name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      red_scenarios:
        description: Whitespace-separated complete scenario tags for expected-red evidence
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TO: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  ci:
    needs: [engine]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require engine success
        env:
          ENGINE_RESULT: ${{ needs.engine.result }}
        run: test "$ENGINE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: donvargax/itos@9ef058985451a656893d16d28b22eeeece3f6fab # v8.46.4
      - name: Range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(itos ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          echo "FROM=$from" >> "$GITHUB_ENV"
      - run: itos verify "$FROM" "$TO"
      - run: itos ci run "$FROM" "$TO"

  # This is readiness infrastructure until live @engine scenarios are implemented.
  # The preflight is read-only; it does not acquire images or create containers.
  engine:
    name: Engine scenarios (Linux amd64)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TO }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Docker server preflight
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=1s 29s bash -euo pipefail <<'PREFLIGHT'
          command -v docker >/dev/null
          test -S /var/run/docker.sock
          server=$(env -u DOCKER_CONTEXT -u DOCKER_HOST -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH -u DOCKER_API_VERSION docker --host unix:///var/run/docker.sock version --format '{{json .Server}}')
          jq -e '.Os == "linux" and .Arch == "amd64"' <<<"$server" >/dev/null
          jq -c --arg commit "$TO" '{version: .Version, apiVersion: .ApiVersion, os: .Os, architecture: .Arch, commit: $commit}' <<<"$server"
          PREFLIGHT
      - name: Prepare engine fixture registry
        id: fixture
        shell: bash
        timeout-minutes: 4
        run: tools/bin/engine-fixture prepare
      - name: Engine scenarios
        timeout-minutes: 5
        shell: bash
        env:
          ITOS_CONTAINER_ENGINE_TESTS: "1"
          ITOS_CONTAINER_RED_SCENARIOS: ${{ github.event_name == 'workflow_dispatch' && inputs.red_scenarios || '' }}
          ITOS_CONTAINER_ENGINE_FIXTURE_IMAGE: ${{ steps.fixture.outputs.image }}
          ITOS_CONTAINER_ENGINE_FIXTURE_ID: ${{ steps.fixture.outputs.image_id }}
          ITOS_CONTAINER_ENGINE_FIXTURE_UID: ${{ steps.fixture.outputs.uid }}
          ITOS_CONTAINER_ENGINE_FIXTURE_GID: ${{ steps.fixture.outputs.gid }}
        run: |
          # Linux uptime is monotonic; wall-clock corrections cannot create headroom.
          engine_now() {
            local engine_uptime
            read -r engine_uptime _ < /proc/uptime || return 1
            [[ $engine_uptime =~ ^([0-9]+)\.([0-9]{2})$ ]] || return 1
            printf '%s\n' "$((10#${BASH_REMATCH[1]} * 100 + 10#${BASH_REMATCH[2]}))"
          }
          engine_started=''
          engine_finish() {
            local result=$? finished elapsed=unknown outcome=failed
            trap - EXIT
            if finished=$(engine_now) && [[ -n $engine_started ]] && (( finished >= engine_started )); then
              elapsed=$(((finished - engine_started) * 10))
              if (( elapsed > 240000 && result == 0 )); then result=1; fi
            elif (( result == 0 )); then
              result=1
            fi
            if (( result == 0 )); then outcome=passed; fi
            printf 'engine step timing: duration_ms=%s outcome=%s\n' "$elapsed" "$outcome"
            exit "$result"
          }
          trap engine_finish EXIT
          engine_started=$(engine_now)
          set +e
          go test -c -o "$RUNNER_TEMP/slice-11-features.test" ./features
          compile_status=$?
          set -e
          compile_elapsed=unknown
          compile_outcome=failed
          if compiled=$(engine_now) && (( compiled >= engine_started )); then
            compile_elapsed=$(((compiled - engine_started) * 10))
            if (( compile_status == 0 )); then compile_outcome=passed; fi
          elif (( compile_status == 0 )); then
            compile_status=1
          fi
          printf 'engine compilation timing: duration_ms=%s outcome=%s\n' "$compile_elapsed" "$compile_outcome"
          if (( compile_status != 0 )); then exit "$compile_status"; fi
          ITOS_CC_TEST_COVERDIR=$(mktemp -d "$RUNNER_TEMP/T-36-engine-coverage.XXXXXX")
          export ITOS_CC_TEST_COVERDIR
          cd features
          set +e
          # Run 42233015284 traced no product/harness process-group signals; the step died
          # from outside that tree. Isolate tests from CI runner/Docker session signals.
          setsid --wait "$RUNNER_TEMP/slice-11-features.test" -test.count=1 -test.v -test.timeout=4m -test.paniconexit0 -test.run '^TestFeatures$' 2>&1 | tee "$RUNNER_TEMP/slice-11-features.log"
          results=("${PIPESTATUS[@]}")
          set -e
          test_status=${results[0]}
          printf 'Feature test exit status: %s\n' "$test_status"
          if (( test_status > 128 && test_status <= 192 )); then
            signal_number=$((test_status - 128))
            printf 'Feature test signal: %s (exit 128+%s)\n' "$(kill -l "$signal_number")" "$signal_number"
          fi
          if (( test_status != 0 )); then exit "$test_status"; fi
          exit "${results[1]}"
      - name: Engine failure diagnostics
        if: ${{ failure() }}
        shell: bash
        timeout-minutes: 1
        run: |
          set +e
          timeout 40 tools/bin/engine-failure-report "$RUNNER_TEMP/slice-11-features.log"
          sudo dmesg | tail -50
          free -m
          if [[ -f "$RUNNER_TEMP/slice-11-features.log" ]]; then
            tail -100 "$RUNNER_TEMP/slice-11-features.log"
          fi
      - name: Clean up engine fixture
        if: ${{ always() }}
        shell: bash
        timeout-minutes: 1
        run: tools/bin/engine-fixture cleanup

  # Unit tests and the non-engine godog tier run automatically on Linux for
  # main pushes and non-draft pull requests. Manual dispatch also runs this Linux suite.
  platform:
    name: Tests (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # go test carries on past a package that fails, so one run shows a platform's every
      # failure. The features build the binary they run themselves, itos-container.exe on
      # windows, stamped with a known version and commit.
      # RAPID_CHECKS=1: each property of the domain on one random case, as in the CI plan.
      - name: Tests
        run: go test ./... -count=1
        env:
          RAPID_CHECKS: 1

  # Manual portability coverage exercises macOS and Windows paths, shells and line endings.
  platform-macos:
    name: Tests (macos-latest)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # go test carries on past a package that fails, so one run shows a platform's every
      # failure. The features build the binary they run themselves, itos-container.exe on
      # windows, stamped with a known version and commit.
      # RAPID_CHECKS=1: each property of the domain on one random case, as in the CI plan.
      - name: Tests
        run: go test ./... -count=1
        env:
          RAPID_CHECKS: 1
          ITOS_CONTAINER_RED_SCENARIOS: ${{ github.event_name == 'workflow_dispatch' && inputs.red_scenarios || '' }}

  platform-windows:
    name: Tests (windows-latest)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # go test carries on past a package that fails, so one run shows a platform's every
      # failure. The features build the binary they run themselves, itos-container.exe on
      # windows, stamped with a known version and commit.
      # RAPID_CHECKS=1: each property of the domain on one random case, as in the CI plan.
      - name: Tests
        run: go test ./... -count=1
        env:
          RAPID_CHECKS: 1
          ITOS_CONTAINER_RED_SCENARIOS: ${{ github.event_name == 'workflow_dispatch' && inputs.red_scenarios || '' }}

  # Only a fully successful push to main can publish this SHA (T-25).
  release:
    needs: [ci, engine, platform]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
