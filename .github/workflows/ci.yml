name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TO: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  ci:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: donvargax/itos@0a8c1bcfce6ae7b67b39197ee3990a90343f35ac # v8.45.3
      - name: Range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(itos ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          echo "FROM=$from" >> "$GITHUB_ENV"
      - run: itos verify "$FROM" "$TO"
      - run: itos ci run "$FROM" "$TO"

  # Every test, the unit tests and the whole godog suite, runs automatically on Linux for
  # main pushes and non-draft pull requests. Manual dispatch also runs this Linux suite.
  platform:
    name: Tests (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # go test carries on past a package that fails, so one run shows a platform's every
      # failure. The features build the binary they run themselves, itos-container.exe on
      # windows, stamped with a known version and commit.
      # RAPID_CHECKS=1: each property of the domain on one random case, as in the CI plan.
      - name: Tests
        run: go test ./... -count=1
        env:
          RAPID_CHECKS: 1

  # Manual portability coverage exercises macOS and Windows paths, shells and line endings.
  platform-macos:
    name: Tests (macos-latest)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # go test carries on past a package that fails, so one run shows a platform's every
      # failure. The features build the binary they run themselves, itos-container.exe on
      # windows, stamped with a known version and commit.
      # RAPID_CHECKS=1: each property of the domain on one random case, as in the CI plan.
      - name: Tests
        run: go test ./... -count=1
        env:
          RAPID_CHECKS: 1

  platform-windows:
    name: Tests (windows-latest)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # go test carries on past a package that fails, so one run shows a platform's every
      # failure. The features build the binary they run themselves, itos-container.exe on
      # windows, stamped with a known version and commit.
      # RAPID_CHECKS=1: each property of the domain on one random case, as in the CI plan.
      - name: Tests
        run: go test ./... -count=1
        env:
          RAPID_CHECKS: 1
