version: "2"
# Role rules follow itos-cc ADR-0047/0051 and itos ADR-0053. The graph check
# resolves owner/layer arrows that depguard's import prefixes cannot express.
linters:
  default: standard
  enable:
    - depguard
    - gosec
    - revive
  settings:
    depguard:
      rules:
        unclassified:
          list-mode: strict
          files:
            - "**/internal/**"
            - "**/pkg/**"
            - "!**/internal/cli/**"
            - "!**/internal/version/**"
            - "!**/internal/release/**"
            - "!**/internal/slices/*/*/**"
            - "!**/internal/engine/*/*/**"
          allow:
            - "architecture.invalid/unclassified$"
        domain:
          list-mode: strict
          files:
            - "**/internal/slices/*/domain/**"
            - "**/internal/engine/*/domain/**"
            - "!$test"
          allow:
            - "bytes$"
            - "context$"
            - "errors$"
            - "fmt$"
            - "maps$"
            - "slices$"
            - "sort$"
            - "strconv$"
            - "strings$"
            - "time$"
            - "unicode$"
            - "github.com/donvargax/itos-container/internal/slices/"
            - "github.com/donvargax/itos-container/internal/engine/"
        domain-tests:
          list-mode: strict
          files:
            - "**/internal/slices/*/domain/*_test.go"
            - "**/internal/slices/*/domain/**/*_test.go"
            - "**/internal/engine/*/domain/*_test.go"
            - "**/internal/engine/*/domain/**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/donvargax/itos-container/internal/slices/"
            - "github.com/donvargax/itos-container/internal/engine/"
            - "pgregory.net/rapid$"
        port:
          list-mode: strict
          files:
            - "**/internal/slices/*/port/**"
            - "**/internal/engine/*/port/**"
            - "!$test"
            - "!**/internal/slices/*/port/porttest/**"
            - "!**/internal/engine/*/port/porttest/**"
          allow:
            - "bytes$"
            - "context$"
            - "errors$"
            - "fmt$"
            - "maps$"
            - "slices$"
            - "sort$"
            - "strconv$"
            - "strings$"
            - "time$"
            - "unicode$"
            - "github.com/donvargax/itos-container/internal/slices/"
            - "github.com/donvargax/itos-container/internal/engine/"
        store-ports-io:
          # Adapted from itos ADR-0053 store-ports-io; tests may read fixtures.
          list-mode: lax
          files:
            - "**/internal/slices/*/port/**"
            - "**/internal/engine/*/port/**"
            - "!$test"
          deny:
            - pkg: "os"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "net"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "syscall"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "golang.org/x/sys/"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "io/ioutil$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "path/filepath$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "plugin$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
        port-tests:
          list-mode: strict
          files:
            - "**/internal/slices/*/port/*_test.go"
            - "**/internal/slices/*/port/**/*_test.go"
            - "**/internal/engine/*/port/*_test.go"
            - "**/internal/engine/*/port/**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/donvargax/itos-container/internal/slices/"
            - "github.com/donvargax/itos-container/internal/engine/"
        command:
          list-mode: strict
          files:
            - "**/internal/slices/*/command/**"
          allow:
            - "$gostd"
            - "github.com/donvargax/itos-container/internal/cli$"
            - "github.com/donvargax/itos-container/internal/slices/"
            - "github.com/donvargax/itos-container/internal/engine/"
        command-io:
          # Adapted from itos ADR-0053 store-ports-io; tests may read fixtures.
          list-mode: lax
          files:
            - "**/internal/slices/*/command/**"
            - "!$test"
          deny:
            - pkg: "os"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "net"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "syscall"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "golang.org/x/sys/"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "io/ioutil$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "path/filepath$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
            - pkg: "plugin$"
              desc: "I/O belongs in an adapter behind a port; fakes keep their state in memory"
        adapter:
          list-mode: lax
          files:
            - "**/internal/slices/*/*/**"
            - "**/internal/engine/*/*/**"
            - "!**/internal/slices/*/domain/**"
            - "!**/internal/slices/*/port/**"
            - "!**/internal/slices/*/command/**"
            - "!**/internal/engine/*/domain/**"
            - "!**/internal/engine/*/port/**"
            - "!**/internal/engine/*/command/**"
          allow:
            - "github.com/donvargax/itos-container/internal/slices/"
            - "github.com/donvargax/itos-container/internal/engine/"
          deny:
            - pkg: "github.com/donvargax/itos-container/"
              desc: "adapters import only their own domain, port and helpers, or engine APIs"
        porttest:
          list-mode: strict
          files:
            - "**/internal/slices/*/port/porttest/**"
            - "**/internal/engine/*/port/porttest/**"
          allow:
            - "$gostd"
            - "github.com/donvargax/itos-container/internal/slices/"
            - "github.com/donvargax/itos-container/internal/engine/"
        ui:
          list-mode: strict
          files:
            - "**/internal/cli/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/alecthomas/kong$"
        ui-tests:
          list-mode: strict
          files:
            - "**/internal/cli/*_test.go"
            - "**/internal/cli/**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/donvargax/itos-container/internal/cli$"
            - "github.com/donvargax/itos-container/internal/cli/"
            - "github.com/alecthomas/kong$"
        version:
          list-mode: strict
          files:
            - "**/internal/version/**"
            - "!$test"
          allow:
            - "$gostd"
        version-tests:
          list-mode: strict
          files:
            - "**/internal/version/*_test.go"
            - "**/internal/version/**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/donvargax/itos-container/internal/version$"
            - "github.com/donvargax/itos-container/internal/version/"
        release:
          list-mode: strict
          files:
            - "**/internal/release/**"
            - "!$test"
            - "!**/internal/release/releasetest/**"
          allow:
            - "$gostd"
            - "github.com/donvargax/itos-container/internal/release$"
        release-tests:
          list-mode: strict
          files:
            - "**/internal/release/*_test.go"
            - "**/internal/release/**/*_test.go"
            - "**/internal/release/releasetest/**"
          allow:
            - "$gostd"
            - "github.com/donvargax/itos-container/internal/release$"
            - "github.com/donvargax/itos-container/internal/release/releasetest"
        # The egress proxy reads the ClientHello and terminates nothing (the T-38 record):
        # crypto/tls stays in its adapter, crypto/x509 nowhere, and its packages import a
        # short list. TestNoInterceptionCode and TestNoRelaxingCode hold the rest, since a
        # rule cannot see identifiers or files go ignores.
        egress-tls:
          list-mode: lax
          files:
            - "**/cmd/**"
            - "**/internal/**"
            - "!$test"
            - "!**/internal/engine/egress/tcp/**"
          deny:
            - pkg: "crypto/tls"
              desc: "TLS belongs to the egress adapter's ClientHello peek alone (T-38 record)"
        egress-x509:
          list-mode: lax
          files:
            - "**/cmd/**"
            - "**/internal/**"
            - "!$test"
          deny:
            - pkg: "crypto/x509"
              desc: "no package holds a certificate, so none can intercept TLS (T-38 record)"
        egress-imports:
          list-mode: strict
          files:
            - "**/internal/engine/egress/**"
            - "!$test"
          allow:
            - "bytes$"
            - "context$"
            - "crypto/tls$"
            - "encoding/json$"
            - "errors$"
            - "fmt$"
            - "io$"
            - "maps$"
            - "net$"
            - "net/netip$"
            - "os$"
            - "slices$"
            - "sort$"
            - "strconv$"
            - "strings$"
            - "sync$"
            - "sync/atomic$"
            - "syscall$"
            - "time$"
            - "unicode$"
            - "github.com/donvargax/itos-container/internal/engine/egress/"
        rapid:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/slices/*/domain/*_test.go"
            - "!**/internal/slices/*/domain/**/*_test.go"
            - "!**/internal/engine/*/domain/*_test.go"
            - "!**/internal/engine/*/domain/**/*_test.go"
          deny:
            - pkg: "pgregory.net/rapid"
              desc: "rapid is used only by domain property tests"
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true
  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec]
formatters:
  enable:
    - gofmt
