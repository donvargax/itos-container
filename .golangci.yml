version: "2"
run:
  # Effective configs live outside the checkout; resolve paths from its cwd.
  relative-path-mode: wd
linters:
  default: standard
  enable:
    - depguard
    - gosec
    - revive
  settings:
    depguard:
      rules: {} # generated by tools/bin/check-slice-layout
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true
  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec]
formatters:
  enable:
    - gofmt
