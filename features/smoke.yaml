# The smoke set: the scenarios every push runs, beside the ones its commits
# name (features/README.md).
#
# The rule, checked by `itos tests smoke check scenario` and `itos config
# check`: every feature file with a live scenario has at least one here, every
# ID here is a live scenario of the file it is listed under, and a file with
# more than one says why (`more`). `itos tests smoke run scenario` runs
# exactly this set.
#
# How to pick one: a fast scenario that exercises what its file is about, not
# an edge of it.
#
# The shape (itos.yaml's `tests.scenario.smoke` names this file): one entry
# per feature file, `file` relative to features/, `more` saying why the file
# has more than one (required when it does), and each scenario's `id` and
# `why`. Quote a value holding `: `, and every ID (its `@` starts no plain
# scalar).
#
#   - file: cli.feature
#     scenarios:
#       - id: "@ID-CLI-01"
#         why: what it exercises, and why it was chosen
- file: count.feature
  scenarios:
    - id: "@ID-COUNT-01"
      why: count's whole path in one run, the counts on stdout and the hint on stderr, the file read through the disk adapter and the output shaped
- file: cli.feature
  scenarios:
    - id: "@ID-CLI-01"
      why: --version, the one call every build answers, the binary built, stamped and run in one step
- file: completion.feature
  scenarios:
    - id: "@ID-COMPL-01"
      why: the hidden completion command answers a new word from kong's model and leaves itself out
- file: policy.feature
  scenarios:
    - id: "@ID-POLICY-01"
      why: policy inspection reads the fixed file, supplies offline defaults and returns the effective policy without engine access
- file: manifest.feature
  scenarios:
    - id: "@ID-MANIFEST-01"
      why: selected manifest parsing resolves literal defaults without engine inspection
- file: doctor.feature
  scenarios:
    - id: "@ID-DOCTOR-01"
      why: read-only inspection identifies the checkout, local engine and exact cached image without granting approval
- file: approval.feature
  scenarios:
    - id: "@ID-APPROVAL-07"
      why: terminal review and explicit consent publish the exact candidate in private temporary host state without checkout execution or engine mutation
- file: parsing.feature
  scenarios:
    - id: "@ID-PARSING-04"
      why: doctor refuses unfinished excessive nesting without effects and still accepts literal YAML data
- file: run.feature
  scenarios:
    - id: "@ID-RUN-03"
      why: run refuses wrapper and inherited JSON before any startup effects and keeps workload flags separate
- file: session.feature
  scenarios:
    - id: "@ID-SESSION-01"
      why: durable intent, unstarted ownership and confirmed cleanup through memory and local disk/SDK backends without a Docker daemon
- file: offline.feature
  scenarios:
    - id: "@ID-OFFLINE-06"
      why: literal argv reaches one inspected owned worker and cleanup confirms its absence in the guarded CI engine tier
- file: foreground_recovery.feature
  scenarios:
    - id: "@ID-OFFLINE-18"
      why: owned cleanup survives writable checkout identity changes while retaining protected authority
- file: recovery.feature
  scenarios:
    - id: "@ID-RECOVERY-08"
      why: run preserves the observed exit and prints a registered stop retry that completes durable cleanup through a fresh process without a Docker daemon
- file: checkout-overlap.feature
  scenarios:
    - id: "@ID-OVERLAP-01"
      why: nested launches refuse across one or two daemons while disjoint checkout controls remain active
