# Port contract suites and fakes are test support, never linked into the binary.
# Keep running their tests; measure product code in the CI proof (itos ADR-0053).
exclude: ["**/porttest/**"]

# Equivalent mutants need project-local proof and a reviewed reason.
mutation:
  tests:
    list: tools/bin/scenario-list
    run: "go test ./features -count=1 -scenarios='{pattern}'"
    ids_pattern: "^@(?:{ids})$"
    join: { each: "{id}", sep: "|" }
    whole: go test ./features -count=1
    support:
      - features/*_test.go
      - features/testdata/**
      - tools/bin/scenario-list
  exceptions:
    - file: internal/release/release.go
      function: github.com/donvargax/itos-container/internal/release#Newest
      hash: 169323ab8c351ad2
      line_in_function: 4
      column: 58
      original: '>'
      replacement: '>='
      reason: 'compareTags returns zero only for identical tag strings: after numeric and length comparisons it uses strings.Compare. Assigning t to newest again when they are identical cannot change the selected tag or any observable result.'
      line_text: if IsTag(t) && (newest == "" || compareTags(t, newest) > 0) {
    - file: internal/engine/manifest/jsonc/limits.go
      function: github.com/donvargax/itos-container/internal/engine/manifest/jsonc#withinTokenBudget
      hash: 3d8e0a691c896bda
      line_in_function: 20
      column: 20
      original: "1"
      replacement: "0"
      reason: The final +1 skips the newline found by bytes.IndexByte. Replacing it with 0 leaves i at that same newline; the next loop iteration takes the whitespace branch, increments i and continues without changing depth or nodes. Both paths resume at the identical byte with identical budget state, or exit at EOF, and neither modifies data. All parser results and resource bounds are therefore unchanged.
      line_text: i += 2 + end + 1
    - file: internal/engine/approval/disk/store.go
      function: github.com/donvargax/itos-container/internal/engine/approval/disk.pin#read
      hash: 64864094e55d13ad
      line_in_function: 16
      column: 80
      original: "0"
      replacement: "1"
      reason: openRecord is os.Root.OpenFile with O_RDONLY|O_NOFOLLOW, without O_CREATE. Its perm argument is used only when creating a file; both 0 and 1 pass the Root nine-bit permission validation. Changing this unused permission value cannot affect an existing record, a missing-path refusal, the returned bytes or filesystem permissions. A test of the injected argument itself would assert an implementation detail rather than behavior.
      line_text: file, err := p.ops.openRecord(p.root(), "current.json", os.O_RDONLY|noFollow, 0)
    - file: internal/engine/approval/canonical/preflight.go
      function: github.com/donvargax/itos-container/internal/engine/approval/canonical.JSON#FrozenRecord
      hash: 6103c9cd38b2f630
      line_in_function: 2
      column: 21
      original: ">"
      replacement: ">="
      reason: The only differing input length is exactly 1048576 settings bytes. Noncanonical or invalid settings still return state.invalid. Canonical matching settings are wrapped by Encode with additional required envelope fields, so Decode rejects the larger-than-1048576-byte record with the same empty Record and state.invalid. The adapter performs no I/O. Boundary tests cover accepted complete envelopes at the limit and rejected settings at that limit; changing this early bound cannot change the result.
      line_text: if len(f.Settings) > 1024*1024 || !bounded([]byte(f.Settings)) {
    - file: cmd/itos-container/main.go
      function: github.com/donvargax/itos-container/cmd/itos-container#run
      hash: ff2388dee0d19522
      line_in_function: 21
      column: 15
      original: ">"
      replacement: ">="
      reason: "Before this guard, run replaces every empty args slice with the one-element slice containing --help. No intervening operation changes args. Thus len(args) is always at least 1 when this expression is reached: both > 0 and >= 0 are true, args[0] is safe, and completion dispatch and all observable outputs are identical. TestRunWithNoArgumentsPrintsTheHelpAndSucceeds and TestRunOfCompleteAnswersFromTheModelWithoutRunningACommand cover the boundary paths."
      line_text: if len(args) > 0 && args[0] == "__complete" {
    - file: internal/slices/run/command/command.go
      function: github.com/donvargax/itos-container/internal/slices/run/command.CLI#Run
      hash: 6edde9fe643a70fa
      line_in_function: 3
      column: 27
      original: "0"
      replacement: "1"
      reason: The changed predicate differs only for a single argument. Unless that argument is --, both paths set separated false. For the lone --, the original passes separated true and empty argv, while the mutant passes separated false and argv containing --. Refuse returns ErrCommandRequired in both cases, or ErrJSONUnsupported first when JSON is requested. Neither path reaches Preflight or mutates caller arguments, and the UI receives the same failure and JSON flag. Live ID-RUN-01 and ID-RUN-05 exercise these separator-only refusals.
      line_text: separated := len(args) > 0 && args[0] == "--"
