      column: 58
      original: '>'
      replacement: '>='
      reason: 'compareTags returns zero only for identical tag strings: after numeric and length comparisons it uses strings.Compare. Assigning t to newest again when they are identical cannot change the selected tag or any observable result.'
      line_text: if IsTag(t) && (newest == "" || compareTags(t, newest) > 0) {
