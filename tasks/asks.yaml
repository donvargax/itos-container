  - id: q-27
    item: "slice-17"
    question: "slice-17: Docker mounts and starts in one operation and inspect gives no inode; which observation and workload release are authorized?"
    answer: "The descriptor-backed volume (q-19) is the protection; the identity check is a detector. Right after ContainerStart, stat /proc/<State.Pid>/root/workspace from the host and compare device and inode with the validated identity; on mismatch or a failed stat, kill and remove the worker through owned teardown and refuse the run. No gate binary (a new mount). Reword the scenario if it promises release gating. See slice-17-steer.md."
