    item: "T-33"
    question: "T-33: which native engine scenarios make the suite slow, and how to fix it?"
    answer: "Run 42457394504: LIFECYCLE-13 row 1 takes 128 s (it waits out the real 120 s startup budget) and LIFECYCLE-09's four rows about 12 s each (the real 10 s grace); everything else is under 6 s. Shorten the product's call, startup and grace budgets for the harness through a test-only seam (a build tag or fixture config, never a user-settable variable), keep assertions relative to the budget used, then restore the 5-minute limits. See T-33-steer.md."
  - id: q-41
    item: "slice-17"
    question: "slice-17: what failed natively in run 42459248613?"
    answer: "The full log is at .git/itos/loop/slice-17-run-42459248613-engine.log. Even fault-free native controls fail, and the product reports only run.mount-refused, so on Docker 28 the anchor or the post-start detector refuses ordinary runs. Make run.mount-refused carry its reason (the check, expected and observed device:inode, or the stat or pidfd errno), show it in the harness output, and return blocked for a native run; if Moby resolves the path by name or refuses it, stop with the evidence (q-19)."
  - id: q-42
    item: "slice-17"
    question: "slice-17: the post-start stat finds no /workspace in a live worker's root (it changed root or namespaces); refuse or record?"
    answer: "Record, as q-39 reasons: the anchor is the protection. On ENOENT, ESRCH or EACCES from the stat, poll the pidfd: exited means q-39's exited path; alive means record the detector as not observed (worker root changed) and continue. Refuse only on a device:inode mismatch, or when a live worker's root still shows /workspace but it can't be read. Add a regression for a live worker that chroots or unshares before the stat."
