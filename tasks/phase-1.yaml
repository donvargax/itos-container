    The coordinator's 2026-11-08 q-43 decision settles the cause and supersedes the earlier
    config-ID-only requirement. Diagnostic run 42497992377 at
    4eedcec4f994ee15223532bf753631057adbae40 used Docker 29.4.2 / API 1.54 on Linux amd64.
