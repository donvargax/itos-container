    that runs with always() and the event guard and fails unless every shard succeeds; ci must
    still require its success. Use fail-fast false so one failure does not cancel other evidence.
    Preserve main/non-draft PR/manual triggers, permissions, pins, ordinary platform jobs and proof.

    If sharding is needed, add a harness-only -engine-feature selector for one known feature
    basename, with empty meaning the existing complete tier. Validate against the full parsed
    inventory before building or initializing fixtures, retain the engine/platform guard and
    reject a nonempty selector in the non-engine tier. Intersect with the existing tier, platform,
    regex and manual-red selection; validate all red IDs against the full inventory first.
    Unknown features and unknown red IDs still fail. Include every feature containing effective
    @engine cases, including all-wip features, exactly once in the workflow's shard inventory.
    Ordinary runs still exclude @wip; manual red runs admit only the named IDs and remain serial
    within each shard. A shard with only excluded cases keeps the existing explicit skip report;
    it cannot stand in for an eligible row elsewhere. Check the union of selected examples, not
    just unique tags or a fixed count of 49, against the unsharded selection. Missing, duplicated,
    extra or newly unassigned examples must fail. No smoke-only or changed-ID runtime selection.

    Add TestEngineScenarioTiming and TestEngineSuiteBudget as engine-free harness regressions.
    The former uses controlled time and memory-only steps to assert distinct outline-row records,
    inclusion of setup/cleanup, nested elapsed-time accounting and preservation of failures.
    The latter parses the actual workflow using the existing YAML parser, holds the restored
    budgets and complete selection, and exercises the actual timing/failure wrapper with
    disposable compiler/test-program fixtures and a controlled timer. A successful program over
    240 s, missing timing, failed compilation, failed capture, signal exit or lost test failure
    must fail, without making a local test wait four minutes. Keep the existing workflow,
    fixture, diagnostic, selection and schedule negative controls. If sharded, extend them for
    the exact feature partition, all-wip and manual-red cases, and failed/cancelled/skipped shard
    aggregation; reject omissions and duplicate rows using parsed Gherkin, not source-text grep.
    Write these assertions before repairing the runner; an absent test is not timing evidence.

    The ledger check below is deliberately engine-free because task checks can execute in
    commit hooks and the ordinary ci job. The promoted native command belongs only in the
    prepared CI engine tier: env -u ITOS_CONTAINER_RED_SCENARIOS ITOS_CONTAINER_ENGINE_TESTS=1
    timeout --signal=TERM --kill-after=5s 240s setsid --wait go test ./features -count=1 -v
    -run '^TestFeatures$' -timeout=4m. Keep it as the unsharded before/after measurement; if
    sharding is required, apply the same command and budget with -engine-feature=<basename>
    in every prepared shard and establish the exact union above. The workflow's normal compiled
    binary invocation must enforce the same whole-step budget. Sharding changes that acceptance
    unit, not the selected suite or its deadline; an unsharded over-budget result remains in the
    report. Do not run either native form in hooks, ordinary platform tests or changed-code proof.

    Before specification at a4f5f0f, an engine-free temporary Go overlay using the existing
    workflow parser failed on all three target assertions: job 13 rather than 10 minutes, step
    8 rather than 5, and absence of the four-minute binary timeout. The named timing/budget tests
    are absent, so discovery below fails before implementation. The older workflow tests still
    accept T-32's allowance and are preservation checks until their expectations are updated.
    The historical CI durations exceed 240 s, but the native command was not run locally and
    neither those durations nor this configuration failure is fresh runtime red evidence.
    The coordinator must obtain the pre-optimization native timing result; setup failure, a
    missing selector/test or an engine-context refusal is not a measured performance failure.

    Commit the test-execution changes, including their inseparable workflow and regression
    expectations, together as test --task T-33; those paths are allowed for test commits. Record
    the new runner assertions failing before the repair and passing with the final configuration,
    without committing a workflow/test mismatch or bypassing a hook. Align features/README.md
    in docs --item T-33, explaining restored budgets and final scheduling. Leave the coordinator's
    external allowance entry removed once the restored limits and shortened fixture land,
    as q-40 directs; retain every unrelated allowance.
    Keep the cheap ledger check in the ordinary task tier and runtime proof in required CI.
    Run the full feature suite without -race through its existing tier; use -race only for
    changed focused tests if needed. The 2026-11-08 22 GB whole-feature race run must not recur;
    a memory kill is a test-cost defect, not permission to raise the limit. Broader memory work
    remains p1-feature-suite-race-memory. Agents use no Docker/socket, real-state approval,
    local mutation run or generated proof. Report changed heads, before/after row and step
    timings, complete row counts, budget failures and final native CI results supplied by the
    loop. Agents commit and stop; the loop owns push, CI watching and closure.
- id: T-34
  type: ci
  title: Engine fixture preparation passes again on today's CI runners
  why: >
    Since about 14:40 UTC on 2026-11-08, tools/bin/engine-fixture prepare fails on main (run
    42494336465) and on every branch: it builds and pushes the fixture image, then exits 1 with no
    message naming the failed check, so no engine scenario runs anywhere. The last pass was
    10:22 UTC; nothing in tools/ changed between. The silent exit after the push points at the
    unguarded jq -e check of the pushed manifest (schemaVersion 2, a single-image manifest media
    type, no manifests key,
    config.digest equal to the built image ID) under set -e: a runner Docker update that pushes an
    OCI index or attestations, or a config digest that differs from --iidfile, would fail it without
    a word. First make every check after the push fail with fail() and print what it saw (the media
    type, whether manifests exists, config.digest and the built ID). Then fix the cause without
    loosening what the fixture proves: if Docker now pushes an index, push or select the single
    linux/amd64 manifest explicitly (for example with provenance and attestations off at build), and
    keep the digest, bytes and config checks.

    This repairs T-20's CI infrastructure for the offline milestone, not product behaviour or a
    supported-host claim. The drafter changes only this entry in a docs commit with Item T-34;
    no scenarios, IDs, step definitions or implementation. Read tools/bin/engine-fixture in full,
    its reviewed Dockerfile, features/engine_fixture_test.go, features/engine_workflow_test.go,
    features/README.md's Cached fixture protocol and .github/workflows/ci.yml. Preserve T-20's
    image pins, recipe, acquisition boundary and ownership rules. T-31's heartbeat race and
    T-33's scenario performance work remain separate; do not change their files or budgets.

    The public job metadata for
    https://github.com/donvargax/itos-container/actions/runs/42494336465/job/128773250266
    confirms successful preflight, failed preparation, skipped scenarios and successful final
    cleanup at 115ac09c3076a61850291f615355a378f7fe825d. Full logs were unavailable to this drafter;
    the coordinator's post-push observation above is not independent proof of a Docker update.
    The helper already sets DOCKER_BUILDKIT=0. Do not assume BuildKit or an index is the cause.
    A generic finish_preparation status message does not identify the failing assertion.

    First make the entire path from the push through final output publication diagnostic.
    Every failed command or check there must reach fail() with its stage and relevant expected
    and observed values, including registry fetch, header parsing, byte hashing, manifest
    validation, owned-reference removal, cold inspection/pull, cached-image validation, smoke
    execution/inspection, pre-scenario cleanup and the final cache check. Cover the jq checks
    in cached_fixture and the smoke exit-state check, not just the suspected manifest predicate.
    Guard operations inside called functions explicitly: putting a function call under || can
    disable errexit throughout its body. Do not let a later successful command hide a failure.
    Preserve the original preparation status when bounded cleanup also fails; the final always()
    cleanup still retries. Publish the four fixture outputs only after all validation and
    pre-scenario cleanup succeed.

    For every fetched manifest, print a bounded, escaped summary containing schemaVersion,
    mediaType, hasManifests, configDigest and builtID, plus the advertised and measured manifest
    digests when available. Absent, malformed or wrong-type values need explicit diagnostics;
    diagnostic parsing must not itself silently exit under set -e. Reject invalid data even if
    rendering its summary fails. Log only these selected fixture observations and failure stages,
    not complete image configurations, environment variables, auth files or shell tracing.

    The coordinator's 2026-11-08 q-43 decision settles the cause and supersedes the earlier
    config-ID-only requirement. Diagnostic run 42497992377 at
    4eedcec4f994ee15223532bf753631057adbae40 used Docker 29.4.2 / API 1.54 on Linux amd64.
    It returned a single OCI manifest whose advertised and measured digest equaled --iidfile,
    while config.digest differed. The runner uses the containerd image store; this was not an
    index or BuildKit failure. Preserve the builder and push strategy. Accept and report either
    graph-driver identity (built ID equals config.digest and differs from the manifest digest)
    or containerd identity (built ID equals the measured manifest digest). Reject every other
    relationship. Never pass an index digest as the fixture image or select its first descriptor.

    Independently hash the daemon's raw config before comparing config.digest. Use the existing
    Docker CLI image save command on the immutable built ID, within the same preparation budget,
    and the runner's tar utility to read manifest.json and its single Config member to stdout.
    Docker documents this daemon export at https://docs.docker.com/reference/cli/docker/image/save/.
    Accept only one export record and a digest-shaped Config member, never arbitrary archive
    paths or extraction into the filesystem. Validate the raw config as Linux amd64 JSON and
    match its bytes to its member digest. This adds no installed dependency or engine service.
    In the graph-driver case also require this config digest to equal the built ID; in the
    containerd case compare it to the registry manifest's config.digest. Do not use the registry
    response as its own expected config. Keep the raw built ID for cached inspection, ownership
    and image_id output on both stores; that output names the daemon's image ID, not always a
    config digest. Product identity semantics remain unchanged.

    Continue requiring exactly one well-formed Docker-Content-Digest header equal to the SHA-256
    of the exact response bytes, schemaVersion 2, one of the existing two single-image media
    types, no manifests key and config.digest equal to the independently established built config
    ID. Require distinct manifest and built IDs in the graph-driver case only. Keep the cold
    exact-reference pull and RepoDigests membership, Linux amd64, numeric non-root UID/GID, empty
    entrypoint, no volumes or devcontainer metadata, hardened smoke output/identity/exit checks,
    registry removal before scenarios and cached inspection after removal. Keep cleanup confined
    to recorded attempt-owned resources; never prune or remove pinned inputs to force a cold pull.
    Preserve CI/Linux guards, explicit local endpoint and override clearing, private empty Docker
    config, loopback publication, step-local outputs, all existing timeouts and failure propagation.
    Do not retry preparation, skip scenarios, downgrade the runner, enable continue-on-error or
    change engine-required CI gating. No new dependency, action, image, service or product code.

    Add TestEngineFixturePostPushDiagnostics and TestEngineFixtureManifestValidation in
    features/engine_fixture_test.go. The former checks the executable helper's guarded failure
    paths and required observation fields, with negative source fixtures removing a guard or an
    observation; comments and unused diagnostic strings must not satisfy it. Its first assertion
    must expose the current unguarded manifest predicate, not fail on a missing future helper.
    Keep the diagnostic regression red in a test --item T-34 commit before the repair. For data
    validation, put the shared shell functions in tools/lib/engine-fixture-checks.sh, containing
    definitions only, used by both the real preparation path and tests. Tests invoke only those
    validators with temporary captured-response files and synthetic IDs, never the prepare/cleanup
    driver, Docker, a registry, a fake Docker transcript or spoofed CI variables. Use the existing
    Bash, jq, tar and coreutils and Go test facilities; no new parser or Go package is needed.

    Exercise valid Docker v2 and OCI single-image responses as positive controls. Independently
    reject wrong schema/media type, OCI index and Docker manifest list, even an empty manifests
    key on a single-image response, missing/wrong config digest, malformed/empty JSON, absent or
    duplicate/malformed digest headers, byte/header mismatch and config/manifest ID confusion.
    Assert nonzero status plus the relevant diagnostic and observed fields, including the invalid
    JSON fallback. Also cover cached-image identity/metadata and smoke-state rejections with
    synthetic inspection JSON; retain the existing workflow/recipe/helper negative controls.
    Tests must execute production validation, not a copied jq predicate whose result can diverge.
    Static guard checks and captured JSON tests are regression evidence, never runtime evidence.

    Extend those regressions for both stores, including an assertion-level red containerd
    positive control before implementation. Reject missing/malformed/mismatched daemon config
    identities, unrelated built IDs, invalid export records/member paths and raw-config byte or
    platform mismatches. Exercise the shared export/config validators on captured data only;
    guard the production export and tar reads, and require their independently measured config
    to reach manifest validation. The existing task checks already pass at the diagnostic head;
    that is preservation evidence, not proof of containerd compatibility.

    The done_when command refuses either missing new regression before running its focused
    engine-disabled selection and the existing fixture/workflow regressions. On 7f8af93 it exits 1
    naming both missing regressions, TestEngineFixturePostPushDiagnostics and
    TestEngineFixtureManifestValidation.
    That discovery failure is missing work, not assertion-level red proof. Separately, executing
    only the current production manifest jq predicate against synthetic data accepted a valid OCI
    manifest but returned 1 with empty stderr for both an index and a config mismatch; stdout is
    discarded by the helper. Reproduce the silent failure with the diagnostic regression before
    repair and report its actual assertion, then all passing positive and negative cases. Syntax
    and existing workflow checks preserve working properties; they do not establish this repair.
    These checks belong in the existing ordinary test tier. Use plain commands in the ledger so
    CI needs no RTK. Never run the race detector on the full features package; the focused tests
    need no race detector, and any wider feature run must omit -race.

    Completion additionally requires the coordinator's actual pushed-head engine job to pass
    preparation on today's native Linux amd64 runner, run its complete live scenario selection
    and pass final cleanup. Retain logs naming the tested SHA, Docker server/API/platform, source
    pins, measured manifest/config identities, the diagnosed cause, cold-pull/cache/smoke results
    and both cleanup verdicts. Compare the diagnostic failure with the repaired pass. Neither a
    source check nor successful build/push alone is sufficient. This integration requirement is
    deliberately not a generic done_when engine command: task checks also run without an engine,
    and a second preparation would collide with the attempt's ownership record. The coordinator
    supplies CI observations; agents never run Docker or approve real state, spoof CI or dispatch.

    Implementation is limited to tools/bin/engine-fixture and tools/lib/engine-fixture-checks.sh
    in ci --task T-34, features/engine_fixture_test.go and its captured-data helper
    features/engine_fixture_identity_test.go in test --item T-34 (split to preserve the existing
    600-line lint limit), and accurate protocol
    updates in features/README.md and this settled specification in docs --item T-34.
    The workflow itself needs no change.
    Keep new checks and their production integration in scope; do not leave an unused validator
    that passes tests while prepare still runs the old predicate. Commit no generated fixture,
    log, coverage or mutation evidence. Let configured hooks and CI run the gates. Agents commit
    and stop; the loop alone pushes, watches CI and closes the item at the actual green head.
- id: T-35
  type: test
  title: The feature suite stays within a few GB, with or without the race detector
  why: >
    Measured 2026-11-08 by the loop's memory sampler: an implementer's go test -race ./features
    -count=1 -json (1,348 scenarios, one process) grew features.test from 0.3 GB to 12.6 GB in a
    minute and to 22 GB the next, leaving 1.5 GB of 31 GB free and pushing 3.5 GB into swap; the day
    before, the same pressure got the loop killed. The race detector multiplies memory, but 22 GB
    also points at state kept across scenarios (buffers, fixtures, goroutines) that a long suite
    accumulates. Find what grows per scenario (a heap profile across the suite) and release it.
    Validate the full suite without -race and the repaired path with focused race tests only,
    including after the repair. A measurement at 2026-11-08 06:10 UTC was worse: without -race,
    a full go test ./features run grew features.test to 9.3 GB anonymous RSS, and the loop's
    10 GB per-agent memory cap OOM-killed it.
    So agents cannot currently run the full feature suite inside a sane limit; the growth is in the
    suite, not only in the race detector. Profile the heap across the suite and release what each
    scenario keeps.

    This is test-harness maintenance needed to validate the offline milestone, not new product
    behaviour. The drafter edits only this ledger entry in docs --item T-35; no implementation,
    scenarios or IDs. The implementation belongs in features/*_test.go in test --task T-35,
    with any explanation of the measurements in features/README.md in docs --item T-35.
    Preserve production code, all feature text and tags, smoke IDs, dependency pins, hooks,
    workflows, proof settings and resource limits. T-31's heartbeat observer, T-33's engine
    scheduling/performance work and T-34's fixture preparation remain separate.

    Retain the promoted check's ceiling of 4194304 KiB (4 GiB). A complete, uncached ordinary
    go test ./features -count=1 must exit zero below or at that peak resident-set size on Linux
    amd64, including TestFeatures and the harness/coverage regressions normally run beside it.
    Measure the test invocation and its reaped descendants with Linux getrusage's ru_maxrss;
    this is the largest individual process high-water mark, not a sum of simultaneous RSS or
    Go's cumulative allocations. Report the measured KiB, exit status, tested SHA, Go version
    and scenario count. A cached result, skipped or narrowed suite, timeout, signal or OOM is
    not a pass. Keep the existing memory cap; an OOM means the test consumes too much.

    Never run -race on the whole features package, including after this repair. Use it only
    for the focused regression named below and other changed tests selected explicitly with
    -run. The complete feature suite runs without -race. The title's race requirement is
    checked by exercising the repaired retention path under the race detector; do not claim
    a measured full-suite race pass. Do not shard, restart between scenarios, drop coverage
    reruns, reduce assertions, suppress diagnostics or change selection to meet the ceiling.
    Do not tune GOGC, GOMEMLIMIT, GORACE or the machine's limit to hide retained state.

    Read features/features_test.go, features/steps_test.go, features/engine_schedule_test.go
    and the selection/coverage regressions before changing their shared harness. TestFeatures
    builds the product once, then runScenarios initializes a fresh world and registers all
    steps for each pickle at concurrency one. initializeScenario's After hook closes fixtures
    and removes its directory, but leaves the world's fields reachable. The pinned godog
    v0.16.0 suite.go stores matched step handlers in its result storage; those handlers can
    retain a world. This is a profiling lead, not proof of the dominant allocation source.
    Inspect any fixture owner reached by the profiles in full before changing its lifetime.

    First collect comparable heap samples during one bounded non-engine run, after warm-up
    and after more completed scenarios while the same suite and result storage are still
    alive. Use Go's existing runtime/pprof, runtime memory statistics and process RSS; compare
    retained heap with cumulative allocations and check for unfinished goroutines/resources.
    A profile only after suite return can miss the retention. Identify the retaining path and
    reproduce it before changing cleanup. Stop a pre-fix diagnostic when observed RSS exceeds
    4 GiB; an early budget abort is failing evidence, never a completed run. Keep profiles and
    logs in T-35-prefixed scratch paths and report their conclusions, without committing them.
    The existing pinned godog and standard libraries suffice; no new library, dependency
    upgrade, service, product flag or Go package is selected.

    Release heavyweight scenario state after its assertions and owned cleanup finish, on both
    success and failure. Close and join resources before dropping their references; clearing a
    pointer alone must not orphan a process, server, pipe, timer or goroutine. Retain the failure
    text, cleanup errors, step locations, independent scenario worlds, coverage propagation
    and every existing engine/platform/red-selection boundary. Immutable registration data may
    be shared only without sharing mutable world state. Preserve the nested quiet-worker
    scheduling and its independent worlds. Do not add forced GC to normal scenario execution;
    explicit collection is permitted only when taking diagnostic or regression heap samples.
    If the profiles instead require a product behaviour change, report that gap for its own
    spec rather than changing product semantics under this task.

    Add TestFeatureMemoryRetention in features/memory_test.go as a focused regression through
    the real runScenarios and initializeScenario paths, using synthetic temporary Gherkin,
    not new product scenarios. Run 64 serial cases in one suite with the normal complete step
    registration. Give each world a freshly allocated 4 MiB stdout payload containing a small
    sentinel, and exercise the existing output assertion before cleanup. Do not execute the
    product or an engine in this fixture. After the real After hook, collect and sample heap
    at case 8 and case 64 while godog still owns its results; assert at most 32 MiB additional
    live heap. The uncorrected retained payloads alone exceed that allowance. Count all 64
    cases and cleanup completions, require removed scratch directories, and ensure the test's
    own observers retain neither worlds nor payloads. Test failure/cleanup-error paths with
    small separate fixtures too: the original diagnostic and nonzero result must survive,
    cleanup must finish, and a later scenario must receive independent state. This bounded
    workload tests lifetime, not an exact heap size or collector timing; the whole-suite RSS
    check independently holds the real workload to its budget.

    Use runtime.MemStats.HeapAlloc after runtime.GC at both observation points; compare the
    signed difference so a smaller second sample cannot underflow into a failure. TotalAlloc
    measures allocation churn and cannot stand in for live heap. Append the observation After
    hook after initializeScenario has registered its cleanup: godog v0.16.0 runs these hooks
    in registration order, before storing the final step result. Earlier step results still
    retain their matched handlers during both samples. Do not move either sample after
    runScenarios returns. Save only scalar counters, heap measurements and scratch path strings
    for later assertions, never a collection of worlds, payloads or closures capturing them.
    Keep the small failure/cleanup-error fixtures as subtests of TestFeatureMemoryRetention
    so the exact-name check exercises them in both modes. Their expected godog failures must
    be asserted by the parent test without marking that parent failed through TestingT;
    retain and check their diagnostic output, suite result and cleanup observations.

    Commit that regression red first in test --item T-35 before the repair. Both ordinary and
    focused race runs must fail at the retained-heap/lifetime assertion before implementation
    and pass afterward. Missing-test discovery, compilation, setup failure, a race report or
    OOM does not replace that assertion-level red. The second check below first requires the
    exact test name so Go's successful 'no tests to run' result cannot satisfy it, then runs
    only that test with and without -race, holding both invocations to the same 4 GiB RSS
    ceiling. On the red checkpoint, run each of those two focused invocations separately:
    the check stops at the first nonzero invocation and cannot by itself supply both reds.
    Keep this bounded check at the task tier; do not
    broaden the repository's general race tier. Let the existing Linux test job run the full
    suite and the configured hooks/CI run their gates.

    At the drafter's d65191a174d68d89026dc281b762b04982c75488 baseline, the original check
    cannot start because /usr/bin/time is absent. Replace that external-tool and RTK dependency
    with Python 3's standard-library resource/subprocess measurement below, available in this
    workspace and the Linux runner; no package installation is needed. The command clears
    inherited Go instrumentation/tuning and engine/red selectors, streams output instead of
    retaining it in the observer, and requires both a successful test and a positive in-budget
    measurement. A separately monitored ordinary full-suite invocation reached 4305988 KiB
    observed process RSS after 82.4 seconds and was terminated at the ceiling, before the
    known OOM range. This is a reproduced budget failure, not a completed suite, end-of-run
    heap profile or diagnosis of its cause. The exact-test discovery check exits 1 today
    because TestFeatureMemoryRetention does not exist; the implementer still owes its red
    assertion and the full passing measurement. Do not repeat an unguarded failing baseline.

    Rechecking at 3c35b35dd54d4fa5fb3ce65c24e1d453be00e5e4 on Linux amd64 with Go
    go1.27.3-X:nodwarf5 confirms exit 1 at missing-test discovery. Only this ledger changed
    since the measured baseline above; the harness and task workload are identical. That
    earlier guarded budget failure is retained as baseline evidence, not rerun or relabeled
    as a completed RSS check. These drafter checks supply neither a heap profile nor
    assertion-level regression red.

    Report the retaining path, before/after heap and RSS measurements, assertion-level red
    and green for the focused regression, full non-engine execution counts and any remaining
    limitations. A local harness result supplies no native-engine support evidence. Real
    engine regressions remain CI-only at the actual pushed head, supplied by the coordinator;
    agents never use Docker, approve real state or fabricate CI context. No mutation run or
    generated evidence is part of this test-only task. Agents commit and stop; the loop owns
    pushing, CI watching and closure.
- id: T-36
  type: test
  title: The feature harness writes per-scenario coverage when itos-cc asks, so the code proof's coverage pass takes minutes
  why: >
    Issue https://github.com/donvargax/itos-container/issues/29 records listed-test coverage
    taking 13745.2 and 14176.2 seconds for 320 IDs in runs 42471183432 and 42505641988.
    The harness ignores ITOS_CC_TEST_COVERDIR, so itos-cc falls back to one go test per ID.
    This blocks timely code proof for the charter's offline milestone. It is test infrastructure,
    with no product scenarios, new IDs, runtime behavior or dependency. Keep the pinned itos-cc
    0.47.2 and its mutation.tests contract unchanged; see
    https://github.com/donvargax/itos-cc/blob/v0.47.2/README.md#mutation.
    The model is donvargax/itos's features/cover_test.go, whose reported approximately 1400 IDs
    in 130 seconds illustrates the protocol, not this project's performance guarantee.

    Build both the CLI in features/features_test.go and the shared cmd test assembly in
    features/session_probe_test.go with -cover -covermode=atomic -coverpkg=./... whenever
    either GOCOVERDIR or ITOS_CC_TEST_COVERDIR is nonempty. With neither set, including a
    selected -scenarios run, keep plain builds and unchanged stdout/stderr, with no missing
    GOCOVERDIR warning. Preserve version/commit stamps and one shared executable per build
    mode; a cached plain assembly cannot satisfy a later covered request, or conversely.
    GOCOVERDIR alone retains the existing aggregate-coverage route.

    The harness reads ITOS_CC_TEST_COVERDIR itself, before w.env drops ITOS_ variables.
    Resolve a relative root against the harness working directory, then create the absolute
    <root>/<ID tag without @> before that scenario starts a covered process. This destination
    wins when both variables are set. Store it on the scenario world, not in process-global
    environment changed by a Before hook: four local worlds can execute concurrently, and
    the native quiet-worker scheduler nests independent worlds. Outline examples sharing an
    ID accumulate in that ID's directory; different IDs never share counters. Preserve data
    until the external collector reads it, beyond world cleanup. A missing/ambiguous ID or
    directory-creation failure during a requested product coverage run is a harness failure,
    never a silent fallback, a skip or an empty successful result. Accept exactly one complete
    tag matching ^@ID-[A-Z]+-[0-9]+$, the existing registry/listing format, before deriving a
    directory name. Reject malformed ID-prefixed tags, including path separators, rather than
    sanitizing them into another ID or writing outside the requested root.

    Give every product invocation that scenario's effective GOCOVERDIR, including launches
    through modified w.env, raw os.Environ, implicit inherited environments, fresh recovery
    controllers and child wrappers. Covered test-binary invocations that return through Go's
    test runner also need the matching -test.gocoverdir; those which exit directly retain
    their existing exit-hook behavior. Audit the manifest/approval/run/session probes,
    foreground/recovery/lifecycle/anchor contract helpers and native launch helpers, not only
    runEnv. Share harness-only routing helpers under features, without changing product
    assembly, environment sanitization, package import arrows or fixture assertions.

    Returning recovery probes run under the syscall observer. Go's test runner rereads all
    counters in -test.gocoverdir to report coverage after printing PASS; sharing the final
    scenario directory makes that work grow with sibling invocations. Stage each returning
    probe's matching GOCOVERDIR and -test.gocoverdir in its own directory beneath the world's
    destination, then move its generated files into that captured destination after joining
    the child. Preserve their measured bytes and remove the staging directory. Export errors
    fail cleanup; deliberately killed controllers need not have completed counters. Extend
    the focused regression with OVERLAP-02 and concurrent returning probes to hold private
    reporting, each child's retained counters and removal of staging directories. Keep the
    shared five-second drain bound, native teardown and all task checks unchanged.

    Secondary worlds created inside a scenario inherit its coverage destination before any
    fixture setup can launch product code. This includes the memory/disk children in
    sessionLocalFixture and the recovery, anchor, overlap, offline and lifecycle control
    worlds, which bypass initializeScenario. They belong to their parent's ID; independent
    scenarios entered by the nested native scheduler still select their own IDs. The focused
    regression must exercise an existing secondary-world path and verify its product counters
    reach the parent ID without ambient GOCOVERDIR.

    OVERLAP-10 leaves both local controllers active through its final assertion. Cancelling
    them immediately in teardown kills them before Go can export counters. After all scenario
    assertions in a coverage-enabled world, end still-running simulated overlap workloads
    through the fixture's existing wait replies and give their controllers one shared
    five-second drain bound before the existing forced cleanup. A drain timeout fails
    cleanup. Keep native teardown unchanged,
    retain every scenario assertion, and add no product calls just to obtain coverage. Include
    OVERLAP-10 in the focused coverage regression to hold this post-assertion export path.
    Plain worlds have no counters to export and retain their original cancellation-and-join
    cleanup; do not impose the coverage drain on uninstrumented controllers. Add a focused
    cleanup regression which holds plain/native cancellation and joining, covered normal exit,
    and failure plus forced cleanup when a covered controller cannot drain. Keep the existing
    five-second coverage bound and every scenario assertion unchanged.

    The older-kernel approval helper and run's child-umask helper must stage restrictive-mask
    output beneath the effective scenario destination and export it there after child exit.
    Preserve exportApprovalKernelCoverage's validation and restoration of owner access only
    on generated coverage files. In particular ID-APPROVAL-32 must run both 0022 and 0777
    examples, and ID-RUN-13 must retain its 0000/0777 cases. Do not relax the child's umask,
    change approval/snapshot permissions, chown state or fabricate metadata/counters. Common
    launch routing must preserve these explicit per-invocation staging destinations instead
    of overwriting them with the world's final directory. Export back to that same world's
    destination after joining the child, never to an ambient process-global directory.

    Whole runs also execute independent harness tests. Isolate their coverage in private
    temporary roots and restore the caller's variables afterward, so synthetic memory cases
    without IDs and repeated metadata/approval/session checks neither fail for a missing ID
    nor add data to the external listed-ID root. This includes TestFeatureMemoryRetention,
    TestManifestContractCoverage, TestApprovalContractCoverage, TestApprovalKernelCoverage,
    TestDoctorListedCoverage and TestSessionContractCoverage. Keep all their assertions and
    filtering rules; specifically clear both variables for the session regression's plain
    cache setup. Do not skip these regressions merely because the new variable is present.
    A selected run still executes only its selected product scenarios.

    Add TestScenarioCoverageContract in features/cover_test.go. Use the real initializer,
    environments and binaries to check the neither/aggregate/per-ID/both-variable matrix,
    absolute routing from a relative root, independent concurrent IDs, combined outline
    rows, retained data after cleanup, and useful errors before launch for invalid IDs or an
    unusable destination. Check readable atomic metadata/counters and positive product-code
    blocks with go tool covdata, not just directory creation or coverage of the test harness.
    COUNT-01 must execute internal/slices/count/domain/ blocks and CLI-01 must not. Judge
    counting reach only by that domain, not the command package: Kong initialization for
    CLI-01's --version legitimately calls count's Help() at command/command.go:38-44.
    This is the settled q-45 correction (2026-11-09); shared command-help coverage is not
    cross-ID counter contamination. Metadata, approval, session and lifecycle contract
    probes must contribute their own executed domain/command blocks.
    Exercise ID-APPROVAL-32's restrictive child, the run umask route and plain/covered cache
    transitions. Bound these fixtures; do not recursively invoke the whole features suite.
    Isolate this regression's own coverage, retain platform/engine guards, and skip its
    independent scenario reruns for filtered/manual-red execution as existing regressions do.

    Commit the focused regression red first with test --item T-36, then repair the harness.
