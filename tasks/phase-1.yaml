- id: T-33
  type: test
  title: main's engine scenarios finish well inside the job's 5-minute limit
  why: >
    main went red at b2ad2ad (run 42392045565) although all 49 engine scenarios passed (feature test
    exit status 0): the Engine scenarios step hit its 5-minute timeout-minutes. The suite took 258 s
    on 2026-11-06 and 277 s on 2026-11-07 (run 42389951333), and every isolation slice adds engine
    cases, so main will go red more often. T-32 subsequently recorded 300-335 s and temporarily
    raised the job/step/test limits to 13/8/7 minutes. That authorized allowance ends with this
    task. Measure each scenario, remove avoidable harness overhead and shard by whole feature if
    the suite still exceeds the target below. Raising any limit is the person's call, not a fix.
    This is maintenance of runtime proof for the offline owned-run milestone, not new product
    behaviour. Add no scenarios or IDs. The drafter changes only this entry, in a docs commit.

    Read features/features_test.go, steps_test.go, engine_schedule_test.go and its regressions,
    lifecycle_native_actions_test.go, lifecycle_native_fixture_test.go, lifecycle_native_steps_test.go,
    native_probe_test.go and native_probe_cache_test.go; also features/lifecycle.feature, the engine
    workflow/fixture/diagnostic tests, features/README.md, .github/workflows/ci.yml and
    tools/bin/engine-fixture. Follow any measured slow step through its entire fixture and cleanup
    before changing it. The existing schedule already nests the four LIFECYCLE-09 rows in the
    quiet LIFECYCLE-13 observation, and trusted probe binaries are already cached per product
    build outside writable checkouts. Neither is a new optimization to claim for T-33.

    Define well inside as at most 240 seconds of wall time for the complete Engine scenarios
    step, including test compilation, the product/probe builds, setup, assertions, cleanup and
    output capture. Fixture preparation keeps its separate existing budget. Restore each native
    engine job to ten minutes and each Engine scenarios step to five minutes; use a four-minute
    Go test timeout, below the step's hard limit. The step must fail if its measured total exceeds
    240 s even when the test binary exits zero. Compilation cannot move outside the measurement
    to create apparent headroom. Preserve diagnostic time and unconditional owned cleanup; no
    retry, larger runner, relaxed memory limit or reduced assertion may supply a passing result.

    Add engine-only timing records to the existing harness output, one for each completed
    scenario example, identified by feature URI, stable scenario tag and distinct example-row
    location. Measure monotonically from before its setup through its final cleanup, including
    failures; keep completed records visible when a later row fails. Report selected/completed
    counts and total suite duration, and separately report compilation and whole-step elapsed
    time. Nested escalation durations overlap the quiet row: never sum row durations as elapsed
    suite time. Timing output contains test identity, duration and outcome only, no environment,
    workload output, credentials or host-state contents. Reuse Go's standard library and the
    already pinned godog and YAML parser; no new library, service, action or tool pin is needed.

    Obtain the before/after row timings at the actual tested heads from the coordinator's native
    CI runs. Optimize only demonstrated harness overhead, such as redundant fixture preparation
    or waiting after an already observed completion. Preserve every selected row and every
    observation, positive control, negative control, durable-state audit and cleanup error.
    The coordinator's q-40 decision of 2026-11-08 supersedes the original prohibition on
    shorter test budgets. Run 42457394504 selected 47 engine examples, taking 285 s overall
    and 246 s in the measured step, correctly failing the 240 s gate. LIFECYCLE-13's quiet
    row took 128 s, its other rows 22 s and 12 s, and LIFECYCLE-09's four rows took 11-14 s
    each. Shorten these real waits through the harness's own build fixture: centralize the
    unchanged production call/startup/grace constants (10/120/10 s) in the existing budget
    engine and have the harness build the engine tier's binary from a disposable copy of
    cmd, internal, go.mod and go.sum outside every checkout, in which only the limits file
    holds 1/3/1 s. A Go build overlay does not work and must not be used: the engine step
    always sets -cover, and then cmd/go hands the cover tool each package file's path on
    disk and ignores the overlay, so the product kept 10/120/10 s (run 42566251698 spent its
    four minutes in the unshortened waits), and the build cache stored that production build
    under the overlaid text's key. The copy's limits file carries a header no overlay had.
    No environment variable, flag or configuration accepted by a product binary may select
    test budgets. Ordinary tests and release builds retain the production constants.
    Keep the 30-second teardown budget and process guards. Native assertions and actions use
    the fixture budgets: quiet time exceeds both startup and call, acknowledgement delay is
    60 percent of grace, repetitions occur at 20 and 80 percent, and escalation tolerance is
    20 percent. Preserve delayed acknowledgements, blocked pipes and independent observations.
    Do not replace native time with a fake clock, reset origins or unblock a pipe early. Keep
    the existing scenario-authorized quiet-control reuse within its outline and product build;
    add no shared observation or success cache. Preserve the narrowly bounded schedule, its quiet
    startup fallback, exact completion counts and serial filtered/manual-red execution. Do not
    enable arbitrary concurrent scenarios on one daemon: resource inventory audits would see
    each other's transitions. If a product defect prevents the target, return it for a behaviour
    spec rather than changing product semantics in this test task. The constant extraction and
    test-only build fixture above are authorized; no new runtime configuration is. T-31 owns the
    equal-basename recovery heartbeat race; coordinate through the loop and do not duplicate it.

    Repair the portability failures reported at cdd3897 without weakening their assertions.
    The protected-record memory fixtures model Linux and must keep slash-absolute Linux
    identities even on Windows. Timing records compare native-cleaned paths so godog's
    filesystem traversal separators do not change identity. The unsupported-host doctor
    fixture must contain a valid synthetic container UID on Windows, where Geteuid returns
    -1, so manifest validation cannot mask the expected host refusal. FIFO examples require
    Unix and retain their Linux/macOS execution and all portable manifest-path assertions.
    Check parsed normal and manual-red selection for every affected platform. These are
    harness corrections, not an expansion of the supported container-host milestone.

    First measure the optimized unsharded execution. If it meets 240 s, keep the single engine
    job. Otherwise use one shard per feature file on separate native ubuntu-latest runners and
    daemons, each with the same 240-second target and restored 10/5/4-minute limits. Keep every
    feature's examples together, especially the quiet control and escalation rows. Each shard
    retains checkout at TO, pinned setup, read-only preflight, its own guarded fixture preparation,
    step-local environment, setsid --wait, paniconexit0, log/signal diagnostics, original test and
    capture exit-status propagation, and always cleanup. No shared daemon, state or fixture output
