    This CI fixture acquisition is the task's explicit scope; it adds no acquisition to doctor,
    approve or run, no product registry dependency and no permission for worker egress.

    Add features/testdata/engine-fixture/Dockerfile with that exact BusyBox base, numeric USER
    from the runner's non-root effective UID/GID, an empty ENTRYPOINT and CMD ["/bin/true"].
    Validate the build arguments as numeric and refuse UID zero. Use only this reviewed recipe
    and an otherwise empty build context, never a consumer checkout's Dockerfile or helpers.
    No RUN, ADD, COPY, package installer, lifecycle hook, devcontainer.metadata, implicit volume,
    extra environment or tool bootstrap is needed. The fixture offers BusyBox, not the pilot's
    full agent toolchain. Later runtime probes may extend its reviewed contents in their own specs.
    The derived digest is measured per build, not fabricated or assumed stable across runs;
    retain its reference and config ID together. The manifest for a scenario must request this
    measured reference and use its owning policy/manifest spec, without validator bypasses.

    Implement preparation and cleanup in tools/bin/engine-fixture, using the existing runner
    shell/coreutils, Docker CLI, curl and jq, with no new Go module, action or installed service.
    Both modes refuse outside GitHub Actions on an actual Linux amd64 host before engine access.
    Agents never invoke them against an engine or spoof CI. Every engine call uses the explicit
    unix:///var/run/docker.sock endpoint and clears the same Docker host/context/TLS/API overrides
    as T-16's preflight. Use disposable Docker configuration without logins or credential helpers.
    Do not install/start/reconfigure the daemon, add insecure-registry settings or fall back to a
    remote endpoint. Failure to use loopback HTTP on the existing runner is a failed check to
