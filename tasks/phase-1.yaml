    the same heartbeat basename under a nested checkout directory and under the host root,
    and checkout siblings named slice-11-heartbeat.keep and slice-11-heartbeat.next.keep.
    In separate disposable fixtures, make each exact excluded heartbeat path a directory with
    a retained child. The existing late deletion omits only that directory's own map entry;
