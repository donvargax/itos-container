    existing workflow checkers to allow only this input and this additional step-local variable;
    keep their unrelated-input, fixture-wiring, engine-switch and cleanup negative controls.
    Replace the old null-dispatch assertion with the exact new schema check, not a blanket pass.

    Before implementation, the new executed-ID assertion fails because named @wip cases remain
    excluded; malformed/unknown red-list assertions fail because no red input is interpreted;
    workflow assertions fail because dispatch has no inputs or wiring. Empty-input, context and
    existing isolation checks are preservation checks, not red proof. Report actual compiling
    regression assertion failures from the test commit and their passing results after the work.
    No real-engine run is needed for these regressions. The original coarse input check below
    already fails on the missing inputs key; the added test-presence checks prevent a no-tests
    success. Let configured hooks and CI run the gates; the drafter does not run completion checks.

    Replace features/README.md's disposable evidence-branch/tag-removal procedure with the
    coordinator command gh workflow run ci.yml --ref <item> -f 'red_scenarios=<ids>'. The item
    branch must hold the complete step commit and these workflow/harness changes; cases stay
    @wip. Record the resolved tested SHA, input IDs, run URL, runner/tier, outline row and failing
    Then assertion. Infrastructure, setup, undefined-step failures and empty/excluded selections
    are not red proof. Keep the failing run visible, then implement, remove @wip in the behaviour
    commit and require green CI at the actual pushed head with no red input. Document the input
    grammar, CI-only scope and unchanged no-input selection wherever the README describes @wip.
    The loop alone publishes, dispatches, reads GitHub results and closes; agents commit and stop.

    In the same implementation PR, record an ADR in docs/decisions/ naming the Future behaviour
    evidence section of docs/architecture/arc42.md and update that section: the scoped dispatch
    selector replaces removing @wip for the red run, while ordinary selection and engine access
