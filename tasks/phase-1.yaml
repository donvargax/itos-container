- id: T-70
  type: build
  title: Track shell-pinned tools in update automation
  why: >
    Keep the offline owned-run milestone's proof tooling maintained by extending existing update
    automation to tools/bin/pinned, preserving verified checksums alongside version updates. Already
    covers updating launcher versions together with verified archive checksums to maintain the
    milestone's proof tooling. The person chose to do this foundation item now, 2026-11-20. Checks
    run through itos ci run (a task check or a Go test it executes); no .github/workflows edits.

    The problem. tools/bin/pinned pins four release tools (golangci-lint 2.14.0, goreleaser 2.18.2,
    git-cliff 2.14.2, itos-cc 0.47.2), each with a SHA-256 and a GitHub asset ID per platform.
    .github/renovate.json5 enables only gomod, github-actions and renovate-config, so nothing
    notices a new release of these tools. itos-template left custom.regex out on purpose, because
    a version-only update would leave the hashes beside the version stale. That danger is real
    here, and worse than a failed check. The launcher downloads by asset ID first. A moved version
    with old IDs and old sums would download the old archive and pass its old checksum. It would
    then cache that archive under the new version's directory: a silently wrong tool. Renovate's
    github-releases datasource gives versions only. No built-in Renovate datasource gives a
    release asset's numeric ID, so the update automation cannot write the asset IDs. The rule below therefore
    lets Renovate track and propose each version. It makes the launcher and this check refuse any
    version whose per-platform SHA-256 and asset ID were not recorded for that version. An update
    lands only after its pins are refreshed and verified on the update's branch, and never with
    stale ones.

    The rule, in three files. The task touches only tools/bin/pinned, .github/renovate.json5 and
    a new tools/pinned/update_managers_test.go. It adds no module (go.mod and go.sum stay unchanged)
    and makes no .github/workflows edit.

    1. tools/bin/pinned. In each tool's case arm, the line directly above its `version=` line is
    exactly `# renovate: depName=<owner>/<repo>`, a tab-indented comment. The four comments are
    golangci/golangci-lint, goreleaser/goreleaser, orhun/git-cliff and donvargax/itos-cc. Each is
    the repository the arm's url= and download_url= already name. Every platform line also sets
    `for_version=<version>`, the release its sum= and asset_id= were taken from. Today that is the
    arm's own version, so every value the launcher resolves stays as it is now. After the tool
    case's closing esac, and before the `dir=$root/.tools/$tool-$version` line, one line refuses
    a mismatch: `[ "$for_version" = "$version" ] || die "$tool $version has no verified pin for
    $platform: its SHA-256 and asset ID are for $for_version"`. die exits 2. The refusal comes
    before the cache lookup and any download, so a version moved alone never fetches or caches
    anything. The header comment gains a few lines on the refresh. When a version moves, every
    platform line's sum= is taken from the release's published checksums and its asset_id= from
    the release API, and the two must agree with the release API's asset digest. for_version is
    set only after that, as T-4 and T-25 verified theirs. A move of itos-cc also records its
    migration in docs/upgrading.md, as T-4 did. Every other line keeps today's text: the platform
    sets, archive and member names, URLs, retries, the 403 fallback, checksum-before-extraction,
    the cache and --path. Existing comments stay too. Where goreleaser and git-cliff have a note
    above version=, the new comment goes between that note and the version= line.

    2. .github/renovate.json5. The file keeps its name and stays JSON5, which itos.yaml's file
    check requires. It is written in the HuJSON subset of JSON5: every key double-quoted, comments
    and trailing commas allowed. The test then parses it with github.com/tailscale/hujson
    v0.0.0-20260727124030-b80ff77dac4f. That library is already pinned in go.mod (the manifest
    parser uses it) and maintained by Tailscale. Go's JSON5 libraries are unmaintained forks, so
    none is added. enabledManagers gains "custom.regex" after the existing three. A customManagers
    array gains exactly one entry, with these values. customType is "regex". managerFilePatterns
    is ["/^tools/bin/pinned$/"], the current option name; fileMatch is not used. matchStrings is
    one pattern, written in the file as the JSON string
    "# renovate: depName=(?<depName>\\S+)\\n\\t+version=(?<currentValue>\\S+)\\n".
    datasourceTemplate is "github-releases". extractVersionTemplate is "^v(?<version>.+)$", since
    every tool's tags are v plus the version. Each match is the comment plus its version line, so
    Renovate rewrites only that version and never a for_version stamp. commitTrailers changes from
    ["Task: T-2"] to ["Task: T-70"]. T-2 is a done gofmt fix that guards nothing Renovate moves.
    itos ci run runs the checks of the tasks a range's footers name (itos internal/plan TasksIn).
    So every Renovate commit, this tool update's included, runs this check in CI, as T-14's checks
    do for itos-template. A version moved alone therefore turns its branch red, and branch
    automerge never lands it. A comment says this in the file's own style. Every other key keeps
    today's value: $schema, extends, ignoreDeps, automergeType, automergeSchedule, semanticCommits,
    commitBody and packageRules. No preset manager gains a match: no `# renovate:` comment exists
    outside tools/bin/pinned.

    3. TestPinnedUpdateManagers, in tools/pinned/update_managers_test.go. It goes in a file of its
    own because pinned_test.go would pass revive's 600-line limit. It reads ../bin/pinned and
    ../../.github/renovate.json5 from the tree. It fetches nothing and runs no Renovate, and it
    has these subtests.
    config: hujson.Standardize and encoding/json decode the file into a map. The top-level key set
    is exactly today's ten plus customManagers. enabledManagers is exactly gomod, github-actions,
    renovate-config, custom.regex. commitTrailers is exactly ["Task: T-70"]. The eight preserved
    keys equal, as decoded JSON, the values written in the test. customManagers holds exactly the
    entry above, with no other key.
    tracked: the tools are the launcher's `case "$tool" in` arms other than `*)`, read from the
    script, so a fifth tool with no comment fails. The test compiles the config's match string
    with Go's regexp, which accepts (?<name>…) groups. Over the launcher it yields exactly one
    match per arm, inside that arm, and no other match. For each match, depName is the repository
    in the arm's api.github.com url=. currentValue equals the version the arm resolves.
    download_url holds /download/v<currentValue>/.
    verified/<tool>/<platform>: the script is cut before `\ndir=$root/.tools/$tool-$version`, as
    TestGitCliffPin cuts it. The uname expression is replaced by an environment value, and
    `printf '%s\n' "$version" "$for_version" "$sum" "$asset_id"` is appended. It runs under
    `sh -s -- <tool>` for Linux-x86_64, Linux-aarch64, Darwin-x86_64, Darwin-arm64,
    MINGW64_NT-10.0-x86_64 and MINGW64_NT-10.0-aarch64. The supported sets stay exactly today's.
    golangci-lint has all six. goreleaser and git-cliff have the four Linux and Darwin ones.
    itos-cc has those four plus windows-amd64. A supported platform exits 0, with for_version
    equal to version and a 64-hex sum and a numeric asset_id. An unsupported one exits 2, saying
    `no pinned <tool> for <platform>`.
    stale/<tool>/<platform>: the test does in memory what Renovate's update does. It replaces only
    the currentValue span of that tool's match with 999.0.0 and runs the same cut script on every
    supported platform. Each run exits 2 with empty stdout, and stderr holds `pinned: <tool>
    999.0.0 has no verified pin for <platform>: its SHA-256 and asset ID are for <old version>`.
    TestGitCliffPin, TestPinnedDownload, TestPinnedAssetRedirect and
    TestPinnedForbiddenAssetFallback stay unchanged and keep passing. fixtureLauncher replaces the
    whole region holding the new refusal line.

    How the check fails today, and what it guards. The check passes only on the parent test's own
    line. go test -v prints that line unindented as `--- PASS: TestPinnedUpdateManagers (<n>s)`
    and each subtest's line indented, so grep -x on the whole unindented line matches no subtest,
    and the pipeline's status, which is grep's, is 0 only when the whole parent test passed. Today
    the package has no TestPinnedUpdateManagers. go test prints "no tests to run" and PASS, grep
    finds no such line and exits 1, so the check exits 1. The test written against today's tree
    fails as a whole, so its parent line reads --- FAIL and the check still exits 1. config fails
    because hujson refuses the unquoted `$schema` key at line 3, and enabledManagers lacks
    custom.regex. tracked finds no match. Each supported platform's verified row fails because sh
    refuses the unset for_version. stale has no match to move. Five verified rows already pass
    today and keep passing, because that behaviour does not change: goreleaser and git-cliff on
    MINGW64_NT-10.0-x86_64 and MINGW64_NT-10.0-aarch64, and itos-cc on MINGW64_NT-10.0-aarch64.
    Each hits its arm's `*) die "no pinned $tool for $platform"` and exits 2 before the appended
    printf reads for_version. Their passing subtest lines do not satisfy the anchored check, so a
    test-only commit, or a partial implementation such as one without the refusal line, still
    fails it. Even with comments alone, a moved version exits 0 and prints the old sum and asset
    ID: the silent case above, which the stale rows fail. With the work, every row passes, and so
    does the parent. Later, a Renovate commit
    that moves a version alone is the stale row made real. Its verified rows fail, and the
    launcher itself refuses in CI's golangci-lint step and in the release's goreleaser and
    git-cliff steps.

    Commits and proof. One build commit carries the three files; a test commit of the new test
    first is allowed but not required. The implementer may commit freely in its workspace. The
    host makes the landing commits and runs itos, submission, publication and review. Neither
    .github/renovate.json5 nor tools/ is a proof.code path, so this has no mutation proof, and the
    rows above are the shell's and the config's guard. tools/bin/pinned is an enforcement input,
    so the hook runs the architecture fixture matrix on that commit, which is expected. No step
    needs the network: Renovate's lookups run centrally, outside this task. Whether Renovate's
    own run accepts the config is outside what an offline check can prove, so this claims no more
    than the test shows.
- id: T-71
  type: chore
  title: Trim features/README.md to its standing harness rules and hold it under a doc-caps cap
  why: >
    Every implementer is told to read features/README.md, and it keeps growing because each slice
    adds its own evidence notes. At 5e9a173 it is 113,103 bytes, not the 79,818 the promoted entry
    measured. Most of that is in 'The CI engine tier' (33.2 KB), 'Manual red-first evidence'
    (28.0 KB), 'Cached fixture protocol' (19.5 KB), the slice-17 and slice-27 paragraphs under
    '## Tags' (6.5 KB) and 'Black-box boundary' (7.3 KB). Much of the bulk is history: 27 commit
    SHAs, 18 Actions run IDs, dated measurements, investigation write-ups such as the overlay
    failure, the goroutine-label analysis and the 2026-11-15 CI excerpts, and per-slice notes on
    which checkpoint supplied which red and how many rows passed. Commits, run pages, ledger
    entries, decision records and the registry already hold all of it. T-71 trims the file to its
    standing harness rules and adds a doc-caps cap so later slices cannot grow it back. T-72
    depends on it and adds one rule inside the cap's headroom.

    What stays. A standing rule is something a person writing scenarios, step definitions, fixtures
    or workflow steps, or running or judging the tiers, has to follow or rely on today. Keep each
    one once, in short form, in these areas:
    the black-box boundary and clean environment;
    running and selection, including the no-race rule for the whole suite;
    the product coverage routing table and its per-ID rules;
    the engine tier: what @engine means, the switch and its CI-only context, that agents get no
    socket and do not spoof CI, the shards and the rule for moving a whole feature only on
    measured times, ITOS_CONTAINER_ENGINE_FEATURES, the aggregate check name and its gate, the
    preflight bounds, the step command, the 180 s warning, the 600 s guard and the 10, 11 and
    15 minute limits, the 1/3/1 fixture budgets against production's 10/120/10 with no product
    input able to enable them, that the session contract assembly keeps production limits, what
    the failure report and timing records are for, and that proof runs stay engine-disabled;
    the LIFECYCLE-09 signal-window limits and the known gap of the first repeat's restart;
    the cached fixture protocol: CI-only helper modes, pinned references and provenance, recipe
    constraints, preparation and warm-up bounds, the fixture-input table, the duties of future
    engine Given steps, cleanup rules, and that no evidence is committed;
    the manual red-first input, where it is read, its selection rules, the four-step procedure
    and what is not red proof;
    the settled operating rules: under q-63 a slow first create gets a re-run, and no limit,
    assertion or retry changes for it; a registration timeout goes to the coordinator; suite
    timeouts are not raised to pass;
    the tags table, IDs, commit rules, smoke set, scenario-writing rules and steps table.
    "Fixture sources and notices" stays word for word. So do the limits on support claims: local
    and harness checks are not native evidence, and no support is claimed without CI runtime
    evidence.
    Where a paragraph only describes what a harness test already holds, replace it with that
    test's name and the rule an author relies on.

    What goes. Commit SHAs, run IDs and URLs, dated observations and measurements, per-slice
    accounts of red and green evidence, row counts, and explanations of past failures. Delete them
    and do not create a new file for them: an extra document would be another uncapped read, and
    history already keeps the text. If a passage records a decision that no ledger entry, decision
    record or registry item holds, keep only its rule and name the passage in the report to the
    coordinator. Merge repeated statements of a rule into one. The no-race rule is stated three
    times today.

    References that must still resolve. Keep these headings exactly: Black-box boundary, Running
    them, Product coverage, The CI engine tier, Cached fixture protocol, Fixture sources and
    notices, Manual red-first evidence, Tags, Commit rules, The smoke set, Writing a scenario, and
    The steps this branch's scenarios use. docs/upgrading.md, docs/plans/offline-run-lifecycle.md
    and docs/decisions/0002 link three of them by anchor. Comments in anchors, checkout-overlap,
    doctor, hardlinks, lifecycle, offline, recovery and run_exit .feature files, in
    features_test.go and session_probe_test.go, in smoke.yaml and in tools/bin/engine-fixture and
    engine-failure-report point at the guarded Linux amd64 CI tier, the cached fixture protocol,
    the real-engine red-first procedure, the smoke rule, the known gap, the session assembly's
    production limits, the failure report's purpose, and fixture sources and licenses. Each of
    these must still be in the file. Leave those other files unchanged.

    The cap. Add `cap features/README.md <n>` to tools/bin/doc-caps after the existing two lines.
    The value n is the smallest multiple of 4096 that is at least the trimmed size plus 2048 bytes,
    and it may not exceed 49152. The 2048 bytes of headroom are for T-72. Record the README's size
    and date in the script's comment, beside the sizes it already records. Change nothing else in
    the script. If the standing rules cannot fit under 49152, stop and report it. Do not cut a
    rule, and do not raise the ceiling: under the script's own comment, raising a cap is a decision.

    Tests and gates. At 5e9a173 no test reads features/README.md: the only mentions in Go code are
    comments. If a merge from main brings in a test that pins removed prose, keep its assertion and
    point it at the kept rule. No gate, workflow, feature file, step or product code changes.
    Sibling branches that add evidence paragraphs will fail doc-caps once T-71 is on main. That is
    the intended effect, and trimming those paragraphs falls to each branch. Before landing, merge
    main and trim anything a sibling has landed in the meantime.

    Commits and proof. One chore commit with Task T-71 carries features/README.md and
    tools/bin/doc-caps. Neither file is a proof.code path or an enforcement input, so there is no
    mutation proof and no fixture matrix. The range is not prose-only, because tools/bin/doc-caps
    is not a prose path, so CI runs these checks; they are POSIX sh with GNU grep -P, as on
    ubuntu-latest. The implementer may commit freely in its workspace. The host makes the landing
    commits and runs itos, submission, publication and review.

    How each check fails today. The first exits 1 at grep, because doc-caps has no README line. The
    second reads an empty n, and the test refuses it. It also fails a cap set high enough to skip
    the trim (anything above 49152), and a cap left loose or too tight around the trimmed size.
    The third passes its heading, digest and license greps today. It fails on the history scan,
    which finds 32 lines with a commit SHA or a run ID. If grep -P is unavailable it fails
    (status 2 is not 1), and it fails again if a linked heading or the fixture provenance is
    removed. The checks cannot tell whether a kept rule is complete or a removed one was history;
    review of the diff against this entry judges that.
- id: T-72
  type: docs
  title: features/README.md requires engine source or native CI evidence for claims about exact mount option strings
  why: >
    The executable /tmp spec showed that leaving out noexec is not enough evidence that a mount
    behaves a certain way. Add a review rule to the scenario guidance: when a spec claims an exact
    mount option string produces a particular behaviour, it cites the relevant engine source or a
    native CI observation. It lands after the trim so the cap has headroom over the shortened file.
    Broken down from p1-refresh-remaining-template-guidance.

    The problem. slice-34 requested the worker's /tmp tmpfs as rw,nosuid,nodev,mode=1777, and its
    spec comments, step oracles and warm-up fixture records called that mount executable because
    noexec was absent from the request. Moby prepends noexec to every HostConfig.Tmpfs option list,
    and only a later exec token clears it (daemon/oci_linux.go and MergeTmpfsOptions). So the mount
    was noexec, and every native home case stopped at its temporary-ELF step until 21c40b9 named
    exec. The spec drew a behaviour from an option string, and neither engine source nor a native
    observation backed it. The engine may add, reorder or override options, so what a request
    leaves out says nothing about the mount.

    The rule. Add one bullet to '## Writing a scenario' in features/README.md. When a spec claims
    that an exact mount option string produces a behaviour, it cites one of two things. The first
    is the engine source that turns the requested options into the mount. The second is a native
    CI observation of the mounted result and the behaviour itself. "Spec" covers ledger entries,
    scenario comments, step oracles and fixture records. Examples are a mount being executable,
    writable or read-only, or a path being reachable or not. The bullet must contain the words
    "mount option", "engine source" and "native CI". It may say that an option left out of a
    request is not evidence, with the noexec prepend as a one-clause example. Following T-71's
    history rule, it names no commit SHA, run ID, date or slice account. The README already says
    that local and harness checks are not native evidence, so the bullet points to that and does
    not repeat it.

    Bounds. Change only features/README.md. Leave every other heading, rule and table as it is.
    Leave the feature files, step oracles and fixtures alone: harness-home.feature and
    offline.feature already state moby's noexec prepend. Do not change any gate or doc-caps cap. The
    bullet must fit in the headroom T-71 left: the file is 46800 bytes and the cap is 49152, so
    2352 bytes remain. If it does not fit, shorten the bullet. Raising the cap is a decision, not
    a fix, under doc-caps' own comment. If no bullet that states the rule fits, stop and report it.

    Commits and proof. One docs commit with Task T-72 carries features/README.md only. No
    proof.code path or enforcement input changes, so there is no mutation proof and no fixture
    matrix. The range is prose-only (itos.yaml's ci.prose.paths includes **/*.md). On such a range
    CI keeps only a task's static checks and those declaring prose: true, and itos work done runs
    no late check. So both checks declare prose: true. They use only POSIX sh, grep, sed and tr.
    The implementer may commit freely in its workspace. The host makes the landing commits and runs
    itos, submission, publication and review.

    How each check fails today. The first exits 1 at grep, because features/README.md never says
    "mount option". Its doc-caps half passes now, and it fails if the bullet pushes the file past
    49152 bytes. The second reads only the '## Writing a scenario' section and flattens whitespace
    first, so line wrapping cannot fail it. It fails today on its first anchor, "mount option". It
    also fails if the rule is placed in another section or leaves out either kind of evidence.
    Neither check can judge whether the bullet states the rule correctly. Review of the diff
    against this entry judges that.
- id: T-73
  type: docs
  title: README explains how to register and verify the local commit hooks
  why: >
    A contributor checkout was found with core.hooksPath unset and no pre-commit or commit-msg
    hooks, so the local lint, vulnerability and commit-message gates in itos.yaml (hooks.bin: itos)
    never ran. Add instructions to README.md for registering the hooks through itos. Also explain
    how to verify them: core.hooksPath and both hooks present, and how a later commit shows the
    configured gates are enforced. Leave gates and CI unchanged. Broken down from
    p1-refresh-remaining-template-guidance.

    The problem. Neither hook can be committed, so a fresh clone has none. tools/hooks/pre-commit
    says it is "declared once in each clone (README.md)", but README.md never says how. The hook
    itself runs the structural architecture check, the fixture matrix when staged enforcement
    inputs change, pinned golangci-lint and govulncheck. Its header gives the two lines that
    declare it, `git config hook.itos-container-pre-commit.event pre-commit` and `git config
    hook.itos-container-pre-commit.command tools/hooks/pre-commit`. itos's own commit-msg and
    pre-push hooks come from `itos hook install`. On git 2.54.0 or later that command declares
    hook.itos-commit-msg and hook.itos-pre-push in the clone's local git config, which is never
    committed and is shared by the clone's worktrees. It writes no hook file and leaves
    core.hooksPath alone. So an unset core.hooksPath is normal and does not mean a hook is
    missing. The finding above holds because nothing had declared the hooks, not because
    core.hooksPath was unset. On an older git, `itos hook install` writes its own hook files
    instead, but nothing runs the project's config-declared pre-commit.

    The rule. Add one section, '## Local commit hooks', to README.md, directly after '## Working
    here'. It says, briefly, five things.
    - What to run once in each clone, in one sh block: `itos hook install` and the two `git config`
      lines above, written exactly as tools/hooks/pre-commit gives them. It also says that they
      write the clone's local config and that git 2.54.0 or later is required.
    - That registering the hooks leaves core.hooksPath alone, because git runs config-declared
      hooks whatever core.hooksPath says. So core.hooksPath should not be pointed at tools/hooks:
      git would then run that pre-commit a second time, beside the declared entry.
    - How to verify. `git hook list pre-commit` names itos-container-pre-commit, `git hook list
      commit-msg` names itos-commit-msg, and `git hook list pre-push` names itos-pre-push. Each
      prints "no hooks found" and exits non-zero when the hook is not declared.
    - How a later commit shows the gates are enforced. `itos commit` refuses with exit 3 where
      itos's commit-msg hook is not declared. With the hook declared, every commit has its message
      and staged paths judged. `itos config check` runs only when the commit stages itos.yaml, a
      ledger file, the work registry, a smoke set or a decision record. The checks of the task the
      commit names run too, but a failing one refuses the commit only once that task's item is
      done. While the item is open, the failure is printed with the task's status and the commit
      goes through, so the section must not say that a failing task check always refuses. A commit that stages any path other than Markdown, docs/**, tasks/** or feature files runs
      the pre-commit's checks (govulncheck needs the network), and any failure refuses the commit.
      A prose-only commit skips them on purpose, so seeing no lint output there does not mean the
      hook is missing.
    - That on a git older than 2.54.0 the project's pre-commit does not run, so git must be
      upgraded. The section offers no workaround.

    Bounds. Change only README.md, and only by adding this section. Leave every other section as
    it is. The README already says that hooks are workflow safeguards and not isolation, so the
    section does not repeat it. Leave tools/hooks/pre-commit, itos.yaml, the CI workflow and every
    gate unchanged. Tell no one to run a gate by hand, since gates run through their hooks and CI.
    README.md has no doc-caps cap, and this task adds none. Keep the section short anyway: about
    25 lines of prose besides the sh block.

    Commits and proof. One docs commit with Task T-73 carries README.md only. It changes no
    proof.code path and no enforcement input, so there is no mutation proof and no fixture
    matrix. The range is prose-only, because itos.yaml's ci.prose.paths includes **/*.md. On such
    a range CI keeps only a task's static checks and those declaring prose: true, and itos work
    done runs no late check. So both checks declare prose: true, and they use only POSIX sh, grep,
    sed and tr. The implementer may commit freely in its workspace. The host makes the landing
    commits and runs itos, submission, publication and review.

    How each check fails today. The first is the item's own check. It exits 1 at its first grep,
    because README.md never says "core.hooksPath". The second reads only the '## Local commit
    hooks' section and flattens whitespace first, so line wrapping cannot fail it. Today it exits
    1 because README.md has no such section. It also fails if the section leaves out
    `itos hook install`, either pre-commit `git config` line as tools/hooks/pre-commit gives it,
    any of the three `git hook list` commands, core.hooksPath or the 2.54.0 requirement. Neither
    check can judge whether the prose is correct. Review of the diff against this entry judges
    that.
