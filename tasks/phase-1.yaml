  done_when:
    - run: |
        python3 - <<'PY'
        from pathlib import Path
        import re, subprocess
        workflow = Path('.github/workflows/ci.yml').read_text()
        assert re.search(r'^  release:\s*$', workflow, re.M), 'ci.yml has no active release caller'
        source = Path('tools/release/workflow_test.go')
