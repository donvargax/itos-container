    The done_when command refuses either missing new regression before running its focused
    engine-disabled selection and the existing fixture/workflow regressions. On 7f8af93 it exits 1
    naming both missing regressions, TestEngineFixturePostPushDiagnostics and
    TestEngineFixtureManifestValidation.
    That discovery failure is missing work, not assertion-level red proof. Separately, executing
    only the current production manifest jq predicate against synthetic data accepted a valid OCI
