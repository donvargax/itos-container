- id: T-64
  type: chore
  title: Detect the available checkout socket backend
  why: >
    T-64 supplies detection for p1-checkout-socket-kernel-enforcement. Milestone two, step 5 of
    docs/charter.md requires doctor, approve and run to agree on which backend the host offers.
    Only confirmed absence of both permits asking for consent to "late host sockets reachable".
    Give these callers one read-only detector under internal/engine/checkoutsockets. Its domain
    selects from observations behind ports. Its port owns the typed outcomes Landlock, gVisor
    and neither available. A typed inspection failure carries no selection. The zero value cannot
    certify absence. Observe afresh within each caller's inspection deadline so a change since
    approval is visible to run. An already cancelled call fails before either probe.

    On the supported Linux amd64 host, the native adapter asks the running kernel for its
    highest Landlock ABI with landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION).
    Use the syscall number and version flag from the pinned golang.org/x/sys v0.48.0. ABI 9
    introduced LANDLOCK_ACCESS_FS_RESOLVE_UNIX. Select Landlock at ABI 9 or higher and finish
    without consulting the runtime list. A positive ABI below 9, ENOSYS (unimplemented) or
    EOPNOTSUPP (disabled) permits the fallback lookup. Any other error, or a successful reply
    with a nonpositive ABI, stops detection. Take the platform as input and return failure
    before I/O for unsupported platforms. Keep the build-specific code to the syscall wrapper.
    [Kernel ABI query](https://docs.kernel.org/userspace-api/landlock.html#landlock-abi-versions).

    For the fallback, give the docker adapter a read-only Info capability for the caller's
    selected, validated native Docker daemon. The pinned Moby client v0.6.2 and API v1.56.1
    already read GET /info and decode its Runtimes map. The current readiness adapter retains
    only identity and platform fields from this response. At the revision supplying API v1.56.1,
    Moby copies path and runtimeArgs from each configured runtime into /info and omits runtimeType.
    Configuring runsc with only runtimeType io.containerd.runsc.v1 therefore leaves the runsc
    entry without an executable or shim identity.
    [Moby's /info implementation](https://github.com/moby/moby/blob/14ebc602124e280ef4ae3e1a8e688dac1255baa6/daemon/info_unix.go#L52-L60).

    Select gVisor only for a path-based registration under the exact name runsc, regardless of
    the default runtime. The operator can assign that name to any executable. The reported path
    must be runsc or an absolute Linux path with final component runsc. Compare names
    case-sensitively. A missing, empty or unrecognized path, or a nonempty runtimeType on the
    runsc entry, yields a typed inspection failure with no selection. A reported map without
    the runsc key, including an explicit empty map, confirms neither backend.
    A missing or null map, a decode or request error, or cancellation yields inspection failure.
    The ABI query and daemon inspection are the detector's only I/O.
    [Docker runtime configuration](https://docs.docker.com/reference/cli/dockerd/#configure-runtimes-using-daemonjson).

    Before selecting gVisor, inspect the complete runtimeArgs list on the matching runsc entry.
    An empty list, including an omitted field, uses runsc's default host-uds policy of none.
    Also accept the exact one-element list ["--host-uds=none"]. For every other list, return
    a typed inspection failure with no selection. This covers arguments that permit host socket
    access and arguments whose effect on that policy the detector cannot establish.
    [gVisor's host socket policy](https://github.com/google/gvisor/blob/a05ab5909d2518dd541a1eb4396057e9292f4178/runsc/config/flags.go#L158).

    Put the in-memory fakes and shared observation contracts in port/porttest. Run each contract
    against its fake and its concrete adapter. In native's TestLandlockABIProbe, supply controlled
    syscall results and check the version-query arguments, both absence errnos, EPERM and an
    invalid ABI.

    In docker's TestRunscRegistration, send /info fixtures through the pinned SDK decoder.
    Keep runc registered and set DefaultRuntime to runc while varying the Runtimes.runsc entry.
    In path_registration, {"path":"runsc"} and {"path":"/usr/local/bin/runsc"} each confirm
    gVisor. Repeat the absolute-path control with runtimeArgs [] and ["--host-uds=none"].
    Change only runtimeArgs on that control for two refusal cases. In socket_permitting_args,
    use ["--host-uds=open"]. In unknown_args, try ["--unknown-fixture-flag"] alone and then
    with "--host-uds=none" prepended. Each must return a typed inspection failure with no selection.
    In shim_only_registration, send {} for the runsc entry, as Moby does for the shim-only
    registration with no reported status. In contradictory_path, send {"path":"/usr/bin/runc"}.
    Require the same typed failure with no selection for both registrations.
    Also require that failure for synthetic entries reporting runtimeType io.containerd.runsc.v1
    or io.containerd.runc.v2 alone, or a runsc path paired with the foreign shim. A lookalike
    key carrying a valid runsc path and an empty inventory each report absence. Cover omitted
    and null inventories, invalid response data and a cancelled read.
    Have the fixture reject unexpected requests. These tests run independently of the machine's
    ABI and runtimes.

    In the domain's TestBackendSelection, assert the result and which probes ran. Cover ABI 8,
    ABI 9 and a newer ABI, both backends present, each alone, and neither. An ABI probe failure
    stops selection even with runsc registered. A failed runtime lookup also leaves no selection.
    Include an unsupported platform and a pre-cancelled call with neither probe touched. Change
    the observations between calls and require the new result even after an earlier success.

    The check runs every checkoutsockets package once and requires Go to report a pass for
    each named test and all five named Docker subtests in their own packages. It currently
    exits 1 because internal/engine/checkoutsockets does not exist. A buildable package with
    no tests produces no matching pass events. First commit the tests and minimal compiling
    stubs with test --item T-64. Record the failing selection and syscall assertions. A Docker
    stub that accepts the runsc name alone must fail the typed-failure assertions in both
    shim_only_registration and contradictory_path. Selecting gVisor from its path alone must
    pass path_registration and fail the typed-failure assertions in
    socket_permitting_args and unknown_args. Implement with chore --task T-64 and run the
    same tests to green.
    Slice-42 owns doctor reporting, slice-43 approval and slice-44 run admission.
    Slice-45 reports the frozen selection. ID-SOCKETS-01 covers the startup scan.
    T-65 owns the worker init. Runtime proof for ID-SOCKETS-02/03 belongs to slice-46 on the
    person's Landlock host and slice-47 under gVisor in hosted CI.
- id: T-65
  type: chore
  title: Build the trusted Landlock worker init
  why: >
    The init must apply the pathname-socket restriction before executing the literal workload argv.
    Test argument preservation and verify that a failed restriction prevents workload execution.
    Broken down from p1-checkout-socket-kernel-enforcement.

    Charter milestone two, step 5 asks for Landlock ABI 9 or later, applied by a small read-only
    init binary that itos-container mounts as the worker's entrypoint and that runs before the
    literal argv. The controller cannot restrict a worker the daemon spawns
    (docs/plans/checkout-socket-enforcement.md), so a trusted process inside the worker must
    restrict itself before any workload instruction runs. This task builds that binary and its
    slice, and nothing that uses them. Mounting it, making it the entrypoint, getting it onto the
    host or into a release, attaching exec, and the ID-SOCKETS-02 and 03 evidence with its
    weakened-gates record belong to slice-46. Backend detection, doctor, approval, admission and
    status belong to T-64 and slice-42 to slice-45. The init imports nothing from T-64's
    checkoutsockets engine. It makes its own fail-closed check at the moment of enforcement and
    trusts no host-side detection, so T-65 keeps its empty depends_on. No public behaviour changes
    until slice-46 wires the init, so this is a task with checks and no Gherkin scenario or ID.

    Layout follows docs/architecture.md, "Slices". cmd/itos-container-init/main.go calls
    runtime.LockOSThread first, binds the two adapters, passes os.Args[1:] and os.Stderr to the
    handler and exits with the code it returns. It does nothing else. The slice is
    internal/slices/workerinit, with command, domain, port, port/porttest, landlock (adapter) and
    process (adapter). It is not called init because arc42 keeps internal/slices/init for the
    deferred example-generation command. It uses no kong, no internal/cli, no flag, help or version
    output. The existing classifier already covers a second main under cmd and a new slice, so
    neither .golangci.yml nor tools/architecture changes.

    The init is invoked as `itos-container-init -- <argv...>`. The first argument must be exactly
    `--` and at least one more must follow. Anything else is a usage refusal before any port is
    called: no argument, `--` alone, any argument before `--`, `-h`, `--help` or `--version`.
    Everything after that first `--` is the workload argv and is never interpreted, a later `--`
    included. The domain then does these steps in order, each at most once and never retried.
    First it reads the ABI with landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION).
    ENOSYS, EOPNOTSUPP or an ABI below 9 is landlock-unavailable, and any other error is
    landlock-failed. Next it creates a ruleset whose handled_access_fs is exactly
    LANDLOCK_ACCESS_FS_RESOLVE_UNIX, with handled_access_net and scoped zero and no rule added.
    So the workload cannot connect, or sendmsg with an explicit address, to a pathname socket
    created outside its domain, wherever that socket lies. Sockets the workload or its descendants
    create stay reachable, which keeps worker-private IPC, and file access is unchanged. Then it
    calls prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0), calls landlock_restrict_self(fd, 0) and closes
    the ruleset descriptor. The prctl call never receives the descriptor; only restrict and close
    do. The landlock adapter's Restrict does exactly this sequence, each raw call once:
    create, set no_new_privs, restrict, close. A create failure stops with no further call. A
    no_new_privs or restrict failure closes the descriptor and stops, and a close error during
    that cleanup does not replace the first failure: Restrict returns the no_new_privs or
    restrict error, not the close error. A close failure after a successful restrict is also a
    failure, and Restrict returns that close error. Every failure is landlock-failed. The sequence and its cleanup live in an
    untagged adapter file over an unexported set of raw-call functions, and the `_linux.go` file
    only supplies the real ones. There is no best-effort mode: a
    kernel below ABI 9 never gets a weaker ruleset. Scopes (abstract sockets, signals) and other
    file rights are left out on purpose. They are protections the charter has not decided, and a
    handled file right without rules would block checkout edits. Last come lookup and exec, two
    process-port operations. Lookup ends before any execve. An argv[0] that contains a slash is
    returned unchanged without touching the filesystem. Otherwise it is looked up in the inherited
    PATH as os/exec.LookPath does. The resolved path must be absolute. A relative result is not
    found, whether or not LookPath reports exec.ErrDot, since GODEBUG=execerrdot=0 suppresses that
    error. Lookup returns the path or port.ErrNotFound. Exec is one execve of that path. ENOENT
    from execve returns port.ErrNotFound, and any other error returns as itself.
    execve gets the resolved path, the argv exactly as received with argv[0]
    still literal, and the environment exactly as received. The init never forks: it replaces
    itself, so the workload keeps its PID (PID 1 in the worker), signals, wait and exit status,
    which slice-10 to slice-17 rely on. Apart from PATH for the lookup, the init reads no file,
    variable or configuration. No flag, variable or file can skip or weaken the restriction, and on
    success it prints nothing.

    Each refusal writes exactly one line to stderr, `itos-container-init: <code>`, with nothing
    from argv, the environment or errno text. Usage, landlock-unavailable and landlock-failed exit
    125, not-found exits 127 and exec-failed exits 126, following Docker's own codes for its
    errors, a command it cannot invoke and a command not found. Any Lookup error is not-found, and
    so is an Exec that returns port.ErrNotFound. An Exec that returns any other error, or returns
    nil, is exec-failed. So a missing bare name and a missing slash path exit 127, and a
    non-executable explicit path exits 126. A workload can exit with the same codes, and telling
    an init refusal from a workload exit is slice-46's concern.

    A Landlock domain and no_new_privs belong to one thread, and only the thread that calls execve
    hands its credentials to the workload. So the handler reads the ABI, restricts, looks up and execs
    synchronously on main's locked thread, and starts no goroutine. AllThreadsSyscall is rejected:
    it returns ENOTSUP when cgo is enabled, as go test may build. golang.org/x/sys moves from
    v0.48.0 to v0.49.0, the first release with unix.LANDLOCK_ACCESS_FS_RESOLVE_UNIX (0x10000, the
    kernel header's 1ULL << 16 for ABI 9). That module already supplies LandlockRulesetAttr,
    SYS_LANDLOCK_* and Prctl, and has no Landlock helpers, so the three calls are ours and no
    constant is copied. v0.49.0 is in the local module cache with h1:XbzkgYJHdqh/8m2Uu0W/dQv8nktxx4BFHp1M0gROTXA=,
    so `go get golang.org/x/sys@v0.49.0` resolves with GOPROXY=off and adds no module. go.mod and
    go.sum are enforcement inputs, so that commit runs the compile-first fixtures.
    github.com/landlock-lsm/go-landlock is rejected. It is not in the module cache, this
    workspace's allowed hosts cannot fetch it, its ABI 9 support is unverified, and it restricts
    through AllThreadsSyscall. No other dependency is added.

    The init runs only on Linux. The command and slice still build for every inherited target
    (linux, darwin, windows), and there the init refuses with landlock-unavailable. x/sys/unix and
    the raw calls live only in thin `_linux.go` files with no mutation site. In `_other.go` files
    every method of both adapters (ABI, Restrict, Lookup and Exec) returns port.ErrUnavailable,
    since Go's syscall.Exec cannot replace a process on Windows. Ordering and errno
    classification stay in untagged files, using syscall errno values, and nothing branches on runtime.GOOS. Built with CGO_ENABLED=0, the init
    is a static ELF, so slice-46 can mount it in any approved image. Lines that need gosec
    exceptions (unsafe pointers for the raw calls, and exec) take a targeted //nolint:gosec with
    the reason, on those lines alone.

    These named tests must run and pass, with none skipped. TestStartRestrictsBeforeExec (domain,
    porttest fakes) covers the order ABI, restrict, lookup, exec on success and each failure row.
    Its rows are unavailable, ABI 8, an ABI read error and a restrict error, none of which calls
    Lookup or Exec. A Lookup error gives not-found and no Exec. Exec returning port.ErrNotFound
    gives not-found, and Exec returning another error or nil gives exec-failed. Exec receives the
    path Lookup returned, argv equal to the input and as an independent copy, and each port method
    is called at most once. TestCommandRefusals (command)
    checks that each usage case calls no port, that each failure gives its one line and exit code,
    that a nil Exec return is exec-failed, and that stderr holds nothing from argv.
    TestLandlockContract runs the shared contract against the fake and against the real adapter.
    It also drives the adapter's Restrict over recording raw-call fakes, on every OS. The success
    row sees create, set no_new_privs, restrict and close in that order, once each. Create gets
    an attribute with handled_access_fs exactly RESOLVE_UNIX and net and scoped zero, with flags
    zero. Set gets option PR_SET_NO_NEW_PRIVS with arguments exactly 1, 0, 0, 0. Restrict gets
    the created descriptor and flags zero, and close gets the created descriptor. Each failing
    raw call in the fake returns its own distinct sentinel error. The failure rows are create (no
    later call), no_new_privs (then close), restrict (then close), no_new_privs and restrict each
    with a cleanup close that also fails, and close after a successful restrict. Each makes no
    call beyond those named. errors.Is shows what Restrict returns: the create, no_new_privs or
    restrict sentinel in its rows, that same first sentinel and not the close sentinel when
    cleanup also fails, and the close sentinel when only the close after a successful restrict
    fails.
    The real adapter runs only in a child re-exec of the test binary, which forwards
    -test.gocoverdir as internal/engine/terminal/native/terminal_linux_test.go does and returns
    normally. The test process itself is never restricted. The child's test goroutine calls
    runtime.LockOSThread before its first Landlock call and never unlocks. It does its ABI
    measurement, Restrict and every socket probe on that goroutine and starts no other for them,
    since a Landlock domain belongs to one thread. The child compares the adapter's ABI
    with its own independent measurement. On ABI 9 or later, after Restrict, a stream connect and a
    datagram sendto to sockets the child made before Restrict fail with EACCES, while a stream
    socket made after Restrict accepts a connection into its listen backlog. Also after Restrict,
    and before any exec, no entry in /proc/self/fd links to anon_inode:[landlock-ruleset], the
    exact readlink target Linux gives a ruleset descriptor. Before relying on that absence, the
    same probe function must report a ruleset descriptor the child deliberately opened with its
    own raw create and still holds, and the child closes that descriptor before calling Restrict.
    On ABI 1
    to 8 Restrict returns an error.
    Where Landlock is unavailable both calls return ErrUnavailable.

    TestExecPreservesArgvAndEnv makes its replacement and byte-preservation assertions on Linux.
    There it runs the real process adapter in a child re-exec. Its target is
    the test binary in a helper mode that reports os.Args and os.Environ. The argv rows are an
    empty element, spaces, a tab, a newline, a leading `-`, a second `--`, `--help`, a non-UTF-8
    byte, a bare argv[0] found through PATH and seen literally, and a path with a slash. The
    environment must come through exactly, including a value holding `=` and an empty value. The
    failures return in the child, since a failed execve replaces nothing. A bare name not on PATH
    gives Lookup port.ErrNotFound. A bare name present only in a relative PATH entry gives Lookup
    port.ErrNotFound both by default and in a child started with GODEBUG=execerrdot=0. A missing
    slash path is returned unchanged by Lookup, and Exec then gives port.ErrNotFound. A
    non-executable explicit path makes Exec return an error other than port.ErrNotFound. Off Linux
    the same test asserts that Lookup and Exec both return port.ErrUnavailable, with no child.

    TestInitBinary (cmd) builds the init with CGO_ENABLED=0 and -trimpath, adding -cover and
    GOCOVERDIR when -test.gocoverdir is set so refusal runs keep main's counters. For a Linux
    build, debug/elf must find no PT_INTERP and no DT_NEEDED. The test measures the ABI with its
    own raw call in a test-only tagged file. It logs `workerinit kernel branch: landlock ABI <n>,
    enforcement` or `..., refusal`, where n is 0 when Landlock is unavailable. On every host,
    usage invocations exit 125 with the usage line and leave the workload's marker absent. In the
    refusal branch (ABI below 9, unavailable, or not Linux) a valid invocation exits 125 with
    landlock-unavailable and leaves the marker absent. The enforcement branch checks these points.
    Argv and environment come through end to end, bare argv[0] included. The workload, and a child
    it starts, get EACCES on a stream connect and a datagram sendto to sockets the test process
    made, while the workload's own socket works. /proc/self/status shows NoNewPrivs 1, and no
    descriptor links to anon_inode:[landlock-ruleset]. That probe takes the same positive control
    as TestLandlockContract's: the workload first opens a ruleset descriptor with its own raw
    create, sees the probe report it, and closes it before the absence check. The
    layer-exhaustion row launches the init
    from a helper mode of the test binary. The helper calls runtime.LockOSThread first and holds
    it through exec. It sets no_new_privs and restricts itself again and again with the init's own
    ruleset until landlock_restrict_self reports E2BIG, the kernel's layer limit. That fills
    whatever slots remain, so layers the helper inherited do not matter. Any other error, or 17
    calls without E2BIG, fails setup. Then the helper execs the init from the same thread, and the
    init's restriction fails: exit 125, landlock-failed, marker absent. A missing bare name exits
    127 not-found. So does a bare name present only in a relative PATH entry, by default and with
    GODEBUG=execerrdot=0 in the init's environment. A missing slash path exits 127 not-found, and
    a non-executable explicit path exits 126 exec-failed.

    The tests need no engine, network, model, account or credential. They use private temporary
    directories and bounded waits. The branch follows the measured kernel, never a runner label.
    In CI the runner's ABI picks the branch. The person's ABI 9+ host and this workspace take the
    enforcement branch (the drafter measured ABI 10 here on 2026-11-19). The implementer reports
    which branch ran where. The ledger check accepts the refusal branch so that ordinary hosted
    CI below ABI 9 stays green, and a refusal-only run proves no enforcement. So T-65 is accepted
    only with one run of this ledger command on the person's ABI 9+ host. That run must log
    `workerinit kernel branch: landlock ABI <n>, enforcement` with n at least 9 and pass
    TestLandlockContract and TestInitBinary. The implementer makes that run in its workspace on
    that host and reports those three lines. It needs neither Docker nor slice-46's scenarios.
    Before the work the check fails at package discovery, which is
    evidence of absence, not a failing assertion. The implementer therefore first makes a test
    commit with the tests and minimal compiling stubs, records each named test's assertion
    failure, then implements until the same tests pass.

    Commits, each decided before editing: a chore moving x/sys (go.mod, go.sum); the test commit;
    the chore implementation under cmd/itos-container-init and internal/slices/workerinit; and a
    docs commit adding one arc42 building-block row for both, "T-65; bound to run by slice-46".
    The implementer may commit freely in its workspace, and the host makes the landing commits.
    Leave sibling ledger entries, the registry, features/, workflows and other slices unchanged.
    Make no local mutation run and commit no coverage or mutation output; CI judges the
    changed-code proof.
- id: T-66
  type: test
  title: A feature-harness fixture chooses the kernel's Landlock answer and the daemon's runtime list for socket-backend scenarios
  why: >
    Charter milestone two, step 5 (late host sockets unreachable) needs doctor, approve and run
    scenarios (slice-42, slice-43, slice-44) that choose the backend the host offers. The product
    asks the kernel itself: T-64's native probe issues landlock_create_ruleset(NULL, 0,
    LANDLOCK_CREATE_RULESET_VERSION) through golang.org/x/sys. cmd's probe assembly gets no
    Landlock seam or default, so nothing can shadow slice-46's real-kernel proof on the person's
    host (triage on slice-42, 2026-11-19). The harness therefore answers at the system call. That
    fixture exists today only in the slices' uncommitted drafts, which already differ, and
    whichever slice landed first would build it. This task builds it once under features/. It
    needs no scenario and no scenario ID, so it can land while minting is blocked. Nothing under
    cmd/ or internal/ changes.

    A world that pins an answer starts each later product invocation, on every route that applies
    the wrapper described below, through a helper mode of the features test binary, as
    TestApprovalKernelHelper does for fchmodat2. The helper locks its thread, sets no_new_privs and
    installs a seccomp filter with SECCOMP_FILTER_FLAG_NEW_LISTENER. The filter's only action other
    than allow is SECCOMP_RET_USER_NOTIF for landlock_create_ruleset under AUDIT_ARCH_X86_64. The
    helper hands the listener to the harness over a descriptor of its own and execs the program in
    the same process. The program keeps the pid the route started, its path, argv (argv[0]
    included), environment, working directory, standard streams, umask unless the route asks for
    one, blocked and ignored signals, resource limits and the route's own extra descriptors at their
    numbers. Exec from a Go program resets an inherited ignored signal that Go handles, such as
    SIGPIPE, to its default. go test starts the harness with no such signal ignored, and the harness
    ignores none, so a helper keeps the same sets. Go's syscall.Exec, which unix.Exec calls,
    restores the soft RLIMIT_NOFILE that Go raises at start. No row compares limits, since a Go
    probe sees only the raised one. None of the helper's descriptors reaches the program. It runs
    with no_new_privs, which an unprivileged filter requires. The helper never runs the program
    unfiltered. A filter the kernel refuses, or a program the helper cannot execute, is the
    invocation step's error, never an exit status that a product assertion reads. The helper reports
    either failure on its own descriptor, which closes when its exec succeeds.

    The harness supervises an invocation until its route ends the wrapper after Wait, never on a
    timer. Ending it closes the listener once each call already received is answered and recorded,
    so a record read after the route returns is complete. A process that outlives the started one,
    such as a descendant, then gets ENOSYS for a later query, as the kernel answers a filter whose
    listener is gone, and the product would read that as Landlock absent. Doctor and approve leave
    no such process. Before a route that can leave one adopts the wrapper, its slice extends
    supervision until the listener reports POLLHUP, which the kernel sends once every process under
    the filter has exited and been reaped. The harness answers the version query, whose arguments
    are NULL, 0 and LANDLOCK_CREATE_RULESET_VERSION, from the world's answer as it stands when the
    query arrives. "ABI <n>" returns n, a decimal from 0 to 2147483647 written with no sign or
    leading zeros, since the kernel's reply is a C int. "ENOSYS", "EOPNOTSUPP" or "EPERM" fails with
    that errno. Any other landlock_create_ruleset call fails with EPERM, and pinning any other text
    is refused. Pinning is safe while invocations run. A step may arrange one action to run when the
    next version query arrives, before its answer is read, as slice-43's drafted daemon takeover
    needs. An action's error fails the invocation's step, and the query still gets the world's
    answer as it then stands. The harness records each supervised invocation's calls in order. Each
    call records whether it was the version query and the answer delivered, so a step can tell
    exactly one version query from none and from other calls. A call counts once its answer is
    delivered. If SECCOMP_IOCTL_NOTIF_SEND fails with ENOENT, either a signal interrupted the call,
    which Go's restarting handlers turn into a new notification, or the program ended. Any other
    notification or failed answer is a fixture error that fails the step. x/sys v0.48.0 has the
    constants and ioctl numbers but not the seccomp_notif and seccomp_notif_resp types, so the
    harness declares those layouts. No library is added: libseccomp-golang needs cgo and
    libseccomp's headers, and the filter is a few BPF instructions.

    One wrapper serves every route: a route applies it to the exec.Cmd it builds before Start and
    ends it after Wait. The wrapper takes an optional umask, which the helper sets after its filter
    and just before its exec, as TestApprovalKernelHelper does, so no other program runs between the
    helper and the program. This task applies the wrapper in runEnv, so that it covers runDoctor,
    which doctor and the fingerprint approval use. Where the approval location is set in a world
    that pins an answer, runEnv passes umask 0000 to the wrapper and starts no /bin/sh. A program
    that cannot be executed is then the helper's failure, never sh's exit 126 or 127. Approve's
    terminal processes, run's preflight process and the other routes that start the product
    themselves adopt the wrapper in the slice that first pins an answer for them. A world that pins
    nothing starts its product directly, as today, through runEnv's /bin/sh umask wrapper where the
    approval location is set. The harness has no default answer, so every existing scenario and
    slice-46's proof see the host's kernel. Scenario cleanup ends any supervision still running,
    closing its listener as a route's end does. A helper or probe invocation leaves no
    itos-container-feature-binaries-* directory. TestMain makes one before m.Run, and neither an
    exec'ing helper nor a probe that exits at once returns to remove it, so TestMain recognizes both
    modes from their arguments and runs them before it makes the directory. The slice-4 helper's own
    leak stays with p2-kernel-helper-leaves-no-feature-temp-dir.

    newDoctorAPI's /info gains DefaultRuntime runc and, by default, the inventory "runc only".
    Once doctor detects, every ordinary doctor world on CI, below ABI 9, then confirms none rather
    than failing its fallback. A world names the selected fixture daemon's inventory, which each
    later request reads afresh. "runc only" is Runtimes {"runc":{"path":"runc"}}. "runc and runsc"
    adds "runsc":{"path":"/usr/local/bin/runsc"}. "runsc permitting host sockets" gives that runsc
    "runtimeArgs":["--host-uds=open"]. "unidentified runsc" adds "runsc":{}, as Moby reports a shim
    registration. "missing inventory" omits Runtimes. Each keeps DefaultRuntime runc, and an
    unknown name is refused. These are the shapes T-64's docker tests judge. No command reads
    Runtimes yet, so the default changes no live scenario.

    Product output is not this task's. The checkout_sockets member, the plain backend line and the
    doctor.sockets.* rules with their exits are slice-42's scenarios to specify, and slice-43 and
    slice-44 reuse them. The fixture asserts none of them; doctorProblem already requires the flat
    field subject such a rule carries. The step texts stay with the slices, as do the ITOS_ROOT and
    working-directory arrangement, a second socket for one daemon and the approval worlds' own
    default inventory. The slices' steps pass the answers and inventory names above through
    unchanged.

    TestSocketBackendFixture holds the fixture. On Linux amd64 it never skips, so a host that
    refuses the filter fails it. Elsewhere it skips, and the package still builds for the manual
    macOS and Windows jobs. Its programs are a probe the features binary carries, which makes the
    calls a row asks for. The probe reports each reply, its argv, working directory, environment,
    standard input, pid, descriptors and umask. It also reports the SigBlk, SigIgn, NoNewPrivs and
    Seccomp_filters lines of /proc/thread-self/status, read on a locked thread, since a blocked set
    is per thread. Each row that runs a program in a pinned world also requires the harness's record
    of that invocation, so none passes against an unsupervised start. Go reports a space in a row's
    name as an underscore.

    kernel_answer/<answer> runs for ABI 9, ABI 8, ABI 0, ENOSYS, EOPNOTSUPP and EPERM. Through
    runEnv, one version query receives exactly that reply, n with no errno or -1 with the errno, and
    the invocation's record holds that one call. The rows share one world and re-pin before each
    invocation, so each record holds only its own call. In unpinned, a world that pins nothing runs
    the probe through runEnv. Its version query gets the same reply as one the test process makes
    itself, its NoNewPrivs and Seccomp_filters equal the test process's own, and the harness holds
    no record of the invocation. In umask_composed, a world whose approval location is set, as the
    child state location step sets it, pins ABI 8. Through runEnv the probe reports umask 0000, its
    version query receives 8, and the record holds that call. A program that cannot be executed
    fails its step in that world too. In other_call_refused, a call with flags 0 gets EPERM and is
    recorded as not the version query. A version query in the same invocation still gets the pinned
    answer. In arrival_action, ABI 8 is pinned, and an action arranged for the next arrival re-pins
    ABI 9. Both version queries of one invocation receive 9, and the action runs once. In a second
    invocation, an arranged action that returns an error fails the step with that error, and its
    query still receives 9. In no_query, a program exits 7 at once without a call. The step reports
    exit 7 and a supervised invocation with no call, and it returns within two seconds. In
    exec_unchanged, one program with one extra descriptor at 3 is started wrapped and unwrapped.
    Both report the same argv, working directory, environment, standard input, umask, SigBlk,
    SigIgn, and descriptor numbers and kinds. Each reports the pid of its started process, and both
    pass their standard output and error through. Only the wrapped query reaches the harness. In
    no_feature_binaries_left, TMPDIR names a private empty directory. A supervised version query
    gets its answer, a supervised probe exits 7 at once, and that directory then holds no
    itos-container-feature-binaries-* entry. In cleanup_ends_supervision, the row starts a wrapped
    probe, as a route would, and never ends the wrapper. The probe reports the pinned answer to its
    first version query, then waits for its standard input to close. Scenario cleanup runs, and the
    record then holds that call alone. Released, the probe's second query fails with ENOSYS within
    two seconds, as the kernel answers a filter whose listener is gone, and the record is unchanged.
    In helper_failure, a helper whose filter the kernel refuses fails its step, naming the fixture,
    and its program never runs. Starting the helper inside another supervised invocation causes
    that, because the kernel refuses a second listener with EBUSY. A program that cannot be executed
    fails the step too. In refused_answers, pinning ABI -1, ABI +9, ABI 09, ABI 2147483648, ABI x,
    abi 9, ABI 9 with a trailing space, EINVAL or empty text fails. On one fixture daemon that
    newDoctorAPI makes, runtimes/default reads GET /v1.56/info before any choice. Then
    runtimes/runc_only, runc_and_runsc, runsc_permitting_host_sockets, unidentified_runsc and
    missing_inventory each choose that inventory and read again. Each read decodes to exactly the
    Runtimes above, or none, and DefaultRuntime runc. runtimes/refused_inventory refuses an unknown
    name.

    The check runs that test once with -json and requires a pass event for it and for each of its
    twenty-three named rows, so a skipped, renamed or missing row fails it. Today it exits 5, since
    go test finds no test to run and jq names all twenty-four missing passes. First commit the
    regression in a test commit with --task T-66, beside stubs that compile, start every program
    unsupervised, record nothing and accept every choice. Each row that runs a program in a pinned
    world then fails at its record, the refusal rows at their refusals and the runtimes rows at
    their /info reads. Only unpinned passes against the stubs, as it must, since they keep the
    property it guards: a direct start that sees the host's kernel. It is there because nothing in
    the product asks the kernel yet, so the ordinary suite would not notice a fixture that wraps or
    answers when nothing is pinned. Build the fixture in a second test commit and run the same check
    green. Since runEnv and newDoctorAPI change for every world, also run the ordinary feature suite
    once, without -race. Use -race only on this test, selected with -run. features/README.md
    describes the fixture beside the older-kernel approval fixture. It also says that a host whose
    processes already sit under a live seccomp listener, as in a sandbox that supervises by user
    notification, refuses the filter with EBUSY, so the test fails there.
- id: T-67
  type: ci
  title: Cursor Bugbot satisfies the review gate
  why: >
    Codex is out of code-review usage (about 2026-11-23), and itos push --ready waits on every
    login in push.pr.review_by. The person approved Cursor Bugbot as the second reviewer.
    Settled decisions: review_by is [cursor] alone, because itos waits on every login listed and a
    list with Codex would still block on Codex. The login is cursor, not cursor[bot]: itos drops a
    [bot] suffix on both sides and GraphQL names the bot without it (PR 75's review came from
    cursor[bot]). Codex stays in push.pr.reviewers as kind codex, so it is still asked, and cursor
    is added there as kind bugbot. Codex's review threads must still be resolved before merge.
    itos reads the itos.yaml of the checkout it runs from, so this item's own pull request is
    judged by the new rule. The change is to itos.yaml alone, committed as ci with Task T-67, and
    it also updates the comment above push.pr to name Bugbot. The check reads the effective config
    and fails today because review_by is [chatgpt-codex-connector] and no reviewer has kind bugbot.
- id: T-68
  type: test
  title: ID-RUNTTY-22 closes the client terminal only after launch is complete
  why: >
    ID-RUNTTY-22 (features/run_terminal.feature, "A late hangup signal cannot kill the controller
    during owned teardown") fails now and then in CI with exit 75 where it expects exit 17. It
    blocked slice-37 and T-64's coverage run and has failed on other heads (runs 44476995073 and
    44554398342). It passes alone in about four seconds, so it fails only under CI load. Charter
    step 5 proof waits on it.

    Cause: the fixture is wrong and the product is right. The step "the fixture closes the client
    master and delivers SIGHUP after owned teardown has begun"
    (features/run_terminal_local_linux_test.go) closes the client master as soon as the fake
    engine's `ready` channel closes (features/run_terminal_engine_test.go). `ready` closes when the
    fake writes its output frame, which runs beside the /start reply, so it does not show that
    launch is finished. Under load the master closes while the controller is still inside launch
    (Start, anchor detection, the post-start record). A hangup before the workload's exit is
    observed cannot give 17: the controller reports the disconnect with exit 75 and "owned run
    could not be completed" (run 44554398342), or its worker-inspect fails and it reports
    run.execution-unavailable and run.mount-refused (run 44476995073). Both are the right product
    answers for a disconnect during launch (see the RUNTTY-14 row "unknown, 75"). The scenario
    means a disconnect during teardown, after launch.

    Settled fix: harness only, no product change and no scenario text change.
    1. The fake engine gets a `startDelay` knob. It holds the reply to POST /start, not the output
    frame, for the given time. The hold selects on time.After(startDelay) or the request's
    r.Context().Done(), with the recorder lock released while it waits, as the existing "start
    accepted but its reply times out" fault does. The RUNTTY-22 step sets it to one second. That
    forces the bad interleaving every time: output is ready while the controller is still in
    Start.
    2. invoke's harness guard (features/run_terminal_linux_test.go, the 5 s `guard`) grows by
    exactly the step's startDelay and by nothing else. This is settled and is not a loosening of
    a gate: it is bookkeeping for a delay the fixture itself injects, and no product bound, no
    scenario assertion and no other scenario's guard changes.
    3. The step closes the client master only once `launchObserved(requests, pid, id)` is true. It
    must not close on `ready` alone. The function takes the recorder's journal ([]doctorRequest),
    the controller's PID and the container ID, and is true when some request has that PID, method
    POST and a path that ends in "/containers/<id>/wait", matched as a suffix as the existing
    /kill gate matches. A query string is not part of the path and does not matter; a version
    prefix such as /v1.56 does not matter. The controller waits only after launch, and the journal
    shows that request for any controller, so no new product signal is needed. The step reads the
    worker's ID from the fake's record (the single key of a.started, read under a.mu), and fails
    the step if there is not exactly one. It never matches a /wait for any other ID. The journal's
    create request carries no id; a.started[id] is set at features/run_terminal_engine_test.go:73
    before the hold.
    4. The existing second gate (SIGHUP only after the owned /kill request, with killDelay 2s) is
    unchanged.
    The scenario must still report run.terminal-disconnected, exit 17, an attempted terminal
    restoration and finished owned cleanup. Nothing may be loosened.

    TestLaunchObserved (features/, no engine) has these rows, named by t.Run with underscores for
    spaces, and the first check requires a pass event for each:
    - accepts_wait_from_pid: POST /v1.56/containers/<id>/wait from the pid is accepted.
    - rejects_wait_from_other_pid: the same request from another PID is rejected.
    - rejects_other_method: GET, and any method but POST, on /wait is rejected.
    - rejects_other_requests: a journal holding only /start, /json, /attach or /kill, from the
    pid, is rejected.
    - rejects_empty_journal: an empty journal is rejected.
    - accepts_query_string: POST /containers/<id>/wait?condition=not-running from the pid is
    accepted.
    - rejects_other_container: a /wait for a different container ID from the pid is rejected.

    Red first, two commits, both with --item T-68.
    Commit 1 (test): the startDelay knob, its use and the guard extension in the step, a stub
    `launchObserved` (its unused parameters named _ so revive passes) that compiles and returns false
    for every input but is not called by the step,
    and TestLaunchObserved with its rows. At this commit the step still closes on `ready`. The
    implementer then runs and reports both red outputs. First, check 1: the accepts_ rows fail at
    their assertions and the rejects_ rows pass against the constant false, so go test fails and the
    check prints its report and exits 1. Second, the scenario check: RUNTTY-22 fails at "terminal
    run reports run.terminal-disconnected and returns the workload exit 17" with exit 75, since
    the master closes on `ready` while /start is held. The sandbox runs RUNTTY-22 (it passed in 4 s
    on 2026-11-20 without the knob), so both are shown locally.
    Commit 2 (test): implement `launchObserved` and wire it into the step in place of the `ready`
    wait. Then both checks pass.

    Check 2 is written in the form CI reads back as a selection (itos.yaml
    tests.scenario.recognize, as: pattern), so CI runs it in its one run. Its pattern is single
    quoted because it holds `$` and parentheses, which itos's reading accepts only in single quotes
    (internal/tests/recognize.go in itos: a pattern word is double-quoted without `$`, single-quoted,
    or bare without quotes, `$` or backslash). Today check 2 passes without the knob; the red
    commit stands in for its red.
- id: T-69
  type: ci
  title: The engine shards' 180-second step budget warns; only a 600-second hang guard fails
  why: >
    The person's standing rule: caps are soft and warn; only a hang guard stops. Today the Engine
    scenarios step in .github/workflows/ci.yml (engine_finish, the line `if (( elapsed > 180000 &&
    result == 0 )); then result=1; fi`) fails an engine shard whose run otherwise passed when it took
    more than 180 seconds. That budget is decision 0024 (T-45), restated in docs/architecture/arc42.md,
    features/README.md and decision 0028's egress note. A slow runner turns a green run red, and the
    answer has been to chase the clock, which the rule says not to do. This is foundation CI work
    under docs/charter.md: no container behaviour, so no scenarios or step definitions. Its checks
    are tests of the wrapper and greps of the docs.


    Settled by the chief for the person, who may override on the pull request.
    1. The line `engine step timing: duration_ms=<ms> outcome=<passed|failed>` stays and prints on
    every run.
    2. Annotations depend only on elapsed time and print for any outcome, a failed run and a run at
    601 s included. Above 180000 ms (`(( elapsed > 180000 ))`) the wrapper prints
    `::warning::Engine shard <shard> took <ms> ms, over the 180000 ms soft budget`. Above 600000 ms
    (`(( elapsed > 600000 ))`) it also prints `::error::Engine shard <shard> took <ms> ms, over the
    600000 ms hang guard`; so a run at 601 s prints both. At 180000 ms or below nothing but the
    timing line is printed. With unreadable timing (elapsed=unknown) no annotation is printed.
    3. Only the status change depends on the result: a run that otherwise passed and took more than
    600000 ms fails, with `(( elapsed > 600000 && result == 0 )); then result=1`. Exactly 600000 ms
    passes. A run that failed for another reason keeps its own exit status, never replaced by timing.
    A passing run above 180000 ms and up to 600000 ms exits 0. Missing, invalid or backwards uptime
    still fails a passing run, as today. This is the only time-based failure.
    4. The shard name is read as `${ITOS_CONTAINER_ENGINE_SHARD:-unknown}`, so `set -u` never trips on
    it and the existing harnesses (TestEngineDiagnostics, TestEngineSuiteBudget) need not set it. The
    step gains the env `ITOS_CONTAINER_ENGINE_SHARD: ${{ matrix.shard }}`.
    5. No watchdog. The guard runs only when the step ends (the EXIT trap), so it is not a timer. A
    real hang is stopped by Go's `-test.timeout=10m`, counted from the test program's start, at about
    606 s with the compile time added; that run fails with Go's `running tests:` panic and keeps its
    own status, and the 600 s guard does not fire for it. The guard therefore fails only a passing run
    that ended past 600 s, in practice (600, 606] s. The amendment and features/README.md say exactly
    that, and never say that the 600 s guard is what fires on a hang.
    6. Limits move so the Go timeout stays the outer stop for a hang: `-test.timeout=10m`, the Engine
    scenarios step `timeout-minutes: 11`, the engine-shard job `timeout-minutes: 15`. Fixture
