- id: T-21
  type: ci
  title: CI's manual trigger runs named @wip scenarios, for their red evidence
  why: >
    features/README.md has the coordinator get assertion-level red evidence for scenarios that run
    only in CI before implementation, but its evidence-branch procedure cannot work. Step commits
    keep cases @wip, both tiers exclude them, draft PRs skip CI, and a test commit removing @wip
