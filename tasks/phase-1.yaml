    Tests must execute production validation, not a copied jq predicate whose result can diverge.
    Static guard checks and captured JSON tests are regression evidence, never runtime evidence.

    Extend those regressions for both stores, including an assertion-level red containerd
    positive control before implementation. Reject missing/malformed/mismatched daemon config
    identities, unrelated built IDs, invalid export records/member paths and raw-config byte or
    platform mismatches. Exercise the shared export/config validators on captured data only;
    guard the production export and tar reads, and require their independently measured config
    to reach manifest validation. The existing task checks already pass at the diagnostic head;
