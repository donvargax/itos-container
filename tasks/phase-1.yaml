# Project-local tasks are added with itos task add, starting at T-1.
- id: T-1
  type: ci
  title: Establish the generated seed as the commit tracking boundary
  why: >
    The generated seed predates this project ledger and has no Task footer. Start project commit
    checks after that exact seed while retaining checks for the pilot draft and every later commit.
    Do not rewrite history, claim inherited proof or relax any gate.
  done_when:
    - run: test "$(itos config get commits.since)" = "23b8ce15410ec9431f5a1fe39a973d9cf0a3d8de" && git merge-base --is-ancestor 23b8ce15410ec9431f5a1fe39a973d9cf0a3d8de HEAD
    - run: itos config check
- id: T-2
  type: style
  title: Format the inherited release test fixture
  why: >
    The first full CI run failed because the release test fixture map is not gofmt-aligned. Change
    only whitespace in internal/release/releasetest/releasetest.go; preserve all fixture contents
    and behavior, and retain the existing formatting gate.
  done_when:
    - run: test -z "$(gofmt -l internal/release/releasetest/releasetest.go)"
- id: T-3
  type: ci
  title: "Finish the move to itos 8: the by-hand steps of itos upgrade 7.0.0-rc.1 to 8.45.3"
  why: >
    itos upgrade moved the pin and itos.yaml to 8.45.3 and rewrote AGENTS.md's itos block
    (2026-11-03), and itos config check passes. The manual migration is incomplete:
    .github/workflows/ci.yml and .github/workflows/release.yml still use the v7.0.0-rc.1 action
    at 1b9f1f9995be5d20aed3b4f8877a453bbd1e98a3 and override its launcher with version 6.0.0.
    This is foundation work under docs/charter.md, not a new container behaviour; it needs task
    checks, no Gherkin scenarios or step definitions.

    Pin both action references to donvargax/itos@0a8c1bcfce6ae7b67b39197ee3990a90343f35ac
    with the comment v8.45.3. Remove each action's with/version override entirely. The upstream
    tag https://api.github.com/repos/donvargax/itos/git/ref/tags/v8.45.3 identifies that commit;
    https://github.com/donvargax/itos/blob/0a8c1bcfce6ae7b67b39197ee3990a90343f35ac/action.yml
    resolves a SHA to its release when no version input is supplied. No new library or service
    is needed. Keep itos.yaml's 8.45.3 pin and checksum
    d91adcab38594aabbaabc828a6a82b027580374d3e55ea3968d7dee75e8dfaea unchanged. A release-looking
    comment beside an arbitrary SHA is not evidence of the correct action.

    Update docs/upgrading.md to distinguish the supported upgrade command from these manual
    workflow edits and record the remaining migration rules. Code proof is enforced by ci run
    through proof.code, so required changed-code mutation results must be recorded and committed
    before the coordinator pushes, using the parent of the item's actual first commit, specs
    included. Keep the proof configuration, thresholds, existing CI steps and verify/ci run
    calls intact. The whole plan's no-start proof message is not a proof pass; a workflow/docs
    change alone touches no proof.code path and must not fabricate mutation records. The pinned
    itos-cc upgrade belongs to T-4.

    Numbered work add, task add and work promote mint their IDs; do not prescribe IDs by hand.
    A plain itos push does not publish tags; a deliberate tag push needs --tag. The existing
    release workflow creates a local tag and publishes its draft through GitHub, without an
    itos push call: preserve that sequence and its version condition, and do not enable releases
    or add a tag-push step. Keep the bans on --no-verify, commit -a and git add -A. Document these
    migration rules without rewriting the template claims in PLAN.md, README.md or AGENTS.md;
    that foundation cleanup is separate work. No runtime, dependency, platform or gate expansion
    belongs to this task.

    The checks below use the runner's existing shell tools, without requiring RTK in CI. They are
    cheap configuration and workflow checks for the existing task/CI gates; let the configured
    hooks and CI run the wider plan. Review its listed steps without changing
    their selection or cost. Before implementation, both exact-action checks fail on the v7 SHA
    and both no-override checks fail on with/version 6.0.0. Configuration validity and plan
    construction are preservation checks, not evidence that the workflow migration is complete.
- id: T-4
  type: build
  title: tools/bin/pinned runs the current itos-cc, not 0.5.0
  why: >
    tools/bin/pinned still runs itos-cc 0.5.0. The current release, verified on 2026-11-04 at
    https://api.github.com/repos/donvargax/itos-cc/releases/latest, is v0.47.2, published on
    2026-11-02 from eb7d910ab864b890a9033f5c8acc2311f56efe25. Fix this task's target at 0.47.2
    rather than resolving latest at runtime. This is the charter's foundation tool upgrade,
    a build task with checks, not container behaviour: no scenarios or step definitions.

    Update only the itos-cc version and its five archive SHA-256 values in tools/bin/pinned.
    The expected values below come from
    https://github.com/donvargax/itos-cc/releases/download/v0.47.2/checksums.txt, whose SHA-256 is
    7ebfae6b1f2193b79425289af3a436e4ee25efe27e6ee11b04f49ac984f9ef30; the release API's asset
    digests agree. Keep Linux and macOS amd64/arm64 and Windows amd64, the archive names and
    member names, versioned cache directory, --path interface and checksum-before-extraction
    behaviour. Leave the other tools' pins alone and do not add Windows arm64. These are tool
    distribution platforms, not additional supported container hosts. No new library or service
    is needed. Verify the release checksum manifest before copying any value; a version bump
    beside old hashes is incomplete. The Linux runtime check must use the repository launcher,
    not an unrelated itos-cc on PATH, and resolve .tools/itos-cc-0.47.2/itos-cc on a cache miss.

    Record the applicable migration in docs/upgrading.md, using the releases from 0.5.0 through
    0.47.2 and https://github.com/donvargax/itos-cc/blob/v0.47.2/README.md. The existing
    mutation sample --count 10 and mutation check --since <base> --fail-uncovered --json cmd
    internal remain supported. Keep those CI/proof commands, their scope and thresholds intact;
    do not replace cached checking with a counted run or change to --fail-uncovered=lines.
    itos-cc.yaml's mutation.exceptions: [] is already valid. Its omitted version means version
    1; strict validation now rejects unknown keys, anchors, aliases, merge keys, non-JSON tags,
    non-string keys and multiple documents, none of which this file uses. Preserve that file;
    do not add exclusions, exceptions, mutation.tests or mutation.copy for this pin move.
    The 0.18.0 comment-insensitive hashes and later whole-suite evidence can stale old results;
    0.47.0 also invalidates older strict coverage evidence. Exception rehashing is unnecessary
    here because the exception list is empty. No consumer here parses mutation's plain output
    or distinguishes its nonzero error codes; keep exit status as the verdict.

    Strict --fail-uncovered now requires fresh coverage evidence for every judged Go function,
    including functions without mutation sites, and rejects uncovered executable blocks as well
    as uncovered mutants. Re-measure required stale evidence with the pinned release, all-tests,
    fail-uncovered and no-annotate; commit only the resulting project-local .metrics/mutate/
    paths. Kill survivors with tests and never excuse uncovered code, hand-edit evidence, copy
    another project's cache or relax a gate. Use the parent of T-4's actual first commit,
    786ea2f2cb1f75351e30c4b75c37d98437b3f418, as the range base:
    ebd187e7f0722f65d9aadda7a13d27048e4e03f6. Reconfirm this against itos work show T-4 if history
    changes. The planned launcher/docs edits touch no proof.code path; the range check below
    then validates command/config compatibility but proves no Go function. Do not manufacture
    changed-code records or expand this task into a repository-wide proof refresh.

    The only existing snapshot records three Example mutants in
    internal/release/releasetest/releasetest.go. A sample draws only fresh recorded outcomes,
    at most ten, and skips stale or missing results: success with zero candidates is not a
    refreshed baseline. Report the actual sampled count and any stale-evidence limitation in
    the implementation handoff. A full foundation baseline is separate work, not a reason to
    lower this task's gates or claim all code is proven.

    Keep the checks at the existing task/CI tiers, with shell tools already on the runner;
    remove the task check's RTK wrapper rather than requiring RTK in CI. The checksum-map and
    executed-version checks fail before implementation on all five old hashes and 0.5.0.
    Shell syntax, configuration and the range check are preservation checks. The existing
    mutation sample already passes with 0.5.0 (three of three cached mutants), so it is only
    a compatibility check, never the upgrade assertion. Its HEAD-derived seed is deterministic
    for a given commit. Leave the existing wider CI plan and hooks in control of their gates.
  done_when:
    - run: sh -n tools/bin/pinned
    - run: |
        awk '
          BEGIN {
            expected["linux-amd64"] = "5e05856d4ed7ec245c8c94de3fd90dbf8868ccfd5bba16f395efbfb2717f8a4c"
            expected["linux-arm64"] = "4077632ceb1838414c5f4de1b6d6f7807e59b3250b71346e454caf0ff4015bdd"
            expected["darwin-amd64"] = "456adc7c5b9808aff34c19ab9d513c3c2858b7a68385aa78fc679e31536f9dcb"
            expected["darwin-arm64"] = "bd7969e2c5e7121ccef24fb7fede28eb719e61e07eed79ce2df8ac63272d0fb4"
            expected["windows-amd64"] = "2cb032aab757e387ada20d1eb900a2478a36d7661d0dca42071410a74b240bc1"
          }
          /^itos-cc\)$/ { active = 1; blocks++; next }
          active && $1 == "esac" { active = 0 }
          active && $2 ~ /^sum=/ {
            platform = $1; sub(/\)$/, "", platform)
            checksum = $2; sub(/^sum=/, "", checksum)
            if (!(platform in expected) || checksum != expected[platform]) {
              print "wrong itos-cc 0.47.2 checksum for " platform; bad = 1
            }
            seen[platform]++
          }
          END {
            if (blocks != 1) { print "expected one itos-cc launcher case"; bad = 1 }
            for (platform in expected) {
              if (seen[platform] != 1) {
                print "missing or duplicate itos-cc checksum for " platform; bad = 1
              }
            }
            exit bad
          }
        ' tools/bin/pinned
    - run: test "$(tools/bin/pinned itos-cc --version)" = "itos-cc 0.47.2"
    - run: itos config check
    - run: >-
        tools/bin/pinned itos-cc mutation check
        --since ebd187e7f0722f65d9aadda7a13d27048e4e03f6
        --fail-uncovered --json cmd internal
    - run: tools/bin/pinned itos-cc mutation sample --count 10
