- id: T-24
  type: test
  title: Settle the survivors of the first full-range proof on main
  why: >
    The coordinator settled this diagnosis on 2026-11-05. This public repository started with
    no green run on main, so itos ci range uses commits.since, the root commit
    23b8ce15410ec9431f5a1fe39a973d9cf0a3d8de. The code proof judges the whole project with that
    fixed seed. It found three survivors no earlier push reached, and every push to main fails
    on them until they are settled. Add tests that kill behaviour-changing mutants; except a
