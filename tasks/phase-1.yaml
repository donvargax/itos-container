    so this wording change has no prerequisites. The opening counts and What changed exclude those
    syncs. The release-version tool reads the full range. Today the notes put that range's totals
    after "includes branch syncs" whenever a sync is present. Five listed feats and one sync feat can
    read as six feats from syncs. An untyped, nonbreaking sync repeats the listed totals and
    qualifies the Upgrading text even when the whole range has no breaking changes.
    [PR 69, comment 6988903923](https://github.com/donvargax/itos-container/pull/69#issuecomment-6988903923).

    In notes.render, count the omitted syncs' own feats, fixes and breaking changes. For both first
    and tagged releases, name their nonzero contributions and all three totals for the full range
    in the opening paragraph. For the mixed history, write "Omitted branch syncs add 1 feat,
    bringing the totals for the version calculation to 6 feats, 0 fixes and 0 breaking changes."
    Omit this sentence when all three contributions are zero. In Upgrading, say "No listed change
    is breaking." only when an omitted sync is breaking and no listed change is.
    If no commit is breaking, the assurance covers every commit since the start of the range.

    Assert the rendered Markdown in both TestSyncMergesLeftOut histories. The first release lists
    nine commits and the release after v0.1.0 lists eight. In each, require five listed feats,
