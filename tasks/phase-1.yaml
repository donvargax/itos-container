    Preserve CI/Linux guards, explicit local endpoint and override clearing, private empty Docker
    config, loopback publication, step-local outputs, all existing timeouts and failure propagation.
    Do not retry preparation, skip scenarios, downgrade the runner, enable continue-on-error or
    change engine-required CI gating. No new dependency, action, image, service or product code.

    Add TestEngineFixturePostPushDiagnostics and TestEngineFixtureManifestValidation in
