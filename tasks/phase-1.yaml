- id: T-56
  type: refactor
  title: Add shared terminal ports, adapters and contract tests
  why: >
    The charter's interactive milestone needs one host-terminal contract shared by run and exec.
    Today terminal detection exists in approval presentation and cmd, and features use disposable
    PTYs, but internal/engine/terminal does not exist. Add the reusable terminal capability before
    slice-37 and slice-39 wire it into commands. This is an unbound foundation task broken down
    from p1-interactive-tty, with task checks and no new public behaviour or Gherkin scenarios.
    Preserve approval's consent rules, existing run behaviour and slice-12's cancellation and
    exit precedence in docs/decisions/0016-cancellation-and-output-drain.md. Terminal selection,
    interactive JSON refusal, engine TTY creation/attachment/resizing, stream forwarding and
    stopping workloads on disconnect belong to those later slices, not this task. Do not add
    command flags, cmd assembly, Docker operations, credential handling or host signal forwarding.

    Follow docs/architecture.md, Slices. Put interfaces, dimensions and typed outcomes in
    internal/engine/terminal/port, the in-memory fake and reusable contract in port/porttest, and
    the host adapter in internal/engine/terminal/native. Any pure lifecycle policy belongs in
    terminal/domain; do not add an empty package or put orchestration in a command. OS files,
    descriptors, term.State, polling and signal subscriptions stay in native, behind the port;
    port/domain imports retain the exact existing allowlist. The fake performs no filesystem,
    process, signal or terminal I/O. Tests run the same contract against fake and native factories;
    production imports no porttest. The new engine imports no slice and need not depend on the
    session engine. Record its responsibility and still-unbound status in arc42's building-block
    view when implementing; no existing architecture rule needs an exception.

    A native provider is explicitly bound by its caller to one already-open terminal file and
    an OS value. It does not discover stdin/stdout, open /dev/tty, consult environment variables
    or choose interactive mode. The caller keeps the supplied file open and does not change its
    terminal settings until the lease ends. Acquire takes a context and returns either a usable
    raw-mode lease with initial dimensions or a typed failure, never a partially usable lease.
    Refuse nil, closed and nonterminal files, an unsupported OS value, invalid initial dimensions,
    and acquisition on an already-cancelled context without changing terminal settings. Permit
    one active lease per provider; overlapping acquisition refuses as busy without blocking or
    changing the first lease. After release, the same provider can acquire a new lease and must
    capture that acquisition's starting settings, not reuse an older snapshot. Separate providers
    for separate terminals remain independent; concurrent ownership of one terminal through
    different providers is outside this contract and must be documented as a caller restriction.

    Save the complete original terminal state and enter raw mode using the existing library.
    A successful release restores that exact state, including pre-existing nondefault flags,
    rather than setting a guessed cooked mode. All failures after raw mode was acquired attempt
    restoration and release owned resources before returning, including partial acquisition if
    the implementation has fallible work after MakeRaw. Explicit close, acquisition-context
    cancellation, terminal hangup and observation failure all end the lease. Close is safe to
    repeat and to race with cancellation or a terminal event; restoration and resource release
    happen once. Retain the first termination cause and report a restoration failure separately
    so neither is hidden by the other; repeated close returns the same final result. A vanished
    terminal can make restoration impossible: report that failure, never claim it was restored.
    Do not wait for a cancelled context to authorize restoration, and do not close caller-owned
    files or change their descriptor flags as a lasting side effect. Close only adapter-owned
    handles, stop only its own signal subscription, and wait for its own monitoring goroutines
    to finish. Do not reset process-wide signal handling.

    Dimensions are an explicit columns/rows value, each in 1..65535, taken from this terminal,
    never from COLUMNS, LINES or a fallback such as 80x24. Initial dimensions accompany acquisition;
    subsequent SIGWINCH notifications re-read them and publish changed dimensions. Expose a
    bounded resize notification stream and a separate completion notification with a retained
    typed result. Resize bursts may coalesce, but after a burst the consumer can observe the
    latest dimensions. An unread resize stream cannot block cancellation, disconnect reporting,
    restoration or close; no unbounded event queue or goroutine per notification. Failure to read
    dimensions, including a zero dimension after acquisition, ends the lease with an observation
    failure rather than publishing invented dimensions. Close event streams on termination and
    make completion observable only after restoration was attempted and owned monitors ended.

    Detect local terminal peer hangup even while no input or output operation is in progress.
    Report it distinctly from deliberate close, context cancellation and observation failure;
    this is a notification for the later session integration, not authority to stop a container.
    Monitoring never reads, writes, echoes or logs terminal payload bytes. Raw Ctrl-C (0x03) and
    Ctrl-D (0x04) remain bytes for the caller's eventual input forwarder, not host signals or a
    disconnect event. An unread input byte must not mask a later peer hangup. Acquisition on a
    cancelled context returns promptly; after cancellation, close or peer hangup, notification
    and local cleanup complete within one second on the supported native Linux terminal path,
    including when nobody reads resize events. This is a local adapter responsiveness bound,
    not a replacement for slice-12's workload grace or teardown deadlines, and does not promise
    recovery after SIGKILL or a kernel-stalled ioctl. Do not return on a timeout while leaving an
    unbounded terminal reader, signal listener or restore goroutine running.

    Reuse the existing pins, golang.org/x/term v0.46.0 for terminal detection, GetState/MakeRaw,
    Restore and GetSize, and golang.org/x/sys v0.48.0 for native hangup observation where needed.
    Use github.com/creack/pty v1.1.24 only in native tests for disposable master/slave pairs and
    controlled window sizes. These maintained libraries already solve the terminal primitives;
    add no dependency or handwritten termios implementation and change no pin. Native support
    here is Linux only; unsupported OS values return a typed failure before I/O. Keep portable
    packages buildable for the inherited targets without claiming runtime support there. Pass
    OS as data, never branch on runtime.GOOS inside logic, and keep build-tagged files to thin
    unavailable-call wrappers with no mutation site, as AGENTS.md requires.

    The check below must execute the shared contract in both port/porttest and native, with no
    success from an empty suite. Its rows cover initial non-square size, raw acquisition, exact
    restoration after normal completion and caller failure, pre-cancelled acquisition, invalid
    terminal refusal, busy acquisition, repeated close, reacquisition with a new starting state,
    independent terminals, changed/latest resize delivery, unread-event backpressure, cancellation
    without terminal activity, peer hangup with and without unread input, and sticky termination
    and restoration-failure results. Use stateful fixtures, not mocks. Controlled failure states
    belong in the fake; native tests must also exercise actual OS failure paths, including closed
    descriptors and master hangup. Cover any reachable partial-acquisition rollback and monitor
    error paths with deterministic tests. No adapter-specific row may replace the common contract.

    Additional native assertions inspect saved versus restored term.State, verify canonical input,
    echo and signal generation are disabled while acquired, and read exact synthetic 0x03/0x04
    bytes from the slave after writing them to the master. This read is test code, not a second
    production input reader. Verify caller-owned handles remain usable after close, size changes
    name the correct terminal, and repeated acquire/cancel/close cycles leave no owned watcher,
    descriptor or signal-subscription growth. Isolate process-directed SIGWINCH tests in a bounded
    child of the test binary, never signal the developer's terminal or another test process.
    Use readiness handshakes and bounded waits, not sleeps to guess that a monitor has started.
    Native Linux PTY allocation failure fails the check; it is not a reason to skip evidence.
    Unsupported-platform tests may select their explicit refusal path. These tests require no
    container engine, real state folder, network endpoint, model, account or credential.

    Keep the check in the existing task and ordinary Go-test tier, uncached and bounded, without
    adding a workflow, race detector, full feature-suite run or architecture-policy exception.
    Configured hooks and CI retain the wider preservation checks, and CI alone judges changed-code
    proof. Before implementation the check fails at package discovery because the terminal tree
    is absent; that is absence evidence, not a failing contract assertion. The implementer first
    commits defined contract tests and the minimal compiling stub needed to exercise them in a
    test commit, records their assertion failures, then implements until the same rows pass.
    Report each row's red/green evidence; do not substitute compilation errors, undefined helpers
    or skipped PTY rows for it. Commit no generated coverage, mutation output or test transcripts.

    The drafter changes only this T-56 ledger entry in docs --item T-56. The implementation's test
    and refactor commits use the terminal paths above with --item T-56 and --task T-56 respectively;
    the small arc42 inventory update is a docs --item T-56 commit. Leave sibling ledger entries,
    ownership/status, existing command and feature files, dependency pins and enforcement inputs
    alone. Agents commit and stop; the loop owns push, CI watching and closure.
- id: T-57
  type: test
  title: The engine suite makes one throwaway product launch before its first engine row, and prints its create interval
  why: >
    The coordinator's 2026-11-16 04:58 UTC decision settles q-79: implement the throwaway launch
    below, without reopening the remedy or holding this task for a decision about limits.
    T-54's plain warm-up and T-55's product-shaped one are both on main and neither removes the slow
    first create. In run 43798922441 they took 100 to 120 ms and 200 to 280 ms on the three shards,
    and ID-LIFECYCLE-08, the lifecycle shard's first engine row, still failed with run.call-timeout
    on operation create response: its engine journal has the create arriving at 1.391 s, forwarded
    at 1.392 s and answered HTTP 201 at 2.408 s, 1.016 s after forwarding. Creates made outside the
    suite are fast, and the first one made inside it is slow, so what is cold is on the suite's own
    path: the recorder that forwards engine calls, the built product's first launch, or what only
    that path asks of the engine. On 2026-11-16 the first row failed on main's run of slice-27's
    merge commit (ID-ANCHORS-09, 1.026 s) and held its release for forty minutes. T-54 and T-55 and
    their two timing lines stay. This is test-harness maintenance, with no product behaviour,
    Gherkin scenario or new scenario ID.

    Once per suite process, after selection admits engine rows and before the first row's setup
    or resource snapshot, launch the built product once through the suite's offlineAPI recorder,
    using the same independently validated fixture image and numeric UID/GID that the rows use.
    Run the literal argv /bin/true through the product's run command, reaching create, inspect,
    attach, start, wait and owned teardown. Keep stdin open until the child exits so EOF does
    not initiate cancellation of the successful launch. A create made by the harness itself,
    a shell-shaped request, a version command or an unstarted container does not perform this
    warm-up. Use a fresh disposable checkout, seeded synthetic approval, isolated account home and control state,
    and its own recorder journal. Reuse the existing fixture and ownership machinery rather than
    adding a permissive recorder. No real approval command, host state folder, new image, pull,
    registry operation, dependency or service is needed.

    Keep the native factory behind the existing featureEnvironment.engineEnabled and
    doctorRealGuard checks. Ordinary non-engine runs, invalid selections and selections with no
    eligible rows must perform no warm-up build, launch, fixture-input read or engine access.
    Retain the single attempt and its result for the process, including failure, so multiple
    TestFeatures invocations or nested scheduling cannot repeat it or turn failure into success.
    Each existing CI shard is its own process and therefore makes its own one attempt. Do not
    insert it into a per-scenario hook, the Gherkin inventory, or the nested quiet-worker suite.

    The warm-up product and its account-home test assembly compile the original checkout's
    production limits, CallDuration 10s, StartupDuration 120s and GraceDuration 10s. Build them in
    a separate temporary directory: buildProduct(..., false) alone is insufficient if the later
    productProbeBinary finds T-33-engine-tree beside the executable and switches to that copy.
    The existing test assembly may isolate the account home exactly as it does for the rows;
    it still invokes the product's real run entry point. It must use the production source and
    the normal coverage/build-cache conventions. The actual rows retain their current binaries,
    shortened 1/3/1-second fixture budgets, controls, assertions, order, retries and selected set.
    Add no product runtime switch for budgets and change no production or fixture limit.

    Bound preparation, compilation, invocation, recorder draining and cleanup; every child is
    joined and every wait has a finite deadline. Reuse the existing 60-second assembly-build,
    45-second offline invocation, 10-second create-outcome and 30-second owned-cleanup allowances
    without extending them; any newly needed build or wait must also have a finite bound. These
    harness watchdogs do not change the compiled product limits. A setup, build, launch, timeout,
    nonzero workload exit, recorder, timing or cleanup failure fails TestFeatures before it enters
    the scenario runner, with a diagnostic beginning engine suite warm-up: and naming the failed
    stage. Preserve the original failure beside a cleanup failure; neither may be swallowed by a
    later successful action. No sleep, retry, ignored exit, skipped row or budget change is a remedy.

    On success and on every partial failure, close and join the controller and recorder, await
    forwarded creates, and attempt cleanup using the existing full identity and ownership checks.
    Account for a create answered after the controller leaves before releasing its checkout
    anchor. Remove and independently verify absence of the warm-up worker and owned anchor before
    permitting any row to begin; transport or inspection failure is not absence. Release sockets,
    held descriptors, temporary checkout/state/build directories and any private coverage data
    after their owners finish. Leave unrelated resources and the shared fixture image unchanged;
    never prune or remove by an unverified name. A cleanup failure fails the suite in its own right.

    Print one separate line per attempted warm-up, including a failed attempt, in this form:
    engine suite warm-up timing: arrival_ns=<n|missing> forwarded_ns=<n|missing>
    answer_ns=<n|missing> forward_to_answer_ns=<n|missing> outcome=<passed|failed>.
    This is one physical line. Take arrival, forwarded and answer from that launch's single
    POST /containers/create journal entry (At, Forwarded and Answered), relative to a monotonic
    origin captured immediately before starting its controller. Compute forward_to_answer_ns
    from Answered minus Forwarded, never from subprocess duration or the controller reply time.
    Successful values are ordered nonnegative integer nanoseconds with HTTP 201 and no cancelled
    controller; success also requires workload completion and verified cleanup. Missing, multiple
    or unordered create entries fail with a timing diagnostic, never fabricated zero intervals.
    A failure before a timestamp exists prints missing for that value. Check output errors and
    fail if the line cannot be written. Print no raw request body, environment, approval, host
    path or credential. Preserve T-54/T-55 and the existing compilation, scenario, suite and step
    timing lines. Include warm-up work in elapsed suite/step time, without adding a selected or
    completed scenario or changing any row's timing or outcome; the 180-second step gate stays.

    Coverage requested by either input must still instrument the warm-up product, but its
    counters go to a private disposable directory outside GOCOVERDIR and ITOS_CC_TEST_COVERDIR's
    collected destinations. It has no scenario ID and must neither create an extra per-ID entry
    nor credit any scenario with its executed lines. Do not mutate the caller's coverage inputs
    or the following worlds' destinations. Plain runs remain plain.

    Add TestEngineSuiteWarmup in features/engine_suite_warmup_test.go. It must exercise the same
    preparation/launch orchestration that TestFeatures calls, not just a formatter, an unused
    helper or a counter substituted for the launch. Provide a test-only fixture-factory seam
    for a disposable stateful engine endpoint; never enable the real engine tier, spoof CI or
    weaken doctorRealGuard to run it locally. One successful local case executes the built
    product's run entry point through the actual offlineAPI recorder against that endpoint,
    checks the literal argv and immutable fixture identity, sees the worker and anchor removed,
    and compares the printed intervals with the recorded exchange. Reuse the existing session
    fixture support where possible; keep all stand-ins in test code and add no production port
    or package. Local protocol evidence proves the mechanism, not native-engine performance.

    Under that named test, exercise disabled and empty selection without side effects; one
    attempt before any row setup across repeated and nested invocations; retained failure with
    no second launch; successful launch and exact timing; preparation/build failure; nonzero
    child exit; a hanging child cancelled and joined at the watchdog; recorder failure; absent,
    duplicate and unordered timing data; unwritable timing output; cleanup after partial setup,
    an abandoned create and a late answer; cleanup failure and preservation of unrelated objects;
    and plain, aggregate and per-ID coverage isolation. Use stateful fixtures and readiness
    handshakes, with a controlled clock or shortened test-only watchdog for failure controls,
    not real long waits or a fake Docker executable. Verify the compiled warm-up assembly carries
    10/120/10 using the existing TestEngineFixtureBudgetContract and that rows still carry 1/3/1.
    A successful warm-up followed by an intentionally failing synthetic row must retain that
    row's failure and the original selected/completed counts; a warm-up failure must launch no row.
    Test the real entry-point wiring as well as helper behaviour, so removing the call from
    TestFeatures fails the regression. Synthetic rows stay in temporary files outside inventory.

    The done_when check first requires the exact top-level test to exist, then runs it uncached
    with a three-minute test watchdog, without a race detector or native engine. At specification
    baseline e77aa15e8e6453438f1f38d72e2b1fc263b3e0ca the original placeholder exits 0 with no
    tests to run; the discovery guard below exits 1 with missing required TestEngineSuiteWarmup. That is
    missing-test evidence, not assertion-level red. The implementer first commits defined tests
    and any minimal compiling seam/stub in test --item T-57, records failure at the missing-launch
    assertion, then implements until the same tests pass. Keep the check in the existing ordinary
    task/Go-test tier. Do not add a new workflow, engine dispatch, full-suite race run or a local
    native-engine requirement. Configured hooks and CI retain the wider checks.

    Neighbouring preservation checks are TestEngineSuiteBudget, TestProductSourceFollowsTheEngineFixture,
    TestProbeAssemblySharesTheProductBuildCache, the engine selection/scheduling/shard and timing
    regressions, TestFeatureConcurrency, TestOfflineRuntimeGuard, TestOfflineRecorderRecordsAbandonedCreate,
    recorder cleanup controls, TestScenarioCoverageContract and TestEngineFixture regressions.
    The full ordinary feature suite runs once without -race through the configured checks; the
    existing native shards alone exercise Docker. Keep live offline, lifecycle, anchor, recovery
    and session scenarios, all shard inventory and their assertions unchanged.

    The coordinator's 2026-11-16 05:44 UTC instruction applies to each implementation attempt:
    before reporting done, run tools/bin/pinned itos-cc mutation run --count 40 --since origin/main
    --seed <seed> --fail-uncovered=lines --json cmd internal with two or three different seeds.
    Kill every survivor with a test that fails on it; only a mutant that cannot behave differently
    may be recorded as equivalent with its reason for review. Cover each uncovered changed line,
    or remove it only if unreachable. Repeat after repairs, never change the draw to escape a
    failure. This expressly overrides the general no-local-mutation rule for implementation;
    a test-harness-only range may have no eligible production sites and must report that honestly.
    Commit no generated mutation/coverage evidence. A red run showing only ID-OFFLINE-29,
    ID-ANCHORS-09, ID-LIFECYCLE-08 or ID-LIFECYCLE-12 is the known flake the loop reruns; change
    nothing for it. Documentation-only specification work supplies no code-proof claim.

    The local acceptance evidence is the mechanism. After landing, the coordinator reads the
    three warm-up timing lines and subsequent first-row create intervals, along with existing
    row/step timings and cleanup verdicts. If a first row's create is still slow, that is for the
    coordinator to act on, not grounds to hold T-57 or reopen the remedy. This supersedes the
    earlier T-54/T-55 report-and-stop wording and the corresponding README guidance for this item;
    do not require successful first rows as proof of this task's mechanism.

    The drafter edits only this T-57 ledger entry in docs --item T-57. Implementation and its
    regressions belong in features/*_test.go in test --task T-57, reusing the named suite, build,
    recorder and fixture helpers; describe the new phase and evidence boundary in features/README.md
    in docs --item T-57. No product code, limits, dependency pin, workflow, sibling ledger entry,
    work ownership/status or generated evidence changes. Agents commit and stop; the loop owns
    push, CI watching and closure.
- id: T-58
  type: build
  title: The whole feature suite's command names its own timeout, with headroom over what the suite takes in CI
  why: >
    The coordinator's 2026-11-16 08:15 UTC decision settles this budget. Go's default ten-minute
    test timeout was never a chosen feature-suite limit. T-48's code proof at f83f235, run
    43826396800, reached it in listed coverage at 600 s before any mutant was judged; on main at
    cffa73a that step took 353 s and the Tests job took ten minutes fifteen. Use an explicit
    -timeout=20m, with headroom over these measurements, unless the ci job's own time limit says
    less. At specification baseline e032ceedc12e4887061e15f006d3499b84ba58c0, jobs.ci and all three
    platform jobs have no explicit job or Tests-step timeout, so 20m applies. The engine shard's
    ten-minute job limit belongs to a separate tier and does not reduce this suite's budget.
    Do not reopen permission to choose the budget. This is configuration maintenance, not new
    product behaviour or a suite speedup; no scenarios, step definitions or new dependency.

    In itos.yaml set tests.scenario.run.whole to go test ./features -count=1 -timeout=20m and
    run.select to the same command followed by -scenarios={pattern}. Change both corresponding
    tests.scenario.recognize commands to match, preserving their whole/pattern classifications,
    the smoke recognizer, ID pattern, joins and all selection rules. A timeout elsewhere in the
    file does not satisfy this task.

    Listed coverage uses itos-cc.yaml's separate mutation.tests commands, so changing itos.yaml
    alone would leave the reported failure in place. Give mutation.tests.whole the same explicit
    whole command and mutation.tests.run the same budget before its existing -scenarios='{pattern}'
    argument, retaining those quotes. Preserve the list command, support paths, ID pattern,
    joins, exclusions, exceptions and proof.code command. Leave tool-level mutation watchdogs
    and proof thresholds unchanged; no local mutation run or generated evidence is required.

    In .github/workflows/ci.yml, change only the Tests run commands in platform, platform-macos
    and platform-windows to go test ./... -count=1 -timeout=20m; each includes ./features. Preserve
    the package set, RAPID_CHECKS, manual-red environment, event guards and failure propagation.
    In features/engine_workflow_test.go, align only the two expected ordinary command strings in
    engineWorkflowIssues and engineRedWorkflowIssues. In tools/release/workflow_test.go, align
    TestReleaseWorkflow's exact automatic Linux command expectation with the same timeout-bearing
    command. Keep their exact comparisons and every negative control. The engine invocation,
    180-second shard gate, four-minute engine test timeout, job/step limits, fixture limits,
    scenario inventory and assertions stay unchanged.

    Audit active suite invocations and timeout overrides in the workflow and tools/bin. The
    baseline tools/bin/scenario-list runs only TestScenarioList, not the suite; domain-coverage
    runs domain packages, and pinned forwards its arguments unchanged. None supplies a shorter
    whole-suite timeout. Leave those tools, engine compile-only commands and bounded engine or
    fixture commands unchanged. Do not use a global GOFLAGS override that would alter them.

    Replace the placeholder grep with the three cheap configuration checks below, at the
    existing task-check tier. The first reads itos's parsed runner and recognizer configuration;
    the second requires both exact proof command lines; the third checks the Tests command in
    each named platform job. At the specification baseline all three fail because these commands
    omit -timeout=20m. They assert configuration, not elapsed runtime or completed code proof.
    Neighbouring preservation checks are TestEngineWorkflow and TestEngineRedWorkflow, including
    their negative controls, TestEngineSuiteBudget and TestReleaseWorkflow. Reproduce the stale
    release assertion with go test ./tools/release -run '^TestReleaseWorkflow$' -count=1 before
    aligning it, then require that check to pass. Run the wider gates through the configured hooks
    and CI; the ordinary full suite remains without -race and native-engine evidence stays in
    CI. Never run the full features package with -race or change a memory limit to obtain a pass.

    The drafter changes only this ledger entry in docs --item T-58. Implement the timeout
    configuration and feature-test expectations together in one build --task T-58 commit. Align
    the omitted release-test expectation and this specification in one follow-up build --task
    T-58 commit, preserving published history. Preserve sibling ledger entries and work
    ownership/status. Agents commit and stop; the loop owns push, CI watching
    and closure after the actual pushed head passes its required checks.
- id: T-59
  type: ci
  title: egress.feature moves to an engine shard of its own, as the other shard's step has passed 180 seconds
  why: >
