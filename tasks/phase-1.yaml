    controller.lock, egress-refusals.jsonl, operation.lock and record.json, so no name of the
    temporary's shape is left.

    Commits, decided before editing, each with itos commit --task T-51, because CI runs no check of
    a task the range's Task: footers do not name. First a test commit, red first: every test above
