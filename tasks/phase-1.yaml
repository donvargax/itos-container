    both && to || in valid, and internal/engine/manifest/disk/open_unix.go:11:80, 0 to 1 in
    openCandidate. Keep production functions unchanged. Do not regroup valid, move the Unix
    call or change source merely to remove a mutation site. Do not change proof.code's count
    10, its base-derived seed or range, commits.since, excludes, tool pins, thresholds, workflow
