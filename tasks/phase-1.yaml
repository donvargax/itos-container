    Use test --item T-21 for harness/regression files and features/README.md, ci --task T-21 for
    .github/workflows/ci.yml, and docs --item T-21 for the ADR/architecture update. This drafter
    changes only this ledger entry in docs --item T-21. No mutation run, generated evidence,
    GitHub action or approval of a real sandbox belongs to drafting this spec.
