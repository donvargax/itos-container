    TestRecoveryProtectedHeartbeatRename; both new tests were absent then. The separate focused
    run of TestOfflineRegistryPreservation and TestAdmissionPreservationRequiresExactProtectedBinding
    passed, including their negative cases. Keep the new tests in the existing ordinary Linux
