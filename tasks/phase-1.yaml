    The checks. The first two pass at the base, since nothing tests egress yet; their red is the
    test commit's, where they fail at the new tests' assertions; the race form holds the watch's
    goroutines and the copy's concurrent close (6 s for the whole engine here). The third exits 1
    today at its first name, "port has no test named TestEgressGrant", and later names any test a
    package lacks, because go test passes when a pattern matches nothing. The fourth exits 1 today
