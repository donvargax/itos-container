# Project-local tasks are added with itos task add, starting at T-1.
- id: T-1
  type: ci
  title: Establish the generated seed as the commit tracking boundary
  why: >
    The generated seed predates this project ledger and has no Task footer. Start project commit
    checks after that exact seed while retaining checks for the pilot draft and every later commit.
    Do not rewrite history, claim inherited proof or relax any gate.
  done_when:
    - run: test "$(itos config get commits.since)" = "23b8ce15410ec9431f5a1fe39a973d9cf0a3d8de" && git merge-base --is-ancestor 23b8ce15410ec9431f5a1fe39a973d9cf0a3d8de HEAD
    - run: itos config check
- id: T-2
  type: style
  title: Format the inherited release test fixture
  why: >
    The first full CI run failed because the release test fixture map is not gofmt-aligned. Change
    only whitespace in internal/release/releasetest/releasetest.go; preserve all fixture contents
    and behavior, and retain the existing formatting gate.
  done_when:
    - run: test -z "$(gofmt -l internal/release/releasetest/releasetest.go)"
- id: T-3
  type: ci
  title: "Finish the move to itos 8: the by-hand steps of itos upgrade 7.0.0-rc.1 to 8.45.3"
  why: >
    itos upgrade moved the pin and itos.yaml to 8.45.3 and rewrote AGENTS.md's itos block
    (2026-11-03), and itos config check passes. The manual migration is incomplete:
    .github/workflows/ci.yml and .github/workflows/release.yml still use the v7.0.0-rc.1 action
    at 1b9f1f9995be5d20aed3b4f8877a453bbd1e98a3 and override its launcher with version 6.0.0.
    This is foundation work under docs/charter.md, not a new container behaviour; it needs task
    checks, no Gherkin scenarios or step definitions.

    Pin both action references to donvargax/itos@0a8c1bcfce6ae7b67b39197ee3990a90343f35ac
    with the comment v8.45.3. Remove each action's with/version override entirely. The upstream
    tag https://api.github.com/repos/donvargax/itos/git/ref/tags/v8.45.3 identifies that commit;
    https://github.com/donvargax/itos/blob/0a8c1bcfce6ae7b67b39197ee3990a90343f35ac/action.yml
    resolves a SHA to its release when no version input is supplied. No new library or service
    is needed. Keep itos.yaml's 8.45.3 pin and checksum
    d91adcab38594aabbaabc828a6a82b027580374d3e55ea3968d7dee75e8dfaea unchanged. A release-looking
    comment beside an arbitrary SHA is not evidence of the correct action.

    Update docs/upgrading.md to distinguish the supported upgrade command from these manual
    workflow edits and record the remaining migration rules. Code proof is enforced by ci run
    through proof.code, so required changed-code mutation results must be recorded and committed
    before the coordinator pushes, using the parent of the item's actual first commit, specs
    included. Keep the proof configuration, thresholds, existing CI steps and verify/ci run
    calls intact. The whole plan's no-start proof message is not a proof pass; a workflow/docs
    change alone touches no proof.code path and must not fabricate mutation records. The pinned
    itos-cc upgrade belongs to T-4.

    Numbered work add, task add and work promote mint their IDs; do not prescribe IDs by hand.
    A plain itos push does not publish tags; a deliberate tag push needs --tag. The existing
    release workflow creates a local tag and publishes its draft through GitHub, without an
    itos push call: preserve that sequence and its version condition, and do not enable releases
    or add a tag-push step. Keep the bans on --no-verify, commit -a and git add -A. Document these
    migration rules without rewriting the template claims in PLAN.md, README.md or AGENTS.md;
    that foundation cleanup is separate work. No runtime, dependency, platform or gate expansion
    belongs to this task.

    The checks below use the runner's existing shell tools, without requiring RTK in CI. They are
    cheap configuration and workflow checks for the existing task/CI gates; let the configured
    hooks and CI run the wider plan. Review its listed steps without changing
    their selection or cost. Before implementation, both exact-action checks fail on the v7 SHA
    and both no-override checks fail on with/version 6.0.0. Configuration validity and plan
    construction are preservation checks, not evidence that the workflow migration is complete.
- id: T-4
  type: build
  title: tools/bin/pinned runs the current itos-cc, not 0.5.0
  why: >
    tools/bin/pinned still runs itos-cc 0.5.0. The current release, verified on 2026-11-04 at
    https://api.github.com/repos/donvargax/itos-cc/releases/latest, is v0.47.2, published on
    2026-11-02 from eb7d910ab864b890a9033f5c8acc2311f56efe25. Fix this task's target at 0.47.2
    rather than resolving latest at runtime. This is the charter's foundation tool upgrade,
    a build task with checks, not container behaviour: no scenarios or step definitions.

    Update only the itos-cc version and its five archive SHA-256 values in tools/bin/pinned.
    The expected values below come from
    https://github.com/donvargax/itos-cc/releases/download/v0.47.2/checksums.txt, whose SHA-256 is
    7ebfae6b1f2193b79425289af3a436e4ee25efe27e6ee11b04f49ac984f9ef30; the release API's asset
    digests agree. Keep Linux and macOS amd64/arm64 and Windows amd64, the archive names and
    member names, versioned cache directory, --path interface and checksum-before-extraction
    behaviour. Leave the other tools' pins alone and do not add Windows arm64. These are tool
    distribution platforms, not additional supported container hosts. No new library or service
    is needed. Verify the release checksum manifest before copying any value; a version bump
    beside old hashes is incomplete. The Linux runtime check must use the repository launcher,
    not an unrelated itos-cc on PATH, and resolve .tools/itos-cc-0.47.2/itos-cc on a cache miss.

    Record the applicable migration in docs/upgrading.md, using the releases from 0.5.0 through
    0.47.2 and https://github.com/donvargax/itos-cc/blob/v0.47.2/README.md. The existing
    mutation sample --count 10 and mutation check --since <base> --fail-uncovered --json cmd
    internal remain supported. Keep those CI/proof commands, their scope and thresholds intact;
    do not replace cached checking with a counted run or change to --fail-uncovered=lines.
    itos-cc.yaml's mutation.exceptions: [] is already valid. Its omitted version means version
    1; strict validation now rejects unknown keys, anchors, aliases, merge keys, non-JSON tags,
    non-string keys and multiple documents, none of which this file uses. Preserve that file;
    do not add exclusions, exceptions, mutation.tests or mutation.copy for this pin move.
    The 0.18.0 comment-insensitive hashes and later whole-suite evidence can stale old results;
    0.47.0 also invalidates older strict coverage evidence. Exception rehashing is unnecessary
    here because the exception list is empty. No consumer here parses mutation's plain output
    or distinguishes its nonzero error codes; keep exit status as the verdict.

    Strict --fail-uncovered now requires fresh coverage evidence for every judged Go function,
    including functions without mutation sites, and rejects uncovered executable blocks as well
    as uncovered mutants. Re-measure required stale evidence with the pinned release, all-tests,
    fail-uncovered and no-annotate; commit only the resulting project-local .metrics/mutate/
    paths. Kill survivors with tests and never excuse uncovered code, hand-edit evidence, copy
    another project's cache or relax a gate. Use the parent of T-4's actual first commit,
    786ea2f2cb1f75351e30c4b75c37d98437b3f418, as the range base:
    ebd187e7f0722f65d9aadda7a13d27048e4e03f6. Reconfirm this against itos work show T-4 if history
    changes. The planned launcher/docs edits touch no proof.code path; the range check below
    then validates command/config compatibility but proves no Go function. Do not manufacture
    changed-code records or expand this task into a repository-wide proof refresh.

    The only existing snapshot records three Example mutants in
    internal/release/releasetest/releasetest.go. A sample draws only fresh recorded outcomes,
    at most ten, and skips stale or missing results: success with zero candidates is not a
    refreshed baseline. Report the actual sampled count and any stale-evidence limitation in
    the implementation handoff. A full foundation baseline is separate work, not a reason to
    lower this task's gates or claim all code is proven.

    Keep the checks at the existing task/CI tiers, with shell tools already on the runner;
    remove the task check's RTK wrapper rather than requiring RTK in CI. The checksum-map and
    executed-version checks fail before implementation on all five old hashes and 0.5.0.
    Shell syntax, configuration and the range check are preservation checks. The existing
    mutation sample already passes with 0.5.0 (three of three cached mutants), so it is only
    a compatibility check, never the upgrade assertion. Its HEAD-derived seed is deterministic
    for a given commit. Leave the existing wider CI plan and hooks in control of their gates.
- id: T-5
  type: docs
  title: Replace inherited template guidance in PLAN.md, README.md and AGENTS.md
  why: >
    PLAN.md and AGENTS.md still describe a template and its stack branches; README.md presents
    this project as a generator input with replaceable attribution. Replace that guidance with
    this project's purpose and current state. This is documentation-only foundation work under
    docs/charter.md, not container behaviour: no scenarios, step definitions or runtime changes.
    Each of the three files must link to docs/charter.md and docs/plans/container-pilot.md, name
    the planned itos container extension and the offline owned-run milestone, and make the
    charter's selected scope and the pilot's binding contract authoritative. Read the charter
    before PLAN.md; do not change either authority to fit inherited guidance.

    PLAN.md must replace template rendering, branch selection and bootstrap sequencing with the
    charter's order: project foundation, configuration/doctor/approval, then an offline owned
    run. Describe the milestone's target, itos container run -- <argv>, as planned: an approved,
    hardened container with no network, the checkout as its only host mount, non-root identity,
    recorded ownership, bounded startup, foreground exit and safe owned cleanup, each requiring
    failing-then-passing scenario evidence. Core itos retains work routing, commit rules and CI
    proof. T-3 and T-4 completed tool migrations, not the entire foundation or the sandbox.
    Keep runtime alternatives (isolates, WASM, restricted shells and a capability broker) only
    as deferred research, with no selected dependency, experiment or runtime branch authorized
    by this edit. They may be shortened to a clearly deferred research note.

    State the first milestone's limits in PLAN.md and README.md and link them from AGENTS.md:
    Linux amd64 with native Docker is the target, with no support claim before runtime proof.
    Proxy egress, credentials/accounts, network Git, LAN ingress, Compose and other platforms
    remain outside this milestone. Distinguish the inherited multi-platform Go checks and release
    tooling from container-host support. Hooks and agent instructions are workflow safeguards,
    not the isolation boundary; assume hostile checkout code and tool execution. Do not promise
    protection against host administrators or kernel/container escapes.

    README.md must distinguish existing code from the planned product. The current entry point
    in cmd/itos-container/main.go already exposes the inherited itos-container count <file>
    example (including standard input and JSON), version and completion. Keep a concise, accurate
    description of that foundation and its Go checks; explicitly say the container commands and
    isolation are not implemented yet. Do not describe planned container commands as runnable
    setup instructions or claim the counting CLI proves a sandbox. Retain the counting example,
    its port/fake architecture, whitespace tokenization and newline-terminated additive property
    in the guidance where relevant. Do not claim a fresh foundation mutation baseline from a
    passing cached sample: T-4 reported zero eligible records, and baseline work is separate.

    AGENTS.md must put the charter first and require itos guide work and itos guide commit for
    the assigned role. Preserve scenario-first behaviour work with red step commits, task checks
    for foundation work, direct implementation without subagents, itos registry ownership rules,
    status inspection and explicit own-file staging, and commits only through itos commit.
    Replace instructions for the implementing agent to push or close an item with the charter's
    division: agents commit; only the coordinating loop pushes, marks a pull request ready and
    closes an item after the actual pushed head is green and required proof passes. Respect a
    brief's role and coordinator-owned lifecycle actions; a drafter does not take the item.
    Keep hook/CI gates, no bypasses, no force-push or published-history rewrite, and no hand-edited
    owners/statuses. Keep the pinned itos-cc requirement, all-tests, fail-uncovered, no-annotate,
    the parent of the item's actual first commit (specs included) as proof base, committed
    project-local evidence, tests for survivors and uncovered code, and reasoned exceptions only
    for genuinely equivalent mutants. Documentation-only work touches no proof.code path and
    must not fabricate mutation results.

    Preserve domain-owned ports, thin entry points, our fakes rather than mocks, OS-as-value
    logic and the narrow build-tag rule. Add the charter's engine boundary: domain tests use an
    engine fake, real-engine scenarios run only in CI, and agents never receive the Docker
    socket. Preserve the bans on credentials in files/logs and on weakening gates. Keep the
    generated block between the itos markers unchanged. Retain accurate AGPL-3.0 attribution to
    donvargax and the authorized infrastructure provenance from itos and itos-template, together
    with the original projects' and dependencies' notices and links to LICENSE/CONTRIBUTORS.md;
    the owner is not an illustrative answer and this repository is not a template generator.

    Implementation edits only PLAN.md, README.md and AGENTS.md. Do not alter the charter,
    contract, code, tests, configuration, gates, license files or generated rules. Retargeting
    docs/CLI.md and docs/CONFIG.md, CI branch conditions and fresh baseline proof are separate
    recorded work. No new library or service is needed. Keep AGENTS.md within its existing
    document cap; let the configured hooks and CI run their checks without changing their tiers.

    The checks use existing shell tools, with no RTK or ripgrep requirement in CI. Before the
    edit, the source/scope check fails on the missing charter link in PLAN.md (all three files
    lack the required links and milestone); the retired-claims check finds template claims in
    all three files; the agent-rules check fails on the missing itos guide commit instruction
    and Docker socket boundary. Its other terms preserve existing proof and commit rules.
    These are cheap documentation checks, not runtime isolation proof. Review the prose against
    the decisions above as well: keyword presence alone cannot establish truthful status,
    correct loop ownership, milestone limits or preserved provenance.
- id: T-6
  type: docs
  title: docs/CLI.md and docs/CONFIG.md describe itos container's commands and itos-container.yaml, from the newest of itos's and itos-cc's guidelines
  why: >
    Both files still describe itos-template, its manifest and its decisions. Replace that guidance
    with this project's planned interface and strict policy rules. This is documentation-only
    foundation work under docs/charter.md and docs/plans/container-pilot.md, not implementation of
    container behaviour. Edit only docs/CLI.md and docs/CONFIG.md; add no scenarios, step definitions,
    code, dependencies, configuration files or gates. Preserve the counting example and existing
    checks. No proof.code path changes, so do not manufacture mutation evidence.

    The upstream comparison was verified on 2026-11-04 using main's commit and each file's last
    modifying commit, not the date a copy arrived here. Pin source links in both documents to the
    inspected revisions below, retain their attribution and external guideline sources, and explain
    which newer rules apply. Do not present another project's implementation gaps or numbered
    decisions as this project's. itos-cc has the newest edits to these guidelines, but its own
    compatibility exceptions and command-specific behaviours are not universal rules. The charter
    and pilot contract remain authoritative over every upstream example.

    itos was inspected at 772cef549d90b9cca7170a2252ad85fc09bd880a. Its docs/CLI.md last changed at
    50dfa0bcc8c0632aaa0d0041206e2c97cf9ae24f on 2026-10-27 at 03:01:23 UTC; there is no docs/CONFIG.md
    at that revision. Its extension protocol is docs/extensions.md at the same inspected revision:
    https://github.com/donvargax/itos/blob/772cef549d90b9cca7170a2252ad85fc09bd880a/docs/extensions.md.
    itos-cc was inspected at 9361616f7204a236e809417726ad107ca4f9b805. Its docs/CLI.md last changed at
    8a3f31cd899be858fa7eaea02ce9f05572d54346 on 2026-10-27 at 10:10:36 UTC; docs/CONFIG.md last changed
    at 405b36205f8a38a27260f69afe554412015077ec on 2026-10-27 at 06:39:05 UTC. itos-template was
    inspected at 1533aee2ea3331816e793faaeaabd3f55f83bcaa. Its docs/CLI.md last changed at
    79301eba51b9768a27906c720e39c49b08491e67 on 2026-10-12; docs/CONFIG.md last changed at
    2d8bc3da85fd0aa8b6cc86f2b40b526c9726ffd3 on 2026-10-07. Link each available guideline using
    https://github.com/donvargax/<project>/blob/<inspected-revision>/docs/<file>. The inherited
    CONFIG.md matches that template copy; its CLI.md lacks the template's later pre-v1 guidance
    and still has render/merge examples. A new repository HEAD date alone does not date a rule.

    Both documents must link to the charter and pilot, state that container commands and policy
    loading are not implemented, and distinguish design rules from current behaviour. The existing
    cmd/itos-container/main.go exposes count, version and completion, not a sandbox. Describe the
    offline owned-run milestone and Linux amd64 with native Docker as a target requiring runtime
    proof, not a support claim. Network egress, credentials/accounts, LAN ingress, Compose and other
    platforms remain deferred. Describing the pilot's later commands does not authorize those
    slices or any open security decision. Do not claim previous-release checks or other upstream
    compliance machinery run here merely because a source describes them.

    CLI.md must describe itos container as dispatch to itos-container through the existing extension
    seam, with a planned command table for init, doctor, approve, run, exec, status and stop. init
    prepares non-runnable examples without overwriting files; doctor only inspects; approve shows
    effective permissions and differences and records explicit host-user consent outside the
    checkout. None executes checkout code, installs hooks, logs in, pulls/builds images or starts
    a session. Distinguish doctor --probe as the pilot's explicit bounded disposable probes using
    trusted material without agents or real credentials; real-engine scenarios run only in CI.
    run -- <argv...> requires an explicit command and preserves argument boundaries, with no
    implicit shell or injected agent permission flags. exec <session> -- <argv...> uses only a live
    owned session's frozen restrictions and never extends its foreground lifetime. Primary exit
    refuses new exec and tears down active commands. status reports owned state/recovery without
    secrets; stop <session> removes only owned resources, preserving checkout edits and project
    state. No detached mode, foreign-resource pruning or unattended recovery restart is implied.

    Preserve applicable naming, help, flag, output, compatibility and completion principles. Retarget
    the executable's version/error prefix to itos-container and proposed product-specific variables
    to ITOS_CONTAINER_; this naming rule creates no new variable or flag. Explain the host protocol's
    ITOS_ROOT, ITOS_CONFIG, ITOS_JSON, ITOS_BIN and ITOS_VERSION separately. ITOS_CONFIG names core
    itos configuration, never itos-container.yaml, and no container keys belong in itos.yaml. Flags
    before container belong to itos; arguments after it belong to the extension, and words after
    run/exec's -- belong to the workload without further wrapper parsing. Proposed flag/environment/
    file precedence cannot grant permissions, bypass approval or import the host environment into
    the worker. NO_COLOR is a presentation convention, not permission to forward host variables.

    For planned noninteractive control commands, --json or inherited ITOS_JSON=1 requests one stdout
    object with schema 1, ok and typed problems even on failure; diagnostics go to stderr. Carry
    forward the newer guidance on stable rule IDs, each problem's exit and flat subject fields,
    reserving rule, exit, message and fix. Scripts rely on codes, structured data and written file
    data, not prose or comments. The pilot proposes refusing JSON mode for interactive run/exec;
    document that exception, including inherited JSON mode, rather than mixing workload output
    into an object. Do not invent exact problem IDs before the behaviour specifications.

    Record the exit-code source disagreement explicitly. itos and its extension contract still use
    0 success, 1 policy/check refusal, 2 usage/config/unknown command, 3 missing environment, 70 internal
    and 75 temporary failure. itos-cc's newer 80/81/82/100 and interrupt 130 are its own decisions.
    Retain the pilot's binding itos wrapper conventions, not an undocumented migration to itos-cc's
    numbers. Once a workload starts, preserve its exit status; report cleanup errors separately,
    returning nonzero when a successful workload has required-cleanup failure. Do not apply the
    inherited rule against child-code passthrough to workload exits or invent a cleanup/signal code.
    Exact timeout, signal and cancellation details still need scenarios. Keep codes, JSON and their
    mapping in the UI, never in the domain. No current counting behaviour changes with this task.

    CONFIG.md must use itos-cc's newer separation of format policy from implemented loader behaviour
    for the planned itos-container.yaml. Other tools' files keep their own formats: itos.yaml is core
    workflow configuration, and the restricted devcontainer.json is JSON-with-comments, not YAML.
    The checkout policy and manifest request permissions; neither authorizes itself. Require shared
    validation by doctor, approve and run, explicit host-owned approval outside the writable checkout,
    and a frozen effective session configuration. Missing/malformed policy, unsupported options,
    invalid values or absent/mismatched approval must not fall back to unrestricted startup. Editing
    checkout files or recording a new approval cannot widen a live session.

    Retain the JSON data model with YAML syntax, explicit visible defaults and no embedded language
    or host-side evaluation. Require rejection of duplicate and unknown keys, non-string keys,
    multiple documents, anchors, aliases, merge keys and non-JSON/custom tags, including inside
    nested values, before using configuration or starting resources. Quotes, comments, block/flow
    styles and the non-specific ! tag are data spellings, not execution. Keep actionable problems
    keyed by their path from the top, validation of all values before use, integer versioning and
    rejection of unsupported versions. Explain that itos-cc's ignored x- keys, absent/empty-file
    defaults, missing-version compatibility and pre-1.0 version-1 additions are project-specific
    exceptions, not adopted sandbox policy. Do not select a parser or claim these checks already
    exist; later behaviour specs must choose maintained libraries and pin them before implementation.

    Keep the remaining format principles: snake_case keys, ordered lists of named objects, values
    kept whole (argv lists rather than shell strings), file-relative slash-separated paths, no
    secrets, documented types/requirements/defaults/examples, reviewable effective defaults, a
    versioned JSON Schema and stable deterministic writes. Distinguish desired documentation/schema
    capabilities from commands or artifacts that exist. General path guidance does not settle safe
    checkout identity, manifest discovery or state storage. No runnable policy example, key catalog,
    schema version, discovery/output path, approval fingerprint, lifecycle-hook semantics or
    resource limit is invented here; those pilot questions remain open. No host credential sourcing
    is authorized by general environment-variable guidance. Remove template-specific examples,
    docs/manifest.md links, bare inherited decision numbers and unowned gap IDs such as
    config-key-paths; link the actual authorities and name remaining specification needs instead.

    The checks below are cheap documentation checks at the existing task/CI tier, using existing
    shell tools without RTK or network access. Before implementation, the command check fails at
    the absent itos container reference; the source/status check fails at the absent pinned itos
    revision; the boundary check fails at the absent ITOS_ROOT; and the retired-claims check finds
    template commands, variables and manifest links. Existing parsing terms are preservation
    checks. Keyword checks do not prove correct prose or isolation: review both documents against
    this entry, especially source differences, current versus planned behaviour, workload exits
    and the approval boundary. Let configured hooks and CI run the wider gates unchanged.
