    https://hub.docker.com/v2/repositories/library/registry/tags/3.0.0 and
    https://hub.docker.com/v2/repositories/library/busybox/tags/1.37.0-musl.
    Use docker.io/library/registry@sha256:5b12b22f21522fe69443079df04c0f3f42cb9977857f3c20404386652a6c6d8e
    (3.0.0) and
    docker.io/library/busybox@sha256:5624bb6777cf469b1fb50ae3f981b15d2715ee2fffaf20b9998cfb7843726835
