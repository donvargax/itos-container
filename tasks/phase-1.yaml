- id: T-48
  type: chore
  title: Prepare session token staging, exact file mounts and owned recovery
  why: >
    Charter milestone two, step 2 needs the shared session seam before slice-31 and slice-33 can
    deliver tokens. This is internal foundation work, with task checks and no new command
    behaviour or scenarios. It does not lift any policy, approval or run refusal. Read
    docs/decisions/0025-credentials-passed-in.md in full, arc42's Credential run and credential
    building blocks, docs/architecture.md's Slices, decision 0017 and LIFECYCLE-03/07. The design
    remains ADR 0025's proposal, not a charter amendment, runtime evidence or permission to use
    real credentials. Its question 1 defers Codex and the original task's direct single-file
    source-mount half; implement neither a Codex kind nor a replacement login mechanism here.
    Question 5 bars real credentials. Question 6 bars an integrated refusal-log absence claim;
    this task neither fixes the logging contract nor declares AC-36 satisfied.

    The coordinator's q-67 decision of 2026-11-15 21:15 UTC confirms the slice-29 prerequisite
    is met: slice-29 merged at ae2e666 and closed at 07a596e on 2026-11-14, and q-54 applies.
    Implement T-48 as specified without another prerequisite question. Consume slice-29's
    bounded, concurrency-safe state-side descendant-exclusion handoff, including refusal of a
    state-descendant alias while admitting a distinct source during another project's
    publications and removals and with more than 100,000 unrelated retained entries. Older
    unresolved-state wording in ADR 0025 or arc42 predates that merge; do not rewrite it in
    this task. Do not implement the withdrawn host-wide state scan, a current-project-only
    substitute, or a fallback. The source capability below consumes that handoff; it does not
    invent its exclusion algorithm.

    Extend internal/engine/session's domain, port, port/porttest, disk, docker, codec and entropy
    responsibilities, preserving the existing slice/engine arrows. Keep OS, filesystem and SDK
    operations behind ports, and the stateful fake entirely in memory. Only cmd may assemble
    concrete adapters; public assembly and grant admission belong to the consuming slices.
    Reuse the session intent, registry, per-session operation lock, finite-call wrappers and
    shared Recovery path, not a second worker lifecycle. No-grant runs keep their existing
    configuration, record meaning, hardening and lifecycle. Preserve T-40's resource ownership
    and cleanup when its changes land; credential cleanup cannot declare a session complete
    while an anchor, worker or other owned resource remains. Reuse the pinned Moby client
    v0.6.2/API v1.56.1, golang.org/x/sys v0.48.0 and Go 1.27 standard library; they already supply
    engine mounts, descriptor operations, tmpfs observation and entropy. No new library, host
    shell, HTTP bridge, network service, init wrapper or dependency upgrade is needed.

    Accept only the two token kinds from ADR 0025, at most one of each. Their immutable targets
    are /run/itos-container/credentials/claude-token and
    /run/itos-container/credentials/github-token. Represent checked source access separately
    from persisted metadata: the source capability retains the descriptor and identity validated
    by readiness, and reading reopens that descriptor through /proc/self/fd, never the supplied
    pathname. Consume slice-29's revalidation, including exclusion, for the complete source set
    before reading or staging; refusal means no staging or create. Read each checked source once
    per command, 1 through 65536 bytes, without trimming. A short read, changed observed size or
    failed read refuses.
    Keep bytes in the copying adapter, not Binding, Record or a Docker request. Use one bounded
    read/write buffer and overwrite it after use on success and failure; this is hygiene, not
    guaranteed Go-memory zeroization. Never read, hash or compare contents to decide approval.

    Publish durable staging intent under the existing protected session authority before mkdir
    or any token copy. Allocate an independent 128-bit random staging name, /dev/shm/itos-container-
    followed by 32 lowercase hexadecimal digits, through the entropy adapter; do not shorten
    existing session or intent IDs or change HexID. Verify /dev/shm is tmpfs with statfs. Create
    a new host-UID-owned directory with mode 0700 and validate it by descriptor after mkdir;
    collision refuses instead of reusing it. Create exactly the selected kind-named regular
    files with O_CREAT, O_EXCL and O_NOFOLLOW, mode 0400, owned by the host UID, and copy the
    checked bytes. A partial failure keeps enough original intent for owned cleanup. Never
    write copies under the checkout, protected state, a disk-backed volume or an image; never
    bind the original source or the staging directory. No grant means no staging allocation.

    Supply only staged paths and fixed targets to the Docker adapter. CreateRun adds one
    read-only HostConfig.Mounts bind per token, alongside the existing checkout anchor volume
    and /tmp tmpfs. Retain private IPC, a separate worker /dev/shm, the read-only root, non-root
    UID/GID, literal workload argv as PID 1, no restart and every existing hardening check.
    Create-time paths may be visible in inspect; token values may not. Extend VerifyRun's
    safeHost and safeMounts to require exactly the intended sources, targets, types and read-only
    flags, refusing missing, extra, duplicate, writable, directory or original-source mounts.
    Do not weaken the existing Docker variation that may omit /tmp from materialized Mounts.
    Inspect's recovery ownership currently recognizes only one HostConfig mount: extend that
    observation and its consumers too, so a legitimate credential bind neither hides an anchor
    mismatch nor prevents owned recovery. Assertions must inspect raw requests and independent
    fixture observations, not call safeHost or safeMounts as the oracle for their own correctness.

    Stage before worker create and keep copies until the start wait returns and the applicable
    existing checkout-mount detector has run. On every path after that point, including failed
    acknowledgement or detector failure, attempt to unlink every staged file and remove the
    directory. On failures before any start attempt, clean partial staging and any owned
    unstarted resources without starting work. Preserve the primary failure if cleanup fails.
    Source inspection, reading, staging, publication, create and verification failures before
    start therefore prevent launch; this does not say a failed start acknowledgement prevents
    launch. Do not add start retries, a new workload lifetime, or a restart after unlink.

    Model staged pathname presence and runtime-acquired references independently. A runtime
    may acquire a credential mount, lose its start acknowledgement, and finish starting after
    the controller unlinks the files. The acquired copy can still be read until that worker's
    mounts are torn down. Preserve the original protected full worker ID; reconcile it within
    the existing operation and teardown budgets and attempt owned termination/removal. Retain
    an unobserved workload outcome as unknown. Missing staged paths, a failed start, or restart
    policy no cannot prove that no workload ran or that credential cleanup completed. Completion
    requires confirmed worker removal AND confirmed staging-path removal, plus the other owned
    resources. A known workload exit keeps its existing precedence over controller failures.

    Retain only kind, paths, original session authority and necessary staging identity/progress
    in recovery evidence, never token bytes or their hashes. Evolve the strict record encoding
    explicitly without repurposing existing schema-1/2 records or accepting unknown fields; keep
    original identities immutable and completion terminal. Coordinate any newer schema number
    with T-40's landed encoding instead of silently colliding with it. Recovery must reconstruct
    its staging authority from protected records without reopening original sources, current
    policy or approval. It verifies directory ownership/mode, identity and the expected file
    names before removal, follows no symlink and never recursively deletes unexpected entries.
    Unexpected or substituted contents refuse cleanup and retain evidence. Missing staging
    after a reboot confirms only path absence, never an earlier workload result. Return staging
    presence as present, absent or unknown through the recovery port for the consuming slices'
    status presentation. Incomplete cleanup keeps the public session ID and exact
    itos container stop <session-id> retry; only observed absence permits the durable completion
    transition. Status is read-only and repeated stop after confirmed completion is idempotent.

    All new finite operations share min(10 seconds, remaining phase time), the original
    120-second startup and separate 30-second teardown totals; status retains 10 seconds and
    stop 30 seconds. A staging syscall can return after cancellation. Keep its descriptor and
    serialization authority until it returns, dispose of late acquired handles, forbid later
    launch and retain uncertain effects for fresh recovery. No late reply can overwrite a
    completed record, resume launch or replace the reported cause. Reuse the existing budget
    engine and controlled-time/barrier tests rather than sleeping for production deadlines.

    Commit executable contracts and unit tests first with compilable, refusing stubs for the
    missing seam, then implement it. New positive controls must fail at their copy, exact-mount,
    ordering or recovery assertion, not at compilation, missing setup or a skipped test. Keep
    the existing passing lifecycle controls as regressions and report them honestly. Use these
    named tests so the ledger cannot pass merely because go test matches no new tests:

    In disk, TestCredentialStagingContract runs the same port/porttest contract as subtests
    memory and disk. Cover each kind and both together, exact byte preservation including a
    final newline, sizes 1 and 65536, independent commands and unchanged original sources.
    Cover intent-before-effects, no-grant no-op, non-tmpfs refusal, occupied directory/file,
    symlinks, wrong ownership/modes, short reads/writes, read or metadata revalidation failure,
    partial staging, failed unlink and safe repeated cleanup. A recording test reporter must
    show the shared oracle rejects a faulty fake, including one that trims the final newline.
    Test-only temporary roots and filesystem observations let disk tests exercise the adapter
    without Docker, privilege or a real state folder; they are not production flags and prove
    no kernel mount behaviour. Unsupported OS is an input value, not a runtime.GOOS branch in
    logic; any build-tagged shim contains only the unavailable call, not decisions.

    In docker, TestCredentialMountContract runs one shared contract as memory and sdk subtests
    against the I/O-free engine fake and the existing local Engine API fixture. Assert exact
    create/inspect mounts, unchanged hardening and literal argv, both token kinds and no-grant
    compatibility. Change each inspected source, target, type, read-only flag and ownership
    independently with a healthy control, requiring refusal before any start. Observe every
    API request and response, including errors, rather than just the final create body.
    TestCredentialUncertainStartContract, also memory and sdk, scripts mount acquisition before
    a lost acknowledgement and delayed start completion after unlink. It must observe the
    retained bytes through the simulated acquired reference, one create/start only, original-ID
    reconciliation, observed exit or explicit uncertainty, and both successful and failed
    cleanup. A fake that deletes its acquired reference on pathname unlink must fail. The SDK
    fixture models this lifecycle; it is not real-engine evidence.

    In domain, TestCredentialLifecycle drives the registered Runner and shared Recovery through
    all preparation/start/detector/cleanup boundaries using the stateful fake. Include stop
    winning the operation lock before start, controller loss before unlink, partial publication,
    unavailable observations, foreign/substituted staging, independent sessions, and every
    combination of worker present/absent and staging present/absent/unknown. Assert mutation
    order, no launch after a pre-start refusal, exact retry and no invented workload success.
    TestCredentialBudgets uses controlled time and barriers for cancelled/late staging reads,
    writes, unlink, intent saves and start replies, proving the original limits and retained
    handle lifetimes without long sleeps. Existing finite-launch, registered-run, anchor,
    recovery and cancellation tests remain live.

    In port, TestCredentialProgress holds immutable ownership and terminal completion through
    every credential progress transition. In codec, TestCredentialRecords round-trips the new
    metadata, refuses missing/unknown/mistyped fields, invalid kinds/paths, changed authority and
    impossible completion, and preserves existing records. In disk,
    TestCredentialRecoveryStore exercises durable publication, interrupted updates and reopening
    against the same store contract on memory and disk. No serialization may include the read
    buffer, source capability or content-derived approval value.

    TestCredentialProvisioningAbsence in docker searches raw synthetic markers and their base64
    encodings at all three offsets in recorded Engine API traffic, configuration, labels and
    adapter failures. The staging, recovery-store and codec tests search their own real output
    surfaces, including fixture state and checkout files; domain tests check controller results
    and fake-recorded configuration/recovery metadata. Use fresh synthetic markers in private
    temporary fixtures and seed
    positive controls for every detector so empty searches cannot pass. Tests never import a
    sibling adapter to assemble this evidence; only cmd assembles adapters, including in the
    consuming slices' integrated tests. The marker must remain in its source and legitimately
    acquired worker reference until removal, but no staged pathname may remain after acknowledged
    startup cleanup or confirmed teardown. Assertions report the surface, never the marker or
    complete record contents. This is provisioning-path evidence only; the integrated searches
    over all approval/snapshot/recovery records, command diagnostics and checkout files remain
    required of slice-31/33. Arbitrary workload output is unredacted, and their ADR hostname-marker
    refusal-log probe still waits on question 6.

    Real Docker staged-bind acceptance, worker read-only access, cross-project isolation,
    hash-only proof of bytes after mount acquisition/lost acknowledgement, and disappearance
    after confirmed teardown remain required CI-only evidence with slice-31/33's black-box
    scenarios. Do not run a daemon here, add an unguarded engine test to the unit suite, or
    substitute this fake/SDK evidence for that handoff. A rejected bind or a staged copy that
    outlives its worker reopens ADR 0025's mechanism; no fallback is authorized. This task adds
    no scenario IDs and does not activate credential delivery in run, status or stop.

    The check below uses only Go and portable shell/awk already present in task CI. It runs the
    session unit suite once without the race detector and requires passing reports for every
    new test and both shared-contract backends; missing or skipped tests fail. Before this
    spec, go test -count=1 ./internal/engine/session/... passes in all eight packages, so that
    command alone is only a regression check. The strengthened check fails on the missing
    credential test reports, not on a credential assertion. The implementer must supply the
    assertion-level red described above, then passing evidence; the drafting failure is not a
    substitute. No feature-suite run, engine run, local mutation run or generated proof belongs
    to this documentation change. Hooks and CI retain their existing wider gates and CI alone
    judges fresh changed-code proof.

    Use test then chore commits for the internal seam, each with Task T-48 so its ledger check
    is selected when the implementer owns the item; an Item-only footer does not select task
    checks. Public behaviour belongs in the consuming slices' scenario-driven commits. Record
    implemented-versus-proposed status in ADR 0025 and arc42 with that implementation, retaining
    their unresolved questions and native-evidence limits. This draft commits only T-48's ledger
    entry as docs with Item T-48 and leaves every sibling entry untouched.
- id: T-49
  type: test
  title: "The lifecycle engine shard flakes on main: two barrier scenarios failed on commits that changed none of their code"
  why: >
    On 2026-11-09, main push run 42713010342 at 1b310df (a registry-only commit) failed Engine
    transport loss reports an unknown workload outcome and retains recovery (worker readiness did
    not reach the controller's foreground stream); 42716948746 at 1ca4e45 (slice-25's merge) failed
    two rows of The primary receives the first signal and its observed exit wins
    (lifecycle.feature:420; product did not reach the handle lifecycle barrier; lifecycle changed
    unrelated native resources or image references). A red main run blocks closure of unrelated
    work. Repair the lifecycle harness's readiness observation and retain enough failure evidence
    to identify which bound a hosted runner actually missed. This maintains milestone runtime
    proof; it adds no product behaviour, Gherkin scenario or ID. The drafter changes only this
    ledger entry. The four LIFECYCLE-08 examples, not just the reported failing two, remain required.

    The coordinator's 2026-11-10 03:10 UTC decision takes precedence over the timing hypothesis
    below. Both this flake and T-50 end with after scenario hook failed: native anchor harness
    cleanup HTTP 409; T-40 run 42746685311 failed both in one run. Before changing either
    scenario's bound, investigate whether cleanup attempts to remove an anchor volume while a
    container still uses it and whether that is their shared cause. Follow the shared anchor
    cleanup and worker-removal ordering, distinguishing the first failure from its cleanup
    aftermath. If a shared harness defect causes both, repair it once and record that result in
    T-50. The readiness and diagnostic regressions below do not by themselves establish the
    cause of the hosted flakes. Keep existing bounds until this investigation is resolved.

    Read features/lifecycle_native_fixture_test.go, lifecycle_native_actions_test.go,
    lifecycle_native_assertions_test.go, lifecycle_native_steps_test.go, lifecycle_probe_test.go,
    lifecycle_guard_test.go, lifecycle_harness_test.go and lifecycle_grace_test.go in full. Follow
    their recoveryProcess, recoveryDiscover, recorder and cleanup paths in
    recovery_native_fixture_test.go and lifecycle_recorder_test.go. Read engine_budgets_test.go,
    engine_budget_test.go, engine_budgets_regression_test.go, engine_schedule_test.go and its
    regressions, cmd/itos-container/engine_fixture_budget_test.go, lifecycle.feature,
    features/README.md and the actual engine-shard workflow. The socket startup diagnostics and
    their negative controls in features/sockets_diagnostics_test.go and offline_startup_test.go
    show the existing restricted diagnostic pattern; do not dump a container inspection.

    The source establishes a race, not yet the cause of every reported failure. The trusted
    probe writes slice-12:ready to its stdout before publishing slice-12-ready. Nevertheless,
    observing that file and a running worker does not establish that the controller's asynchronous
    output capture has received the frame. lifecycleSignalAction currently takes one bytes.Contains
    snapshot after lifecycleReady and signals even when the snapshot sets an error. LIFECYCLE-12's
    healthy control uses that same action, so its failure can occur before the disconnect under
    test. lifecycleReady itself waits up to 35 seconds for file/running observations;
    lifecycleAwait returns the same false for timeout and early process exit. lifecycleAbortEarly
    then adds a generic error, and lifecycleResult returns that error before reporting the exit
    and stderr. Thus the handle-barrier message does not prove that 35 seconds elapsed, nor that
    the disposable product's 1-second call or 3-second startup budget expired. Preserve the
    resource-inventory failure too; an unremoved owned resource or a real unrelated mutation
    must not become success by being labelled timing noise.

    Readiness is one bounded observation. Name its existing 35-second allowance in
    features/engine_budgets_test.go and use one absolute deadline from the recorded controller
    start, covering ready-file publication, the independent running/identity observation and
    receipt of the complete foreground frame. Partial bytes, repeated polls and progress do not
    restart it. A captured-output path must wait for the exact slice-12:ready newline frame,
    including when it arrives in pieces after the file; it must never send the requested signal
    or trigger transport loss while that evidence is missing. All captured-output callers,
    including the independent healthy control, use the same rule. Already complete evidence
    returns promptly. An observed controller exit or observation failure ends the wait promptly
    as failure; a live process with no complete frame fails at the original deadline. Keep
    independent observer I/O bounded by the remaining allowance, not an unbounded callback after
    a timer expires. Record readiness only after the required observations are complete.

    Preserve the unread-output cases. The stdout-pipe path still reads and preserves only its
    pre-release readiness prelude before releasing the workload writer; it cannot require bytes
    in the unused stdout capture buffer. The stderr-pipe path still captures stdout readiness.
    Neither path may drain the deliberately blocked workload output to make progress. Keep the
    measured full-pipe barrier, quiet-control lifetime, delayed acknowledgements, first-signal
    origins and every native receipt and durable-state assertion. Keep the 75/190-second process
    guards, the 40-second startup collection guard, and the original 30-second teardown plus its
    2-second observation tolerance. Collection or harness cancellation never supplies product
    success, and failed observations still receive unconditional owned fixture cleanup.

    On a missing barrier, report which observation was missing, the mode and condition, elapsed
    time from the recorded origin and its configured limit, and whether the controller exited
    before the deadline or the harness cancelled it after expiry. After collection, retain its
    actual exit code, process/guard error, quoted stderr and a bounded ordered request-journal
    summary even when l.err was already set. This evidence must reach the first failing Then
    through lifecycleResult and healthy-control errors, not only a later skipped assertion or
    cleanup hook. Put the cause and exit classification before verbose details so T-43's public
    annotation retains them. Read exit/error fields only after done and snapshot recorder entries
