- id: T-38
  type: docs
  title: "Record the egress proxy decision: library, topology, delivery, failure closure and refusal log"
  why: >
    Charter step 1 says the proxy is our own, on Go's standard library with no dependencies, beside
    the worker on an internal network, allowing CONNECT to listed host names on port 443 only, with
    no TLS interception, matching the name the client gave, checking the TLS ClientHello's SNI
    against that name, and logging every refusal. T-39 and T-40 need its design, topology, delivery,
    failure closure and refusal log fixed before any code. The title's "library" is the first of
    those questions, and the answer is none. This entry holds every decision. The implementer writes
    them as one record, docs/decisions/0022-egress-proxy.md (slice-21 holds 0021 on its branch; take
    the next free number), and updates docs/architecture/arc42.md. This is documentation only: no
    code, dependency, scenario, step definition, workflow or engine run. Nothing here is runtime
    evidence or a support claim; real-engine proof belongs to slice-27 and slice-28, in CI. Read the
    charter, the contract's "Runtime and network boundary", "Decisions still open" and acceptance
    matrix, arc42, docs/architecture.md's Slices, then T-39, T-40 and slice-25 to slice-28. PLAN.md,
    README.md and docs/ORCHESTRATING.md still call egress out of scope; the charter's "Specify and
    start step 1 now" governs, and p1-docs-admit-milestone-two-egress owns their edit, so that
    wording is no reason to stop here.

    The proxy is our own code on Go's standard library (the person, q-51): no library, no go.mod
    change, nothing new in THIRD_PARTY_NOTICES.md, and no network service. Its flow, in this order:
    read the CONNECT head; check the name against the allowlist and the port against 443; dial;
    answer 200; peek the ClientHello through crypto/tls; replay the peeked bytes upstream untouched;
    splice both ways; log each refusal as one JSON line. The person's estimate is about 300 lines.
    This is a deliberate exception to the charter's "prefer an existing, maintained library", and
    the charter says so. The record repeats q-51's reasons: the proxy is security-critical and
    small, the libraries either carry MITM machinery (goproxy) or are unmaintained (cproxy), and
    q-49's check needs custom code anyway. If TLS interception is ever wanted, the charter moves the
    proxy to a repository of its own first, and this code seeds it.

    No interception code exists anywhere in the tree. The proxy holds no CA, certificate or key and
    never completes a handshake: its one tls.Config sets GetConfigForClient, which always returns an
    error, so crypto/tls stops once the ClientHello has parsed, before it chooses a version. T-39
    proves this three ways. A contract test has a client verify through the tunnel and see the
    upstream's own certificate. A check finds none of tls.Certificate, tls.LoadX509KeyPair,
    tls.X509KeyPair, tls.Listen, tls.NewListener, tls.Client, GetCertificate or
    x509.CreateCertificate in the production sources under cmd and internal, where no Go file
    mentions crypto/tls or x509 today. And go list -deps of internal/engine/egress's packages shows
    no module but this one and no net/http (measured: crypto/tls, net, io, os and encoding/json do
    not import it). Those checks run only for T-39's own range, so T-39 also adds a depguard rule
    with its fixture, which holds on every later push: production code may import crypto/tls only in
    egress's adapter, and crypto/x509 nowhere. Test fakes generate their upstream's certificate in
    memory, so no key enters a file.

    Rejected. github.com/elazarl/goproxy v1.9.3 (BSD-3-Clause), the maintained candidate with eleven
    tags since 2026-01-17: certs.go's init parses CA_CERT and CA_KEY on import, unconditionally, and
    its MITM path and signer are linked, so "no interception code" could not be said of it. It also
    brings about 3,700 production lines, golang.org/x/net and x/text at versions with OSV
    advisories, acceptance when a handler returns nil, plain-HTTP forwarding and HTTPS_PROXY read
    from the environment. github.com/smarty/cproxy/v2 v2.1.1 (MIT), CONNECT only with no TLS code:
    its last tag is 2024-07-09, its production files are unchanged since v2.1.0 of 2023-06-22, and
    q-49's check would still have needed a guard socket, a replaying connector and one handler per
    request around it. wzshiming/httpproxy v0.6.1 (MIT): one maintainer, a plain-HTTP forwarding
    path and a tunnel that closes both directions at the first EOF. stripe/smokescreen v0.1.0 (MIT):
    purpose-built but with its own ACL engine and roles, Datadog, Prometheus, logrus and a private
    goproxy fork, so neither small nor a fit for a domain that owns the decision.
    caddyserver/forwardproxy: a Caddy plugin with no tagged release.

    The proxy reads the head itself and imports no net/http, a choice q-51's "parse CONNECT" leaves
    open. Nothing of the head is ever forwarded, so no second parser can disagree with it, and all
    that is judged is one literal string against a list. net/http's server would only add what this
    design must then close: ErrorLog lines holding client addresses, recovered handler panics, its
    own 400, 431 and 505 answers, and a parsed URL that hides the target, since it reads
    user:pw@name:443 as userinfo and host, and name:443/x and name:0443 also carry a usable URL.Host
    (each measured). The adapter reads the socket up to the first CRLF CRLF, at most 8 KiB, under a
    10 s read deadline from accept, and every byte after that terminator belongs to the tunnel. The
    domain parses the head as pure code, within its allowlist, so a domain test and the fuzz test
    reach it. The request line is exactly a non-empty method, one space, a non-empty target, one
    space, a version and CRLF, where the version is HTTP/1.1 or HTTP/1.0: curl and Python 3.14 send
    1.1 and openssl s_client sends 1.0 (measured), as Python 3.11's http.client does (read in its
    source). A bare LF or CR in that line is malformed. Headers are skipped unread: never judged,
    logged or forwarded, Host and Proxy-Authorization included.

    A request passes only when its method is exactly CONNECT and its target is exactly a listed name
    followed by :443. Anything else is refused with the first reason that fits, in this order:
    malformed (no complete head, or a request line of any other shape); not-connect (any other
    method, compared exactly, whatever its target); malformed (a CONNECT whose target is not a plain
    host, a colon and a port as the log's rule below defines them); literal-ip (dotted IPv4 or
    bracketed IPv6); not-canonical (its lowercase form without one trailing dot is listed);
    not-listed; and port (the name is listed and the port is not the exact text 443, so name:0443
    and name:80). So GET http://listed.example/path HTTP/1.1, what curl and urllib send for any
    http:// URL once http_proxy is set, reads not-connect, not malformed. These are labels for the
    person: only the exact match admits anything. T-39's domain decides on the name first, so a
    refused name is never resolved and refusals are no DNS channel.

    The contract's address rule stands, since the charter does not change it (AC-12). The adapter
    dials with net.Dialer, network tcp4 and a 10 s timeout, giving the rooted name to the proxy's
    resolver, and checks each address in net.Dialer's Control hook, which sees the address actually
    connected, including CNAME targets and changed answers, with no second lookup. It refuses the
    IANA IPv4 special-purpose registry, including 10/8, 172.16/12, 192.168/16, 127/8, 169.254/16 and
    100.64/10, plus multicast, from a table in the adapter: net/netip is outside the domain
    allowlist, and a table this small needs no library (code.dny.dev/ssrf rejected for that reason).
    An answer mixing valid and refused addresses dials only the valid ones; one with none valid is a
    refusal with reason address. IPv6 is out of this step: both networks have it off, so a listed
    name with only AAAA answers fails as dns. T-39's adapter tests reach their loopback listeners by
    giving its constructor a test resolver and dial function, and test the table directly; porttest
    fakes stay free of I/O, cmd always binds the real ones, and no flag, variable or build tag
    relaxes the table in the product.

    The peek follows q-49, which q-51 takes up. After the 200 the proxy holds the upstream socket
    and moves nothing in either direction until the hello passes, so a server that speaks first
    reaches no client. It sets a 10 s read deadline on the client and runs tls.Server over a shim, a
    small net.Conn whose Read serves the bytes that came after the head, then the socket, recording
    every byte and stopping at 64 KiB, and whose Write discards, because crypto/tls sends an alert
    when the callback aborts (measured: 7 bytes) and a client must get nothing forged by the proxy.
    GetConfigForClient captures ClientHelloInfo's ServerName and Extensions. The domain then judges
    them, in this order: extension 0xfe0d, encrypted_client_hello, is tls-ech; no ServerName is
    tls-no-name; a ServerName other than the CONNECT name, byte for byte, is tls-name. If the
    callback never ran the reason is not-tls, however that happened: bytes that are not TLS, bytes
    that start like TLS and then fail to parse, a truncated hello, a client that closes or stays
    silent to the deadline, or more than 64 KiB. Each refusal writes a record, then closes both
    sockets with no byte forwarded. On a pass the proxy writes every recorded byte upstream
    unchanged, including any beyond the hello, clears the deadline and splices. A failed replay is
    event upstream-failed, reason connect, and closes.

    The splice is two goroutines, each an io.Copy between the raw *net.TCPConn pair, which Go turns
    into splice(2) on Linux. The shim never reaches them and no wrapper type touches the tunnel, so
    nothing can copy around the peek, which has finished before either starts. When one direction
    reaches EOF the proxy calls CloseWrite on the other socket, so half-close carries, and both
    sockets close once both directions have ended or either has failed. There is no idle timeout,
    because agents stream for long periods; the contract's resource limits stay open.

    A scratch spike of this flow ran on loopback under Go 1.27.3, outside the tree: no Docker, so it
    is no runtime evidence, and T-39's tests replace it. curl 8.23.0, Python 3.14's http.client,
    openssl s_client and Go's client each completed a verified handshake with the upstream's own
    certificate through it. A wrong SNI (curl --connect-to included), no SNI, an ECH hello from Go's
    client, plain HTTP, an SSH banner, silence, truncation, unparseable records and 70 KB of
    one-byte records each put 0 bytes upstream and none to the client after the 200, and left one
    record. A hello sent with the CONNECT, split byte by byte, split across two TLS records or
    followed by more bytes reached the upstream exactly as sent. Half-close carried both ways, and
    strace showed splice(2) on a 200,000-byte tunnel. The real resolver through the Control hook
    connected a mixed answer to its valid address, and gave address with none valid, dns for no such
    host and connect for a refused connection.

    T-39 requires fuzz tests for CONNECT parsing and the ClientHello peek (q-51), beside slice-27's
    real-engine scenarios. The proxy is the one process of this project a hostile worker can talk
    to, and it has a route out, so a parser bug there is the boundary failing. There is one target
    over the domain's head parser and one over the adapter's peek, written as
    internal/engine/policy/yaml/fuzz_test.go is, with real hellos among the seeds. The head target
    asserts that nothing panics, that only an exact CONNECT of a listed name on 443 passes, and that
    the method, target and port it would log obey the log's rule below. The peek target asserts that
    nothing panics, that no byte reaches the client, that the recording is a prefix of the input
    within 64 KiB, and that a pass has the exact ServerName and no 0xfe0d. Plain go test only
    replays seeds, which CI's go test ./cmd/... ./internal/... does on every push, and every crash a
    run finds is committed as a seed under testdata/fuzz. So T-39's done_when also runs each target
    with -fuzz for 30 s at -parallel 2 and -fuzzminimizetime=0s, which itos ci run runs for T-39's
    own range. Go's default spends up to 60 s minimizing an interesting input while fuzzing waits:
    from a fresh corpus the spike's peek target did 11,141 executions in its first 3 s and none in
    the other 27 s, against 226,151 in all with the flag, and its head target found 18 new inputs
    against 109 (measured). A crash is still written to the corpus with the flag, just not minimized
    (measured). Thirty seconds of each target found nothing and peaked at 120 MiB a process here and
    159 MiB in the spec review's runs, which is no firm bound, since the cached corpus grows. This
    repository has no nightly tier for fresh runs after that, and this record adds none.

    The code proof measures changed lines with the engine off (arc42's check tiers), so the proxy
    container never starts under it, and its exact Env and lack of a writable mount would stop a
    -cover binary writing counters anyway (reasoned from the design, not run). T-39 therefore covers
    its serve loop with tests over loopback listeners, and slice-27 covers the slice's handler and
    cmd's binding with tests that need no engine.

    The topology has two owned per-session bridge networks. The internal network is created with
    Internal true, EnableIPv6 false and com.docker.network.bridge.gateway_mode_ipv4=isolated. Plain
    internal is not enough: Docker's port-publishing documentation says containers on an internal
    network can reach host services on the bridge address, including those bound to 0.0.0.0, which
    is AC-10's host gateway, and features/offline_isolation_network_test.go binds host listeners on
    just such an address. Isolated mode assigns the bridge no address while containers on it still
    reach each other (moby's TestIsolated), so the worker's closure depends on neither iptables nor
    the proxy. It needs Docker 28.0, API 1.48; the recorded runners are 28.0.4 and 29.4.2. Doctor
    and run refuse an older engine as an unavailable control, and verify after create that the
    network is internal, IPv6-off, isolated and has no IPAM gateway, because old daemons ignore
    unknown options. The egress network is a plain bridge with IPv6 off and only the proxy on it. It
    is owned rather than the default bridge, which other containers share and a daemon may disable;
    Docker's inter-bridge isolation keeps other networks from the proxy's port.

    The proxy joins both networks at create, publishes no port and listens on 3128. Its default
    route comes from the egress network, the only one of the two with a gateway. Its HostConfig sets
    Sysctls net.ipv4.ip_forward=0, verified by inspect before start, so its kernel cannot route
    between the two networks: a new network namespace inherits the host's value, and a Docker host
    runs with forwarding on (measured under unshare -rn: 1 on a host at 1). The worker joins the
    internal network only, with no published port and its existing CapDrop ALL, so it can neither
    craft packets nor change routes. Its environment carries HTTP_PROXY, HTTPS_PROXY and their
    lowercase forms with the proxy's literal internal address, read by inspect after ready, plus
    NO_PROXY and no_proxy set to localhost,127.0.0.1,::1; the manifest already reserves these names
    in any letter case. Without the last two a test suite's local server would go to the proxy,
    since curl and Python's urllib both send localhost through http_proxy (each measured), and each
    such request would count toward the log's cap. Loopback stays inside the worker, so this does
    not touch the boundary. The variables help cooperating clients and are not the boundary: a
    client ignoring them has no route. Docker's embedded resolver at 127.0.0.11 cannot be removed
    from a user-defined network, so the contract's "block embedded Docker DNS" gives way to its
    result, AC-11's no unauthorized resolution path (the coordinator, provisional for the person's
    review, q-50): for a sandbox with only internal endpoints libnetwork starts it with proxyDNS
    false, skips host-loopback servers and sends the rest from the container's own namespace, where
    no route exists (sandbox_dns_unix.go and resolver.go). Clients need no DNS, since the proxy
    resolves. slice-27's AC-11 scenario must prove this on the real engine; if it cannot, the
    topology reopens. Offline runs keep NetworkMode none, with no proxy or network.

    For delivery, the proxy container runs the host's own itos-container executable, at its resolved
    os.Executable path, bind-mounted read-only at /itos-container as that container's only mount,
    through a hidden __egress-proxy command. That command is a slice of its own,
    internal/slices/egressproxy, which slice-27 creates with only a command package: a thin handler
    over the engine's port, with cmd binding the adapter. An owner needs no empty domain or port
    directory, and a command cannot import net, so listener, dial, peek and splice stay in
    internal/engine/egress's adapter, which is T-39's "entrypoint". The hidden __complete, which cmd
    handles itself, is no precedent: arc42's cmd row exempts only version and completion
    infrastructure, and this is a long-running network server. No image is built, published or
    pulled by a command, no second artifact ships, and a scenario exercises the proxy of its own
    commit. The root filesystem is inert:
    docker.io/library/busybox@sha256:5624bb6777cf469b1fb50ae3f981b15d2715ee2fffaf20b9998cfb7843726835,
    T-20's pinned image, which the engine job already pulls. Docker needs some image; nothing in
    this one runs. It is a product constant that neither policy nor manifest can change, because the
    contract says the manifest cannot configure or replace the trusted proxy. The person pulls it as
    they pull the worker's image, so this project distributes none of its GPL-2.0 content; doctor
    names the exact pull when it is absent, commands only inspect it, and approval binds the digest,
    so changing it needs a new approval. slice-26 names the network-granting profile. The executable
    must be a static Linux amd64 ELF, and doctor and run refuse anything else (debug/elf behind a
    port). .goreleaser.yaml already builds with CGO_ENABLED=0. features/features_test.go does not,
    and its build measured dynamically linked here; p1-acceptance-static-binary makes the harness
    build what the release ships, and slice-27 depends on it. Rejected: the worker image as root
    filesystem, which puts a checkout-requested image and its ENV under the trusted proxy; a
    published proxy image, which adds a registry service (the charter's stop) and a digest-in-source
    cycle; importing an image at run, which the contract's "no automatic pull/build path" bars.

    The proxy stays out of the worker's reach. The worker's mounts remain exactly the checkout and
    tmpfs, as VerifyRun already enforces; the two containers share no volume or namespace; the
    worker has no engine access; and run refuses an executable whose resolved path lies inside the
    checkout, which a worker could replace for the next session (slice-20's scan already refuses
    hard links there). The proxy runs as the effective host UID/GID like the worker, with read-only
    root, CapDrop ALL, no-new-privileges, pids limit 4096, restart policy no, no tmpfs, and no
    checkout, state volume or socket. The frozen allowlist is its Cmd, its Env is exact, and both
    are verified by inspect before start, so nothing the worker does can change them and a restart
    cannot widen them.

    Failure closure has no fallback network: nothing reconnects the worker, changes its network or
    restarts the proxy. Creation order is the anchor as today, internal network, egress network,
    proxy, verify, start, ready, then the worker as today, with durable intent before each. The
    checkout's pin, its socket scan and the anchor stay first, so a refused checkout starts no
    proxy; the scan's known race (q-30) only grows by the proxy's start. Ready is one record, event
    ready, that the proxy prints on stdout only after validating the list and listening; the
    controller reads it with bounded log calls inside run's existing 120 s startup budget. A missing
    ready, a proxy exit or an unverifiable resource means no worker is created. Policy is compiled
    into the same process, so the contract's addon-failure window does not arise: an invalid list
    exits nonzero before the listener opens. The proxy recovers no panic, so a panic in any
    goroutine ends the process, and an Accept error or a failed log write ends it too; each is the
    same closure. During a run the controller also waits on the proxy, and its exit is a typed
    failure: the worker gets the existing termination (first signal, 10 s from cancellation,
    SIGKILL), an observed exit keeps its precedence and run returns nonzero. With the proxy gone the
    worker has no peer. Under A3 a lost controller leaves both running under the frozen list until
    stop, with no watchdog and no new route.

    Teardown reverses creation: worker, stop the proxy and confirm it has exited, refusal-log copy,
    remove the proxy, egress network, internal network, then the anchor. The copy waits for that
    exit because a record reaches the json-file asynchronously, through a pipe to dockerd's log
    copier, so a log read of a running proxy could miss a workload's last refusal and removing the
    proxy would then lose it for good. Docker waits for that path only when a container exits:
    handleContainerExit in moby's daemon/monitor.go waits up to 2 s for the streams and up to 10 s
    for the copier before it marks the container stopped (read at v27.5.1 and v28.5.2, not run). The
    stop is SIGKILL, then the engine's not-running wait and a fresh inspection, as for the worker's
    exit: each record is one write with nothing buffered in the process, so the kill loses none, and
    a proxy that has already exited goes straight to the copy. This stop is the controller's own act
    once the worker is gone, not the typed proxy failure, so it changes neither the run's result nor
    its exit code. A failed step retains its recovery record and exact retry. Removal is authorized
    as arc42's protocol has it, by durable intent with a random name before each create and then the
    inspected full ID, recorded before any instruction, never by labels or names alone (T-40).

    The refusal log is one JSON object per line on the proxy's stdout, at most 2 KiB: schema 1, time
    (RFC 3339 UTC) and event, which is one of ready, refused, upstream-failed or log-full. A refused
    or upstream-failed record adds method, target, port and reason; ready and log-full add nothing.
    A refused record's reason is one of not-listed, literal-ip, port, not-canonical, not-connect,
    malformed, address, not-tls, tls-name, tls-no-name, tls-ech, and an upstream-failed record's is
    dns or connect. Method is written only when it is one to 16 ASCII uppercase letters. Target and
    port are written only when the text before the request target's last colon is a non-empty plain
    host, at most 255 bytes of ASCII letters, digits, hyphen, underscore and dot or a bracketed IPv6
    literal, and the text after it is one to 5 digits; otherwise both are omitted. A request line of
    any other shape writes none of the three. So secret-token@listed.example:443,
    a/b?token=secret:443, listed.example:443/path?token=secret and
    http://listed.example/path?token=secret write neither target nor port, though net.SplitHostPort
    accepts all four (measured), and slice-28's AC-36 marker scenario uses these forms. Never
    written: URL path or query, userinfo, headers, Proxy-Authorization, bodies, tunnel bytes, the
    hello's SNI, client address or Go error text. Every way a head can fail leaves one malformed
    record, a partial head and a deadline expiry included; a connection closed before its first byte
    asked for nothing and leaves none. An allowed tunnel writes no record. Each record is one write,
    made before the client is answered, and a failed write ends the process, because a refusal that
    cannot be recorded must stop the session.

    A refusal decided before the 200 answers HTTP/1.1 403 Forbidden, an address refusal included. A
    DNS or connect failure on a listed name is event upstream-failed, reason dns or connect,
    answered HTTP/1.1 502 Bad Gateway, so the status and the log both tell policy from failure. Both
    answers carry Content-Length: 0 and Connection: close with no body, and the proxy then closes.
    The tunnel's answer is HTTP/1.1 200 Connection Established. Handshake refusals come after that
    200, so they close the connection with no answer.

    The log lands in two places. During the run it is the proxy's json-file log (max-size 64m,
    max-file 1), which survives controller loss. At teardown, after stopping the proxy and before
    removing it, the controller copies every record but ready, fsynced and mode 0600, to
    sessions/<lookup>/<id>/egress-refusals.jsonl under the protected state root. Publish in
    internal/engine/approval/disk/storage.go refuses more than 1 MiB, which this log can exceed, so
    slice-28 adds a streaming writer with the same private-file, fsync, rename and parent-fsync
    rules. A failed copy keeps the stopped proxy, its log and its recovery record, so stop retries
    and nothing is lost. Cleanup never deletes that file; status names it and its count, and display
    escapes a hostile name as approval's does (slice-28). The proxy stops after 20,000 refused or
    upstream-failed records, writing one log-full record and exiting nonzero, which the run treats
    as a proxy failure. Every refusal stays recorded, and a hostile workload can end its own session
    but cannot rotate away its earlier attempts, since a session's records, each at most 2 KiB, stay
    under the 64m cap even after Docker's escaping. That bounds one session at about 40 MiB of host
    disk. Retention across sessions stays open (p3-session-state-retention): completed sessions are
    not garbage-collected (features/recovery.feature), so these files accumulate with them.

    Handshake guarantee (q-49): the proxy reads the ClientHello without terminating TLS or holding a
    key or CA, which the charter's "no TLS interception" permits, and T-39's "opaque tunnelling"
    means opaque after that hello. The guarantee to disclose in approve, status and
    docs/security.md: the proxy verifies the CONNECT name and the first ClientHello's SNI. It cannot
    see the HTTP Host inside TLS or anything after that hello, a second hello after a
    HelloRetryRequest included, so fronting remains a limit, as does a hello the upstream's TLS
    stack reads differently from crypto/tls, and it cannot stop data sent to an allowed service.
    Clients that omit SNI or send ECH, Chromium's GREASE included, and SSH over 443 are refused
    until a later mode names them. That Codex and Claude Code send SNI without ECH is not yet known:
    the person's smoke check confirms it, since no scenario uses a real harness. The disclosure has
    owners: slice-26 puts it in approve's presentation, and slice-27 puts it in status and edits
    docs/security.md, which p1-docs-admit-milestone-two-egress does not cover. This settles the
    contract's "Which passthrough handshake guarantees can be enforced".

    From the contract's "Decisions still open" this record settles the concrete guard/proxy topology
    and its fail-closed handling, and for the guard only its versions, digests, provenance and
    acquisition. Worker versions, final destinations, resource limits and the platform matrix stay
    open. It does not settle who may approve a sandbox that grants network, which stays with
    p3-approval-before-egress; the record says so, so that no one reads it as settled. q-49 began as
    the coordinator's provisional answer, and the person's q-51 and the charter have since taken up
    its check, so the record treats it as settled. q-50 stays provisional for the person's review,
    and the record says that too. The record lists each contract passage it supersedes or defers, so
    the person can edit the contract: the Agreed scope's Proxy row (mitmdump) and TLS row
    (inspection per destination), which give way to the charter by the person's 2026-11-09 choice;
    its Images row, for the proxy only; its Mounts row's "do not bind-mount additional host paths"
    and the "Not included" list's "extra host-directory mounts", which must now read as the
    worker's, since the proxy has one read-only executable mount; its Platforms row, since delivery
    needs the host's own static Linux amd64 ELF, so the darwin, windows and arm64 builds in
    .goreleaser.yaml cannot run egress this way, which the charter's "Not yet" allows for now, and a
    later platform needs another delivery; "The precise guard/worker network topology is a blocking
    experiment" with Experiments item 1 (mitmdump), since this record settles the topology from
    reading and a loopback spike and leaves its proof to slice-27; the sentence "block embedded
    Docker DNS" (q-50); and the HTTPS inspection and SSH tunnel modes with AC-15, AC-19 and AC-20,
    deferred.

    The record also says which of these rest on an answered question and which it decides itself.
    The Proxy and TLS rows rest on q-51 and the DNS sentence on q-50. The Images and Mounts
    readings, the two-network topology and the delivery have no question behind them, though the
    charter's stop rule names contract changes and "Decisions still open". The coordinator told the
    drafter to finish, and slice-27 must prove the topology and delivery on the real engine, so the
    work goes on, but the record marks all of these as its own decisions for the person to confirm
    or overturn.

    Scenarios need no product seam. In the engine job the harness creates its own bridge network
    with a subnet outside the refused table (for example 11.22.33.0/24) and a fake TLS endpoint on
    it whose network alias equals a listed name, then connects the running proxy container to that
    network, so the proxy's embedded resolver answers the alias. A second network with a private
    subnet and alias proves the address refusal. The workload waits on a checkout sentinel until the
    harness has connected. No flag, variable or build tag enters the product; this is the charter's
    "fake endpoint the proxy allows in tests".

    In arc42, Constraints keeps offline's limits, names this record for the egress profile, and
    names q-51's exception beside its rule on dependencies. Context and scope replaces "Proxy
    egress, guard/proxy infrastructure" and "Do not create a guard, proxy or session network" with
    egress's status. Building-block view adds internal/engine/egress (proposed, T-39, importing no
    other engine), internal/slices/egressproxy (proposed, slice-27) and session's networks and proxy
    (proposed, T-40). The work-item table adds T-38 to T-40 and slice-25 to slice-28. Runtime view
    adds a subsection headed ### Egress run with the order and failure closure. Deployment view adds
    the proxy and both networks and confines NetworkMode none to offline runs. Cross-cutting
    concepts adds the refusal log and, under dependencies, q-51's exception. Decisions links the
    record. Quality requirements maps AC-09 to AC-14, AC-16 to AC-18, AC-23 and AC-36 to slice-27
    and slice-28, marked unproven. Risks replaces the topology and handshake rows with pointers to
    the record, leaving TLS interception deferred. Use the record's exact terms for the isolated
    mode, the hidden command and the log file. Keep the twelve headings and all offline text that
    still holds; label everything proposed. The record names these sections as the ones it updates,
    under the charter's drift rule.

    The drafter changes only this entry. The implementer changes only the record and arc42, in docs
    commits with Task T-38 as T-26's implementation was, and leaves the registry and sibling specs
    alone, reporting a conflict rather than resolving it. T-39's, T-40's, slice-26's, slice-27's and
    slice-28's drafters take these decisions from the record, including our own proxy and its fuzz
    tests, the crypto/tls depguard rule, the second network, the forwarding sysctl, NO_PROXY, the
    address check, the hello peek, the egressproxy slice, the inert image, the static harness build,
    the stop before the log copy, the streaming log writer and the handshake disclosure, all of
    which their whys predate.

    Both checks read only those two documents, with grep, and declare prose: true, because on a
    prose-only range CI leaves out any other late check and itos work done never runs one. Their
    anchors are words the decisions above force, compared with whitespace flattened so line wrapping
    cannot fail them; semantic review judges the rest. The first fails today at ls, because no
    record exists. The second fails on its first anchor, internal/engine/egress.
- id: T-39
  type: chore
  title: A CONNECT proxy engine package that allows only listed names on port 443 and logs every refusal
  why: >
    Charter step 1's proxy, built once as engine code under internal/engine/egress. It is the one
    process of this project a hostile worker can talk to, and it has a route out, so a bug in it is
    the boundary failing. docs/decisions/0022-egress-proxy.md ("the record", T-38) is its design and
    binds this task: read it whole, with the charter, docs/architecture.md's Slices and arc42's
    egress rows. This entry repeats each rule T-39 builds to, settles what the record left to T-39,
    and names the four places it corrects the record, which T-39 amends. If they differ anywhere
    else, stop and say so. It adds no CLI behaviour: slice-27 writes the hidden command and binds
    the adapter in cmd, and T-40 owns the containers. It runs no Docker, adds no scenario and
    changes neither go.mod nor THIRD_PARTY_NOTICES.md. Nothing here is runtime evidence or a support
    claim.

    The entry this replaces predates the record. q-51 removed its library: the proxy is our own code
    on Go's standard library, with no dependency and no network service, the deliberate exception
    the charter and the record explain. Its type was feat, and a feat commit must name live
    scenarios, which this task has none of: itos commit check-message refuses feat with Task: T-39
    and Upgrading: none ("feat commits need a Scenarios: @ID-… footer") and accepts chore with Task:
    T-39 (both run). T-39 gives a user nothing to feel until slice-27, so its type is chore. It
    stays a task with checks, not a slice.

    Four packages, laid out as Slices says. internal/engine/egress/port holds the contract values,
    within the domain allowlist: Proxy, whose Serve(ctx context.Context, names []string) error is
    what slice-27's thin handler calls; Log, whose Write(line []byte) (int, error) *os.File
    satisfies, so the port needs no io and slice-27 binds os.Stdout; Failure, a string type with
    Error(), whose values ListInvalid, ListenFailed, AcceptFailed, LogFailed and LogExhausted hold
    no Go error text, because the handler may print them; and the event, reason, record and hello
    values. internal/engine/egress/domain is the pure decision, importing only its port: the
    allowlist, the head, the hello, the limits (HeadLimit 8,192, HelloLimit 65,536, LogLimit 20,000)
    and the numbering of records. Its head and hello verdicts refuse at their zero value, so a stub
    or a forgotten branch fails closed: a pass is a field of its own, never an empty reason.
    internal/engine/egress/port/porttest holds an in-memory log, a Proxy fake and ProxyContract,
    with no I/O. internal/engine/egress/tcp is the adapter and T-39's "entrypoint": tcp.New(log
    port.Log) *Proxy, with listener, dial, peek and splice. Binding names, because slice-27, the
    checks or the fixtures read them: those four paths, Proxy, Log, the five Failure values,
    tcp.New, ProxyContract, the three depguard rules and every test this entry names. Any other name
    here only describes.

    The head. The domain's parser takes what the adapter read and finds the first CRLF CRLF itself,
    within the first 8,192 bytes; a terminator ending at exactly byte 8,192 counts. With no
    terminator there the reason is malformed with no method, target or port, so a partial head, an
    oversized head and empty input read alike. Every byte after the terminator belongs to the
    tunnel, and the verdict says where they start. The request line is exactly a non-empty method,
    one space, a non-empty target, one space, HTTP/1.1 or HTTP/1.0, and CRLF. A bare CR or LF in it
    is malformed, and a line of any other shape writes none of the three. Headers are skipped
    unread: never judged, logged or forwarded, Host and Proxy-Authorization included. A request
    passes only when its method is exactly CONNECT and its target is exactly a listed name followed
    by :443. Anything else is refused with the first reason that fits, in this order: malformed
    (above); not-connect (any other method, whatever its target); malformed (a CONNECT whose target
    is not a plain host, a colon and a port); literal-ip; not-canonical; not-listed; port (the name
    is listed and the port is not the exact text 443, so name:0443 and name:80).

    T-39 settles the words the record leaves loose. The target is split at its last colon. The port
    is one to 5 digits. A plain host is one to 255 bytes, the record's non-empty plain host, either
    ASCII letters, digits, hyphen, underscore and dot, or a bracketed IPv6 literal, which here is [,
    one or more hex digits, colons and dots, and ], checked no further because it only earns a
    label, so []:443 and [fe80::1%25eth0]:443 are malformed. Dotted IPv4 is exactly four
    dot-separated runs of digits with no range check, so 1234:443 and 1.2.3:443 read not-listed,
    where the spike said literal-ip (T-38 review, P3 d). A name not exactly listed reads
    not-canonical when its strings.ToLower with one trailing dot removed is listed. These are labels
    for the person: only the exact match admits anything. A verdict keeps a method only when it is
    one to 16 ASCII uppercase letters, and a target and port only when both fit the rule above, so
    secret-token@listed.example:443, a/b?token=secret:443, listed.example:443/path?token=secret and
    http://listed.example/path?token=secret, the forms slice-28's AC-36 scenario uses, keep neither.

    T-39 canonicalises nothing and calls no IDNA library or port. A triage note
    (2026-11-09T13:55:50Z) asked it to canonicalise the client's name through slice-25's Names port
    in internal/engine/policy/idna, because that adapter alone refuses a final xn--. This entry
    declines: the record admits only the exact match, byte for byte, and has egress import no other
    engine, and q-51 allows no dependency. The confusion that note guards against needs a library
    that maps spellings, and none runs here: listed.example.xn--:443 is compared as written and
    reads not-listed, a Unicode spelling is no plain host and reads malformed, and case or one
    trailing dot only choose the label. So T-39 does not depend on slice-25. A list that is not
    already canonical is refused, never mapped. The list is valid when it is non-empty, names
    nothing twice, and each name has at least two labels, each label 1 to 63 bytes of a-z, 0-9 and
    hyphen, at most 253 bytes in all, no trailing dot, and a final label that is neither all digits
    nor 0x with only hex digits. That is the shape slice-25's canonicalHost returns
    (internal/engine/policy/domain/allowlist.go on its branch), written again because of the import
    rule, so every list policy produces passes, and a later drift fails closed at run.

    The hello. The domain judges what the peek captured, in this order: a callback that never ran is
    not-tls, however that happened; extension 0xfe0d is tls-ech; no ServerName is tls-no-name; a
    ServerName other than the CONNECT name, byte for byte, is tls-name. Only 0xfe0d is refused, as
    the record says. A hello with the older ECH code points 0xfe0a or 0xffce and the exact SNI
    passes (T-38 review, P3 a): no upstream is known to honour them, fronting is already disclosed,
    and widening the refused set is a security decision this task does not take.
    TestOlderECHCodePointsPass pins it, and the record's handshake guarantee gains the sentence, the
    fourth correction. crypto/tls refuses a malformed non-empty 0xfe0d before the callback, which
    reads not-tls, and an empty one reads tls-ech (both measured). Only the label differs: both are
    refused.

    The log. One JSON object per line, at most 2 KiB, one write per record, its fields in this order
    with each empty one left out: schema (the number 1), seq, time (RFC 3339 UTC, to the second),
    event, method, target, port (a string, so 0443 keeps its zero), reason. For example
    {"schema":1,"seq":2,"time":"2026-11-09T12:00:00Z","event":"refused","method":"CONNECT","target":"other.example","port":"443","reason":"not-listed"}.
    T-40 and slice-28 read this format. The events are ready, always seq 1; refused, with reason
    not-listed, literal-ip, port, not-canonical, not-connect, malformed, address, not-tls, tls-name,
    tls-no-name or tls-ech; upstream-failed, with reason dns or connect; and log-full. ready and
    log-full add nothing. A pure domain type numbers the records and counts the limit: the 20,000th
    refused or upstream-failed record is followed by one log-full, so those two are seq 20,001 and
    20,002. The adapter encodes with encoding/json and writes under one mutex, so seq is the order
    of the writes. Never written: URL path or query, userinfo, headers, Proxy-Authorization, bodies,
    tunnel bytes, the hello's SNI, client address or Go error text. An allowed tunnel writes no
    record.

    Serve, in order. Validate the list, else ListInvalid with nothing opened. Listen on
    0.0.0.0:3128, tcp4, else ListenFailed. Write ready, else LogFailed. Then accept, one goroutine
    per connection, until ctx ends (nil), AcceptTCP fails (AcceptFailed), a record's write fails
    (LogFailed) or log-full is written (LogExhausted). Before returning it stops the log, closes the
    listener and every socket it holds and waits for its goroutines, so no record follows its return
    and a test leaks nothing. The record's stop is SIGKILL, so nothing in the product need end ctx.
    Egress's production code holds no recover: a panic in any goroutine ends the process, the same
    closure. After a failed write or the limit, no further record is written and the connection that
    hit it gets no answer, because the process is ending.

    One connection, in the record's order. Set a 10 s read deadline from accept, once, so a byte a
    second cannot extend it, and read up to the terminator, over as many reads as it takes and at
    most 8,192 bytes in all, looking for it in everything read so far. A read error with no byte
    read leaves no record unless it is the deadline (os.ErrDeadlineExceeded), whether the client
    closed or reset: both asked for nothing. That settles the T-38 review's P3 c, since the spike
    spared only io.EOF and wrote malformed for a reset (measured here). Judge. A refusal writes its
    record, answers 403 and closes, and its name is never resolved or dialled, so refusals are no
    DNS channel. Dial: an address refusal is a refused record and 403; dns or connect is an
    upstream-failed record and 502. Answer 200. From here the proxy holds the upstream socket and
    moves nothing in either direction until the hello passes, so a server that speaks first reaches
    no client. Set a fresh 10 s read deadline and peek. A refusal writes its record and closes both
    sockets, with no answer and no byte forwarded. On a pass, clear the deadline, write upstream the
    recorded bytes and then any unserved bytes from after the head, and splice. A failed replay
    writes upstream-failed, reason connect, and closes. A failed write of an answer is ignored, with
    no branch of its own: after the 200 the peek then reads the dead socket and records not-tls, as
    the record's "a client that closes" says. Each record is written before the client is answered.
    The answers, exactly: HTTP/1.1 200 Connection Established with nothing else; HTTP/1.1 403
    Forbidden and HTTP/1.1 502 Bad Gateway, each with Content-Length: 0 and Connection: close and no
    body.

    First correction. The record says a pass writes every recorded byte upstream. That misses bytes
    read with the head which crypto/tls never asked for: they are never recorded, and the splice
    reads only the socket. On a throwaway build forwarding only the recording, CONNECT, Go's
    1,518-byte hello and a trailer in one write gave the upstream 2,048 bytes of 2,118 at 600 bytes
    and 2,048 of 7,518 at 6,000 (measured, as the T-38 review did). Nothing crosses the boundary,
    since only the sender's own stream breaks, but the record's "every byte after that terminator
    belongs to the tunnel" must hold.

    The peek. Its one tls.Config sets GetConfigForClient and nothing else. The callback captures
    ServerName and Extensions and always returns an error, so crypto/tls stops once the hello has
    parsed, before it chooses a version. tls.Server runs over a shim, a net.Conn whose Read serves
    the bytes after the head, then the socket, recording every byte and stopping at exactly 65,536,
    and whose Write discards, because crypto/tls sends a 7-byte alert when the callback aborts and a
    client must get nothing forged by the proxy. Embedding the client's net.Conn gives the shim its
    other methods with no line to cover. The splice is two goroutines, each an io.Copy between the
    raw *net.TCPConn pair, which Go turns into splice(2) on Linux; the shim never reaches them. EOF
    in one direction calls CloseWrite on the other socket, an error closes both at once, and both
    close when both directions have ended. There is no idle timeout, because agents stream for long
    periods; the contract's resource limits stay open.

    The dial. A net.Dialer with Timeout 10 s, the proxy's Resolver and a Control hook, network tcp4,
    address the rooted name and :443. The hook sees the address actually connected, CNAME targets
    and changed answers included, with no second lookup, and refuses any address in the table and
    any text that does not parse as an IPv4 address and port. A mixed answer dials only its valid
    addresses. IPv6 is out of this step: under tcp4 a listed name with only AAAA answers fails as
    dns. A failed dial is classified in the record's four steps, in order: an error holding a
    *net.DNSError is dns; the dial's atomic passed flag set is connect; its refused flag set is
    address; neither is connect. The table, in the adapter on net/netip, is the IANA IPv4
    special-purpose registry (read 2026-11-09, last updated 2025-10-09) plus multicast, with the
    registry's narrower rows inside these: 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8,
    169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.31.196.0/24, 192.52.193.0/24,
    192.88.99.0/24, 192.168.0.0/16, 192.175.48.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24,
    224.0.0.0/4 and 240.0.0.0/4.

    Seams. tcp.New takes the log alone and fills an unexported settings struct with every real
    value: the address, the three 10 s waits, net.DefaultResolver, the real listen and dial
    functions and LogLimit. So cmd always binds the real ones, and no exported field, flag, variable
    or build tag can relax anything. Lint's gosec reports G102 for the literal 0.0.0.0:3128 passed
    straight to net.Listen (measured in the spec review). Listening on every interface is Serve's
    rule above, because the proxy is told no address of its own and Docker's inter-bridge isolation
    keeps other networks from its port (the record): the address reaches Listen through those
    settings, and wherever gosec still reports it, a //nolint:gosec naming G102 and that reason, as
    approval/disk's private.go names G302, is the fix, never another address. In-package tests build
    through an unexported constructor taking those settings, which is the record's test resolver and
    dial function and the dial timeout a test can shorten (triage note, 14:42:54Z). The dial seam is
    func(ctx context.Context, d *net.Dialer, address string) (*net.TCPConn, error) and receives the
    dialer the adapter built. That lets the mixed-answer tests send no packet, as the T-38 PR review
    asked, since a VPN or route answering 11.22.33.44 would otherwise fail them: the test's dial
    wraps d.Control so the adapter's own hook judges each address first, and for one it passes the
    wrapper returns an error, on which net stops before connect(2). Go's real Dialer and resolver
    and the real table all still run, and the valid address still passes the table, as the record
    requires. Tests fake DNS with a UDP socket on 127.0.0.1 behind net.Resolver{PreferGo: true,
    Dial: …}. The fake encodes its answers by hand, a header, the query's question and fixed A or
    AAAA records, in about 30 lines of encoding/binary (measured), because
    golang.org/x/net/dns/dnsmessage, the maintained library for it, is a module go.mod does not
    hold, and the standard library's copy is internal. Go's resolver sorts an answer by RFC 6724
    before dialling: 10.0.0.1, 127.0.0.1 was tried 127.0.0.1 first (measured), and an address with
    no route moves last (read in net/addrselect.go, rule 1). So a test asserts no dial order across
    scopes. Both orders of the mixed answer still give connect on any machine, and a test that needs
    an order uses one scope, 127.0.0.2 then 127.0.0.1.

    Tests, over in-process listeners with no Docker and no external binary. Only a test about a
    deadline sets that deadline short; every other wait is 30 s or more, so a loaded runner cannot
    turn a slow read into another reason. Upstream certificates are generated in memory, so no key
    enters a file. The contract goes to port/porttest only where it does no I/O; the record's
    contract test with a verifying client belongs in the adapter's _test.go, because porttest does
    no I/O and depguard refuses it crypto/tls (T-38 review, P3 b). Tests write each limit and wait
    they check as its literal value, never the code's constant, so a wrong constant, or a stub's
    zero one, fails at an assertion. Test files keep to 600 lines and errcheck, as lint holds them.

    In port, TestFailureText holds each value's Error(). In porttest, TestProxyContract runs
    ProxyContract on the fake, and TestProxyContractCatchesFaults shows through a recording reporter
    that the contract fails faulty proxies, as count's contract_test.go does. ProxyContract holds: a
    valid list writes exactly one ready record (schema 1, seq 1, RFC 3339 UTC time, event ready,
    nothing more, a final newline), Serve stays in until ctx ends and returns nil, and nothing
    follows; each invalid list (nil, empty, LISTED.example, listed.example., 127.0.0.1, a repeated
    name) returns ListInvalid with no record; a failing log returns LogFailed. Its fixture follows
    policy's SourceFixture: an adapter consumes the names and the log, and the fake, which validates
    nothing because a port-side package may not import the domain, takes the failure it should
    return. The fake records the names it was given and writes the same ready record, for slice-27's
    handler tests.

    In the domain. TestJudge's table holds every reason; each AC-36 form; both versions; the order
    cases LISTED.example:80 (not-canonical), other.example:80 (not-listed) and 127.0.0.1:80
    (literal-ip); 1234:443, 1.2.3:443, listed.example..:443, listed.example.xn--:443, which a prefix
    match would pass, and a.listed.example:443 and xlisted.example:443, which a suffix match would
    (not-listed); [::1]:443 (literal-ip); []:443, a zone and a Unicode spelling (malformed); an
    empty host and an empty port, :443 and listed.example: (malformed, with the method and no target
    or port); lower-case connect (not-connect, a target and port but no method); 16- and 17-letter
    methods; 255- and 256-byte hosts; 5- and 6-digit ports; a bare CR, a bare LF, a double space, a
    trailing space, HTTP/1.2 and an HTTP/2 preface. TestJudgeHeadLimit holds 8,192 and 8,193 bytes
    and that the first of two terminators says where the tunnel starts. TestAllowlist holds each
    edge of the list rule, including 253 and 254 bytes, 63 and 64 bytes and a final 0x7f.
    TestJudgeHello holds the order and byte-for-byte comparison. TestLog holds seq from 1, UTC, the
    fields kept and the limit at 20,000. TestLimits holds the three constants.

    In the adapter. TestAdapterContract runs ProxyContract over a loopback listener.
    TestNewBindsTheRealOnes holds what New fills. TestVerifiedThroughTheTunnel has Go's client
    verify against a pool holding only the upstream's in-memory certificate, see that leaf in
    PeerCertificates and read the upstream's bytes, with no record written. TestRefusedHeads drives
    real sockets: not-listed, port, not-connect with a marker in the URL and Proxy-Authorization,
    malformed with a marker in userinfo and in a path, exactly 8,192 bytes with no terminator (no
    more, so the close is no reset racing the answer), a bare LF and a partial head then close each
    answer exactly the 403, leave one record whose bytes match the format and hold no marker, and
    never call the dial seam. TestEmptyConnections holds no record after a close and after a reset
    (SetLinger(0)) before the first byte, and one malformed record and a 403 for silence to the
    deadline, a partial head then silence, and a trickle of one byte every quarter of a short
    deadline for four deadlines, which that deadline must cut off because it is set once.
    TestRefusedHellos holds wrong SNI, upper-case SNI, no SNI, ECH from Go's client, an empty
    0xfe0d, a malformed 0xfe0d, plain HTTP, an SSH banner, silence to the deadline, truncation then
    silence, truncation then close, close with no bytes, a record that starts like TLS and fails to
    parse, 70 KB of one-byte records, and a hello trickled one byte every quarter of a short
    deadline for four deadlines, which the peek's one deadline must cut off: each gives the client
    no byte after the 200, the upstream no byte and a closed socket, and leaves one record with
    method, target and port and no SNI text. TestOlderECHCodePointsPass forwards both hellos whole.
    TestShimLimit feeds a handshake message claiming 65,000 bytes in one-byte records and holds the
    recording at exactly 65,536 bytes, with the next Read refused. TestReplay holds the exact bytes
    upstream for head, hello and a trailer of 0, 37, 600 and 6,000 bytes in one write, a hello split
    byte by byte and one over two TLS records; a head in two writes 100 ms apart, cut inside its
    CRLF CRLF after the CR LF CR, under a head deadline of 120 s, longer than the test's 30 s wait,
    whose client gets the 200 and whose hello, sent after it, reaches the upstream exactly; the
    deadline cleared on a pass, by sending the hello with the head, so the peek reads no socket,
    then writing past a short deadline; and a failed replay, from a dial seam returning a closed
    socket. Every other complete head arrives in one write, which loopback hands over in one Read,
    so without the split head an adapter that took one Read for the head would pass every test,
    though it refuses as malformed a head split across segments, as a long Proxy-Authorization can
    be, and so would one that searched only its latest read for the terminator, though it answers
    only at the deadline, which the 120 s makes fail the test's wait. Loopback gave the two writes
    as reads of 64 and 1 bytes (measured, five runs). TestSplice holds half-close each way, a server
    that speaks first reaching the client only after the hello passes, and a reset on one side
    closing the other. TestDialClassification holds, with the wrapper above, both orders of 10.0.0.1
    and 11.22.33.44 and 11.22.33.44 alone (connect); none valid (address); no such host, an empty
    answer, a name with only an AAAA record and a resolver that never replies under a short timeout
    (dns), the AAAA answer pinning tcp4, since under tcp the hook sees that address and refuses it
    as address (measured); a refused connection to a closed loopback port with the hook removed
    (connect, step four); 127.0.0.2 then 127.0.0.1 connecting to a loopback listener while the
    wrapper shows the hook 11.22.33.44 for it, after the hook refused 127.0.0.2; the rooted name;
    and through Serve the event and answer for address, dns and connect. TestRefusedAddressTable
    holds the first and last address of every row, the address on each side of it (11.22.33.44 too),
    and refused text that does not parse, IPv6 included. TestServeFailures holds an invalid list
    never calling listen, a failed listen, a closed listener (AcceptFailed, no record), a failing
    write (LogFailed, no answer) and a limit of 2. TestLogFullUnderLoad has 50 concurrent refused
    clients at a limit of 5 leave exactly ready, five records and log-full, and LogExhausted.
    TestRecordBeforeAnswer uses a log that blocks, and no answer arrives until its write returns.
    TestConcurrentRecords has 50 concurrent refused clients leave seq 1 to 51 in write order, one
    line each. TestLongestRecord holds a 16-letter method, a 255-byte host and a 5-digit port within
    2,048 bytes. TestContextEndsTunnels ends a live tunnel with ctx, and Serve returns nil.

    No interception code exists in the tree, proved the record's three ways, with the second changed
    in form (second correction). TestVerifiedThroughTheTunnel is the first. The record's second is a
    search for names, which cannot stand: a correct peek writes tls.ClientHelloInfo, so grep -F
    tls.Client matches it (T-38 review, P2), and a ledger check leaves the ledger when work done
    closes the task (triage note, 11:55:55Z). So TestNoInterceptionCode, an ordinary Go test in the
    adapter, parses with go/parser every .go file under cmd and internal that is neither a _test.go
    file nor under testdata, files go would ignore on the runner included, and refuses: any
    crypto/x509 import, sub-packages included; any crypto/tls import outside
    internal/engine/egress/tcp and the folders below it, egress-tls's rule; any rename of
    crypto/tls; and in a file importing it, any tls.<name> selector but Config, ClientHelloInfo and
    Server, which refuses tls.Certificate, tls.LoadX509KeyPair, tls.X509KeyPair, tls.Listen,
    tls.NewListener and tls.Client by identifier, and any key but GetConfigForClient in a tls.Config
    literal, which refuses GetCertificate. It compares the qualifier, since session's Docker adapter
    writes container.Config literals (measured). In a file importing net/http it also refuses any
    selector named ListenAndServeTLS or ServeTLS, whatever its qualifier, since they terminate TLS
    from certificate and key files with no crypto/tls import, and in any file an import of
    net/http/httptest, whose NewTLSServer and StartTLS serve a built-in certificate. None of these
    is in a production file today, where only readiness's and session's Docker adapters import
    net/http (measured). It reads the files go ignores because depguard cannot: on Linux go list
    builds 169 of today's 174 production files and ignores five OS-specific ones, approval/disk's
    calls_windows.go and private_other.go, manifest/disk's and policy/disk's open_windows.go and
    session/disk's anchor_other.go (measured), and the pinned golangci-lint 2.14.0 lints no ignored
    file (the spec review measured an os import in an engine domain's probe_windows.go: no depguard
    issue on Linux, one under GOOS=windows). So egress-tls and egress-x509 miss crypto/tls or
    crypto/x509 in a _windows.go file under cmd, which the Windows release still compiles, and on
    every push only this walk catches it. It first proves itself on a table of offending sources,
    one for each form it refuses, and fails unless it read at least 100 files, among them at least
    one under cmd and one under internal/engine/egress/tcp: 174 exist today but only 2 under cmd, so
    a walk rooted at internal alone would pass a bare count. It holds on every later push because
    CI's go test ./cmd/... ./internal/... and the platform job run it. The third way stays a check:
    go list -deps of egress's packages shows no module but this one and no net/http (measured).

    TestNoRelaxingCode holds the rest of "no flag, variable or build tag" and "recovers no panic"
    the same way, over egress's own production sources: every .go file under internal/engine/egress
    that is neither a _test.go file nor under testdata, files go would ignore included. It refuses a
    comment line that go/build/constraint's IsGoBuild or IsPlusBuild reports, so a constraint in
    either form; a file that go/build's Context.MatchFile does not match for each target
    .goreleaser.yaml builds, linux and darwin on amd64 and arm64 and windows on amd64, so a name
    such as table_darwin.go or table_amd64.go and one go ignores, such as _table.go; any rename of
    os or syscall; in a file importing os, any os selector but ErrDeadlineExceeded, which refuses
    Args, a flag read without the flag package egress-imports refuses, and Getenv, LookupEnv,
    Environ, Open and ReadFile; in a file importing syscall, any syscall selector but RawConn, the
    Control hook's type, which refuses syscall.Getenv and syscall.Open; any GOOS selector, whatever
    its qualifier; and any recover call. So neither a build tag nor a file name can make egress
    differ by platform, and neither os.Args, an environment variable nor a file can feed it a
    setting. It fails unless it read at least one production file in each of domain, port,
    port/porttest and tcp, because a walk rooted wrongly, at tcp alone say, would otherwise pass,
    and table_windows.go's red run below proves only that tcp is read. It needs both of its first
    two rules: MatchFile refuses // +build ignore, _windows.go on linux and _amd64.go on arm64, but
    matches //go:build !relaxed for all five targets, though a build with -tags relaxed would drop
    that file (measured under Go 1.27.3). os stays in egress-imports for os.ErrDeadlineExceeded,
    which errors.Is matches exactly where net.Error's Timeout is broader.

    Three depguard rules hold the imports on every later push, in .golangci.yml, each lax or strict
    as written. egress-tls is lax, files **/cmd/**, **/internal/**, !$test and
    !**/internal/engine/egress/tcp/**, denying crypto/tls. egress-x509 is lax, files **/cmd/**,
    **/internal/** and !$test, denying crypto/x509. egress-imports is strict, files
    **/internal/engine/egress/** and !$test, allowing bytes, context, crypto/tls, encoding/json,
    errors, fmt, io, maps, net, net/netip, os, slices, sort, strconv, strings, sync, sync/atomic,
    syscall, time, unicode, each exact with its trailing $, and the owner's prefix
    github.com/donvargax/itos-container/internal/engine/egress/, so net/http, flag, a library or
    another engine needs a reviewed change. The third goes beyond the record's two, because the
    adapter's own rule allows any standard package or engine API and the go list check leaves with
    the task. Each fixture is appended to tools/testdata/architecture/cases.json with a Name
    starting egress-. Kind allow, with Rule naming the rule it passes: crypto/tls in tcp/probe.go,
    tcp/nested/probe.go and tcp/probe_test.go; crypto/x509 and crypto/x509/pkix in
    tcp/probe_test.go; crypto/tls and crypto/x509 in internal/engine/session/docker/probe_test.go;
    $module/internal/engine/egress/domain in tcp/probe.go. Kind lint, with Rule as given: crypto/tls
    in internal/engine/egress/domain/probe.go (domain,egress-tls),
    internal/engine/egress/port/probe.go (port,egress-tls), and with egress-tls alone in
    internal/engine/egress/port/porttest/probe.go, internal/engine/egress/tcpx/probe.go,
    internal/engine/session/docker/probe.go, internal/slices/fresh/command/probe.go,
    internal/cli/probe.go and cmd/probe/probe.go; crypto/x509 and crypto/x509/pkix in tcp/probe.go
    (egress-imports,egress-x509); crypto/x509 in internal/engine/session/docker/probe.go and
    cmd/probe/probe.go (egress-x509); net/http, flag, golang.org/x/term and
    $module/internal/engine/policy/domain in tcp/probe.go (egress-imports). That is 24 probes, with
    tcp/ short for internal/engine/egress/tcp/.

    Fuzz tests, q-51's requirement, written as internal/engine/policy/yaml/fuzz_test.go is.
    FuzzHead, in the domain, takes arbitrary bytes and holds them to an oracle of its own, regular
    expressions in the test rather than the domain's helpers, which could not catch themselves:
    nothing panics; a pass happens exactly when the input begins with CONNECT, a listed name, :443,
    one space, HTTP/1.1 or HTTP/1.0 and CRLF and its first terminator ends within 8,192 bytes; a
    pass's tunnel offset follows that terminator; and method, target and port obey the log's rule.
    Its seeds are TestJudge's heads, passes among them. FuzzPeek, in the adapter, takes bytes and a
    cut, giving up to 8,192 bytes as the bytes after the head and the rest to a scripted client
    socket: nothing panics; no byte reaches the client; the recording is a prefix of the input
    within 65,536 bytes; a pass has the exact ServerName and no 0xfe0d. Third correction: a pass
    also forwards the whole input, its recording, its unserved bytes and what the socket still holds
    together equalling the input, because the record's assertions cannot catch the first
    correction's loss, a recording being a prefix either way. Its seeds are real hellos from Go's
    client, captured in memory over net.Pipe at seed time, with the exact SNI, another SNI, no SNI
    and ECH, an exact-SNI hello with a 6,000-byte trailer, and both code-point extensions, beside
    empty input, plain HTTP and a truncated record. No curl or openssl capture enters the tree: Go's
    client's hellos are real, the parser is crypto/tls's either way, and an opaque blob would
    explain nothing. Plain go test replays the seeds on every push. Each target also runs with -fuzz
    for 30 s at -parallel 2 and -fuzzminimizetime 0s in done_when, for T-39's own range, the flag
    and its reason as the record has them, and every crash found is committed as a seed under
    testdata/fuzz. A nightly tier stays p2-scheduled-fuzz-egress-parser's. The race check likewise
    runs once, for this range, because the adapter is where this project's concurrency meets a
    hostile client and its tests take seconds; go test -race runs only over egress's packages, never
    ./features.

