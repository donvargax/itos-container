    failures or an empty selection are not red proof. The expected-red run stays failed and is
    never merged; the original item branch retains its @wip tags until implementation. Later
    remove those tags on the item branch and require green CI at its actual implemented head.
    The loop alone publishes/dispatches/observes these runs; agents commit and stop. This spec
    creates no evidence branch and makes no claim that the later scenarios have run.

    Implementation paths are .github/workflows/ci.yml, tools/bin/engine-fixture,
