    Beyond the checks, run once: golangci-lint over the module through its hook,
    tools/bin/architecture-check, tools/bin/domain-coverage, which holds session's domain to 80%,
    and the whole non-engine feature suite once without -race, since the run, status, stop and
    recovery scenarios drive this engine through the binary and their offline events must not
    change. The code proof measures changed lines with the engine off and samples mutants in changed
