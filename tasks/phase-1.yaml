        PY
    - run: |
        python3 - <<'PY'
        from pathlib import Path
        import subprocess
        expected = [
            'tools/bin/release-version/main.go', 'tools/bin/release-version/main_test.go',
            'tools/bin/release-notes/main.go', 'tools/bin/release-notes/main_test.go',
            'tools/bin/release-notes/cliff.toml',
        ]
        missing = [path for path in expected if not Path(path).is_file()]
        assert not missing, 'missing release helpers: ' + ', '.join(missing)
        command = ['go', 'test', './tools/bin/release-version']
        listed = subprocess.run(command + ['-list', '^TestReleaseHistory$'], check=True, text=True, capture_output=True)
        assert 'TestReleaseHistory' in listed.stdout.splitlines(), 'release-history test selection is empty'
        subprocess.run(['go', 'test', './tools/bin/release-version', './tools/bin/release-notes', './internal/release/...', '-count=1'], check=True)
        PY
    - run: |
        version=$(tools/bin/pinned git-cliff --version) &&
        test "$version" = 'git-cliff 2.14.2' &&
        python3 - <<'PY'
        import subprocess
        command = ['go', 'test', './tools/pinned']
        listed = subprocess.run(command + ['-list', '^TestGitCliffPin$'], check=True, text=True, capture_output=True)
        assert 'TestGitCliffPin' in listed.stdout.splitlines(), 'git-cliff pin test selection is empty'
        subprocess.run(command + ['-run', '^(TestGitCliffPin|TestPinnedDownload|TestPinnedAssetRedirect)$', '-count=1'], check=True)
        PY
    - run: |
        python3 - <<'PY'
        from pathlib import Path
        import re, shutil, subprocess, tempfile
        root = Path.cwd()
        assert (root / 'tools/bin/release-version/main.go').is_file(), 'missing version program for dry run'
        assert (root / 'tools/bin/release-notes/main.go').is_file(), 'missing notes program for dry run'
        def run(args, cwd=root):
            return subprocess.run(args, cwd=cwd, check=True, text=True, stdout=subprocess.PIPE).stdout
        def state(cwd):
            return tuple(run(['git', *args], cwd) for args in (
                ['rev-parse', 'HEAD'], ['for-each-ref', '--format=%(refname) %(objectname)'],
                ['status', '--porcelain', '--untracked-files=all'], ['diff', '--binary', 'HEAD']))
        before = state(root)
        candidate = run(['go', 'run', './tools/bin/release-version'])
        fields = dict(line.split('=', 1) for line in candidate.splitlines())
        assert len(candidate.splitlines()) == 4 and set(fields) == {'last', 'next', 'bump', 'range'}, candidate
        if not fields['last']:
            assert candidate == 'last=\nnext=0.1.0\nbump=minor\nrange=HEAD\n', candidate
        else:
            assert fields['range'] == fields['last'] + '..HEAD', candidate
        print('Candidate HEAD ' + before[0].strip())
        print(candidate, end='')
        cliff = Path(run(['tools/bin/pinned', '--path', 'git-cliff']).strip()).resolve()
        with tempfile.TemporaryDirectory(prefix='T-25-release-') as temporary:
            temp = Path(temporary)
            version, notes = temp / 'release-version', temp / 'release-notes'
            run(['go', 'build', '-o', str(version), './tools/bin/release-version'])
            run(['go', 'build', '-o', str(notes), './tools/bin/release-notes'])
            repo = temp / 'history'
            run(['git', 'clone', '--quiet', '--no-hardlinks', '--no-tags', str(root), str(repo)])
            assert run(['git', 'rev-parse', 'HEAD'], repo) == before[0], 'scratch clone is not the candidate HEAD'
            assert run(['git', 'rev-parse', '--is-shallow-repository'], repo).strip() == 'false', 'scratch history is shallow'
            assert not run(['git', 'tag', '--list'], repo).strip(), 'scratch history contains tags'
            for name in ('tools/bin/pinned', 'tools/bin/release-notes/cliff.toml'):
                destination = repo / name
                destination.parent.mkdir(parents=True, exist_ok=True)
                shutil.copy2(root / name, destination)
            cached = repo / '.tools/git-cliff-2.14.2/git-cliff'
            cached.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(cliff, cached)
            snapshot = state(repo)
            output = run([str(version)], repo)
            assert output == 'last=\nnext=0.1.0\nbump=minor\nrange=HEAD\n', output
            bootstrap = dict(line.split('=', 1) for line in output.splitlines())
            notes_args = [str(notes), '-version', bootstrap['next'], '-from', bootstrap['last'],
                          '-itos', shutil.which('itos') or 'itos']
            rendered = run(notes_args, repo)
            for text in ('# itos-container 0.1.0\n', '## What changed', '## Upgrading',
                         '`itos-container --version`', '-R donvargax/itos-container'):
                assert text in rendered, 'release notes lack ' + text
            changed = rendered.split('## What changed\n', 1)[1].split('## Upgrading\n', 1)[0]
            linked = set(re.findall(r'https://github\.com/donvargax/itos-container/commit/([0-9a-f]{40})', changed))
            expected = set(run(['git', 'rev-list', bootstrap['range']], repo).splitlines())
            assert linked == expected, f'notes commit range differs: missing={expected - linked}, extra={linked - expected}'
            assert 'https://github.com/donvargax/itos-template/commit/' not in rendered, 'notes still link template commits'
            assert state(repo) == snapshot, 'dry run changed scratch HEAD, refs or working files'
            run(['git', '-c', 'tag.gpgSign=false', 'tag', 'v' + bootstrap['next'], 'HEAD'], repo)
            tagged = state(repo)
            assert run(notes_args, repo) == rendered, 'local release tag changed bootstrap notes or their range'
            assert state(repo) == tagged, 'notes changed the tagged fixture HEAD, refs or working files'
            print(output, end='')
            print('Both release programs ran; notes match before and after the fixture tag; helpers changed no refs.')
        assert state(root) == before, 'dry run changed source HEAD, refs or working files'
        PY
