  title: The Engine failure diagnostics step prints each failed scenario's godog step error and annotates it
  why: >
    Job logs return 403 without a token and agents have no gh, so a red engine job shows only
    'Process completed with exit code 1' and a goroutine dump from `tail -100`. In
    .github/workflows/ci.yml, make the step print each `--- FAIL` block with its godog step error.
    Also emit one `::error title=<scenario>` annotation per failed scenario or go-test failure line,
    so the coordinator can tell an unchanged flake from a new failure on a re-run, which the two
    attempts at 0a1d85c could not show. Annotations are public: read without a token on 2026-11-09,
    e2faafd's failed engine job (check run 129190393996) returns its annotations, whose only failure
    text is that exit-code line, and 403 for its log. This is project-side and does not wait for the
    itos summary-extractor fix tracked upstream. Runs 42609794543 and 42626087465 are further
    instances of the unreadable message: LIFECYCLE-09's assertion stays unread until a red run after
    this lands, and T-44 adds its signal and SIGKILL offsets to the same output. A log artifact itos
    can fetch is no separate upstream item, as that fix is already tracked. Cover it in the existing
    TestEngineDiagnostics, which runs the workflow shell against disposable fixtures. Broken down
    from p1-engine-suite-under-its-limit-again.

    Record for the next re-run: anchors.feature:410 (ANCHORS-09, exit 75, cleanup 409) failed on
    e2faafd, at the step 'Then status identifies the original running session', still line 410
    today. The next unchanged re-run can show whether ANCHORS-09 or ANCHORS-10 repeat. A repeat on
    its own would justify a separate item for a possible real race in anchor cleanup; the one
    failure, in a run where LIFECYCLE-09 rows #02 and #03 also failed, does not.

    What a red log holds, captured for this spec by running failing memory-only scenarios through
    runFeatureScenarios with TestFeatures's godog options and the step's flags, on go1.27.3 and
    godog v0.16.0. Under -test.v, go test streams t.Errorf where it happens, so every `--- FAIL:`
    line at the end of the log is bare: that is the empty `go-test TestFeatures/...#03:` body of run
    42626087465. A scenario's error reaches the log up to three times. `pretty` prints it at its
    step, in bold red with its later lines at their original indent. Then comes go test's
    `    suite.go:640: <first line>` block, with further lines indented eight spaces, beneath the
    last `=== RUN` or `=== NAME` line, which names its test: the one copy that says whose it is.
    `pretty` prints it again under `--- Failed steps:` when the suite completes. So what an error
    quotes can stand at column 0: features/offline_anchor_assertions_test.go:159 and
    features/sockets_run_test.go:101 quote raw stderr with `%s`, where a later line can be a panic,
    and features/lifecycle_local_steps_test.go:49 quotes nested -test.v output, though in non-engine
    steps only today. `=== NAME` matters: LIFECYCLE-13's step can fail after LIFECYCLE-09's nested
    rows ran. A timeout prints no `--- FAIL:` line at all, only the blocks so far and then `panic:
    test timed out after 4m0s` and a tab-indented `running tests:` list naming the scenario in
    flight. A real `panic: ` or `fatal error: ` ends the process: a panicking test prints its `---
    FAIL:` lines before it, and only a goroutine dump follows, as seen on subtest, top-level,
    goroutine, cleanup and double panics, a nil dereference and a misused mutex. godog's `--- Failed
    steps:` summary cannot stand in, as it omits undefined and pending steps and a timeout never
    reaches it. So the report below pairs each failure with its block itself; -test.v and the rest
    of engineInvocation stay.

    The rule. A new executable tools/bin/engine-failure-report <log>, in bash like
    tools/bin/engine-fixture, reads the log once into an ordered list of failures, each a title and
    a text.

    Only the run's own lines steer it, so that a quoted line is plain text. The run's test is the
    one the log's first `=== RUN` line names, as both invocations select exactly one. Its own lines
    are a column-0 `=== RUN   <name>` or `=== NAME  <name>` and a `--- FAIL: <name> (<time>)` at any
    indent, each naming that test or a subtest of it, and a block start, `<file>.go:<line>: ` after
    exactly four spaces. A block belongs to the test named by the last own `=== RUN` or `=== NAME`,
    and goes on through the lines right after it that are indented eight spaces. A line of only
    eight spaces is one of them and becomes an empty line of the block's text, never its end: it is
    how go test prints a blank line of an error, and quoted stderr holds them, as a Go panic dump
    has one after its first line. Go test prints three spaces after `=== RUN`, two after `=== NAME`
    and four before a block's file; `itos work show` collapses such runs, so read these literals in
    tasks/phase-1.yaml itself. Every line of the log counts, a last one with no newline after it
    included, as a kill can leave one. A block start is tried before a failure line, whatever its
    first line quotes: `nested go test said --- FAIL: TestX (0.00s)` has its block, and the block's
    later lines are its text, never lines of the run, so a quoted failure line among them marks
    nothing. The script reads in the C locale (`export LC_ALL=C`), so that it works on bytes: in a
    UTF-8 locale, this host's en_US.UTF-8 or C.UTF-8, a pattern's `.` matches no invalid byte
    sequence, and the `%s` errors above quote raw stderr, which can put one on a block's first
    line, so that no block starts and its scenario goes unnamed in a timeout's log and loses its
    text in a completed run's.

    The list, in order. First, so that the cap below never hides a timeout's list, each `panic: ` or
    `fatal error: ` line at column 0 with no own line anywhere after it: title `go test`, text that
    line and the tab-indented lines after it, less one tab. A quoted one has its block or the run's
    `=== NAME` after it, unless the run dies first, when it is reported as one more `go test`, which
    is accepted. Then each failed scenario, in the order the log first shows it failed: title its
    go-test name as printed (`TestFeatures/<name>#NN`), text its last `suite.go` block without
    location or indents, or `no error text in the log`. A scenario, a subtest of the run's test, has
    failed when the log holds its `--- FAIL:` line or a `suite.go` block beneath it, the second for
    the timeout. One whose step failed while its After hook was still running at the timeout has
    neither, and its error is nowhere in the log: godog runs those hooks before `pretty` prints the
    step (suite.go:189 and 220) and reports the error to the subtest only after them (suite.go:640).
    Then only the `go test` annotation's `running tests:` list names it, which is accepted. No step
    here uses godog.T, so another file's block beneath a scenario can only be a quote. A quote
    steers only where it reproduces an own line itself, as a quoted `suite.go` block start would:
    nested godog -test.v output holds one at four spaces, and the summary's echo of it would start a
    block beneath whichever scenario ran last, marking that one failed or replacing its text. No
    engine step quotes such output today, so that is accepted. Then, only if no scenario failed and
    the run's test has a `--- FAIL:` line: title that name, text its last block of any file or `no
    error text in the log`, as TestFeatures logs its excluded scenarios first
    (features/features_test.go:74) and fails last. When a scenario did fail, its `a scenario failed`
    adds nothing and would take a slot. Last, only if the log has no go-test failure line, meaning
    no `panic: ` or `fatal error: ` line counted above and no `--- FAIL:` line of the run's test:
    title `Engine scenarios`, text `the log holds no go-test failure line; its last line: <last
    non-blank line>`, where a blank line holds nothing but spaces and tabs, or, when every line is
    blank or there is none, `the log holds no go-test failure line; it is blank`. That is what a
    kill, a caught signal, a capture failure or a passing run over the 180 s shard budget leave.
    For the last, how long the step took is in the Engine scenarios step's own `engine step timing:`
    line, which this report does not read: annotating it would change that step and
    TestEngineSuiteBudget, and is not this item's work. A missing log file gives one failure,
    title `Engine scenarios`,
    text `no test log: the test binary never ran`, for a failed preflight, preparation or
    compilation.

    Each text keeps only its first 4096 bytes, in the C locale: for ASCII the 4096 characters that
    are all the runner keeps of a message, and for other text no more than it keeps; the log above
    it holds the rest. That bound is what keeps the report's time linear in the log. A long error is
    reachable, as offlineBuffer (features/offline_runtime_fixture_test.go:122) has no cap and the
    `%s` errors above quote it, and bash is quadratic when it substitutes across a long string:
    `${s//%/%25}` on one 3.6 MB error took 10.8 s in the C locale and 145 s in C.UTF-8, and the spec
    review's own report took 63.5 s on such an error, while the same substitution line by line took
    0.2 to 0.3 s in either. Cutting first leaves no such string, however the text was built.

    It prints, first, one `::error title=<title>::<text>` line per failure, with no file or line
    property, escaped as the runner unescapes (ActionCommand.cs in actions/runner; escapeData and
    escapeProperty in @actions/core): in both, `%`, CR and LF become `%25`, `%0D` and `%0A`; in the
