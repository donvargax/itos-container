# Project-local tasks are added with itos task add, starting at T-1.
- id: T-1
  type: ci
  title: Establish the generated seed as the commit tracking boundary
  why: >
    The generated seed predates this project ledger and has no Task footer. Start project commit
    checks after that exact seed while retaining checks for the pilot draft and every later commit.
    Do not rewrite history, claim inherited proof or relax any gate.
  done_when:
    - run: test "$(itos config get commits.since)" = "23b8ce15410ec9431f5a1fe39a973d9cf0a3d8de" && git merge-base --is-ancestor 23b8ce15410ec9431f5a1fe39a973d9cf0a3d8de HEAD
    - run: itos config check
- id: T-2
  type: style
  title: Format the inherited release test fixture
  why: >
    The first full CI run failed because the release test fixture map is not gofmt-aligned. Change
    only whitespace in internal/release/releasetest/releasetest.go; preserve all fixture contents
    and behavior, and retain the existing formatting gate.
  done_when:
    - run: test -z "$(gofmt -l internal/release/releasetest/releasetest.go)"
- id: T-3
  type: ci
  title: "Finish the move to itos 8: the by-hand steps of itos upgrade 7.0.0-rc.1 to 8.45.3"
  why: >
    itos upgrade moved the pin and itos.yaml to 8.45.3 and rewrote AGENTS.md's itos block
    (2026-11-03), and itos config check passes. Left by hand, from its report: the itos action in
    .github/workflows/ci.yml and release.yml still pins v7.0.0-rc.1's commit; the CI plan's code
    proof moved from work done into ci run (proof.code, record its results before pushing); numbered
    work add, task add and work promote mint their IDs; a plain itos push no longer pushes tags (use
    --tag; check the release workflow); itos refuses --no-verify, commit -a and git add -A; check
    every step itos config check and ci plan name. Run itos upgrade 8.45.3 again to reprint the
    list; it is idempotent. From Copilot's review of PR #2 (2026-11-04):
    .github/workflows/ci.yml:36-38 and release.yml:81-83 still pin the v7.0.0-rc.1 itos action and
    install the 6.0.0 launcher through their version overrides; docs/upgrading.md asks for the
    repository pin and the action to move together. Move both action references to 8.45.3's commit
    and update or drop the overrides.
  done_when:
    - run: "rtk proxy sh -ec 'itos config check; itos ci plan --whole; for f in .github/workflows/ci.yml .github/workflows/release.yml; do grep -Eq \"uses: donvargax/itos@[0-9a-f]{40} # v8[.]45[.]3$\" \"$f\"; done; ! grep -Eq \"version:[[:space:]]+6[.]0[.]0\" .github/workflows/ci.yml .github/workflows/release.yml'"
- id: T-4
  type: build
  title: tools/bin/pinned runs the current itos-cc, not 0.5.0
  why: >
    tools/bin/pinned pins itos-cc 0.5.0 (2026-11-03); the latest release is 0.47.2. CI's mutation
    sample and proof.code's mutation check run through it, so the project's code proof runs a tool
    forty-odd releases behind, without its narrower test runs and fixes. Move the pin and its five
    checksums to the current release, read itos-cc's release notes for changed flags or config
    (itos-cc.yaml), and keep the proof green.
  done_when:
    - run: rtk proxy tools/bin/pinned itos-cc mutation sample --count 10
