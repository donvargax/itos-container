    100 lines as tail prints them. It writes each record line with engineTiming.write, so that a
    change to the streamed form fails here.

    Its subtests. `timeout`: `=== RUN   TestFeatures`, a godog line, a line holding a NUL and a
    0xff byte, then, between godog lines, the records of @ID-RUN-01 at 1999999999 ns,
    @ID-OVERLAP-03 at 35.2 s, @ID-LIFECYCLE-09 at 12.3 s holding the cut row's `signals` below,
    @ID-LIFECYCLE-13 at 128.41 s and @ID-ANCHORS-09 at 35.2 s, then `panic: test timed out after
    4m0s`, its tab-indented `running tests:` list, a blank line and 120 goroutine headers, so that
    the last 100 lines hold no record. Its section is the header with 5, then LIFECYCLE-13 at
    128.410 s, OVERLAP-03 and then ANCHORS-09 at 35.200 s, LIFECYCLE-09 at 12.300 s and RUN-01 at
    1.999 s, which pins truncation, each right-aligned as the format prints it. `record cut by a
    kill`: the RUN-01 and OVERLAP-03 records, then a last line `engine scenario timing:
    {"feature":"lifecycle.feature","id":"@ID-LIFE` with no newline after it. Its section is the
    header with 3, OVERLAP-03, RUN-01 and the cut line at 0.000 s, and the output ends without a
    newline, as the log does. `no records`: `=== RUN   TestFeatures`, `--- FAIL: TestFeatures
    (0.00s)` and `FAIL`, giving the header with 0 and no line under it. `no log`: nothing after the
    memory marker.

    TestEngineScenarioTiming gains t.Run("LIFECYCLE-09 rows carry their signal offsets"). It clears
    GOCOVERDIR and ITOS_CC_TEST_COVERDIR with t.Setenv, as features/cover_test.go:27 does, since the
    real world's Before hook would otherwise make a coverage directory per ID in the proof's root.
    It runs runFeatureScenarios at the engine tier, the selection from timingSelection(t, fixture,
    true), with an initializer that calls the real initializeScenario(sc, t.TempDir(), "unused"),
    none of whose steps runs here, and registers three steps of its own: `the escalation journal
    "<name>"`, which sets w.lifecycle to a copy of one built before the run; `the row passes`; and
    `the row fails`, which returns an error. No real step matches those texts. The fixture is an
    @engine feature with an @ID-LIFECYCLE-09 outline whose rows are immediate, delayed, cut after
    the check, no signal request, never signalled and no journal, the third failing at its second
    step, and an @ID-LIFECYCLE-08 scenario with the immediate journal. The journals are
    lifecycleWindowWorld's, each given newLifecycleFaults("ignore", "", its delay) as fault, so that the world's
    closeLifecycleNative runs: immediate is the case 'immediate at the grace' with SIGINT at 0
    percent; delayed is 'delayed slow teardown' and cut after the check is 'delayed acknowledgement
    cut a call limit after the daemon check', each with SIGTERM at 60 percent; no signal request is
    immediate without its signal requests; never signalled is immediate with only signalled
    cleared, preserving its requests; no journal is immediate with only journalAtReturn cleared,
    preserving its signal time. These last two independently pin both reasons to omit signals.
    Decode each record into the test's own type with DisallowUnknownFields, as timingRecords does, with
    `signals` a json.RawMessage, which tells absent from null and [] and pins the order, and
