    appear at the new head, settle them with tests or demonstrated equivalence under these same
    rules, never by redrawing the sample or relaxing a gate. Uncovered changed lines need tests.

    Add TestDecodeRejectsSelfConsistentInvalidProfile and
    TestDecodeRejectsSelfConsistentInvalidEngineOS in
    internal/engine/approval/canonical/json_test.go. Start each from porttest.Ready and a valid
    non-root UID/GID candidate with generation 1. Include a valid round-trip control. Change
    only settings.profile to other in the first case and settings.engine.os to windows in the
