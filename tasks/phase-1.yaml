    whitespace-separated complete scenario tags for expected-red evidence. Pass it as the
    step-local ITOS_CONTAINER_RED_SCENARIOS environment variable to Engine scenarios and to the
    Tests steps of platform-macos and platform-windows, using the expression
    ${{ github.event_name == 'workflow_dispatch' && inputs.red_scenarios || '' }}.
