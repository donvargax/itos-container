- id: T-44
  type: test
  title: The Engine failure diagnostics step prints the slowest engine scenario timings, with LIFECYCLE-09's signal offsets
  why: >
    The same step must show where the engine tier's 4-minute budget goes, so the slowdown after T-41
    (2 min 49 s, then 3 min 44 s, then 4 min 5 s on main) can be located from a red run's output.
    Print the last `engine scenario timing:` records, or the slowest examples sorted, instead of
    only `tail -100`. Add LIFECYCLE-09's per-row signal and SIGKILL offsets to the same `engine
    scenario timing:` output. They show how close real calls come to T-33's 1 s call budget, and
    they inform review of T-42's limits. In features/README.md, say that a goroutine blocked a
    minute or more is labelled with its minutes in a timeout dump. Keep the limit at 4 minutes and
    the engine harness's syscall tracer as it is. Leave the diagnostics step's failure-block
    printing to p1-engine-diagnostics-failures, now T-43. Both items edit the one step in ci.yml,
    so whichever lands second rebases on the other. Broken down from
    p1-engine-suite-under-its-limit-again.

    The coordinator decided, 2026-11-09 15:18 UTC: the promoted check, go test ./features -count=1
    -run '^(TestEngineDiagnostics|TestEngineScenarioTiming)$', already passes on main before any
    work, since both tests exist today, so as written the task would close with nothing done. This
    entry replaces it with checks that fail on today's main and pass only once the work is in.

    The section. Inside the step's `if [[ -f "$RUNNER_TEMP/slice-11-features.log" ]]` block and
    before `tail -100`, print `Engine scenario timing records, slowest first: <N>`, N being the
    number of the log's lines that begin `engine scenario timing: `, then one line for each of
    them: its duration, as `%4d.%03d s ` prints the whole seconds and the milliseconds of the
    line's first `"duration_ns":<digits>`, truncated, then the line's text after that prefix,
    unchanged. Slowest first; equal durations keep their order in the log; a line with no
    `"duration_ns":<digits>`, as a killed run can leave its last, counts as zero. All of them, not
    the last few: a timeout's run is the rows that finished plus the one in flight, and only the
    whole list shows which rows took the time. Read the log as text whatever it holds: a NUL byte,
    or invalid UTF-8 under a UTF-8 locale, makes plain grep print `binary file matches` in place of
    the lines, and quoted workload output can hold either, so use grep -a or a bash read loop. With
    no log there is no section, as there is no tail, and the step still exits 0. Use bash, grep,
    sort and the like, no awk or jq: the agents' host has only gawk and its own jq, and
    ubuntu-latest's may differ, so only CI would catch a difference, the reason T-43 wrote its
    report in bash. It is a few lines, so it stays inline in the step, and
    engineFailureDiagnostics in features/engine_workflow_test.go, which TestEngineWorkflow and
    TestEngineFixtureWorkflow compare with the step's text, gains the same lines.

    T-43's spec, committed on its branch at 79d2974, puts `timeout 40
    tools/bin/engine-failure-report "$RUNNER_TEMP/slice-11-features.log"` straight after `set +e`,
    keeps the kernel messages, `free -m` and `tail -100` after it unchanged, and leaves what becomes
    of the tail to this item. The tail stays, and stays last: T-43's tests assert that the log's
    last non-blank line ends the step's output, which this placement keeps true whichever item
    lands first. T-43's report already prints a timeout's `panic: test timed out` line with its
    `running tests:` list, which names the row in flight, the one row with no record yet, so this
    section prints records only. The second item to land rebases the step,
    engineFailureDiagnostics and the README sentence on the first, and runs the step through the
    first's test helper rather than adding a second one.

    The offsets. The `engine scenario timing:` record of a row whose ID is @ID-LIFECYCLE-09, and of
    no other row, gains `signals`: one object per request of the row's collected journal
    (lifecycleNative.journalAtReturn, the journal lifecycleSignals judges) that
    lifecycleSignalRequest selects, in journal order, holding in this order `signal`, the request's
    `signal` query value, empty when it has none; `at_ns`, its arrival; `replied_ns`, its reply,
    absent when Replied is zero; `status`, the journaled status; `cancelled`, the journal's
    Cancelled; and `previous_ns` and `next_ns`, the arrival of the journal's request just before it
    and just after it, each absent at the journal's end. Each offset is in nanoseconds after the
    harness signalled the controller (lifecycleNative.signalled), the cancellation T-42's limits
    count from. A reader can then set SIGKILL's at_ns against the 1 s to 3 s window, an immediate
    row's 1.8 s and a delayed row's first at_ns plus 1.6 s; the first signal's reply, or its cut,
    against the 600 ms hold; and that signal's call, which starts after previous_ns, the daemon
    check in recoverySignal's order, and ends at its reply or, when cut, just before next_ns,
    against the 1 s call budget, which is how heldAcknowledgement reads a cut. `signals` is absent
    when the row never signalled the controller or collected no journal, as an aborted row that
    never reached its signal, and `[]` when the journal holds no signal request, as a product that
    sent none leaves it.

    The offsets are taken whatever the row's outcome: a failing row is the one whose offsets
    matter, and godog skips the steps after a failure. initializeScenario's After hook
    (features/steps_test.go:72) computes them from w.lifecycle before it resets the world, and
    hands them on through the context godog passes to the After hooks registered after it, so the
    timing collector's hook in runScenarios (features/features_test.go:372) writes them. No other
    field, record or tier changes: other rows' records keep their five fields, and the ordinary
    tier writes none.

    The words, in features/README.md. The failure-only step's sentence (line 280) says the step
    prints the timing records slowest first before the last 100 lines. The records paragraph (line
    308), which says records contain only five fields, gives LIFECYCLE-09's `signals`, its fields
    and their origin. The sentence on TestEngineScenarioTiming (line 319) adds the subtest below
    and TestEngineFailureTimings. And a note on reading a timeout's goroutine dump: a goroutine
    waiting a minute or more can carry its whole minutes in its header, as in `goroutine 8 [chan
    receive, 1 minutes]:`, Go writing `minutes` for one as well. The note says the label is
    approximate, as a scratch test measured on go1.27.3 for this spec. The runtime stamps a waiting
    goroutine only when a garbage collection's marking finds it, and with the time the collection
    before began its mark termination: runtime/mgcmark.go:275 copies work.tstart, which gcMark
    (runtime/mgc.go:1976) sets only after marking. So a 35-second wait seen by the process's second
    collection showed `1 minutes`, and a goroutine that waited 70 s with only the first collection
    behind it had no label at all. In a 4-minute engine run collections are frequent, so a long
    wait is labelled, give or take the time between two of them.

    What stays: the Engine scenarios step and engineInvocation, with the 4-minute test timeout and
    the 240 s step budget, which TestEngineDiagnostics, in the first check as a guard, and
    TestEngineSuiteBudget hold; the syscall tracer in features/recovery_trace_test.go; T-43's
    report; and every existing assertion of TestEngineScenarioTiming.

    TestEngineFailureTimings, in a new features/engine_failure_timings_test.go, takes the host OS as
    a value and skips off Linux, as testEngineDiagnostics does. It runs the real step text read
    from ci.yml as T-43's cases do: bash -euo pipefail -c under a 5 s context, with cmd.Dir `..`,
