    0, SIGTERM 0, SIGINT 60 and SIGTERM 60 percent, in that order. Each row is a subtest named
    <signal>_<percent> holding every case of its class below, immediate at 0 percent and delayed at
    60, so the 32 cases make 64 subtests (21 and 42 when first committed; the eleven added cases are
    the abandoned and cut holds below). Nothing reads the process environment, builds the product or reaches
    an engine.

    Each case calls the real w.lifecycleSignals(true) on a journal it writes. Its world holds a
    doctorWorld with engineID and imageID, an approvalWorld with project, a sessionWorld with token,
    a recoveryNative with worker, an offlineRuntime whose api is an offlineAPI with w and that
    worker created, and a lifecycleNative with first the row's signal, signalled, delay the row's
    percent of grace as lifecycleFixture computes it, aliveBeforeGrace true, journalAtReturn and an
    empty signalTrace file. Each kill follows its own GET /info and GET /containers/<worker>/json,
    all three reaching the recorder at one instant unless a case says otherwise, carries the
    observation and 0600 record that lifecycleRevalidated checks, and is otherwise Status 204 with
    Replied its At plus the row's delay.

    Times below are after cancellation and F is the first signal's arrival. Accepted, marking the
    cases that fail today: 'immediate at the grace' F 50 ms, SIGKILL 1 s; 'immediate past the old
    window' F 50 ms, 1.201 s (fails); 'immediate just before a repeat restart' F 50 ms, 1.799 s
    (fails); 'delayed slow teardown' F 500 ms, 1.3 s (fails); 'delayed just before an
    acknowledgement restart' F 300 ms, 1.899 s (fails); 'delayed at the absolute tolerance' F 1.5 s,
    3 s (fails); 'delayed acknowledgement cut by the call limit' F 50 ms, Cancelled, zero Replied,
    1.1 s (fails, at the delay check). Refused naming 'SIGKILL at': 'immediate before the grace' F
    50 ms, 999 ms; 'delayed before the grace' F 50 ms, 999 ms; 'immediate at a repeat restart' F 50
    ms, 1.8 s; 'delayed at an acknowledgement restart' F 300 ms, 1.9 s; 'delayed as an
    acknowledgement timer on a hosted runner' F 500 ms, 2.2 s; 'delayed past the absolute tolerance'
    F 1.5 s, 3.001 s; and, each delayed at F 50 ms with Cancelled, Status 204 and zero Replied,
    'delayed cut at an acknowledgement restart', 1.65 s, and 'delayed cut before the grace', 999 ms.
    Each immediate at F 50 ms, refused naming 'signal request count': 'no SIGKILL' with no second
    kill and 'second SIGKILL' at 1 s and 1.1 s; refused naming 'literal first signal': 'first signal
    repeated instead of SIGKILL', the row's signal at 1 s. Each delayed at F 50 ms with SIGKILL at
    1.1 s, refused naming 'delay did not execute': 'acknowledgement replied early', Replied 100 ms
    after F; 'cancelled before the engine accepted', Cancelled, Status 502, zero Replied; 'no reply
    and not cancelled', zero Replied. The cut holds' next request decides whether the cut could be
    the call limit: the accepted cut case has none of the product's own waits, so its next request
    is the SIGKILL's inspection, a call limit or more after the request before it, as an honest
    cut's is. Two delayed cases, each Cancelled, Status 204 and zero Replied at F 50 ms, are refused
    naming 'delay did not execute': 'delayed hold abandoned before the call limit', SIGKILL at 1 s
    with no wait, which comes 950 ms after the request, and 'delayed hold abandoned, then a timer
    from the abandonment', a wait of the product's at 150 ms and SIGKILL at 1.15 s.

    The call limit runs from the signal call's start, not from cancellation, so a first signal that
    arrives late spends most of it before the hold begins. Each signal's requests follow
    recoverySignal's order, inspection, daemon check, kill, and the bound is measured from the
    request before the kill. Four more delayed cases with Cancelled, Status 204 and zero Replied are
    refused naming 'delay did not execute': 'delayed hold abandoned after a late first signal', F
    1.2 s, SIGKILL 1.25 s; 'delayed hold abandoned after a late first signal, then a timer from the
    abandonment', F 1.2 s, a wait at 1.25 s and SIGKILL at 2.25 s; 'delayed hold abandoned within the
    call limit of a first signal at 600 ms', F 600 ms, SIGKILL 1.1 s, which is what a 500 ms call
    limit produces; and 'delayed hold abandoned just before the call limit', F 600 ms, SIGKILL
    1.599 s. Only the second sends a wait; the bound alone refuses the other three. An honest cut after
    a late first signal stays accepted so a repair cannot tighten past the product's limit:
    'delayed acknowledgement cut by the call limit after a late first signal', F 600 ms, SIGKILL
    1.65 s. 'Delayed hold cut at the call limit after a late first signal', F 600 ms, wait 1.6 s,
    SIGKILL 1.7 s, was listed as a second honest cut and is refused naming 'delay did not execute',
    since an honest cut sends no wait.

    The accepted cases put the daemon check and the kill at one instant, so they cannot tell a bound
    measured from the daemon check from one measured from the kill's arrival, and the second is
    tighter than the call limit allows: the call starts after the daemon check, the recorder sees
    the kill some time later, and the product's next request follows the cut at once. A throwaway
    mutant that started the bound at the kill's arrival passed all 58 subtests while refusing
    honest cuts, such as the daemon check at 600 ms, the kill at 650 ms, the cut and the next
    request at 1.62 s, 970 ms after the kill and 1.02 s after the check. A case can therefore put
    the first signal's daemon check a lead before its kill and its inspection a lead before the
    check. Three more delayed cases with Cancelled, Status 204 and zero Replied, each with F 650
    ms and the daemon check at 600 ms: 'delayed acknowledgement cut a call limit after the daemon
    check', SIGKILL 1.62 s, stays accepted; 'delayed hold cut a call limit after the daemon check',
    wait 1.62 s, SIGKILL 1.7 s, is refused naming 'delay did not execute' as a wait, whatever its
    time; 'delayed hold abandoned within a call limit of the daemon check', the inspection at 560
    ms, SIGKILL 1.59 s, is refused naming 'delay did not execute', which pins the check, not the
    inspection, as the start. Against the committed file the mutant from the kill's arrival passes
    and the mutant from the inspection passes; against the new file the first fails the accepted
    case and the second the refused one, in both delayed rows.

    A subtest 'recorder journals a cut acknowledgement' ties the cut cases to the recorder, and
    passes today. On recoveryRecorderWorld with newLifecycleFaults("ignore", "", time.Hour), a.serve
    takes a first kill on a cancellable request. Once the daemon has the kill and the journal
    entry's Status is set, cancel it. After serve returns, the entry must hold Status 204, Cancelled
    and a zero Replied. Its world is Linux's and skips elsewhere.

    Correct the words with the rule. Lines 361-365 and 711-718 of features/README.md say the
    tolerance is 20 percent of grace, and 1 s to 1.2 s; they must state the two-second tolerance,
    the 1.8 s limit (with '1.8 s' on one line) and the delayed row's limit, and why a delayed row's
    SIGKILL follows its acknowledgement. The comment at features/lifecycle.feature:216 says 20
    percent. No scenario text, tag or step changes. T-42 supersedes T-33's 'escalation tolerance is
    20 percent' alone; T-33's entry stays as the record, as T-36's did under T-41. Fixture budgets
    stay 1/3/1 s, the 20 and 80 percent repeats and the 60 percent delay stay, and so do
    lifecycleBound and the recorder.

    Commit TestLifecycleSignalWindow alone first, red, with test --item T-42, and report each
    failing subtest's assertion. Then commit the rule, the named offset and the corrected words with
    test --task T-42. features/lifecycle_grace_test.go,
    features/lifecycle_native_assertions_test.go, features/lifecycle_native_actions_test.go,
    features/engine_budgets_test.go, features/README.md and the comment in
    features/lifecycle.feature are the whole change. Before stopping, without -race, run the
    neighbours that read these helpers and words: go test ./features -count=1 -run
    '^(TestLifecycle|TestEngineFixture|TestEngineSuiteBudget|TestEngineSchedule)'. The range touches
    no proof.code path, so its CI judges no mutant. Native proof is CI's and one green engine run
    cannot show an intermittent failure gone, so closure rests on the checks below and the pushed
    head's engine tier passing. If a LIFECYCLE-09 row still fails, that is new evidence: read its
    assertion from the job log, and never raise a limit on inference again. An engine step that only
    times out says nothing about T-42, which adds no waiting: that is
    p1-engine-suite-under-its-limit-again's, it holds closure until a rerun passes or that item
    lands, and no limit here moves for it.

    The first check follows the 13:18 decision, and how CI selects was tested for it. The engine
    step runs TestFeatures with no pattern, so every live @engine row, and TestFeatures'
    selectScenarios intersects -scenarios, a regular expression over tags, with the tier the
    environment enables. -scenarios='^@ID-LIFECYCLE-09$' in a hook, itos task or the ci job
    therefore excludes all four rows as '@engine disabled' and skips, exit 0, before and after the
    fix: alone it is the empty pass the decision refuses. With ITOS_CONTAINER_ENGINE_TESTS=1 and
    CI's variables but no prepared fixture, as in the ci job, every row stops at 'absent or
    malformed CI cached-image fixture inputs', before any engine call, before and after the fix.
    Only the engine job prepares that fixture, and it runs no task check; off GitHub Actions the
    switch and tools/bin/engine-fixture refuse, and agents run no engine. Nor can a native row fail
    on demand: it fails on a slow runner, and T-33 to T-37 passed it before any fix. So the check
    selects with CI's own flag and function and takes its red from the journals. It passes that
    -scenarios to TestFeatures and requires the four rows excluded and the skip, and
    TestLifecycleSignalWindow makes the same selection at the engine tier's values. The native rows
    keep running where they do already, in the engine job on every non-draft pull request and main
    push, and the ci job fails unless that job succeeded.

    The promoted check's pattern reached only the two TestLifecycleGrace tests, which pass, so it
    reported done. These checks name no lock and run as written in CI, through sh -c under dash,
    capturing go test's status rather than using set -o pipefail. itos ci plan marks the first
    (run), where a check written as itos.yaml's select reads (merged), into the ordinary run where
    its rows skip. At ae75d46 both fail. The first: go test exits 0, TestFeatures skips with the
    rows excluded, and awk exits 1 finding no TestLifecycleSignalWindow; once committed red, twelve
    of the 42 subtests fail, ten at 'SIGKILL at ... (at most 200ms scheduling tolerance)' and the
    two cut cases at 'signal acknowledgement delay did not execute', while the other thirty and the
    recorder subtest pass. The second: features/README.md says 20 percent at lines 364 and 716 and
    1.2 s at 716, features/lifecycle.feature says 20 percent at line 216, and the README has no 1.8
    s. With a throwaway rule and words, since reverted, both pass and the neighbours above stay
    green, and each of 26 variants of the rule fails the first at named subtests: today's share, a
    plain 2 s, a plain 500 ms, tolerances of 1 s and 3 s, no lower bound, no upper bound, either end
    of the window exclusive, inclusive restart limits, the acknowledgement limit on every row, the
    repeat limit on every row, the repeat limit from its 20 percent send, the acknowledgement limit
    from Replied with and without a zero guard, from cancellation or without the delay, the delayed
    limit or the whole window skipped on a cut hold, no cut path, any cancellation accepted, a cut
    without Cancelled or without the 204, no hold check, no exact count and no literal signal check.
    The rows losing @engine, a row dropped, the delayed rows moved and the ID renamed each fail it
    too. dash is not installed where this was written, so the checks ran under sh as bash in POSIX
    mode and gawk; they use only POSIX constructs.
- id: T-43
  type: ci
  title: The Engine failure diagnostics step prints each failed scenario's godog step error and annotates it
  why: >
    Job logs return 403 without a token and agents have no gh, so a red engine job shows only
    'Process completed with exit code 1' and a goroutine dump from `tail -100`. In
    .github/workflows/ci.yml, make the step print each `--- FAIL` block with its godog step error.
    Also emit one `::error title=<scenario>` annotation per failed scenario or go-test failure line,
    so the coordinator can tell an unchanged flake from a new failure on a re-run. This is
    project-side and does not wait for the itos summary-extractor fix tracked upstream. Cover it in
    the existing TestEngineDiagnostics, which runs the workflow shell against disposable fixtures.
    Record in the item that anchors.feature:410 (ANCHORS-09, exit 75, cleanup 409) failed on
    e2faafd, so the next unchanged re-run can show whether ANCHORS-09 or ANCHORS-10 repeat. A repeat
    on its own would justify a separate item for a possible real race in anchor cleanup. Broken down
    from p1-engine-suite-under-its-limit-again.
