    and reopened, a refused transition, and a tampered egress block refused at Validate). In
    port/porttest: TestEgressConnectionContract and TestRefusalLogContract. In docker:
    TestSDKEgressContract; TestCreateNetworkRequest (both bodies exactly, and each refusal before a
    request); TestInspectNetworkObservation (the mapping, 404, missing fields, a malformed body, a
    changed socket); TestCreateProxyRequest (the body exactly, the image inspected first, each
    refusal before a request, both pinned NetworkIDs); TestVerifyProxyRefusesEachDefect (a row per
    field above, including an omitted or wrong NetworkID and a nil endpoint, the healthy one
    passing); TestProxyReadyReadsStdoutOnly (the query; a stderr frame before the ready line;
    each malformed, extra-key, wrong-value and 2,049-byte first line; the stream ending early; a
    request error; a system-error frame); TestCopyProxyLogCopiesStdoutOnly (the query, the stdout
    bytes exact with stderr frames between them dropped, a failed write, a system-error frame);
    TestCreateRunOnInternalNetwork (the body with the pinned internal NetworkID, the six variables,
    the proxy checks, both schema mismatches); TestVerifyRunEgressNetworks (each network, port and
    DNS defect, including an omitted or wrong NetworkID and a nil endpoint);
    TestEgressPreStartNetworkIDs (create then verify each container before its own start, starting
    and readying the proxy before the worker's create, against the request-derived fixture: the
    recorded IDs pass with no allocated endpoint or address, and omitting or changing an ID in
    each create's captured settings makes verification fail with IsolationUnverified, with no
    start sent for that container); and
    TestEgressRequestsRecheckSocket (each new method sending nothing once the pin changed, beside a
    healthy control).

    In domain: TestEgressLaunchOrder (the order above, the store's record at each create holding
    that resource's intent and every earlier ID); TestEgressLaunchFailuresStartNoWorker (a row per
    failure point, from a lost network reply and a gateway on the internal network to a proxy that
    is never ready, stays silent for its call budget, stops right after ready, or stops between the
    worker's create and start, and a foreign endpoint at the checks before start, each with its
    outcome and operation, no worker started, and teardown releasing every recorded resource in
    reverse order or, after a lost reply, keeping that intent); TestEgressProxyExitDuringRun
    (ProxyExited with the existing termination and the exit seen in teardown kept, a watch failure,
    and a worker exiting first leaving the result the worker's); TestEgressTeardownOrder (worker,
    SIGKILL, wait, exited, the copy holding the stdout bytes, proxy removal, egress network,
    internal network, anchor, Completed and the admission released);
    TestEgressCopyFailureRetainsProxy (Begin, Write and Commit failing, a fresh Recovery with nil
    Refusals and a copy timing out each keep all but the worker, Incomplete or Internal with the
    retry, and a later Recovery.Stop with a working log completes, copying again);
    TestEgressCopyGapReleasesResources (ready seq 1 and refusal seq 3, the fake's committed report
    naming 2..2: foreground teardown, Runner.Cleanup and fresh Recovery.Stop each keep the stored
    copy and typed report and remove in order through the anchor; Runner.Cleanup returns Complete
    and foreground run's Cleanup is Complete; registered teardown releases admission and preserves
    the worker's exit; Recovery reports complete with no retry despite the gap failure; a later
    network removal failure retains both diagnoses with a retry for the remaining resources;
    a clean copy has no gap report and a publication failure still retains resources);
    TestEgressRecoveryRefusesForeignResources (a
    foreign name, other labels, another ID and a changed socket, each Refused with no removal);
    TestEgressRecoveryAfterControllerLoss (a fresh Recovery.Stop of a running session ends the
    worker and tears everything down); TestEgressUncertainCreates (an intent not found stays
    Incomplete with the later resources untouched, and one found owned is adopted and released);
    TestEgressStatus (pending while any resource remains, complete only when all are absent,
    failures for foreign or unknown ones, nothing written); TestEgressGrantRefusedBeforeResources
    (each invalid grant Invalid and a nil Refusals Internal, with no registration or engine call);
    TestOfflineRunCreatesNoEgress (an offline run's events and record bytes exactly today's); and
    TestUnregisteredRunRefusesEgress.

    Commits, decided before editing, each with itos commit --task T-40, because CI runs no check of
    a task the range's Task: footers do not name. First a test commit, red first: every test above
    with what it needs to compile, the port's types, fields, interfaces and outcomes whole but its
    new predicates and the schema 3 branches of its existing ones stubbed to refuse, and stub
    methods in the fake, the RefusalLog fake, the adapter and the domain that return zero values or
    refusals, so each test reaches its assertions. Every test fails there at an assertion, not in
    setup, reported test by test, but TestOfflineRunCreatesNoEgress, which passes because what it
