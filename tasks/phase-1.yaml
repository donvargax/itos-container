    Keep environment and host values as data in selection policy, with the real process read
    confined to TestFeatures or its boundary helper. Never enable the engine from this input.
    ITOS_CONTAINER_ENGINE_TESTS still requires its exact existing switch values and, when enabled,
    CI=true, GITHUB_ACTIONS=true and an actual Linux amd64 test process. Existing child-environment
    filtering must strip the new ITOS_ variable too. These context checks prevent accidental
    execution, not hostile code; agents must never spoof the context or receive an engine socket.

    An unset, empty or whitespace-only input retains today's selection, including @wip exclusion
    on an ordinary dispatch. Otherwise split with standard-library whitespace rules, validate
    every complete token against ^@ID-[A-Z]+-[0-9]+$, deduplicate, and join exact anchored matches.
    Accept one ID or several; reject bare IDs, arbitrary tags, lowercase areas, commas, regex or
    godog operators and shell-looking values before binary build or scenario initialization.
    Do not treat the supplied text as a regex or godog expression. Refuse combining a nonempty
    red list with a nonempty -scenarios expression rather than silently widening either selection.
    Require each requested ID to occur in the parsed feature inventory, including inherited tags;
    a well-formed unknown ID fails even when other requested IDs exist. Selection/parser errors
    name the problem and fail, without falling back to the whole suite.

    With a valid red list, select only those exact IDs, live or @wip, intersected with the existing
    engine tier and platform. Remove only the @wip restriction for those IDs in memory; never
    rewrite feature files or their smoke entries. Apply restrictions to every OR branch and keep
    the existing expected-versus-filtered pickle check. Feature, Rule, Outline and Examples tag
    inheritance still applies, and selecting an outline ID selects all its eligible rows. A list
    containing only IDs excluded by this job's tier/platform reports an explicit skip with IDs,
    reasons and count, never falls back to live cases and is never red evidence. This lets the
    same list reach engine and manual platform jobs safely. An eligible selection must execute
    its expected cases; failures, undefined/pending/skipped steps or lost cases cannot become a
    successful red run. Preserve the existing strict engine completion checks and apply that
    completion discipline to red selections in the non-engine manual jobs as well.

    The manual jobs still run go test ./..., so TestManifestContractCoverage must also recognize
    an active red selection and skip its independent whole-suite product-scenario reruns, just
    as it already skips for -scenarios. Otherwise it executes unrequested manifest IDs. Make
    this focused change in features/manifest_coverage_test.go using the same guarded context
    policy; empty input and ignored input outside dispatch must not skip ordinary coverage.
    Memory-only harness regressions and other unit tests continue to run normally. Isolate
    synthetic harness subprocesses from the caller's red selection by stripping the new variable
    in cleanHarnessEnvironment; an actual manual dispatch must not contaminate those fixtures.

    Preserve automatic push and pull-request runs, all event/draft guards, the five jobs and
    stable engine check name, exact engine TO checkout, native runner, read permissions, action
    pins, budgets, fixture preparation and unconditional owned cleanup. Keep the existing go test
    commands unchanged; the environment supplies the red selection. With no input the engine
    still runs every live engine case and manual platforms their full eligible suites. The ci
    job must still require engine success. Propagate the actual test outcome, never force a
    failure or accept a passing run as red proof. Failing red-evidence dispatches stay failed and
    are never a merge/closure prerequisite or a substitute for green CI at the implemented head;
    do not add continue-on-error, success fallbacks, tag rewrites or a draft-guard exception.

    Commit compiling ordinary regression tests first with test --item T-21. Add
    TestEngineRedSelection in features/engine_selection_test.go and TestEngineRedWorkflow in
    features/engine_workflow_test.go, using the existing memory fixtures, hook counters and YAML
    parser. Test context values and environment lookups through in-memory data, never by setting
    a real process to CI engine mode. Prove that only named @wip/live IDs execute in dispatch,
    including inherited outline rows, duplicates and IDs whose prefixes overlap. Assert no
    unrelated initializer, Background, hook or step runs. Cover malformed and partially unknown
    lists, conflicting -scenarios, empty input, cross-tier/platform exclusion, invalid engine
    context and unsuccessful/incomplete selected execution. Use a recording environment lookup
    to prove the new variable is not read for local, missing-CI, missing-Actions, PR or push
    contexts, even if it would return a hostile value. Retain the existing early-exit tests and
    prove the new harness variable is absent from product child environments. Cover the
    whole-suite coverage helper's dispatch-only exclusion and synthetic subprocess isolation
    so a real manual job cannot run unrequested product scenarios or corrupt regression selection.

    Parse the workflow to assert the exact optional input schema and three permitted environment
    locations, conditional dispatch expression and unchanged run commands. Include broken-workflow
    negative controls for a missing/required/nonempty-default input, an extra input, missing wiring,
    run-script interpolation, an unguarded expression, global/job/proof/ordinary-Linux leakage
    and ignored failures. T-21 explicitly supersedes T-20's no-dispatch-input invariant and its
