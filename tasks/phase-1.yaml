# Project-local tasks are added with itos task add, starting at T-1.
- id: T-1
  type: ci
  title: Establish the generated seed as the commit tracking boundary
  why: >
    The generated seed predates this project ledger and has no Task footer. Start project commit
    checks after that exact seed while retaining checks for the pilot draft and every later commit.
    Do not rewrite history, claim inherited proof or relax any gate.
  done_when:
    - run: test "$(itos config get commits.since)" = "23b8ce15410ec9431f5a1fe39a973d9cf0a3d8de" && git merge-base --is-ancestor 23b8ce15410ec9431f5a1fe39a973d9cf0a3d8de HEAD
    - run: itos config check
- id: T-2
  type: style
  title: Format the inherited release test fixture
  why: >
    The first full CI run failed because the release test fixture map is not gofmt-aligned. Change
    only whitespace in internal/release/releasetest/releasetest.go; preserve all fixture contents
    and behavior, and retain the existing formatting gate.
  done_when:
    - run: test -z "$(gofmt -l internal/release/releasetest/releasetest.go)"
- id: T-3
  type: ci
  title: "Finish the move to itos 8: the by-hand steps of itos upgrade 7.0.0-rc.1 to 8.45.3"
  why: >
    itos upgrade moved the pin and itos.yaml to 8.45.3 and rewrote AGENTS.md's itos block
    (2026-11-03), and itos config check passes. The manual migration is incomplete:
    .github/workflows/ci.yml and .github/workflows/release.yml still use the v7.0.0-rc.1 action
    at 1b9f1f9995be5d20aed3b4f8877a453bbd1e98a3 and override its launcher with version 6.0.0.
    This is foundation work under docs/charter.md, not a new container behaviour; it needs task
    checks, no Gherkin scenarios or step definitions.

    Pin both action references to donvargax/itos@0a8c1bcfce6ae7b67b39197ee3990a90343f35ac
    with the comment v8.45.3. Remove each action's with/version override entirely. The upstream
    tag https://api.github.com/repos/donvargax/itos/git/ref/tags/v8.45.3 identifies that commit;
    https://github.com/donvargax/itos/blob/0a8c1bcfce6ae7b67b39197ee3990a90343f35ac/action.yml
    resolves a SHA to its release when no version input is supplied. No new library or service
    is needed. Keep itos.yaml's 8.45.3 pin and checksum
    d91adcab38594aabbaabc828a6a82b027580374d3e55ea3968d7dee75e8dfaea unchanged. A release-looking
    comment beside an arbitrary SHA is not evidence of the correct action.

    Update docs/upgrading.md to distinguish the supported upgrade command from these manual
    workflow edits and record the remaining migration rules. Code proof is enforced by ci run
    through proof.code, so required changed-code mutation results must be recorded and committed
    before the coordinator pushes, using the parent of the item's actual first commit, specs
    included. Keep the proof configuration, thresholds, existing CI steps and verify/ci run
    calls intact. The whole plan's no-start proof message is not a proof pass; a workflow/docs
    change alone touches no proof.code path and must not fabricate mutation records. The pinned
    itos-cc upgrade belongs to T-4.

    Numbered work add, task add and work promote mint their IDs; do not prescribe IDs by hand.
    A plain itos push does not publish tags; a deliberate tag push needs --tag. The existing
    release workflow creates a local tag and publishes its draft through GitHub, without an
    itos push call: preserve that sequence and its version condition, and do not enable releases
    or add a tag-push step. Keep the bans on --no-verify, commit -a and git add -A. Document these
    migration rules without rewriting the template claims in PLAN.md, README.md or AGENTS.md;
    that foundation cleanup is separate work. No runtime, dependency, platform or gate expansion
    belongs to this task.

    The checks below use the runner's existing shell tools, without requiring RTK in CI. They are
    cheap configuration and workflow checks for the existing task/CI gates; let the configured
    hooks and CI run the wider plan. Review its listed steps without changing
    their selection or cost. Before implementation, both exact-action checks fail on the v7 SHA
    and both no-override checks fail on with/version 6.0.0. Configuration validity and plan
    construction are preservation checks, not evidence that the workflow migration is complete.
- id: T-4
  type: build
  title: tools/bin/pinned runs the current itos-cc, not 0.5.0
  why: >
    tools/bin/pinned still runs itos-cc 0.5.0. The current release, verified on 2026-11-04 at
    https://api.github.com/repos/donvargax/itos-cc/releases/latest, is v0.47.2, published on
    2026-11-02 from eb7d910ab864b890a9033f5c8acc2311f56efe25. Fix this task's target at 0.47.2
    rather than resolving latest at runtime. This is the charter's foundation tool upgrade,
    a build task with checks, not container behaviour: no scenarios or step definitions.

    Update only the itos-cc version and its five archive SHA-256 values in tools/bin/pinned.
    The expected values below come from
    https://github.com/donvargax/itos-cc/releases/download/v0.47.2/checksums.txt, whose SHA-256 is
    7ebfae6b1f2193b79425289af3a436e4ee25efe27e6ee11b04f49ac984f9ef30; the release API's asset
    digests agree. Keep Linux and macOS amd64/arm64 and Windows amd64, the archive names and
    member names, versioned cache directory, --path interface and checksum-before-extraction
    behaviour. Leave the other tools' pins alone and do not add Windows arm64. These are tool
    distribution platforms, not additional supported container hosts. No new library or service
    is needed. Verify the release checksum manifest before copying any value; a version bump
    beside old hashes is incomplete. The Linux runtime check must use the repository launcher,
    not an unrelated itos-cc on PATH, and resolve .tools/itos-cc-0.47.2/itos-cc on a cache miss.

    Record the applicable migration in docs/upgrading.md, using the releases from 0.5.0 through
    0.47.2 and https://github.com/donvargax/itos-cc/blob/v0.47.2/README.md. The existing
    mutation sample --count 10 and mutation check --since <base> --fail-uncovered --json cmd
    internal remain supported. Keep those CI/proof commands, their scope and thresholds intact;
    do not replace cached checking with a counted run or change to --fail-uncovered=lines.
    itos-cc.yaml's mutation.exceptions: [] is already valid. Its omitted version means version
    1; strict validation now rejects unknown keys, anchors, aliases, merge keys, non-JSON tags,
    non-string keys and multiple documents, none of which this file uses. Preserve that file;
    do not add exclusions, exceptions, mutation.tests or mutation.copy for this pin move.
    The 0.18.0 comment-insensitive hashes and later whole-suite evidence can stale old results;
    0.47.0 also invalidates older strict coverage evidence. Exception rehashing is unnecessary
    here because the exception list is empty. No consumer here parses mutation's plain output
    or distinguishes its nonzero error codes; keep exit status as the verdict.

    Strict --fail-uncovered now requires fresh coverage evidence for every judged Go function,
    including functions without mutation sites, and rejects uncovered executable blocks as well
    as uncovered mutants. Re-measure required stale evidence with the pinned release, all-tests,
    fail-uncovered and no-annotate; commit only the resulting project-local .metrics/mutate/
    paths. Kill survivors with tests and never excuse uncovered code, hand-edit evidence, copy
    another project's cache or relax a gate. Use the parent of T-4's actual first commit,
    786ea2f2cb1f75351e30c4b75c37d98437b3f418, as the range base:
    ebd187e7f0722f65d9aadda7a13d27048e4e03f6. Reconfirm this against itos work show T-4 if history
    changes. The planned launcher/docs edits touch no proof.code path; the range check below
    then validates command/config compatibility but proves no Go function. Do not manufacture
    changed-code records or expand this task into a repository-wide proof refresh.

    The only existing snapshot records three Example mutants in
    internal/release/releasetest/releasetest.go. A sample draws only fresh recorded outcomes,
    at most ten, and skips stale or missing results: success with zero candidates is not a
    refreshed baseline. Report the actual sampled count and any stale-evidence limitation in
    the implementation handoff. A full foundation baseline is separate work, not a reason to
    lower this task's gates or claim all code is proven.

    Keep the checks at the existing task/CI tiers, with shell tools already on the runner;
    remove the task check's RTK wrapper rather than requiring RTK in CI. The checksum-map and
    executed-version checks fail before implementation on all five old hashes and 0.5.0.
    Shell syntax, configuration and the range check are preservation checks. The existing
    mutation sample already passes with 0.5.0 (three of three cached mutants), so it is only
    a compatibility check, never the upgrade assertion. Its HEAD-derived seed is deterministic
    for a given commit. Leave the existing wider CI plan and hooks in control of their gates.
- id: T-5
  type: docs
  title: Replace inherited template guidance in PLAN.md, README.md and AGENTS.md
  why: >
    PLAN.md and AGENTS.md still describe a template and its stack branches; README.md presents
    this project as a generator input with replaceable attribution. Replace that guidance with
    this project's purpose and current state. This is documentation-only foundation work under
    docs/charter.md, not container behaviour: no scenarios, step definitions or runtime changes.
    Each of the three files must link to docs/charter.md and docs/plans/container-pilot.md, name
    the planned itos container extension and the offline owned-run milestone, and make the
    charter's selected scope and the pilot's binding contract authoritative. Read the charter
    before PLAN.md; do not change either authority to fit inherited guidance.

    PLAN.md must replace template rendering, branch selection and bootstrap sequencing with the
    charter's order: project foundation, configuration/doctor/approval, then an offline owned
    run. Describe the milestone's target, itos container run -- <argv>, as planned: an approved,
    hardened container with no network, the checkout as its only host mount, non-root identity,
    recorded ownership, bounded startup, foreground exit and safe owned cleanup, each requiring
    failing-then-passing scenario evidence. Core itos retains work routing, commit rules and CI
    proof. T-3 and T-4 completed tool migrations, not the entire foundation or the sandbox.
    Keep runtime alternatives (isolates, WASM, restricted shells and a capability broker) only
    as deferred research, with no selected dependency, experiment or runtime branch authorized
    by this edit. They may be shortened to a clearly deferred research note.

    State the first milestone's limits in PLAN.md and README.md and link them from AGENTS.md:
    Linux amd64 with native Docker is the target, with no support claim before runtime proof.
    Proxy egress, credentials/accounts, network Git, LAN ingress, Compose and other platforms
    remain outside this milestone. Distinguish the inherited multi-platform Go checks and release
    tooling from container-host support. Hooks and agent instructions are workflow safeguards,
    not the isolation boundary; assume hostile checkout code and tool execution. Do not promise
    protection against host administrators or kernel/container escapes.

    README.md must distinguish existing code from the planned product. The current entry point
    in cmd/itos-container/main.go already exposes the inherited itos-container count <file>
    example (including standard input and JSON), version and completion. Keep a concise, accurate
    description of that foundation and its Go checks; explicitly say the container commands and
    isolation are not implemented yet. Do not describe planned container commands as runnable
    setup instructions or claim the counting CLI proves a sandbox. Retain the counting example,
    its port/fake architecture, whitespace tokenization and newline-terminated additive property
    in the guidance where relevant. Do not claim a fresh foundation mutation baseline from a
    passing cached sample: T-4 reported zero eligible records, and baseline work is separate.

    AGENTS.md must put the charter first and require itos guide work and itos guide commit for
    the assigned role. Preserve scenario-first behaviour work with red step commits, task checks
    for foundation work, direct implementation without subagents, itos registry ownership rules,
    status inspection and explicit own-file staging, and commits only through itos commit.
    Replace instructions for the implementing agent to push or close an item with the charter's
    division: agents commit; only the coordinating loop pushes, marks a pull request ready and
    closes an item after the actual pushed head is green and required proof passes. Respect a
    brief's role and coordinator-owned lifecycle actions; a drafter does not take the item.
    Keep hook/CI gates, no bypasses, no force-push or published-history rewrite, and no hand-edited
    owners/statuses. Keep the pinned itos-cc requirement, all-tests, fail-uncovered, no-annotate,
    the parent of the item's actual first commit (specs included) as proof base, committed
    project-local evidence, tests for survivors and uncovered code, and reasoned exceptions only
    for genuinely equivalent mutants. Documentation-only work touches no proof.code path and
    must not fabricate mutation results.

    Preserve domain-owned ports, thin entry points, our fakes rather than mocks, OS-as-value
    logic and the narrow build-tag rule. Add the charter's engine boundary: domain tests use an
    engine fake, real-engine scenarios run only in CI, and agents never receive the Docker
    socket. Preserve the bans on credentials in files/logs and on weakening gates. Keep the
    generated block between the itos markers unchanged. Retain accurate AGPL-3.0 attribution to
    donvargax and the authorized infrastructure provenance from itos and itos-template, together
    with the original projects' and dependencies' notices and links to LICENSE/CONTRIBUTORS.md;
    the owner is not an illustrative answer and this repository is not a template generator.

    Implementation edits only PLAN.md, README.md and AGENTS.md. Do not alter the charter,
    contract, code, tests, configuration, gates, license files or generated rules. Retargeting
    docs/CLI.md and docs/CONFIG.md, CI branch conditions and fresh baseline proof are separate
    recorded work. No new library or service is needed. Keep AGENTS.md within its existing
    document cap; let the configured hooks and CI run their checks without changing their tiers.

    The checks use existing shell tools, with no RTK or ripgrep requirement in CI. Before the
    edit, the source/scope check fails on the missing charter link in PLAN.md (all three files
    lack the required links and milestone); the retired-claims check finds template claims in
    all three files; the agent-rules check fails on the missing itos guide commit instruction
    and Docker socket boundary. Its other terms preserve existing proof and commit rules.
    These are cheap documentation checks, not runtime isolation proof. Review the prose against
    the decisions above as well: keyword presence alone cannot establish truthful status,
    correct loop ownership, milestone limits or preserved provenance.
- id: T-6
  type: docs
  title: docs/CLI.md and docs/CONFIG.md describe itos container's commands and itos-container.yaml, from the newest of itos's and itos-cc's guidelines
  why: >
    Both files still describe itos-template, its manifest and its decisions. Replace that guidance
    with this project's planned interface and strict policy rules. This is documentation-only
    foundation work under docs/charter.md and docs/plans/container-pilot.md, not implementation of
    container behaviour. Edit only docs/CLI.md and docs/CONFIG.md; add no scenarios, step definitions,
    code, dependencies, configuration files or gates. Preserve the counting example and existing
    checks. No proof.code path changes, so do not manufacture mutation evidence.

    The upstream comparison was verified on 2026-11-04 using main's commit and each file's last
    modifying commit, not the date a copy arrived here. Pin source links in both documents to the
    inspected revisions below, retain their attribution and external guideline sources, and explain
    which newer rules apply. Do not present another project's implementation gaps or numbered
    decisions as this project's. itos-cc has the newest edits to these guidelines, but its own
    compatibility exceptions and command-specific behaviours are not universal rules. The charter
    and pilot contract remain authoritative over every upstream example.

    itos was inspected at 772cef549d90b9cca7170a2252ad85fc09bd880a. Its docs/CLI.md last changed at
    50dfa0bcc8c0632aaa0d0041206e2c97cf9ae24f on 2026-10-27 at 03:01:23 UTC; there is no docs/CONFIG.md
    at that revision. Its extension protocol is docs/extensions.md at the same inspected revision:
    https://github.com/donvargax/itos/blob/772cef549d90b9cca7170a2252ad85fc09bd880a/docs/extensions.md.
    itos-cc was inspected at 9361616f7204a236e809417726ad107ca4f9b805. Its docs/CLI.md last changed at
    8a3f31cd899be858fa7eaea02ce9f05572d54346 on 2026-10-27 at 10:10:36 UTC; docs/CONFIG.md last changed
    at 405b36205f8a38a27260f69afe554412015077ec on 2026-10-27 at 06:39:05 UTC. itos-template was
    inspected at 1533aee2ea3331816e793faaeaabd3f55f83bcaa. Its docs/CLI.md last changed at
    79301eba51b9768a27906c720e39c49b08491e67 on 2026-10-12; docs/CONFIG.md last changed at
    2d8bc3da85fd0aa8b6cc86f2b40b526c9726ffd3 on 2026-10-07. Link each available guideline using
    https://github.com/donvargax/<project>/blob/<inspected-revision>/docs/<file>. The inherited
    CONFIG.md matches that template copy; its CLI.md lacks the template's later pre-v1 guidance
    and still has render/merge examples. A new repository HEAD date alone does not date a rule.

    Both documents must link to the charter and pilot, state that container commands and policy
    loading are not implemented, and distinguish design rules from current behaviour. The existing
    cmd/itos-container/main.go exposes count, version and completion, not a sandbox. Describe the
    offline owned-run milestone and Linux amd64 with native Docker as a target requiring runtime
    proof, not a support claim. Network egress, credentials/accounts, LAN ingress, Compose and other
    platforms remain deferred. Describing the pilot's later commands does not authorize those
    slices or any open security decision. Do not claim previous-release checks or other upstream
    compliance machinery run here merely because a source describes them.

    CLI.md must describe itos container as dispatch to itos-container through the existing extension
    seam, with a planned command table for init, doctor, approve, run, exec, status and stop. init
    prepares non-runnable examples without overwriting files; doctor only inspects; approve shows
    effective permissions and differences and records explicit host-user consent outside the
    checkout. None executes checkout code, installs hooks, logs in, pulls/builds images or starts
    a session. Distinguish doctor --probe as the pilot's explicit bounded disposable probes using
    trusted material without agents or real credentials; real-engine scenarios run only in CI.
    run -- <argv...> requires an explicit command and preserves argument boundaries, with no
    implicit shell or injected agent permission flags. exec <session> -- <argv...> uses only a live
    owned session's frozen restrictions and never extends its foreground lifetime. Primary exit
    refuses new exec and tears down active commands. status reports owned state/recovery without
    secrets; stop <session> removes only owned resources, preserving checkout edits and project
    state. No detached mode, foreign-resource pruning or unattended recovery restart is implied.

    Preserve applicable naming, help, flag, output, compatibility and completion principles. Retarget
    the executable's version/error prefix to itos-container and proposed product-specific variables
    to ITOS_CONTAINER_; this naming rule creates no new variable or flag. Explain the host protocol's
    ITOS_ROOT, ITOS_CONFIG, ITOS_JSON, ITOS_BIN and ITOS_VERSION separately. ITOS_CONFIG names core
    itos configuration, never itos-container.yaml, and no container keys belong in itos.yaml. Flags
    before container belong to itos; arguments after it belong to the extension, and words after
    run/exec's -- belong to the workload without further wrapper parsing. Proposed flag/environment/
    file precedence cannot grant permissions, bypass approval or import the host environment into
    the worker. NO_COLOR is a presentation convention, not permission to forward host variables.

    For planned noninteractive control commands, --json or inherited ITOS_JSON=1 requests one stdout
    object with schema 1, ok and typed problems even on failure; diagnostics go to stderr. Carry
    forward the newer guidance on stable rule IDs, each problem's exit and flat subject fields,
    reserving rule, exit, message and fix. Scripts rely on codes, structured data and written file
    data, not prose or comments. The pilot proposes refusing JSON mode for interactive run/exec;
    document that exception, including inherited JSON mode, rather than mixing workload output
    into an object. Do not invent exact problem IDs before the behaviour specifications.

    Record the exit-code source disagreement explicitly. itos and its extension contract still use
    0 success, 1 policy/check refusal, 2 usage/config/unknown command, 3 missing environment, 70 internal
    and 75 temporary failure. itos-cc's newer 80/81/82/100 and interrupt 130 are its own decisions.
    Retain the pilot's binding itos wrapper conventions, not an undocumented migration to itos-cc's
    numbers. Once a workload starts, preserve its exit status; report cleanup errors separately,
    returning nonzero when a successful workload has required-cleanup failure. Do not apply the
    inherited rule against child-code passthrough to workload exits or invent a cleanup/signal code.
    Exact timeout, signal and cancellation details still need scenarios. Keep codes, JSON and their
    mapping in the UI, never in the domain. No current counting behaviour changes with this task.

    CONFIG.md must use itos-cc's newer separation of format policy from implemented loader behaviour
    for the planned itos-container.yaml. Other tools' files keep their own formats: itos.yaml is core
    workflow configuration, and the restricted devcontainer.json is JSON-with-comments, not YAML.
    The checkout policy and manifest request permissions; neither authorizes itself. Require shared
    validation by doctor, approve and run, explicit host-owned approval outside the writable checkout,
    and a frozen effective session configuration. Missing/malformed policy, unsupported options,
    invalid values or absent/mismatched approval must not fall back to unrestricted startup. Editing
    checkout files or recording a new approval cannot widen a live session.

    Retain the JSON data model with YAML syntax, explicit visible defaults and no embedded language
    or host-side evaluation. Require rejection of duplicate and unknown keys, non-string keys,
    multiple documents, anchors, aliases, merge keys and non-JSON/custom tags, including inside
    nested values, before using configuration or starting resources. Quotes, comments, block/flow
    styles and the non-specific ! tag are data spellings, not execution. Keep actionable problems
    keyed by their path from the top, validation of all values before use, integer versioning and
    rejection of unsupported versions. Explain that itos-cc's ignored x- keys, absent/empty-file
    defaults, missing-version compatibility and pre-1.0 version-1 additions are project-specific
    exceptions, not adopted sandbox policy. Do not select a parser or claim these checks already
    exist; later behaviour specs must choose maintained libraries and pin them before implementation.

    Keep the remaining format principles: snake_case keys, ordered lists of named objects, values
    kept whole (argv lists rather than shell strings), file-relative slash-separated paths, no
    secrets, documented types/requirements/defaults/examples, reviewable effective defaults, a
    versioned JSON Schema and stable deterministic writes. Distinguish desired documentation/schema
    capabilities from commands or artifacts that exist. General path guidance does not settle safe
    checkout identity, manifest discovery or state storage. No runnable policy example, key catalog,
    schema version, discovery/output path, approval fingerprint, lifecycle-hook semantics or
    resource limit is invented here; those pilot questions remain open. No host credential sourcing
    is authorized by general environment-variable guidance. Remove template-specific examples,
    docs/manifest.md links, bare inherited decision numbers and unowned gap IDs such as
    config-key-paths; link the actual authorities and name remaining specification needs instead.

    The checks below are cheap documentation checks at the existing task/CI tier, using existing
    shell tools without RTK or network access. Before implementation, the command check fails at
    the absent itos container reference; the source/status check fails at the absent pinned itos
    revision; the boundary check fails at the absent ITOS_ROOT; and the retired-claims check finds
    template commands, variables and manifest links. Existing parsing terms are preservation
    checks. Keyword checks do not prove correct prose or isolation: review both documents against
    this entry, especially source differences, current versus planned behaviour, workload exits
    and the approval boundary. Let configured hooks and CI run the wider gates unchanged.
- id: T-7
  type: ci
  title: Align CI triggers and Go test conditions with main and work branches
  why: >
    The offline owned-run milestone needs reliable CI proof on main and work branches. The
    inherited .github/workflows/ci.yml limits push and pull_request to main, stack/**, go/** and
    renovate/**. A push to T-7 therefore does not trigger CI. A pull request from T-7 to main
    triggers CI, but the main job's Go setup and the entire platform job are skipped by their
    stack/go/renovate conditions; a push to main skips them too. This is foundation CI work
    under docs/charter.md, not container behaviour: no scenarios or step definitions are needed.

    Implementation edits only .github/workflows/ci.yml, in a ci commit tied to Task T-7. Keep
    the existing on mapping and its pull_request and push entries, removing both branches
    lists without replacement filters. CI must cover main, T-* and other work branches,
    including Renovate, without maintaining branch-name allowlists. Leave the default event
    activity types unchanged. Add no branches-ignore, tags, tags-ignore, paths or paths-ignore
    filter. Unfiltered push also includes tag pushes, as documented in
    https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushbranchestagsbranches-ignoretags-ignore
    (checked 2026-11-04); this does not change release.yml or authorize publishing tags/releases.

    Remove the complete if expression from the ci job's actions/setup-go step and from the
    platform job. Both Go setup steps and the platform suite must be eligible on every
    workflow run, subject to normal failure handling, with no replacement job/step condition
    or shell branch test. Keep the platform matrix exactly ubuntu-latest, macos-latest and
    windows-latest, fail-fast false, bash shell, and go test ./... -count=1. Preserve the
    RAPID_CHECKS=1 and GOCOVERDIR environment and directory creation so the inherited unit,
    property and full godog suite still run with their existing coverage setup on each OS.

    Preserve job names, runner selection, permissions, concurrency, checkout/setup-go/itos
    action pins, go.mod/go.sum inputs and the ci checkout's fetch-depth 0. Keep TO, the Range
    step and its BASE/token handling, FROM export, and both itos verify and itos ci run calls
    with their existing arguments and order. Do not add continue-on-error, swallow failures,
    alter range selection or weaken proof. Leave itos.yaml's plan, prose selection, hooks,
    thresholds and proof.code scope unchanged. No new tool, dependency, service or runtime
    probe is needed; do not add engine access or alter other workflows.

    The three-OS matrix is inherited Go portability coverage, not container-host support.
    The charter still targets only Linux amd64 with native Docker for the offline milestone,
    contingent on runtime evidence. Do not remove macOS/Windows Go checks to match that target
    or claim sandbox isolation from these tests. This workflow-only implementation touches
    no proof.code path and must not manufacture mutation records; fresh foundation mutation
    evidence remains separate work.

    Retain the check below at the existing task/CI tier, using the runner's awk without RTK,
    network access or a new YAML parser. Before implementation it exits 1 because the two
    branches lists and two if blocks set bad; the event, setup, command and matrix matches
    already pass and are preservation assertions. The same check must pass after the four
    removals. It is a static guard, not proof that hosted jobs ran: review the diff against
    the preservation rules above, and let configured hooks and CI run their wider gates.
    The coordinating loop must check the actual pushed head's CI and platform results before
    closing the item; the drafter commits only this ledger specification, leaving the task
    check failing until implementation and leaving ownership/status to the loop.
- id: T-8
  type: test
  title: Record a fresh foundation mutation baseline with pinned itos-cc
  why: >
    T-4 pinned itos-cc to 0.47.2, but its sample found zero eligible cached mutants and its
    changed-code check judged no Go sources. The only committed snapshot records three Example
    mutants in internal/release/releasetest/releasetest.go, without current strict coverage
    evidence. Establish a fresh project-local baseline for the inherited Go foundation under
    docs/charter.md. This is a test task, not container behaviour; no new Gherkin scenarios or
    step definitions are required. Keep the dependency on completed T-4. The duplicate idea
    p1-foundation-mutation-baseline describes this same work; registry consolidation belongs
    to the coordinator, not a hand edit of owners or statuses.

    Use tools/bin/pinned itos-cc at the existing 0.47.2 pin, never a different binary on PATH
    or a newly resolved latest release. Measure all admitted Go source under cmd and internal,
    including the CLI, counting adapters/domain/fake and release helpers. The first check below
    runs the whole test suite for coverage and each mutant. --mutate-all reruns recorded kills;
    --no-coverage-cache forces measurement instead of reusing coverage cache entries;
    --no-annotate leaves source comments untouched. Keep strict --fail-uncovered for whole
    functions, including executable blocks in functions with no mutation sites. No --since,
    --changed, --count, --site or narrowed path selection may replace this full baseline.
    Neither a successful sample nor a changed-code check over no functions establishes it.

    Run the initial measurement during implementation, retain its actual failure details in
    the handoff, then add deterministic tests that kill non-equivalent survivors and exercise
    uncovered executable code. Reuse the existing ports, fakes, fixtures and Go test tools;
    add no dependency or service. Preserve whitespace tokenization, newline-terminated additive
    pieces and all existing CLI behaviour and scenarios. Use focused assertions on observable
    results, including genuine error paths, rather than assertions that merely mirror code.
    Fix flaky tests without retries that conceal failures or reducing their checks. If a
    behaviour-preserving test seam is necessary, explain it and commit that refactor separately
    with Task T-8; retain the behaviour and mutation obligations. Do not delete or reshape
    executable code merely to remove sites or uncovered blocks. A discovered behaviour defect
    needs separately specified scenarios and red steps; report it instead of silently fixing it.

    Only a genuinely equivalent mutant may be recorded through the pinned tool's mutation
    except command in itos-cc.yaml. Give its exact identity and a reason demonstrating equivalent
    observable behaviour for the person to review. An untested branch, difficult error path,
    uncovered mutant or block, flaky outcome or missing/stale coverage is never an exception.
    Keep such failures visible until tested or report a concrete blocker. Add no exclusions,
    annotations that suppress checks, reduced coverage mode or replacement test command. Keep
    the existing pins, dependencies, proof.code paths, thresholds, hooks and CI plan unchanged.

    After the last source, test or exception change, complete the full fresh run successfully
    and require the full-scope cached check below to pass against that exact tree. Commit the
    tool-generated .metrics/mutate/ files by explicit path, including refreshed legacy records
    and strict coverage evidence for zero-site functions. Never hand-edit a snapshot, import
    another project's cache, stage a folder or commit .metrics/coverage scratch/cache output.
    A partial or interrupted run is not the baseline. Review that results actually judged
    functions and mutants across the admitted cmd/internal scope, record the totals and any
    exceptions, and identify each file the tool reports as not built on the measured platform.
    Do not hard-code a mutant count that can change as tests or legitimate seams change.

    Record the tool version, Go version, host OS/architecture, commands, measured source/test
    commit, counts, failures repaired and final verdicts in the implementation handoff. This
    baseline covers the admitted code on that platform only; it proves neither other platforms
    nor container isolation. Preserve the inherited multi-platform Go checks. Real-engine
    scenarios remain CI-only and agents never receive the Docker socket. No container runtime,
    policy, approval, network or credential implementation belongs to this task.

    Changed-code proof is additional to the whole-foundation baseline. T-8's actual first
    commit is its promotion/specification commit 1536aa563c94175e761b5d2186a7bc3f322e29fb;
    use its parent 4ac0cc4b017feb219ba1645ca4263a7dd26870fd for the range check below, not a
    later take or implementation commit. Reconfirm that history with itos work show T-8 if
    the branch changes. Remeasure any stale evidence after subsequent edits before handoff.

    Keep the full measurement as this foundation task's completion check, not a new recurring
    CI or hook step. The cached whole-scope and range checks then validate the saved evidence
    without running tests or writing results. Use the runner's existing shell tools, with no
    RTK requirement in the stored commands. Let configured hooks and CI run their wider gates.
    Before implementation, the whole-scope cached check fails on missing records such as
    cmd/itos-container/main.go and on the legacy snapshot's missing current coverage evidence.
    The full run generates the missing evidence and exposes the test gaps; its initial failing
    mutants and coverage blocks must be reported from that run, not invented in this spec.
    No scenarios have failing steps to report. The drafter commits only this ledger entry;
    the implementer supplies tests and evidence, and the loop alone pushes and closes T-8
    after the actual pushed head is green and its required proof passes.
- id: T-9
  type: docs
  title: Refresh docs/ORCHESTRATING.md for the offline owned-run milestone
  why: >
    docs/ORCHESTRATING.md still calls this repository a template with stack branches, denies the
    existing public CLI and godog runner, and describes proof as internal-only. Replace these
    claims with coordinator guidance for the offline owned-run milestone. This is documentation
    foundation work under docs/charter.md, not container behaviour: no new scenarios, step
    definitions, runtime code, dependency or service. Implementation edits only
    docs/ORCHESTRATING.md in a docs commit tied to Item T-9. The drafter edits only this ledger
    entry; leave registry ownership and status to the coordinating loop.

    Keep these as project-local notes printed after the coordinator guide by itos go. Begin
    with reading docs/charter.md first, then PLAN.md and its milestone limits, the binding
    docs/plans/container-pilot.md, AGENTS.md and the actual itos.yaml. Link those files using
    paths relative to docs/ORCHESTRATING.md. The charter selects foundation, configuration,
    doctor and approval, then the offline owned run; the broader pilot authorizes no later slice
    here. Linux amd64 with native Docker remains a target requiring runtime evidence. Egress,
    credentials, network Git, LAN ingress, Compose and other container hosts stay deferred.
    Open security decisions go to the person rather than being settled in a brief. Preserve
    the distinction between workflow safeguards and isolation against hostile checkout code.

    Describe the current foundation accurately. cmd/itos-container/main.go exposes count,
    version and completion, and features/README.md documents the existing godog runner. The
    planned itos container commands and isolation are not implemented. Reference the actual
    .github/workflows/ci.yml: pushes and pull requests run without stack/feature branch filters,
    and the Linux/macOS/Windows matrix covers the inherited Go tests, not container-host support.
    .github/workflows/release.yml exists as a reusable binary-release workflow but ci.yml does
    not call it. Do not claim either that release machinery is absent or that releases run.
    Remove stack inheritance, generated-project and template-tag instructions; this is one
    project on main and work branches. Do not enable releases or change workflows in this task.

    For inspection use itos work, itos work show <id> and tasks/phase-1.yaml. Explain explicitly
    that itos task executes checks: it is not a read-only task viewer and can run expensive or
    state-writing measurements. T-8's completion checks included a full mutation measurement;
    do not run that command just to draft a brief. T-8 is now done and its completion checks
    were removed on closure. Read its ledger why, commit history and
    docs/proof/T-8-foundation-baseline.md for the original checks, results and reproduction
    environment instead of inferring commands from an empty done_when or reopening the task.

    Require task-specific briefs with all placeholders resolved before handing them off. Name
    the actual item, drafter or implementer role, ledger type, spec path, allowed edit paths,
    exact checks and neighbouring checks, required proof and commit type/footer. Read itos
    guide work and itos guide commit, and use itos guide brief when preparing the handoff.
    For non-behaviour tasks use the ledger's why and done_when, not generic instructions to
    invent scenarios or step definitions. T-8 is the test task example: tests and generated
    proof with its specified checks, no new behaviour scenarios. T-9 is a docs task with cheap
    documentation checks and no mutation measurement. Behaviour briefs require specified
    black-box scenarios and red-first step commits while scenarios remain @wip. Each scenario
    must fail at its behaviour assertion with @wip removed for the run, then pass after the
    implementation; undefined steps are not evidence. Run non-engine cases locally and keep
    real-engine scenarios CI-only. Domain tests use the engine fake; agents never receive the
    Docker socket. Preserve smoke coverage and never weaken a scenario or gate to obtain green.

    Override the generic guides' lifecycle instructions in every brief with this project's
    division of responsibility. A drafter specifies only and does not take an item; an
    implementer follows the assigned spec. Agents inspect git status, stage only their own
    explicit file paths, commit through itos commit with a message file, then stop. The loop
    owns taking items, pushing, marking pull requests ready, watching CI and closing items
    only after the actual pushed head is green and required proof passes. Never hand-edit
    owners/statuses, bypass hooks, force-push or rewrite published history. Agents report gaps
    and ideas with why they matter; the coordinator owns registry changes and upstream reports.

    State that proof.code already selects Go changes under both cmd/ and internal/ in
    itos.yaml. Use tools/bin/pinned itos-cc with all-tests, fail-uncovered and
    no-annotate to refresh required changed-code evidence after the last source/test change.
    The range base is the parent of the item's actual first commit, specs included, found
    through itos work show and history, never an assumed take commit. Commit project-local
    .metrics/mutate/ evidence by explicit path; never copy another project's cache or hand-edit
    results. Kill non-equivalent survivors with tests and exercise uncovered executable code,
    including functions without mutation sites. Only genuinely equivalent mutants may have
    reasoned exceptions for the person to review; never except uncovered code or remove sites
    to avoid proof. Documentation-only changes touch no proof.code path and fabricate no
    mutation results. Leave configured hooks and CI in control of their gates.

    Link docs/proof/T-8-foundation-baseline.md instead of duplicating its counts or commands.
    Distinguish its completed full foundation baseline from the earlier T-4 sample with zero
    eligible records. A sample or empty changed-code range is not a fresh baseline, and later
    test/toolchain changes can stale evidence. The T-8 report records the Go environment needed
    to reproduce proof; it does not establish other-platform or container-isolation support.
    Do not make the full measurement a new recurring gate or run it for this documentation task.

    Retain the counting example's standard-library Unicode whitespace and logical lines, with
    newline-terminated pieces for its additive property. Preserve attribution to donvargax and
    infrastructure provenance from itos and itos-template without global handle substitutions.
    Keep the warning that Renovate configuration alone proves neither App installation nor bot
    activity. Keep at most ten lessons, each with recorded date, last-seen date and exit item
    or permanent status; no invented lesson or upstream issue is required. Keep the whole file
    within its existing 6144-byte cap by linking detailed rules rather than duplicating them.
    Change no other document, generated rules, configuration, gate, pin, code or proof artifact.

    Retain the original check below and add the brief and current-evidence checks at the existing
    task/CI tier, using ordinary shell tools without RTK or network access. Before implementation,
    the original check fails on the absent charter.md reference and finds the retired template
    claims; the brief check fails on the absent itos guide work instruction; the current-evidence
    check fails on the absent cmd/itos-container/main.go reference. These are static documentation
    checks, not behaviour or isolation proof. Review the prose against this entry as well:
    keywords alone cannot prove correct task-vs-behaviour instructions, lifecycle ownership,
    inspection-vs-execution guidance or truthful current status. Let configured hooks and CI
    run the wider checks unchanged. The drafter commits this spec with completion checks still
    failing; the implementer supplies the document and reports their results to the loop.

- id: T-10
  type: ci
  title: The depguard rules hold every slice to internal/count's layout, not only count
  why: >
    docs/architecture.md ("Slices") makes every command a vertical slice before the first container
    command is written; .golangci.yml's depguard rules name only internal/count's domain and disk
    packages, so a new slice could import os from its domain or an adapter could import the domain
    and only a review would notice. Generalise them: a domain package of any slice denies os,
    os/exec, net, net/http and every adapter, and an adapter imports only its slice's port. Prove
    each rule with a fixture that breaks it.
  done_when:
    - run: tools/bin/check-slice-layout
- id: T-11
  type: docs
  title: Specify the offline owned-run lifecycle contract
  why: >
    Record the later run slice's contract in docs/plans/offline-run-lifecycle.md: literal argv,
    interactive JSON refusal, ownership before execution, hardened offline startup, bounded waits,
    signals, cancellation, workload exits and safe cleanup with recovery. Include black-box
    acceptance cases and identify security choices requiring the person's decision. This PR
    specifies behavior without implementing runtime commands. Broken down from
    p2-specify-policy-manifest-approval.
  done_when:
    - run: sh -eu -c 'f=docs/plans/offline-run-lifecycle.md; test -s "$f"; for section in "## Arguments and JSON" "## Ownership and startup" "## Timeouts and cancellation" "## Workload exits" "## Cleanup and recovery" "## Acceptance scenarios" "## Security decisions"; do grep -Fqx "$section" "$f"; done'
- id: T-12
  type: ci
  title: CI runs on Linux, each pull request once; other platforms by hand
  why: >
    CI on main has had no green run since 14:37 UTC on 2026-11-04: every failure is Tests
    (macos-latest) never acquiring a runner and being cancelled after 15 minutes (41856642827), and
    later runs queue behind it. The charter's "Not yet" excludes every platform but Linux amd64 with
    native Docker, so this project pays for a matrix it does not need. Settled: the push and
    pull-request matrix is ubuntu-latest alone; Windows and macOS stay runnable by hand through
    workflow_dispatch. Triggers follow donvargax/itos/.github/workflows/ci.yml
    lines 3-7, 17-19 and 32: push on main only, pull_request with ready_for_review, drafts judged by
    nothing, cancel-in-progress on a pull request's own runs, never on main. Today every branch push
    runs twice (41863302515, 41863312223). Keep item branches' CI through the pull request, which is
    what T-7 wanted. Read itos's file; do not invent. Touch no other workflow.
  done_when:
    - run: "! grep -Eq 'os:.*(macos|windows)-latest' .github/workflows/ci.yml && grep -q ready_for_review .github/workflows/ci.yml && grep -q workflow_dispatch .github/workflows/ci.yml"
- id: T-13
  type: ci
  title: The code proof is a fresh seeded mutation run in CI, with no committed evidence
  why: >
    The code proof reads agent-committed evidence: itos.yaml proof.code.check is mutation check over
    a committed .metrics/mutate, and AGENTS.md requires a local run. It already failed T-8 with
    mutation.coverage-stale because the host's Go differs from CI's (41832816369). itos ADR-0057 and
    itos-cc ADR-0059 removed this approach for the same reason; read them. Settled: proof.code.check
    becomes tools/bin/pinned itos-cc mutation run --count 10 --since {base} --seed {base}
    --fail-uncovered=lines --json cmd internal, judged fresh in CI: deterministic per range, since a
    gate must be (itos ADR-0051), and ten sites rather than itos's one because the tree is small.
    The committed .metrics/mutate go, with AGENTS.md's local-run requirement and whatever else names
    them. The unseeded mutation sample step in ci goes: its seed defaults to HEAD, so each push
    draws anew, the random-survivor failure itos's nightly suffered, moved into the required job.
    Read itos-cc.yaml's mutation.tests in donvargax/itos for how scenarios
    count, and make the coverage the proof reads real: ci.yml's GOCOVERDIR feeds a merge step that
    does not exist here, so finish it or remove it. itos-cc.yaml's exceptions stay. No nightly:
    nothing slow or random remains once this lands.
  done_when:
    - run: "! git ls-files .metrics/mutate | grep -q . && grep -q 'mutation run --count 10 --since {base} --seed {base}' itos.yaml && ! grep -q 'mutation sample' itos.yaml"
- id: T-14
  type: ci
  title: Slices and engines live at paths the lint holds by default deny, with go list checks a nolint cannot evade
  why: >
    Replaces T-10, whose generator refuses the shared engine package docs/architecture.md prescribes
    and leaves any directory without a domain or port child unruled (probes: internal/flat with
    os/exec and a foreign adapter passes; a domain importing syscall, encoding/json, flag and kong
    passes; a port with os/exec passes; a handler importing a foreign adapter passes;
    //nolint:depguard passes). Two mature repositories hold the answer; copy from them rather than
    the template, which is behind: donvargax/itos-cc (.golangci.yml,
    tools/bin/architecture-check, docs/decisions ADR-0047, ADR-0051,
    internal/coverage/port/porttest/contract.go) and donvargax/itos
    (.golangci.yml, docs/ARCHITECTURE.md, ADR-0053). origin/T-10 holds fixtures worth reusing: they
    compile first, so a type error cannot pass as a refusal. Settled: (1) Layout:
    internal/slices/<cmd>/{command,domain,port,<adapter>} and
    internal/engine/<name>/{domain,port,<adapter>}; the path says what a package is, so depguard's
    globs are static in .golangci.yml and tools/slice-layout's generator does not land. Move
    internal/count to internal/slices/count. (2) Default deny: every package under internal/ is held
    by a rule; one no rule names fails, including internal/engine nested packages and pkg/.
    internal/cli, internal/version and internal/release are named. (3) A domain imports the standard
    library's pure packages by allowlist plus its own port and an engine's domain or port, nothing
    else: no os, os/exec, net, net/http, syscall, golang.org/x/sys, encoding/json, flag, kong. (4) A
    port imports only ports and does no I/O. (5) A slice imports no other slice and no adapter, its
    own neither; cmd/ is the assembly that binds adapters. (6) An adapter may import its own domain
    and port, as itos-cc ADR-0047 decided after finding the ban forced mappers;
    docs/architecture.md's contrary sentence goes. (7) internal/cli imports nothing of ours: a
    slice's failure classifier sits beside the slice and cmd hands it over (itos-cc's ui rule);
    today cli.go:20 and codes.go:3 import count's port, so every new slice would edit the shared UI.
    (8) A fake cannot reach production: porttest and fakes are refused outside tests, and
    tools/bin/architecture-check --siblings --outside --linked --toplevel, on go list arrows no
    nolint can suppress, runs in ci. (9) A //nolint:depguard in the tree fails the gate. (10)
    Contract suites: a port's <port>/porttest suite runs against both its fake and its real adapter;
    count's disk adapter gets one as the example, since agents test only against fakes and drift is
    this project's core risk. (11) Each rule is proven by a fixture that breaks it, and
    TestNoDenyEntryPrefixesAnother is carried over, as depguard hides a deny that prefixes another.
    Fixtures run only when the rules change, not on every commit. docs/architecture.md and AGENTS.md
    describe the result, and a record in docs/decisions says why. Behaviour does not change: every
    scenario passes before and after.
  done_when:
    - run: test -d internal/slices/count && ! test -e internal/count && ! test -e tools/slice-layout && tools/bin/architecture-check --siblings --outside --linked --toplevel
- id: T-15
  type: docs
  title: Draft docs/architecture/arc42.md from the pilot contract, the charter and the slice layout, for the person's review
  why: >
    The loop builds better from a detailed plan: steering overnight mostly supplied what the
    documents left unsaid (what blocks what, the slice layout, how specs commit). An arc42 document
    gives every step a shared reference: goals and quality goals (charter), context and scope,
    solution strategy, a building-block view that names each slice and engine and their dependencies
    (the breakdown step's input), runtime views for the main commands, cross-cutting concepts
    (ports, fakes, strict config reading), decisions (docs/decisions/), quality requirements mapped
    to gates, and risks. Source it from docs/plans/container-pilot.md, docs/charter.md, PLAN.md and
    docs/architecture.md; mark every open choice the contract leaves to the person as open, never
    decided. A docs task; the person reviews it. The queued architecture draft already covers slice
    dependencies, command composition and shared contracts. Include doctor’s shared schemas,
    diagnostics and fixtures across slices 1–4, slice-3’s prerequisites from slices 1–2, and
    slice-4’s approval integration and implementation order.
  done_when:
    - run: sh -eu -c 'f=docs/architecture/arc42.md; test -s "$f"; for section in "## Goals" "## Constraints" "## Context and scope" "## Solution strategy" "## Building-block view" "## Runtime view" "## Deployment view" "## Cross-cutting concepts" "## Decisions" "## Quality requirements" "## Risks and open questions" "## Glossary"; do grep -Fqx "$section" "$f"; done'
