    A missing tool, bad platform, registry failure, digest mismatch or timeout fails; never skip.

    Build the derived fixture for linux/amd64, record its config ID, and push only to a unique
    repository under that loopback registry. Read the pushed single-platform manifest through
    the registry API, verify the SHA-256 of its bytes against Docker-Content-Digest and its config
    digest against the built image ID. Do not confuse a multi-platform index with this manifest.
    Remove only the derived fixture's recorded local tags/digest references, then confirm that
    the requested repository@sha256 reference is absent before pulling that exact digest back.
    Do not assume every store leaves RepoDigests empty after build or push: the required result
    is a successful cold digest pull and subsequent exact-reference inspection on this engine.
    Inspect by repository@sha256 and require RepoDigests to contain that entire reference, a
    nonempty sha256 config ID equal to the built ID, linux/amd64, the numeric non-root USER,
    empty entrypoint, no declared volumes and no devcontainer.metadata. A tag, another repository
    with the same digest, config ID alone, or locally built image alone cannot satisfy this check.

    Prove the fixture can execute a bounded benign command using the exact cached digest with
    pull disabled, network none, read-only root, all capabilities dropped, no-new-privileges,
    the recorded UID/GID and no host mounts. Require the observed UID/GID, a fixed output marker
    and exit zero; remove the recorded smoke container. This tests the fixture, not itos run or
    the product's isolation guarantees. Stop and remove the registry before product scenarios
    and confirm the cached digest remains inspectable. Thus later scenarios consume cached data
    with acquisition over; attempted product acquisition still needs their request-journal
    assertions and cannot be excused by the registry being unavailable.

    Preparation publishes step outputs image, image_id, uid and gid only after all checks pass.
    Wire them solely into the existing Engine scenarios step as the harness-only variables
    ITOS_CONTAINER_ENGINE_FIXTURE_IMAGE, ITOS_CONTAINER_ENGINE_FIXTURE_ID,
    ITOS_CONTAINER_ENGINE_FIXTURE_UID and ITOS_CONTAINER_ENGINE_FIXTURE_GID. IMAGE is the exact
    loopback repository@sha256 reference; ID is its distinct config digest. Future engine Given
    steps read these and independently inspect cached content, refusing absent/malformed values;
    they never acquire a substitute. Existing ITOS_ filtering keeps these inputs out of product
    children, which receive the reference through their disposable manifest. Ordinary selection
    must not read them or initialize fixture hooks, even when they happen to be present.
    For missing-image cases derive a different well-formed digest in the same repository, verify
    it is absent through read-only inspection, and never remove the shared positive fixture to
    manufacture absence. Do not create approval state, relax metadata rules or add product flags.

    Keep a runner-temporary ownership record outside the checkout as resources are acquired.
    Preparation must attempt cleanup on its own failure; add a final always() cleanup step to
    engine for failures and cancellation after preparation too. Bound each cleanup attempt to
    30 seconds, preserve an earlier failure and fail a previously successful job on cleanup
    failure. Cleanup is idempotent and targets only this attempt's recorded containers, storage
    and derived image references, checking identity before mutation; it never prunes, removes
    unrelated images/resources or deletes checkout files. Keep shared pinned input images alone.
    Do not promise cleanup after a runner is killed: report that run as incomplete, not evidence.

    Preserve the sole engine job, stable check name, exact TO checkout, native runner, read-only
    permissions, event/draft guards, ten-minute job budget and five-minute scenario budget.
    Preserve the unrestricted live-engine TestFeatures invocation and step-local
    ITOS_CONTAINER_ENGINE_TESTS=1. Preparation always runs in engine even while all engine cases
    are @wip; the explicit no-live-engine skip remains readiness only, never scenario proof.
    ci must still depend on engine and fail on anything other than success. No services mapping,
    job container, extra job, workflow, event, dispatch input, continue-on-error or success fallback.
    Ordinary Linux/macOS/Windows tests, hooks, smoke and code proof remain engine-disabled; keep
    their existing commands, dependencies, pins and proof policy. No local mutation run or
    generated coverage/mutation record belongs to this task.

    Commit ordinary regression tests first with test --item T-20. Add TestEngineFixtureWorkflow
    in features/engine_fixture_test.go, using the existing YAML parser and parsed workflow data,
    never an engine, network request or CI-context spoof. Check ordered preflight/preparation/
    scenarios/always-cleanup, budgets, pinned inputs/recipe, exact output wiring, containment in
    engine and failure propagation. Use broken workflow/recipe fixtures as negative controls for
    missing preparation/cleanup, ignored failure, unpinned inputs, wildcard publication, an
    acquisition command in an ordinary job, leaked fixture environment and a filtered engine run.
    Update TestEngineWorkflow to require the expanded sequence and environment, replacing its
    four-step/one-variable assumptions with these checks while retaining every T-16 protection
    and negative control. Do not simply delete the old assertions to accept arbitrary new steps.
    Shell syntax and these static tests are cheap existing-tier checks, not proof of RepoDigests.

    Before implementation the new preparation/output/cleanup assertions fail against the current
    four-step workflow; report actual assertion failures from the compiling test commit. The
    presence checks below fail because the helper, recipe and new regression do not exist; those
    are missing work, not runtime red evidence. The retained original grep check is only a coarse
    wiring check (@engine already appears in features/README.md). CI completion additionally
    requires the real round trip, smoke and cleanup above, even with zero live engine scenarios.
    Record the tested commit, server version/API/platform, source pins, derived reference/config
    ID, expected/observed results and cleanup verdict in CI logs. Do not commit generated images,
    fixture state or test evidence, or call fixture success a passed doctor/runtime scenario.

    Document the red-first procedure in features/README.md without changing the selection rules.
    A behaviour implementer commits complete steps while its scenarios remain @wip. The loop
    creates a separate disposable evidence branch from that exact step commit, with one test
    commit removing @wip only from the named cases (retaining @engine and adding a valid smoke
    entry if needed), and manually dispatches the existing CI workflow on that branch. The
    workflow already exists on main; workflow_dispatch runs a selected branch independently of
    its PR's draft status, as documented at
    https://docs.github.com/en/actions/how-tos/manage-workflow-runs/manually-run-a-workflow.
    No uncommitted CI tag rewrite, harness bypass, draft-guard relaxation or expected-failure-to-success
