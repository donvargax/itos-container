    Add TestRecoveryProtectedHeartbeatRename using disposable files and the real recovery
    preservation collector, without constructing a native fixture, starting a product command
    or connecting to an engine. Include an unchanged control and controlled rename_after_listing
    and rename_with_cached_info cases. In each rename case, have the walker enumerate the real
