- id: T-52
  type: test
  title: "The acceptance harness builds the binary the release ships: CGO_ENABLED=0"
  why: >
    Blocks the charter's milestone two, step 1, through slice-27: the proxy container runs the
    host executable in an inert root filesystem, and decision 0022 requires a static Linux
    amd64 ELF. The release already sets CGO_ENABLED=0 in .goreleaser.yaml. The acceptance
    harness instead inherits the caller's setting, exercising different DNS and user lookup
    paths. Fix this before slice-27's implementation; its dependency on T-52 is already in
    the registry. This is test infrastructure, not a new product behaviour or a release change.

    Set CGO_ENABLED=0 explicitly in the environment of the go command in both buildProduct
    (features/features_test.go) and world.probeAssembly (features/session_probe_test.go).
    Replace any inherited value using setEnv, preserving the rest of each builder's current
    environment, including sessionChildEnvironment's filtering for the assembly. Do not change
    the test process's environment as the implementation, rely on CI or the caller to set it,
    or apply it to every session child. Keep build flags, version stamps, coverage flags,
    source selection, binary names, cache reuse, timeouts and error reporting intact.
    No dependency is needed: Go's standard library supplies environment handling and artifact
    inspection. No production package, release configuration or architecture change is needed.

    Cover both builders, plain and covered. Fixtures replace the plain product with the test
    assembly, so fixing buildProduct alone does not fix what doctor inspects or the proxy runs.
    The session assembly compiles the checkout with production budgets; the engine product
    assembly compiles the shortened-budget tree beside the suite's product. Both must retain
    those distinct sources and be built without cgo. The engine tier's buildProduct also uses
    that copied tree. Creating and compiling this fixture requires no container engine.

    Add TestAcceptanceStaticBinary in features, using the real buildProduct,
    sessionProbeBinary and productProbeBinary paths, not a separate build command that merely
    repeats their flags. It has eight leaf subtests: cli/plain, cli/covered, engine-cli/plain,
    engine-cli/covered, session-probe/plain, session-probe/covered, engine-probe/plain and
    engine-probe/covered. Build sequentially into isolated temporary paths, so cached files
    from another mode or test cannot satisfy the assertions. Reuse the engine fixture tree
    within a mode where possible. The test sets the inherited CGO_ENABLED to 1 with t.Setenv
    before calling the builders, restoring it afterwards; no parallel subtests or global
    environment mutation outside the test. The assertion must still fail on a host whose
    default is already CGO_ENABLED=0. Red evidence is collected on Linux with a working C
    compiler so a compiler failure cannot stand in for the artifact assertion.

    Inspect every resulting executable with debug/buildinfo.ReadFile and require an explicit
    CGO_ENABLED=0 build setting. On Linux also inspect with debug/elf and require no PT_INTERP
    segment and no DT_NEEDED libraries. Select the Linux-only assertion using the artifact's
    GOOS setting as data; retain the build-setting assertion on macOS and Windows, without
    requiring their binaries to be ELF or claiming additional container-host support. Missing
    settings and unreadable artifacts fail, never skip. These standard-library inspections
    need no external file, ldd or readelf command and do not execute the inspected binary.

    Plain rows clear GOCOVERDIR and ITOS_CC_TEST_COVERDIR and leave world.coverdir empty.
    Covered CLI rows request coverage through GOCOVERDIR for cli and ITOS_CC_TEST_COVERDIR
    for engine-cli, pointing to private temporary directories. The covered session-probe row
    uses only world.coverdir; the covered engine-probe row uses ITOS_CC_TEST_COVERDIR. Inspect
    build settings for -cover=true on covered artifacts and its absence or false value on
    plain ones, so dropping coverage cannot pass this regression. Restore each environment
    change and keep counters out of the caller's proof destination. Existing coverage-routing
    regressions retain the broader aggregate/per-ID execution and cache assertions.

    First commit the new regression alone with itos commit --task T-52, type test, and run
    it before changing the builders. Report each row failing at the CGO_ENABLED artifact
    assertion; use nonfatal assertions or separate leaf runs so an early failure does not
    hide other rows. Then change only the builders and necessary test helpers in a second
    test commit with the same Task footer, and obtain a passing run. No scenario or step
    definition is added, and no @wip tag or existing gate is weakened.

    The done_when command runs only this deterministic regression and requires a PASS report
    for every leaf and the parent, preserving go test's failure status. The promoted command
    returned exit 0 with no tests to run before this spec, because the test does not exist.
    This replacement exits 1 naming the missing test and all eight leaves. That is missing-test
    evidence, not assertion-level red; the implementing agent supplies the latter first.
    Keep this at the existing task CI tier, without a race run, new workflow or nightly job.

    For preservation, the implementation needs the existing full non-engine features suite
    once, without -race, through its configured checks. It includes TestScenarioCoverageContract,
    TestManifestContractCoverage, TestEngineSuiteBudget, TestProbeAssemblySharesTheProductBuildCache
    and the feature-binary cache tests, as well as CLI, counting, manifest, approval and session
    scenarios that all consume these builders. Existing real-engine shards remain CI-only;
    a local build of the engine fixture is not engine runtime evidence. Leave their budgets,
    selectors and assertions intact. The drafter changes only this ledger entry in a docs
    commit with Item T-52; push, CI watching and lifecycle actions belong to the coordinator.
