  - id: p2-credential-brokering
    title: "Decide how a sandboxed agent gets credentials it cannot keep after the run: pass in, broker or mint per credential."
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Today the worker reads real long-lived credentials, so a hostile agent can copy one out and
      use it after the run; the shared read-write Codex login also lets it replace the host's login.
      The design compares passing in, TLS-intercepting brokers, base-URL brokers and short-lived
      minted tokens, and recommends API keys passed in for model logins plus per-run GitHub App
      tokens, with no interception. It waits on the person's decision and on slice-31 and slice-33
      landing; the design is at docs/plans/credential-brokering.md.

      The person corrected the Codex part of q-90 on 2026-11-20: Codex defaults to a sandbox-only
      ChatGPT login in the harness home (device login, never the host auth.json), with an API key
      only as the fallback when a weekly limit is reached. The design is amended to match.
    deferred: >
      Deferred until remote sandboxes (microVMs on cloud providers) exist, by the person's direction
      of 2026-11-20 (q-90). Locally run sandboxes share the host's own logins, so the local case
      needs no brokering; this item's broker design applies only to remote sandboxes, and the person
      decides it when those start.
