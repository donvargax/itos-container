      saves only when that key missed. The build cache is therefore frozen at the first save for
      each go.sum, so every job recompiles all of this module's packages changed since then. The
      engine step's 240 s gate (T-33) includes `go test -c`, so compile cost counts against the same
      budget T-45 is trying to free. A work step measured it locally on 4 CPUs. The features binary
