  - id: p1-mount-bound-to-validated-inode
    title: The checkout mount is bound to the inode that passed validation
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Isolation, this milestone. A read-only security audit of main at 7236d68 (Codex, 2026-11-06),
      static, no Docker run; confirm with a scenario before building. Docker receives the checkout
      as a pathname (internal/engine/session/docker/run.go:68; registered_run.go:179), so after the
      final identity checks and before ContainerStart a worker whose checkout contains another
      approved checkout can rename the inner one and put a symlink to the host home in its place;
      the second worker then mounts an unapproved host directory. Fix: hand Docker an inode-bound
      source through a protected mount anchor held through startup and recovery, and refuse
      overlapping worker checkouts.
  - id: slice-19
    title: Host Unix sockets under the checkout are not reachable from the worker
    phase: 1
    owner: donvargax
    status: doing
    depends_on: []
    kind: slice
    why: >
      Was p1-host-sockets-in-checkout.
      Isolation, this milestone. A read-only security audit of main at 7236d68 (Codex, 2026-11-06),
      static, no Docker run; confirm with a scenario before building. The whole checkout is
      bind-mounted (docker/run.go:64) and network none does not isolate filesystem Unix sockets, so
      a tmux server, SSH control socket or other host service with its socket under the checkout is
      reachable from /workspace as the host UID: host command execution or network access without
      another mount. A startup scan is not enough, as host processes can create sockets later; deny
      connecting to host sockets, or expose a materialised checkout with no host IPC objects.
  - id: slice-20
    title: Hard links to files outside the checkout are refused
    phase: 1
    owner: donvargax
    status: doing
    depends_on: []
    kind: slice
    why: >
      Was p1-hard-links-outside-checkout.
      Isolation, this milestone. A read-only security audit of main at 7236d68 (Codex, 2026-11-06),
      static, no Docker run; confirm with a scenario before building. Checkout validation
      (internal/engine/readiness/disk/checkout.go:129) rejects symlinks and git indirections but not
      shared inodes; a local git clone hard-links .git/objects with its source, so the worker can
      chmod and overwrite a shared object and change the source repository outside the mount.
      Require independent inodes (refuse hard-linked layouts, or materialise copies or reflinks) and
      keep that through the run.
