      misleads readers of a security record and still makes the CONTROL fixtures compute it. Specify
      the upgrade contract with black-box scenarios, covering old roots no catalog has seen and an
      old controller running beside a new one. Decide in the same step whether a schema bump removes
      the device field or a stable filesystem ID replaces it; statfs IDs are not uniformly
      populated, so any replacement needs evidence. Phase p2: it does not block slice-22 or
      slice-23, which build on the shared tracking. It must land before any claim that existing
