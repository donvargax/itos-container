  - id: p1-checkout-socket-kernel-enforcement
    title: Host Unix sockets created during a run are unreachable from the worker
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Deferred from slice-19 by the person (q-30, 2026-11-07): CI showed the worker connects to host
      Unix sockets in the bind-mounted checkout (runs 42312676619, 42323471709), and the milestone
      only refuses sockets present at startup. Closing it needs kernel enforcement: Landlock's
      pathname-socket rule (ABI 9+) through a product init, which needs a new kernel on every host
      and a CI runner that has it, or the gVisor runtime, which hosted runners can prove but which
      adds a runtime. Research in docs/plans/checkout-socket-enforcement.md; scenarios ID-SOCKETS-02
      and 03 wait for it. A milestone-2 choice.

      Already tracks continuous enforcement against host sockets created or replaced after startup,
      retaining Landlock/gVisor research and runtime scenarios ID-SOCKETS-02/03. Preserve the
      person's q-30 deferral to milestone 2.

      The person's design, 2026-11-07, for milestone 2: Landlock by default (ABI 9+,
      LANDLOCK_ACCESS_FS_RESOLVE_UNIX), applied by a small read-only init binary itos-container
      mounts and runs as the worker's entrypoint before exec'ing the literal argv, as Docker has no
      Landlock option and the controller cannot restrict a worker the daemon spawns; gVisor (runsc)
      as the fallback when the kernel lacks ABI 9; on a host with neither, run is allowed only with
      an explicit approval that records 'late host sockets reachable', shown at approve time and in
      status. Doctor reports which backend a run would use, and the approval binds it. Proof: the
      Landlock path is proven locally on the person's machine (Landlock ABI 10 on Linux 7.2) for
      now, with hosted CI proving the gVisor path; a weakened gate until a new-kernel CI runner
      exists (record it in weakened-gates.md when built). Amends the spec's no-helper and
      no-extra-mount rules for the init binary.
