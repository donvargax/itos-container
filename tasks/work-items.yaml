    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Slice-21's decision record (docs/decisions/0021-control-state-publication.md, on its branch)
      says an upgrade contract for unseen old XDG roots and mixed old/new controllers is 'still
      required before claiming protection for existing installations'. No registry item tracks it,
