    kind: idea
    why: >
      No item covers this. T-35 recorded 303 s for the uncached `go test ./features -count=1` (1,274
      scenario rows plus the harness regressions), and the current work step saw 298 s on Linux.
      T-33 shortens only the engine tier, and T-36 only the coverage pass. Every slice adds rows,
