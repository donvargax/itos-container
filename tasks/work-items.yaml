      runs to confirm the share. If it holds, settle in the spec the key that rolls with main and
      the restore order. Also settle whether it needs a pinned actions/cache in place of setup-go's
      cache option, with the reason and version. Branch scoping must keep a pull request's cache
      from feeding main. Keep the 240 s gate, the 4 m test timeout and compilation inside the
