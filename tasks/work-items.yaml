  - id: p2-architecture-stdlib-on-go-list
    title: The architecture check holds stdlib allowlists on go list arrows, which no comment can evade
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Probes of T-14's gate, 2026-11-04: a domain or handler with os/exec passes under a '// Code
      generated … DO NOT EDIT.' header, as golangci-lint skips generated files; five more nolint
      spellings pass (///nolint:depguard, // //nolint:depguard, a trailing comma, nolint:allx,
      gosec,,depguard); a handler or porttest can import crypto/tls, log/syslog or database/sql; a
      build-tagged handler file with os/exec passes. No agent has been seen doing these, so nothing
      blocks. One check closes most: tools/bin/architecture-check reads each role's stdlib imports
      from go list, with an allowlist per role, including IgnoredGoFiles. Details at the
      coordinator.

      This belongs inside p2-architecture-stdlib-on-go-list. That item already plans a go list based
      change to tools/architecture and already names build-tagged files as an evasion ('a
      build-tagged handler file with os/exec passes'). Closing this gap is the same
      enforcement-input edit: it triggers the full fixture matrix, so it should be one change, not
      two. One correction to the idea's example. I checked with go list on this Linux host: a lone
      x_darwin.go is already reported in IgnoredGoFiles, so the current check
      (tools/architecture/graph.go) does refuse it. The real gap is a file that matches the host.
      x_linux.go, x_amd64.go and //go:build linux all pass on Linux CI, yet the file is dropped on
      the other release targets (.goreleaser.yaml builds linux, darwin and windows). So the domain
      or port behaves differently per OS without any ignored file showing up. The idea's measured
      remedy still applies: run go/build MatchFile over the goreleaser targets, plus a refusal of
      any //go:build line in domains and ports, because //go:build !relaxed matches on all five
      targets. The charter's supported host is Linux amd64, so this is p2 at most and blocks
      nothing. Backport candidate for the coordinator to file on go-template-itos after searching
      its issues: tools/architecture has been reworked in this project, and the template renders the
      same checker (.itos-template.yaml names go-template-itos). This project's copy was changed
      after rendering.
