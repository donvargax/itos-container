      timing-record approach. Then cut only demonstrated harness overhead, such as redundant fixture
      builds or fixed waits in the recovery and lifecycle fixtures. Keep every row, assertion and
      cleanup, and add no sharding or reduced selection. Phase p2: nothing blocks the current step,
      and no CI job's limit is near 300 s.
  - id: p2-control-state-upgrade-contract
    title: Specify the upgrade contract for existing control state, and drop the persisted device field with it
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Slice-21's decision record (docs/decisions/0021-control-state-publication.md, on its branch)
