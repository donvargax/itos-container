    title: run reaches only the approved names through the proxy; every other route out is closed
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-26, T-39, T-40]
    kind: slice
    why: >
      Was p1-egress-run-through-proxy.
      The first user-visible egress behaviour, charter step 1 (contract AC-09, AC-10, AC-13).
      Scenarios first, with the real-engine ones in CI only, run against a fake endpoint the proxy
      allows and never a real model or credential. With an approved allowlist, itos container run
      reaches an allowed host name over CONNECT on 443. A direct route out (ignoring proxy
      variables, a literal IP, the default gateway, UDP, another port) fails independent of client
      cooperation. A name outside the list, or a spelling variant, is refused. Offline runs are
      unchanged. It wires the approved allowlist from the approval slice, the proxy package and the
      lifecycle port into the run slice, and doctor says what a run will use. Each property is
      proven by a scenario that fails without it. Broken down from p1-egress-allowlist-proxy.
  - id: slice-28
    title: Refusals are logged, a proxy failure stops the run, and cleanup removes the proxy and network
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-27]
    kind: slice
    why: >
      Was p1-egress-refusals-and-failure.
      Charter step 1's remaining properties (contract AC-17 and the cleanup rule). Scenarios first,
      the real-engine ones in CI. Every refused CONNECT leaves a log record, containing the name and
      port the client gave and no payload or secret, that the person can read after the run. If the
      proxy crashes, never becomes ready or exits mid-run, the workload stops or never starts, with
      no unrestricted network and a clear diagnostic that separates policy refusal from DNS failure.
      Normal exit, failure and interruption remove the worker, proxy and network. A cleanup failure
      leaves a recovery record with the exact retry command, and stop recovers it without touching
      foreign resources. It builds on the run-through-proxy slice, so it comes last. Broken down
      from p1-egress-allowlist-proxy.
