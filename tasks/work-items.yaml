  - id: p2-kernel-helper-leaves-no-feature-temp-dir
    title: A kernel-helper child of the feature tests leaves no itos-container-feature-binaries directory in /tmp
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      features/engine_diagnostics_test.go:20 TestMain creates /tmp/itos-container-feature-binaries-*
      before m.Run and removes it only after m.Run returns. A kernel-helper child re-runs the
      features test binary with one -test.run selector, and TestApprovalKernelHelper
      (features/approval_kernel_linux_test.go:16) then calls unix.Exec into the product. So the
      child's TestMain never reaches RemoveAll, and every helper invocation leaks one empty
      directory. 1391 of them sit in /tmp on the loop machine today. The Landlock helper slice-42 to
      slice-46 bring would leak one per supervised doctor, approve or run invocation, which makes it
      worse quickly on a machine several workers share. Wanted: helper mode is detected before the
      setup (from its selector or its helper argument), or the directory is created only when a test
      first needs a standalone probe, so a helper child makes nothing it cannot remove. This is
      harness work, so a ledger task, checked by a regression that runs the approval kernel helper
      and finds no new feature-binaries directory in a private TMPDIR. Phase p2: it blocks no
      charter step, but it should land before the Landlock helper multiplies the leak. The harness's
      TestMain is this project's own, not the template's, so no backport.

      T-66's spec already covers the new helper: its no_feature_binaries_left row requires that a
      Landlock-helper invocation leaves no feature-binaries directory. The spec says outright that
      the slice-4 fchmodat2 helper's leak stays with this idea, so folding the idea into T-66 would
      undo a decision already made. Once T-66 lands, check how it avoids the directory. If it spots
      helper mode before TestMain's setup for every helper selector, TestApprovalKernelHelper is
      fixed too, and this idea shrinks to its own regression: run the approval kernel helper with a
      private TMPDIR and find no new directory. Then remove the 1391 leaked directories in the loop
      host's /tmp by hand.

      This item already tracks the slice-4 fchmodat2 helper's leak. Its own text says to check how
      T-66 avoids the directory once T-66 lands. T-66 now has the answer: TestMain dispatches helper
      mode before it makes the directory (socketBackendChild in features/engine_diagnostics_test.go
      on the T-66 branch). So the item's fix is to route TestApprovalKernelHelper's selector through
      that same pre-setup dispatch, plus its planned regression: run the approval kernel helper with
      a private TMPDIR and find no new itos-container-feature-binaries directory. After that, remove
      the leaked directories in the loop host's /tmp by hand. No new design is needed.
