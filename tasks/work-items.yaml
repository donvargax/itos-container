  - id: p2-fixture-worlds-inherit-scenario-coverdir
    title: A fixture world that drops the scenario coverage destination fails in go test, not in CI
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      No item covers this. T-36 made the harness route per-scenario coverage under
      ITOS_CC_TEST_COVERDIR, but every secondary world is a hand-written &world{root, bin, coverdir:
      w.coverdir, ...} literal in more than ten fixtures: anchors, overlap, offline anchors,
      lifecycle and recovery. Slice-21's control-state fixture left coverdir out of its W and P
      worlds. The product subprocesses then wrote no counters, and the failure ('listed test
      ID-CONTROL-19 produced no per-ID coverage data') showed up only at the CI mutation proof's
      listed-coverage step, after a full CI round and without naming the fixture. The charter keeps
      suite and proof reliability fixes inside the first milestone, and every new slice with a
      second world can repeat this. First add a harness regression, committed red, that fails when a
      world a scenario builds lacks the captured coverdir, or that checks ITOS_CC_TEST_COVERDIR
      yields counters for each live local-engine-fixture ID, naming the fixture. Then route the
      literals through one constructor if that is the smallest repair. Keep every scenario,
      assertion and the pinned itos-cc contract unchanged. Phase p2: nothing blocks the current
      step, since slice-21's own fix has landed on its branch.
  - id: p1-egress-allowlist-proxy
    title: Egress through an allowlisting Go CONNECT proxy beside the worker
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Milestone two, step 1 (docs/charter.md). The worker gets no direct route out: an owned proxy
      on an internal network allows CONNECT to listed host names on port 443 only, with no TLS
      interception, matching the name the client gave (never a reverse-DNS lookup), and logs every
      refusal. The allowlist is part of the approved settings. The proxy is a small, maintained Go
      CONNECT proxy chosen in the spec, not squid (the person, 2026-11-09). Each property is proven
      by a scenario that fails without it; harness traffic in scenarios goes to a fake endpoint the
      proxy allows.
