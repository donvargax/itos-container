  - id: p2-control-state-upgrade-contract
    title: Specify the upgrade contract for existing control state, and drop the persisted device field with it
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Slice-21's decision record (docs/decisions/0021-control-state-publication.md, on its branch)
      says an upgrade contract for unseen old XDG roots and mixed old/new controllers is 'still
      required before claiming protection for existing installations'. No registry item tracks it,
      and v0.1.0 is already published, so installations exist. The same record keeps the persisted
      binding device in schema 1 only as a shape-checked diagnostic: it is never compared, so it
      misleads readers of a security record and still makes the CONTROL fixtures compute it. Specify
      the upgrade contract with black-box scenarios, covering old roots no catalog has seen and an
      old controller running beside a new one. Decide in the same step whether a schema bump removes
      the device field or a stable filesystem ID replaces it; statfs IDs are not uniformly
      populated, so any replacement needs evidence. Phase p2: it does not block slice-22 or
      slice-23, which build on the shared tracking. It must land before any claim that existing
      installations are protected, and it stays inside the charter's first-milestone control-state
      work.

      This is the upgrade problem for installations that already exist: v0.1.0 session records under
      the default tree, and old roots no catalog has seen. A person with those records cannot
      recover today, and the item's decision (documented manual cleanup or a migration step) is the
      one the upgrade contract already has to make. Slice-21's PR still says 'select another
      XDG_STATE_HOME' in docs/CONFIG.md and in the Fix text at
      internal/engine/approval/port/diagnostic.go:72. That advice cannot work for this case, so
      slice-21 should correct or remove it before merge, and the upgrade contract then supplies the
      real recovery.

      This is the recovery decision that item already has to make, which it frames as 'documented
      manual cleanup or a migration step'. Legacy v0.1.0 records with no catalog are its subject.
      The lost-location lockout is the same decision: after `XDG_STATE_HOME=/tmp/x approve` and a
      reboot that clears /tmp, doctor, approve and run all fail on state.unavailable, and stop exits
      75 with no retry that can succeed. Any recovery needs the same consent surface, so the upgrade
      contract should cover both cases. One correction to the idea: v0.1.0 is already published, so
      'before v0.1.0 ships' is stale. The item must land before any claim that existing
      installations are protected. A supported recovery command is a new command and consent surface
      the charter does not yet authorize, so the person decides it (`itos decision`). The agent
      working that item should not invent a repair, and slice-21 deliberately offers only the host
      user's manual remedy. Specify any recovery with scenarios covering a lost retained location,
      legacy records and no live worker.

      Records with no catalog are that item's subject, and its recovery decision is the person's
      (itos decision): documented manual cleanup or a migration step. The 'never adopts' wording in
      CONFIG.md and the code at internal/engine/approval/disk/control.go:303, where the evidence
      check runs only when t.data[t.fixed] is nil, are a guarantee and a recovery procedure at once.
      Whether the refusal lasts only until a catalog exists, or the code must enforce 'never
      adopted', cannot be settled by a doc edit. Add to that item: a later approve under another
      selection enrolls the original tree with its records in place, validated by the reservation
      scan. The reviewer found no exposure bypass. Until the person decides, slice-21 should word
      CONFIG.md to say only what the code does now.
