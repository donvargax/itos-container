      This is the recovery decision that item already has to make, which it frames as 'documented
      manual cleanup or a migration step'. Legacy v0.1.0 records with no catalog are its subject.
      The lost-location lockout is the same decision: after `XDG_STATE_HOME=/tmp/x approve` and a
