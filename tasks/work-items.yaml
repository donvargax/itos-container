  - id: p3-registration-before-intent
    title: A crash between registration and intent publication leaves no stuck session
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Recovery debris, this milestone. A read-only security audit of main at 7236d68 (Codex,
      2026-11-06), static, no Docker run; confirm with a scenario before building. Registration is
      durable before Store.New publishes its intent (registered_run.go:39;
      session/disk/registry.go:144), so controller loss or an intent-write failure in that gap
      leaves a session status and stop both refuse, which no supported command clears; no worker
      exists, so it is debris, not an escape. Publish both consistently, or add a durable
      create-not-issued state recovery can retire; a name-only 404 must not become proof of absence.

      Extend this existing recovery item to cover crashes after durable admission reservation but
      before public registration. Such orphan reservations can block overlapping checkouts without a
      discoverable session. Include a black-box scenario and safe retirement based on durable
      evidence that creation was never issued, preserving active reservations; a name-only 404 must
      not establish absence.

      This is crash debris with no supported way to clear it, which is what
      p3-registration-before-intent is about. Add this to that item's safe-retirement part. A
      publisher killed anywhere in Publish (before the write, during it, or after the link) leaves a
      .intent-<nonce>.tmp, either alone or as the second link of its record. The next control-lock
      holder can retire it on durable evidence: the name Publish makes, in the pinned private
      directory, and either an orphan or the same inode as its record. Keep to the item's rule that
      a name alone is not proof. It is not needed for correctness, because Names skips the temporary
      and bd383fd reads the record around it. The item's scenario should check that a retired
      temporary leaves the record intact and that a live publisher's temporary is never removed.
