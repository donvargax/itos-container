  - id: p1-egress-proxy-spec
    title: "Record the egress proxy decision: library, topology, delivery, failure closure and refusal log"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Charter step 1 says the proxy is a small, maintained Go CONNECT proxy chosen in the spec, not
      squid. This task writes a docs/decisions record and updates the arc42 building-block view and
      runtime/network text. It picks one library with a pinned version, an AGPL-compatible licence
      and a stated maintenance reason. It fixes the topology: an internal Docker network with no
      route out, a proxy container dual-homed beside the worker, and the worker attached to the
      internal network only. It states how the proxy binary or image reaches the proxy container and
      how it stays out of the worker's reach. It defines fail-closed behaviour, with no fallback
      network when the proxy fails. It gives the refusal log format and where it lands, with no
      secrets logged. It names the contract's open decisions it settles and stops for the person if
      one is a security property the charter leaves open. The library, topology and delivery are
      then fixed before any code. Broken down from p1-egress-allowlist-proxy.
  - id: p1-egress-allowlist-policy
    title: The policy file accepts an exact host-name egress allowlist and doctor validates it
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Charter step 1: the allowlist is part of the approved settings, so it starts in
      itos-container.yaml. Today network is a closed object whose only mode is offline
      (docs/CONFIG.md, internal/engine/policy). Scenarios first: a network mode that routes through
      the proxy, with a list of host names. Each name is canonicalised (case, trailing dot, IDNA)
      and must be a full DNS name. Literal IPs, wildcards and suffix shortcuts, ports, URLs, empty
      or duplicate names and an empty list in allowlist mode are refused with a located doctor
      diagnostic. Offline stays the default and is unchanged. Doctor shows the effective allowlist
      without executing checkout code. It reads and validates only, with no engine or proxy. Update
      docs/CONFIG.md and docs/CLI.md for the new field. Broken down from p1-egress-allowlist-proxy.
  - id: p1-egress-allowlist-approval
    title: Approval binds the egress allowlist, and any change to it needs a new approval
    phase: 1
    owner: null
    status: todo
    depends_on: [p1-egress-allowlist-policy]
    kind: idea
    why: >
      Charter step 1: the allowlist is part of the approved settings, and the contract's AC-02
      requires a change to network permissions to refuse startup with no self-approval. The
      canonical approved-settings record (engine/approval/canonical, profile offline-v1) and the
      approve presentation extend to the allowlist. Scenarios first: approve shows the exact host
      names the worker will be able to reach and the profile that grants network. Adding, removing
      or changing a name invalidates an existing approval, and run refuses with the change
      explained. Reordering the same names does not, since the canonical form is a set. Offline
      approvals keep their existing profile and identity. This slice covers records, presentation
      and refusal only. Nothing starts a proxy yet. It follows the policy slice, which supplies the
      validated list. Broken down from p1-egress-allowlist-proxy.
