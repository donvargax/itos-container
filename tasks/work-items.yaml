  - id: p2-proxy-log-lost-tail-sink
    title: Decide whether the proxy gets a log sink that can show a lost tail of the refusal log
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      For the person to decide before slice-28 is drafted. The per-process `seq` in the proxy's
      refusal log exposes a hole inside the stored records but not a lost tail. A hostile worker can
      fill a Docker data root that shares the checkout's filesystem. The proxy then keeps writing
      without seeing a failure, the session continues, and the teardown copy succeeds on a truncated
      log. That undermines the 'every refused CONNECT leaves a log record the person can read'
      property that slice-28 builds on (AC-17). Only a second sink the proxy can see fail would
      close it, for example a final count written somewhere the controller reads. That is a security
      decision, so the drafter must stop for it and not invent a protection. It is p2 because T-39's
      record discloses the limit, so step 1 can ship with the disclosure. It is separate from
      p3-session-state-retention, which covers how long the log is kept, not whether it is complete.
      The answer shapes T-40's teardown copy and slice-28's reading of the log, so settle it before
      slice-28 is taken.

      This item already records the problem and the open decision: a hostile worker fills a Docker
      data root that shares the checkout's filesystem, the proxy's writes keep succeeding, and the
      teardown copy succeeds on a truncated log. It is p2 and must be settled before slice-28 is
      taken. Note to add: the open decision has two concrete candidates. (1) A proxy-held fsynced
      volume sink that fails closed mid-run but gives the proxy a writable mount, which cuts against
      its hardening. (2) A terminal record the proxy writes on clean stop, which shows a lost tail
      at teardown without a new mount, but cannot stop a run that is already losing records. The
      choice changes the log schema (a terminal record or final count) and the proxy's hardening, so
      the person must decide it before slice-28 writes its copy check, and the drafter must stop for
      it rather than invent a protection.

